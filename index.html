    <!-- Splash de carregamento — fica no HTML de propósito: precisa pintar antes
         do JS, senão não cobre o flash de troca de fonte que ele existe para esconder. -->
    <style>
      #bw-splash{position:fixed;inset:0;z-index:2147483000;display:flex;flex-direction:column;
        align-items:center;justify-content:center;gap:26px;background:#FAF8F4;color:#1A2332;
        font-family:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
        opacity:1;transition:opacity .5s cubic-bezier(.22,1,.36,1)}
      #bw-splash.is-done{opacity:0;pointer-events:none}
      #bw-splash .bw-mark{font-size:clamp(30px,6vw,46px);font-weight:600;letter-spacing:-.055em;line-height:1}
      #bw-splash .bw-track{width:min(240px,60vw);height:1px;background:rgba(23,27,34,.17);overflow:hidden}
      #bw-splash .bw-fill{display:block;height:100%;width:0;background:#11355B;
        transition:width .35s cubic-bezier(.22,1,.36,1)}
      #bw-splash .bw-msg{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
        font-size:10px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:#5A6472}
      @media (prefers-reduced-motion:reduce){#bw-splash,#bw-splash .bw-fill{transition:none}}
    </style>

    <div id="bw-splash" role="status" aria-live="polite" aria-label="Carregando">
      <div class="bw-mark">Bewild</div>
      <div class="bw-track"><i class="bw-fill"></i></div>
      <div class="bw-msg">Seu desejo é uma obra</div>
    </div>

    <script>
    (function () {
      var el = document.getElementById('bw-splash');
      if (!el) return;

      // Só na primeira carga da sessão: navegação interna da SPA já é instantânea.
      try {
        if (sessionStorage.getItem('bw-splash')) { el.remove(); return; }
        sessionStorage.setItem('bw-splash', '1');
      } catch (e) {}

      var fill = el.querySelector('.bw-fill');
      var start = Date.now(), pct = 0, done = false;
      var MIN = 350, MAX = 1400;

      function set(p) { if (p > pct) { pct = p; fill.style.width = p + '%'; } }
      set(15);

      function finish() {
        if (done) return; done = true;
        set(100);
        setTimeout(function () {
          el.classList.add('is-done');
          setTimeout(function () { el.remove(); }, 550);
        }, Math.max(0, MIN - (Date.now() - start)));
      }

      // Marcos reais de carregamento, não cronômetro.
      document.addEventListener('DOMContentLoaded', function () { set(45); });
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(function () { set(75); });
      } else { set(75); }

      var root = document.getElementById('root');
      if (root && root.childElementCount > 0) finish();
      else if (root) {
        var obs = new MutationObserver(function () {
          if (root.childElementCount > 0) { obs.disconnect(); finish(); }
        });
        obs.observe(root, { childList: true });
      }

      setTimeout(finish, MAX); // trava de segurança: nunca segura a página além disso
    })();
    </script>
