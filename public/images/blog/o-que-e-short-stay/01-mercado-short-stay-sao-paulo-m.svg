<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1288" width="420" height="1288" role="img" aria-labelledby="t d"><title id="t">Short stay em São Paulo: mais anúncios, menos receita por anúncio</title><desc id="d">Infográfico com dados de mercado do short stay em São Paulo. Média da cidade (GuestFavorites, janeiro a agosto de 2026): 34.854 anúncios ativos, diária média de R$ 266, 60% de ocupação e receita anual média de R$ 58.259 por anúncio. Em um ano (AirROI, agosto de 2025 a julho de 2026): 60,7% mais anúncios e receita por anúncio 14,3% menor; o AirROI usa outro método e mede 38,1% de ocupação. Receita anual média por anúncio, por bairro (GuestFavorites): Itaim Bibi, R$ 77.390, com 59% de ocupação; Jardim Paulista, R$ 72.372, com 62%; Pinheiros, R$ 68.335, com 62%; média de São Paulo, R$ 58.259, com 60%; Perdizes, R$ 49.423, com 53%. Demanda (Prefeitura de São Paulo, Observatório de Turismo e Eventos, balanço de 2025): 47,2 milhões de turistas em 2025, 25% a mais que em 2024; 2,5 milhões de visitantes internacionais; ocupação hoteleira média de 62,96%. Números de terceiros, com métodos diferentes; não são projeção de renda de um imóvel.</desc><style>.s{font-family:Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif}.m{font-family:'JetBrains Mono', Menlo, Consolas, monospace}</style><rect width="420" height="1288" fill="#FFFFFF"/><text x="16" y="34" class="m" font-size="12" font-weight="700" fill="#11355B" letter-spacing="1.5">MERCADO DE SHORT STAY · SP · 2026</text><text x="16" y="60" class="s" font-size="17" font-weight="700" fill="#1A2332" letter-spacing="-0.3">Short stay em São Paulo:</text><text x="16" y="83" class="s" font-size="17" font-weight="700" fill="#1A2332" letter-spacing="-0.3">mais anúncios, menos receita</text><text x="16" y="106" class="s" font-size="17" font-weight="700" fill="#1A2332" letter-spacing="-0.3">por anúncio</text><text x="16" y="130" class="s" font-size="13" fill="#5A6472">O mercado em números, por dois levantamentos</text><text x="16" y="148" class="s" font-size="13" fill="#5A6472">de 2026 e pelo balanço de turismo da Prefeitura.</text><text x="16" y="184" class="m" font-size="12" font-weight="700" fill="#11355B">A MÉDIA DA CIDADE</text><text x="16" y="202" class="m" font-size="12" fill="#5A6472">GUESTFAVORITES · JAN–AGO/2026</text><rect x="16" y="216" width="189" height="80" rx="8" fill="#F6F3EC"/><text x="30" y="247" class="s" font-size="20" font-weight="700" fill="#1A2332" letter-spacing="-0.3">34.854</text><text x="30" y="267" class="s" font-size="12.5" fill="#5A6472">anúncios ativos</text><rect x="215" y="216" width="189" height="80" rx="8" fill="#F6F3EC"/><text x="229" y="247" class="s" font-size="20" font-weight="700" fill="#1A2332" letter-spacing="-0.3">R$ 266</text><text x="229" y="267" class="s" font-size="12.5" fill="#5A6472">diária média</text><rect x="16" y="306" width="189" height="80" rx="8" fill="#F6F3EC"/><text x="30" y="337" class="s" font-size="20" font-weight="700" fill="#1A2332" letter-spacing="-0.3">60%</text><text x="30" y="357" class="s" font-size="12.5" fill="#5A6472">ocupação</text><rect x="215" y="306" width="189" height="80" rx="8" fill="#F6F3EC"/><text x="229" y="337" class="s" font-size="20" font-weight="700" fill="#1A2332" letter-spacing="-0.3">R$ 58.259</text><text x="229" y="357" class="s" font-size="12.5" fill="#5A6472">receita anual média</text><text x="229" y="373" class="s" font-size="12.5" fill="#5A6472">por anúncio</text><text x="16" y="420" class="m" font-size="12" font-weight="700" fill="#11355B">EM UM ANO</text><text x="16" y="438" class="m" font-size="12" fill="#5A6472">AIRROI · AGO/2025–JUL/2026</text><rect x="16" y="452" width="189" height="66" rx="8" fill="#F6F3EC"/><path d="M30,482 L36.5,469 L43,482 Z" fill="#2F6FA8"/><text x="51" y="483" class="s" font-size="20" font-weight="700" fill="#1A2332" letter-spacing="-0.3">+60,7%</text><text x="30" y="503" class="s" font-size="12.5" fill="#5A6472">anúncios ativos</text><rect x="215" y="452" width="189" height="66" rx="8" fill="#F6F3EC"/><path d="M229,469 L242,469 L235.5,482 Z" fill="#D07A3E"/><text x="250" y="483" class="s" font-size="20" font-weight="700" fill="#1A2332" letter-spacing="-0.3">−14,3%</text><text x="229" y="503" class="s" font-size="12.5" fill="#5A6472">receita por anúncio</text><text x="16" y="540" class="s" font-size="12.5" fill="#5A6472">O AirROI usa outro método: mede 38,1% de</text><text x="16" y="557" class="s" font-size="12.5" fill="#5A6472">ocupação no mesmo período.</text><text x="16" y="594" class="m" font-size="12" font-weight="700" fill="#11355B">RECEITA ANUAL MÉDIA POR ANÚNCIO, POR BAIRRO</text><text x="16" y="612" class="m" font-size="12" fill="#5A6472">GUESTFAVORITES · JAN–AGO/2026</text><text x="16" y="642" class="s" font-size="13" font-weight="600" fill="#1A2332">Itaim Bibi</text><text x="404" y="642" class="s" font-size="12.5" fill="#5A6472" text-anchor="end">59% de ocupação</text><path d="M16,651 H302 Q306,651 306,655 V661 Q306,665 302,665 H16 Z" fill="#2F6FA8"/><text x="314" y="663" class="s" font-size="13" font-weight="700" fill="#1A2332">R$ 77.390</text><text x="16" y="688" class="s" font-size="13" font-weight="600" fill="#1A2332">Jardim Paulista</text><text x="404" y="688" class="s" font-size="12.5" fill="#5A6472" text-anchor="end">62% de ocupação</text><path d="M16,697 H283.196 Q287.196,697 287.196,701 V707 Q287.196,711 283.196,711 H16 Z" fill="#2F6FA8"/><text x="295.196" y="709" class="s" font-size="13" font-weight="700" fill="#1A2332">R$ 72.372</text><text x="16" y="734" class="s" font-size="13" font-weight="600" fill="#1A2332">Pinheiros</text><text x="404" y="734" class="s" font-size="12.5" fill="#5A6472" text-anchor="end">62% de ocupação</text><path d="M16,743 H268.069 Q272.069,743 272.069,747 V753 Q272.069,757 268.069,757 H16 Z" fill="#2F6FA8"/><text x="280.069" y="755" class="s" font-size="13" font-weight="700" fill="#1A2332">R$ 68.335</text><text x="16" y="780" class="s" font-size="13" font-weight="600" fill="#1A2332">Média de São Paulo</text><text x="404" y="780" class="s" font-size="12.5" fill="#5A6472" text-anchor="end">60% de ocupação</text><path d="M16,789 H230.311 Q234.311,789 234.311,793 V799 Q234.311,803 230.311,803 H16 Z" fill="#7A8594"/><text x="242.311" y="801" class="s" font-size="13" font-weight="700" fill="#1A2332">R$ 58.259</text><text x="16" y="826" class="s" font-size="13" font-weight="600" fill="#1A2332">Perdizes</text><text x="404" y="826" class="s" font-size="12.5" fill="#5A6472" text-anchor="end">53% de ocupação</text><path d="M16,835 H197.201 Q201.201,835 201.201,839 V845 Q201.201,849 197.201,849 H16 Z" fill="#2F6FA8"/><text x="209.201" y="847" class="s" font-size="13" font-weight="700" fill="#1A2332">R$ 49.423</text><text x="16" y="886" class="m" font-size="12" font-weight="700" fill="#11355B">A DEMANDA</text><text x="16" y="904" class="m" font-size="12" fill="#5A6472">PREFEITURA DE SÃO PAULO · BALANÇO DE 2025</text><rect x="16" y="918" width="388" height="62" rx="8" fill="#F6F3EC"/><text x="30" y="946" class="s" font-size="20" font-weight="700" fill="#1A2332" letter-spacing="-0.3">47,2 milhões</text><text x="30" y="966" class="s" font-size="12.5" fill="#5A6472">de turistas em 2025, 25% a mais que em 2024</text><rect x="16" y="990" width="388" height="62" rx="8" fill="#F6F3EC"/><text x="30" y="1018" class="s" font-size="20" font-weight="700" fill="#1A2332" letter-spacing="-0.3">2,5 milhões</text><text x="30" y="1038" class="s" font-size="12.5" fill="#5A6472">de visitantes internacionais</text><rect x="16" y="1062" width="388" height="62" rx="8" fill="#F6F3EC"/><text x="30" y="1090" class="s" font-size="20" font-weight="700" fill="#1A2332" letter-spacing="-0.3">62,96%</text><text x="30" y="1110" class="s" font-size="12.5" fill="#5A6472">de ocupação hoteleira média</text><text x="16" y="1154" class="s" font-size="12.5" fill="#5A6472">Números de terceiros, com métodos diferentes.</text><text x="16" y="1171" class="s" font-size="12.5" fill="#5A6472">Não são projeção de renda de um imóvel.</text><line x1="16" y1="1190" x2="404" y2="1190" stroke="#E7E2D9" stroke-width="1"/><text x="16" y="1210" class="m" font-size="12" fill="#5A6472">Fontes: GuestFavorites (jan–ago/2026); AirROI</text><text x="16" y="1227" class="m" font-size="12" fill="#5A6472">(ago/2025–jul/2026); Prefeitura de São Paulo,</text><text x="16" y="1244" class="m" font-size="12" fill="#5A6472">Observatório de Turismo e Eventos (balanço de 2025)</text><text x="16" y="1268" class="m" font-size="12" font-weight="700" fill="#11355B">bewild.com.br</text></svg>
