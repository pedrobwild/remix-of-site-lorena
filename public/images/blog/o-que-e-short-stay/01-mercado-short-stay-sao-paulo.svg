<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1002" width="720" height="1002" role="img" aria-labelledby="t d"><title id="t">Short stay em São Paulo: mais anúncios, menos receita por anúncio</title><desc id="d">Infográfico com dados de mercado do short stay em São Paulo. Média da cidade (GuestFavorites, janeiro a agosto de 2026): 34.854 anúncios ativos, diária média de R$ 266, 60% de ocupação e receita anual média de R$ 58.259 por anúncio. Em um ano (AirROI, agosto de 2025 a julho de 2026): 60,7% mais anúncios e receita por anúncio 14,3% menor; o AirROI usa outro método e mede 38,1% de ocupação. Receita anual média por anúncio, por bairro (GuestFavorites): Itaim Bibi, R$ 77.390, com 59% de ocupação; Jardim Paulista, R$ 72.372, com 62%; Pinheiros, R$ 68.335, com 62%; média de São Paulo, R$ 58.259, com 60%; Perdizes, R$ 49.423, com 53%. Demanda (Prefeitura de São Paulo, Observatório de Turismo e Eventos, balanço de 2025): 47,2 milhões de turistas em 2025, 25% a mais que em 2024; 2,5 milhões de visitantes internacionais; ocupação hoteleira média de 62,96%. Números de terceiros, com métodos diferentes; não são projeção de renda de um imóvel.</desc><style>.s{font-family:Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif}.m{font-family:'JetBrains Mono', Menlo, Consolas, monospace}</style><rect width="720" height="1002" fill="#FFFFFF"/><text x="32" y="34" class="m" font-size="12" font-weight="700" fill="#11355B" letter-spacing="1.5">MERCADO DE SHORT STAY · SÃO PAULO · 2026</text><text x="32" y="66" class="s" font-size="22" font-weight="700" fill="#1A2332" letter-spacing="-0.3">Short stay em São Paulo: mais anúncios,</text><text x="32" y="95" class="s" font-size="22" font-weight="700" fill="#1A2332" letter-spacing="-0.3">menos receita por anúncio</text><text x="32" y="126" class="s" font-size="14" fill="#5A6472">O mercado em números, por dois levantamentos de 2026 e pelo balanço de turismo da Prefeitura.</text><text x="32" y="166" class="m" font-size="12" font-weight="700" fill="#11355B">A MÉDIA DA CIDADE</text><text x="688" y="166" class="m" font-size="12" fill="#5A6472" text-anchor="end">GUESTFAVORITES · JAN–AGO/2026</text><rect x="32" y="180" width="155" height="92" rx="8" fill="#F6F3EC"/><text x="48" y="216" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.3">34.854</text><text x="48" y="238" class="s" font-size="13" fill="#5A6472">anúncios ativos</text><rect x="199" y="180" width="155" height="92" rx="8" fill="#F6F3EC"/><text x="215" y="216" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.3">R$ 266</text><text x="215" y="238" class="s" font-size="13" fill="#5A6472">diária média</text><rect x="366" y="180" width="155" height="92" rx="8" fill="#F6F3EC"/><text x="382" y="216" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.3">60%</text><text x="382" y="238" class="s" font-size="13" fill="#5A6472">ocupação</text><rect x="533" y="180" width="155" height="92" rx="8" fill="#F6F3EC"/><text x="549" y="216" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.3">R$ 58.259</text><text x="549" y="238" class="s" font-size="13" fill="#5A6472">receita anual média</text><text x="549" y="255" class="s" font-size="13" fill="#5A6472">por anúncio</text><text x="32" y="310" class="m" font-size="12" font-weight="700" fill="#11355B">EM UM ANO</text><text x="688" y="310" class="m" font-size="12" fill="#5A6472" text-anchor="end">AIRROI · AGO/2025–JUL/2026</text><rect x="32" y="324" width="322" height="80" rx="8" fill="#F6F3EC"/><path d="M48,359 L55.5,344 L63,359 Z" fill="#2F6FA8"/><text x="72" y="360" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.3">+60,7%</text><text x="48" y="382" class="s" font-size="13" fill="#5A6472">anúncios ativos</text><rect x="366" y="324" width="322" height="80" rx="8" fill="#F6F3EC"/><path d="M382,344 L397,344 L389.5,359 Z" fill="#D07A3E"/><text x="406" y="360" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.3">−14,3%</text><text x="382" y="382" class="s" font-size="13" fill="#5A6472">receita por anúncio</text><text x="32" y="428" class="s" font-size="13" fill="#5A6472">O AirROI usa outro método: mede 38,1% de ocupação no mesmo período.</text><text x="32" y="468" class="m" font-size="12" font-weight="700" fill="#11355B">RECEITA ANUAL MÉDIA POR ANÚNCIO, POR BAIRRO</text><text x="688" y="468" class="m" font-size="12" fill="#5A6472" text-anchor="end">GUESTFAVORITES · JAN–AGO/2026</text><text x="32" y="498" class="s" font-size="14" font-weight="600" fill="#1A2332">Itaim Bibi</text><text x="688" y="498" class="s" font-size="13" fill="#5A6472" text-anchor="end">59% de ocupação</text><path d="M32,508 H408 Q412,508 412,512 V518 Q412,522 408,522 H32 Z" fill="#2F6FA8"/><text x="420" y="520" class="s" font-size="14" font-weight="700" fill="#1A2332">R$ 77.390</text><text x="32" y="548" class="s" font-size="14" font-weight="600" fill="#1A2332">Jardim Paulista</text><text x="688" y="548" class="s" font-size="13" fill="#5A6472" text-anchor="end">62% de ocupação</text><path d="M32,558 H383.361 Q387.361,558 387.361,562 V568 Q387.361,572 383.361,572 H32 Z" fill="#2F6FA8"/><text x="395.361" y="570" class="s" font-size="14" font-weight="700" fill="#1A2332">R$ 72.372</text><text x="32" y="598" class="s" font-size="14" font-weight="600" fill="#1A2332">Pinheiros</text><text x="688" y="598" class="s" font-size="13" fill="#5A6472" text-anchor="end">62% de ocupação</text><path d="M32,608 H363.538 Q367.538,608 367.538,612 V618 Q367.538,622 363.538,622 H32 Z" fill="#2F6FA8"/><text x="375.538" y="620" class="s" font-size="14" font-weight="700" fill="#1A2332">R$ 68.335</text><text x="32" y="648" class="s" font-size="14" font-weight="600" fill="#1A2332">Média de São Paulo</text><text x="688" y="648" class="s" font-size="13" fill="#5A6472" text-anchor="end">60% de ocupação</text><path d="M32,658 H314.063 Q318.063,658 318.063,662 V668 Q318.063,672 314.063,672 H32 Z" fill="#7A8594"/><text x="326.063" y="670" class="s" font-size="14" font-weight="700" fill="#1A2332">R$ 58.259</text><text x="32" y="698" class="s" font-size="14" font-weight="600" fill="#1A2332">Perdizes</text><text x="688" y="698" class="s" font-size="13" fill="#5A6472" text-anchor="end">53% de ocupação</text><path d="M32,708 H270.677 Q274.677,708 274.677,712 V718 Q274.677,722 270.677,722 H32 Z" fill="#2F6FA8"/><text x="282.677" y="720" class="s" font-size="14" font-weight="700" fill="#1A2332">R$ 49.423</text><text x="32" y="764" class="m" font-size="12" font-weight="700" fill="#11355B">A DEMANDA</text><text x="688" y="764" class="m" font-size="12" fill="#5A6472" text-anchor="end">PREFEITURA DE SÃO PAULO · BALANÇO DE 2025</text><rect x="32" y="778" width="210.667" height="92" rx="8" fill="#F6F3EC"/><text x="48" y="814" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.3">47,2 milhões</text><text x="48" y="836" class="s" font-size="13" fill="#5A6472">de turistas em 2025,</text><text x="48" y="853" class="s" font-size="13" fill="#5A6472">25% a mais que em 2024</text><rect x="254.667" y="778" width="210.667" height="92" rx="8" fill="#F6F3EC"/><text x="270.667" y="814" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.3">2,5 milhões</text><text x="270.667" y="836" class="s" font-size="13" fill="#5A6472">de visitantes</text><text x="270.667" y="853" class="s" font-size="13" fill="#5A6472">internacionais</text><rect x="477.333" y="778" width="210.667" height="92" rx="8" fill="#F6F3EC"/><text x="493.333" y="814" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.3">62,96%</text><text x="493.333" y="836" class="s" font-size="13" fill="#5A6472">de ocupação hoteleira</text><text x="493.333" y="853" class="s" font-size="13" fill="#5A6472">média</text><text x="32" y="900" class="s" font-size="13" fill="#5A6472">Números de terceiros, com métodos diferentes. Não são projeção de renda de um imóvel.</text><line x1="32" y1="920" x2="688" y2="920" stroke="#E7E2D9" stroke-width="1"/><text x="32" y="942" class="m" font-size="12" fill="#5A6472">Fontes: GuestFavorites (jan–ago/2026); AirROI (ago/2025–jul/2026); Prefeitura de São Paulo,</text><text x="32" y="960" class="m" font-size="12" fill="#5A6472">Observatório de Turismo e Eventos (balanço de 2025, 21/01/2026)</text><text x="32" y="982" class="m" font-size="12" font-weight="700" fill="#11355B">bewild.com.br</text></svg>
