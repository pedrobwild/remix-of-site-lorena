<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" width="720" height="500" role="img" aria-labelledby="t d"><title id="t">A diária do anúncio típico é 22% menor que a média; o resultado líquido, 33% menor</title><desc id="d">Diária e resultado líquido mensal de um studio no Airbnb em Pinheiros, com 63% de ocupação. Média do bairro: diária de R$ 299 e líquido de R$ 2.164. Anúncio típico (mediana): diária de R$ 232, 22% abaixo da média, e líquido de R$ 1.456, 33% abaixo. 25% mais baratos (P25): diária de R$ 171, 43% abaixo, e líquido de R$ 809, 63% abaixo. Custos pelo DRE padrão do guia do Radar Bewild e R$ 1.000 de condomínio e contas. Fonte: Radar Bewild, com dados da GuestFavorites de janeiro a setembro de 2026.</desc><style>.s{font-family:Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif}.m{font-family:'JetBrains Mono', Menlo, Consolas, monospace}</style><rect width="720" height="500" fill="#FFFFFF"/><text x="32" y="34" class="m" font-size="12" font-weight="700" fill="#11355B" letter-spacing="1.5">PINHEIROS · AIRBNB</text><text x="32" y="66" class="s" font-size="22" font-weight="700" fill="#1A2332" letter-spacing="-0.3">A diária do anúncio típico é 22% menor que a</text><text x="32" y="95" class="s" font-size="22" font-weight="700" fill="#1A2332" letter-spacing="-0.3">média; o resultado líquido, 33% menor</text><text x="32" y="128" class="s" font-size="14" fill="#5A6472">Studio no Airbnb com 63% de ocupação. Os R$ 1.000 de condomínio e contas não caem</text><text x="32" y="149" class="s" font-size="14" fill="#5A6472">quando a diária cai.</text><text x="32" y="184" class="m" font-size="12" font-weight="700" fill="#11355B" letter-spacing="1">DIÁRIA</text><text x="388" y="184" class="m" font-size="12" font-weight="700" fill="#11355B" letter-spacing="1">RESULTADO LÍQUIDO POR MÊS</text><line x1="32" y1="198" x2="332" y2="198" stroke="#E7E2D9" stroke-width="1"/><line x1="388" y1="198" x2="688" y2="198" stroke="#E7E2D9" stroke-width="1"/><text x="32" y="228" class="s" font-size="15" font-weight="700" fill="#1A2332">Média do bairro</text><text x="388" y="228" class="s" font-size="15" font-weight="700" fill="#1A2332">Média do bairro</text><path d="M32 238H224Q228 238 228 242V256Q228 260 224 260H32Z" fill="#2F6FA8"/><path d="M388 238H580Q584 238 584 242V256Q584 260 580 260H388Z" fill="#2F6FA8"/><text x="236" y="255" class="s" font-size="15" font-weight="700" fill="#1A2332">R$ 299</text><text x="592" y="255" class="s" font-size="15" font-weight="700" fill="#1A2332">R$ 2.164</text><text x="32" y="296" class="s" font-size="15" font-weight="700" fill="#1A2332">Anúncio típico (mediana)</text><text x="388" y="296" class="s" font-size="15" font-weight="700" fill="#1A2332">Anúncio típico (mediana)</text><path d="M32 306H180.08Q184.08 306 184.08 310V324Q184.08 328 180.08 328H32Z" fill="#D07A3E"/><path d="M388 306H515.874Q519.874 306 519.874 310V324Q519.874 328 515.874 328H388Z" fill="#D07A3E"/><text x="192.08" y="323" class="s" font-size="15" font-weight="700" fill="#1A2332">R$ 232  −22%</text><text x="527.874" y="323" class="s" font-size="15" font-weight="700" fill="#1A2332">R$ 1.456  −33%</text><text x="32" y="364" class="s" font-size="15" font-weight="700" fill="#1A2332">25% mais baratos (P25)</text><text x="388" y="364" class="s" font-size="15" font-weight="700" fill="#1A2332">25% mais baratos (P25)</text><path d="M32 374H140.094Q144.094 374 144.094 378V392Q144.094 396 140.094 396H32Z" fill="#2F6FA8"/><path d="M388 374H457.274Q461.274 374 461.274 378V392Q461.274 396 457.274 396H388Z" fill="#2F6FA8"/><text x="152.094" y="391" class="s" font-size="15" font-weight="700" fill="#1A2332">R$ 171  −43%</text><text x="469.274" y="391" class="s" font-size="15" font-weight="700" fill="#1A2332">R$ 809  −63%</text><text x="32" y="418" class="s" font-size="13" fill="#5A6472">Percentuais em relação à média do bairro. Mesma ocupação em todas as faixas: a fonte não</text><text x="32" y="436" class="s" font-size="13" fill="#5A6472">publica ocupação por faixa de preço.</text><line x1="32" y1="460" x2="688" y2="460" stroke="#E7E2D9" stroke-width="1"/><text x="32" y="482" class="m" font-size="12" fill="#5A6472">Fonte: Radar Bewild (GuestFavorites, jan–set/26); custos: hipóteses</text><text x="688" y="482" class="m" font-size="12" font-weight="700" fill="#11355B" text-anchor="end">bewild.com.br</text></svg>