<svg xmlns="http://www.w3.org/2000/svg" viewBox="16 0 388 743" width="388" height="743" role="img" aria-labelledby="t d"><title id="t">A diária do anúncio típico é 22% menor que a média; o resultado líquido, 33% menor</title><desc id="d">Diária e resultado líquido mensal de um studio no Airbnb em Pinheiros, com 63% de ocupação. Média do bairro: diária de R$ 299 e líquido de R$ 2.164. Anúncio típico (mediana): diária de R$ 232, 22% abaixo da média, e líquido de R$ 1.456, 33% abaixo. 25% mais baratos (P25): diária de R$ 171, 43% abaixo, e líquido de R$ 809, 63% abaixo. Custos pelo DRE padrão do guia do Radar Bewild e R$ 1.000 de condomínio e contas. Fonte: Radar Bewild, com dados da GuestFavorites de janeiro a setembro de 2026.</desc><style>.s{font-family:Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif}.m{font-family:'JetBrains Mono', Menlo, Consolas, monospace}</style><rect width="420" height="743" fill="#FFFFFF"/><text x="24" y="32" class="m" font-size="13" font-weight="700" fill="#11355B" letter-spacing="1.5">PINHEIROS · AIRBNB</text><text x="24" y="64" class="s" font-size="20" font-weight="700" fill="#1A2332" letter-spacing="-0.3">A diária do anúncio típico é 22%</text><text x="24" y="90" class="s" font-size="20" font-weight="700" fill="#1A2332" letter-spacing="-0.3">menor que a média; o líquido, 33%</text><text x="24" y="116" class="s" font-size="20" font-weight="700" fill="#1A2332" letter-spacing="-0.3">menor</text><text x="24" y="146" class="s" font-size="13" fill="#5A6472">Studio no Airbnb com 63% de ocupação. Os R$ 1.000</text><text x="24" y="166" class="s" font-size="13" fill="#5A6472">de condomínio e contas não caem quando a diária cai.</text><text x="24" y="196" class="m" font-size="13" font-weight="700" fill="#11355B" letter-spacing="1">DIÁRIA</text><line x1="24" y1="208" x2="396" y2="208" stroke="#E7E2D9" stroke-width="1"/><text x="24" y="234" class="s" font-size="14" font-weight="700" fill="#1A2332">Média do bairro</text><path d="M24 243H230Q234 243 234 247V259Q234 263 230 263H24Z" fill="#2F6FA8"/><text x="242" y="258" class="s" font-size="14" font-weight="700" fill="#1A2332">R$ 299</text><text x="24" y="292" class="s" font-size="14" font-weight="700" fill="#1A2332">Anúncio típico (mediana)</text><path d="M24 301H182.943Q186.943 301 186.943 305V317Q186.943 321 182.943 321H24Z" fill="#D07A3E"/><text x="194.943" y="316" class="s" font-size="14" font-weight="700" fill="#1A2332">R$ 232  −22%</text><text x="24" y="350" class="s" font-size="14" font-weight="700" fill="#1A2332">25% mais baratos (P25)</text><path d="M24 359H140.1Q144.1 359 144.1 363V375Q144.1 379 140.1 379H24Z" fill="#2F6FA8"/><text x="152.1" y="374" class="s" font-size="14" font-weight="700" fill="#1A2332">R$ 171  −43%</text><text x="24" y="414" class="m" font-size="13" font-weight="700" fill="#11355B" letter-spacing="1">RESULTADO LÍQUIDO POR MÊS</text><line x1="24" y1="426" x2="396" y2="426" stroke="#E7E2D9" stroke-width="1"/><text x="24" y="452" class="s" font-size="14" font-weight="700" fill="#1A2332">Média do bairro</text><path d="M24 461H230Q234 461 234 465V477Q234 481 230 481H24Z" fill="#2F6FA8"/><text x="242" y="476" class="s" font-size="14" font-weight="700" fill="#1A2332">R$ 2.164</text><text x="24" y="510" class="s" font-size="14" font-weight="700" fill="#1A2332">Anúncio típico (mediana)</text><path d="M24 519H161.294Q165.294 519 165.294 523V535Q165.294 539 161.294 539H24Z" fill="#D07A3E"/><text x="173.294" y="534" class="s" font-size="14" font-weight="700" fill="#1A2332">R$ 1.456  −33%</text><text x="24" y="568" class="s" font-size="14" font-weight="700" fill="#1A2332">25% mais baratos (P25)</text><path d="M24 577H98.5074Q102.507 577 102.507 581V593Q102.507 597 98.5074 597H24Z" fill="#2F6FA8"/><text x="110.507" y="592" class="s" font-size="14" font-weight="700" fill="#1A2332">R$ 809  −63%</text><text x="24" y="632" class="s" font-size="13" fill="#5A6472">Percentuais em relação à média do bairro. Mesma</text><text x="24" y="649" class="s" font-size="13" fill="#5A6472">ocupação em todas as faixas: a fonte não publica ocupação</text><text x="24" y="666" class="s" font-size="13" fill="#5A6472">por faixa de preço.</text><line x1="24" y1="689" x2="396" y2="689" stroke="#E7E2D9" stroke-width="1"/><text x="24" y="710" class="m" font-size="12" fill="#5A6472">Fonte: Radar Bewild (GuestFavorites,</text><text x="24" y="727" class="m" font-size="13" fill="#5A6472">jan–set/26); custos: hipóteses</text><text x="396" y="727" class="m" font-size="12" font-weight="700" fill="#11355B" text-anchor="end">bewild.com.br</text></svg>