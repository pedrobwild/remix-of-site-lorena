  <text x="500" y="226" font-size="12.5" fill="#5A6472">e ocupação com o bairro</text>
  <rect x="24" y="300" width="672" height="84" rx="8" fill="#FFFFFF" stroke="#E5E8EC"/>
  <text x="40" y="324" font-size="12" font-weight="700" fill="#1A2332">DUAS BASES DE DADOS</text>
  <text x="40" y="346" font-size="12.5" fill="#5A6472">Mercado: diária e ocupação de 28 bairros de São Paulo (GuestFavorites)</text>
