  <text x="50" y="119" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="70" y="120" font-size="17" font-weight="700" fill="#1A2332">Vou comprar</text>
  <text x="40" y="152" font-size="14" font-weight="600" fill="#1A2332">Este bairro paga</text>
  <text x="40" y="171" font-size="14" font-weight="600" fill="#1A2332">o preço pedido?</text>
  <line x1="40" y1="188" x2="220" y2="188" stroke="#E5E8EC"/>
  <text x="40" y="208" font-size="12.5" fill="#5A6472">Ranking, mapa e comparador</text>
  <text x="40" y="226" font-size="12.5" fill="#5A6472">Simulador de resultado</text>
  <text x="40" y="244" font-size="12.5" fill="#5A6472">Simulador de financiamento</text>
  <rect x="254" y="78" width="212" height="204" rx="8" fill="#F5F7FA" stroke="#E5E8EC"/>
  <rect x="254" y="78" width="212" height="6" rx="3" fill="#D07A3E"/>
  <circle cx="280" cy="114" r="12" fill="#D07A3E"/>
  <text x="280" y="119" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="300" y="120" font-size="17" font-weight="700" fill="#1A2332">Vou reformar</text>
  <text x="270" y="152" font-size="14" font-weight="600" fill="#1A2332">Quanto reservar e por</text>
  <text x="270" y="171" font-size="14" font-weight="600" fill="#1A2332">quanto tempo?</text>
  <line x1="270" y1="188" x2="450" y2="188" stroke="#E5E8EC"/>
  <text x="270" y="208" font-size="12.5" fill="#5A6472">Estimativa de custo por área</text>
  <text x="270" y="226" font-size="12.5" fill="#5A6472">Prazo de obra</text>
  <rect x="484" y="78" width="212" height="204" rx="8" fill="#F5F7FA" stroke="#E5E8EC"/>
  <rect x="484" y="78" width="212" height="6" rx="3" fill="#11355B"/>
  <circle cx="510" cy="114" r="12" fill="#11355B"/>
  <text x="510" y="119" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="530" y="120" font-size="17" font-weight="700" fill="#1A2332">Já opero</text>
  <text x="500" y="152" font-size="14" font-weight="600" fill="#1A2332">Estou acima ou abaixo</text>
  <text x="500" y="171" font-size="14" font-weight="600" fill="#1A2332">do bairro?</text>
