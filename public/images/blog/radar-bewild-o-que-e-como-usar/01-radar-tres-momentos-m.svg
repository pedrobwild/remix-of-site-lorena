  <text x="36" y="606" font-size="12.5" fill="#5A6472">Comparação de diária</text>
  <text x="36" y="624" font-size="12.5" fill="#5A6472">e ocupação com o bairro</text>
  <rect x="20" y="656" width="380" height="84" rx="8" fill="#FFFFFF" stroke="#E5E8EC"/>
  <text x="36" y="680" font-size="12" font-weight="700" fill="#1A2332">DUAS BASES DE DADOS</text>
  <text x="36" y="702" font-size="12.5" fill="#5A6472">Mercado: diária e ocupação de 28 bairros (GuestFavorites)</text>
  <text x="36" y="722" font-size="12.5" fill="#5A6472">Reforma: custo e prazo de 188 contratos da Bewild</text>
