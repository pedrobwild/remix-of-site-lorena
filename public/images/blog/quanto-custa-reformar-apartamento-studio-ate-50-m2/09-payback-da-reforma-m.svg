<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 637" width="420" height="637" role="img" aria-labelledby="t d"><title id="t">Em quantos anos a reforma se paga</title><desc id="d">Mapa de calor: anos de payback para reformas de R$ 65 mil a R$ 120 mil e ganho líquido mensal de R$ 600 a R$ 2.400. Ex.: R$ 72 mil com R$ 1.500 por mês = 4,0 anos.</desc><style>.s{font-family:Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif}.m{font-family:'JetBrains Mono', Menlo, Consolas, monospace}</style><rect width="420" height="637" fill="#FFFFFF"/><text x="32" y="44" class="m" font-size="13" font-weight="700" fill="#11355B" letter-spacing="1.5">PAYBACK SIMPLES</text><text x="32" y="78" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">Em quantos anos a reforma</text><text x="32" y="108" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">se paga?</text><text x="32" y="140" class="s" font-size="15" fill="#5A6472">Anos = investimento na reforma ÷ ganho</text><text x="32" y="161" class="s" font-size="15" fill="#5A6472">líquido que ela cria por mês. Sem juros e</text><text x="32" y="182" class="s" font-size="15" fill="#5A6472">sem valorização do imóvel.</text><text x="246" y="225" class="s" font-size="13" fill="#5A6472" text-anchor="middle">ganho líquido gerado, R$/mês</text><text x="127.7" y="247" class="m" font-size="13" font-weight="700" fill="#1A2332" text-anchor="middle">600</text><text x="175" y="247" class="m" font-size="13" font-weight="700" fill="#1A2332" text-anchor="middle">900</text><text x="222.3" y="247" class="m" font-size="13" font-weight="700" fill="#1A2332" text-anchor="middle">1.200</text><text x="269.7" y="247" class="m" font-size="13" font-weight="700" fill="#1A2332" text-anchor="middle">1.500</text><text x="317" y="247" class="m" font-size="13" font-weight="700" fill="#1A2332" text-anchor="middle">1.800</text><text x="364.3" y="247" class="m" font-size="13" font-weight="700" fill="#1A2332" text-anchor="middle">2.400</text><text x="32" y="290" class="s" font-size="13.5" font-weight="700" fill="#1A2332">R$ 65 mil</text><rect x="105" y="260" width="45.3" height="50" rx="3" fill="#2F6FA8"/><text x="127.7" y="290" class="s" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">9,0</text><rect x="152.3" y="260" width="45.3" height="50" rx="3" fill="#5E97C4"/><text x="175" y="290" class="s" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">6,0</text><rect x="199.7" y="260" width="45.3" height="50" rx="3" fill="#94BCDC"/><text x="222.3" y="290" class="s" font-size="14" font-weight="700" fill="#1A2332" text-anchor="middle">4,5</text><rect x="247" y="260" width="45.3" height="50" rx="3" fill="#C3D9EC"/><text x="269.7" y="290" class="s" font-size="14" font-weight="700" fill="#1A2332" text-anchor="middle">3,6</text><rect x="294.3" y="260" width="45.3" height="50" rx="3" fill="#C3D9EC"/><text x="317" y="290" class="s" font-size="14" font-weight="700" fill="#1A2332" text-anchor="middle">3,0</text><rect x="341.7" y="260" width="45.3" height="50" rx="3" fill="#E4EEF6"/><text x="364.3" y="290" class="s" font-size="14" font-weight="700" fill="#1A2332" text-anchor="middle">2,3</text><text x="32" y="342" class="s" font-size="13.5" font-weight="700" fill="#1A2332">R$ 72 mil</text><rect x="105" y="312" width="45.3" height="50" rx="3" fill="#2F6FA8"/><text x="127.7" y="342" class="s" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">10,0</text><rect x="152.3" y="312" width="45.3" height="50" rx="3" fill="#5E97C4"/><text x="175" y="342" class="s" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">6,7</text><rect x="199.7" y="312" width="45.3" height="50" rx="3" fill="#94BCDC"/><text x="222.3" y="342" class="s" font-size="14" font-weight="700" fill="#1A2332" text-anchor="middle">5,0</text><rect x="247" y="312" width="45.3" height="50" rx="3" fill="#C3D9EC"/><text x="269.7" y="342" class="s" font-size="14" font-weight="700