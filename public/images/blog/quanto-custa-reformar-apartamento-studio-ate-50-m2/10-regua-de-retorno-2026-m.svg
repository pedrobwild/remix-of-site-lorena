<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 631" width="420" height="631" role="img" aria-labelledby="t d"><title id="t">A régua do investidor em setembro de 2026</title><desc id="d">CDI 12 meses 14,63% bruto e 12,44% líquido; aluguel mais valorização média de SP 10,05%; rentabilidade bruta do aluguel em SP 6,42%; IPCA 4,14%; valorização do m² à venda 3,63%.</desc><style>.s{font-family:Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif}.m{font-family:'JetBrains Mono', Menlo, Consolas, monospace}</style><rect width="420" height="631" fill="#FFFFFF"/><text x="32" y="44" class="m" font-size="13" font-weight="700" fill="#11355B" letter-spacing="1.5">PÓS-OBRA: CONTRA O QUE COMPARAR</text><text x="32" y="78" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">A régua do investidor em</text><text x="32" y="108" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">setembro de 2026</text><text x="32" y="140" class="s" font-size="15" fill="#5A6472">Retornos anuais de referência. O imóvel</text><text x="32" y="161" class="s" font-size="15" fill="#5A6472">médio de SP não vence o CDI só com aluguel:</text><text x="32" y="182" class="s" font-size="15" fill="#5A6472">o produto decide.</text><text x="32" y="235" class="s" font-size="14" font-weight="600" fill="#1A2332">CDI 12 meses (bruto)</text><path d="M32.0,243.0 H297.2 Q301.2,243.0 301.2,247.0 V255.0 Q301.2,259.0 297.2,259.0 H32.0 Z" fill="#CFC8BC"/><text x="309.2" y="257" class="s" font-size="14" font-weight="700" fill="#1A2332">14,63%</text><text x="32" y="289" class="s" font-size="14" font-weight="600" fill="#1A2332">CDI 12 meses (líquido de IR)</text><path d="M32.0,297.0 H256.9 Q260.9,297.0 260.9,301.0 V309.0 Q260.9,313.0 256.9,313.0 H32.0 Z" fill="#CFC8BC"/><text x="268.9" y="311" class="s" font-size="14" font-weight="700" fill="#1A2332">12,44%</text><text x="32" y="343" class="s" font-size="14" font-weight="600" fill="#1A2332">Aluguel + valorização (média SP)</text><path d="M32.0,351.0 H212.9 Q216.9,351.0 216.9,355.0 V363.0 Q216.9,367.0 212.9,367.0 H32.0 Z" fill="#2F6FA8"/><text x="224.9" y="365" class="s" font-size="14" font-weight="700" fill="#1A2332">10,05%</text><text x="32" y="397" class="s" font-size="14" font-weight="600" fill="#1A2332">Aluguel: rentabilidade bruta (SP)</text><path d="M32.0,405.0 H146.1 Q150.1,405.0 150.1,409.0 V417.0 Q150.1,421.0 146.1,421.0 H32.0 Z" fill="#2F6FA8"/><text x="158.1" y="419" class="s" font-size="14" font-weight="700" fill="#1A2332">6,42%</text><text x="32" y="451" class="s" font-size="14" font-weight="600" fill="#1A2332">IPCA 12 meses</text><path d="M32.0,459.0 H104.2 Q108.2,459.0 108.2,463.0 V471.0 Q108.2,475.0 104.2,475.0 H32.0 Z" fill="#CFC8BC"/><text x="116.2" y="473" class="s" font-size="14" font-weight="700" fill="#1A2332">4,14%</text><text x="32" y="505" class="s" font-size="14" font-weight="600" fill="#1A2332">Valorização do m² à venda (SP, 12m)</text><path d="M32.0,513.0 H94.8 Q98.8,513.0 98.8,517.0 V525.0 Q98.8,529.0 94.8,529.0 H32.0 Z" fill="#2F6FA8"/><text x="106.8" y="527" class="s" font-size="14" font-weight="700" fill="#1A2332">3,63%</text><line x1="32" y1="565" x2="388" y2="565" stroke="#E7E2D9" stroke-width="1"/><text x="32" y="587" class="m" font-size="13" fill="#5A6472">Fontes: FipeZap (ago/26), BCB/SGS, IBGE</text><text x="32" y="609" class="m" font-size="13" font-weight="700" fill="#11355B">bewild.com.br</text></svg>
