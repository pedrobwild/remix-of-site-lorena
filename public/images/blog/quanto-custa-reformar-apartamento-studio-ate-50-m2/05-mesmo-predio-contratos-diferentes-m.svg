<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 753" width="420" height="753" role="img" aria-labelledby="t d"><title id="t">Mesmo prédio, contratos diferentes</title><desc id="d">Pares de contratos no mesmo empreendimento e metragem parecida: Exalt Ibirapuera 31 m²: R$ 73.000 a R$ 121.000; Nurban Vila Madalena 26–28 m²: R$ 71.303 a R$ 108.447; Nex One Pereira Coutinho 27 m²: R$ 67.000 a R$ 90.432; Level Brooklin 26 m²: R$ 56.334 a R$ 69.753; MetroCasa Berrini 26–27 m²: R$ 64.456 a R$ 71.432</desc><style>.s{font-family:Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif}.m{font-family:'JetBrains Mono', Menlo, Consolas, monospace}</style><rect width="420" height="753" fill="#FFFFFF"/><text x="32" y="44" class="m" font-size="13" font-weight="700" fill="#11355B" letter-spacing="1.5">O QUE A METRAGEM NÃO EXPLICA</text><text x="32" y="78" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">Mesmo prédio, mesma planta,</text><text x="32" y="108" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">contratos diferentes</text><text x="32" y="140" class="s" font-size="15" fill="#5A6472">Menor e maior contrato no mesmo</text><text x="32" y="161" class="s" font-size="15" fill="#5A6472">empreendimento. A diferença vem do escopo e</text><text x="32" y="182" class="s" font-size="15" fill="#5A6472">do padrão, não do m².</text><line x1="58.1" y1="235" x2="58.1" y2="599" stroke="#E7E2D9" stroke-width="1"/><text x="58.1" y="617" class="m" font-size="13" fill="#5A6472" text-anchor="middle">50</text><line x1="148.8" y1="235" x2="148.8" y2="599" stroke="#E7E2D9" stroke-width="1"/><text x="148.8" y="617" class="m" font-size="13" fill="#5A6472" text-anchor="middle">75</text><line x1="239.4" y1="235" x2="239.4" y2="599" stroke="#E7E2D9" stroke-width="1"/><text x="239.4" y="617" class="m" font-size="13" fill="#5A6472" text-anchor="middle">100</text><line x1="330" y1="235" x2="330" y2="599" stroke="#E7E2D9" stroke-width="1"/>