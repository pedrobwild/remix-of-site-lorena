<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 594" width="720" height="713" role="img" aria-labelledby="t d"><title id="t">Em quantos anos a reforma se paga</title><desc id="d">Mapa de calor: anos de payback para reformas de R$ 65 mil a R$ 120 mil e ganho líquido mensal de R$ 600 a R$ 2.400. Ex.: R$ 72 mil com R$ 1.500 por mês = 4,0 anos.</desc><style>.s{font-family:Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif}.m{font-family:'JetBrains Mono', Menlo, Consolas, monospace}</style><rect width="600" height="594" fill="#FFFFFF"/><text x="32" y="44" class="m" font-size="13" font-weight="700" fill="#11355B" letter-spacing="1.5">PAYBACK SIMPLES</text><text x="32" y="78" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">Em quantos anos a reforma</text><text x="32" y="108" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">se paga?</text><text x="32" y="140" class="s" font-size="15" fill="#5A6472">Anos = investimento na reforma ÷ ganho líquido que ela</text><text x="32" y="161" class="s" font-size="15" fill="#5A6472">cria por mês. Sem juros e sem valorização do imóvel.</text><text x="348" y="204" class="s" font-size="13" fill="#5A6472" text-anchor="middle">ganho líquido mensal gerado pela reforma</text><text x="164.7" y="226" class="m" font-size="13" font-weight="700" fill="#1A2332" text-anchor="middle">R$ 600</text><text x="238" y="226" class="m" font-size="13" font-weight="700" fill="#1A2332" text-anchor="middle">R$ 900</text><text x="311.3" y="226" class="m" font-size="13" font-weight="700" fill="#1A2332" text-anchor="middle">R$ 1.200</text><text x="384.7" y="226" class="m" font-size="13" font-weight="700" fill="#1A2332" text-anchor="middle">R$ 1.500</text><text x="458" y="226" class="m" font-size="13" font-weight="700" fill="#1A2332" text-anchor="middle">R$ 1.800</text><text x="531.3" y="226" class="m" font-size="13" font-weight="700" fill="#1A2332" text-anchor="middle">R$ 2.400</text><text x=