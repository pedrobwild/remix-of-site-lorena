<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 0 380 629" width="380" height="629" role="img" aria-labelledby="t d"><title id="t">Valor por m² por faixa de metragem</title><desc id="d">até 20 m²: R$ 3.825 por m² (42 orçamentos); 20 a 24 m²: R$ 3.056 por m² (64 orçamentos); 24 a 28 m²: R$ 2.802 por m² (241 orçamentos); 28 a 32 m²: R$ 2.594 por m² (107 orçamentos); 32 a 40 m²: R$ 2.550 por m² (109 orçamentos); 40 a 45 m²: R$ 2.649 por m² (22 orçamentos)</desc><style>.s{font-family:Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif}.m{font-family:'JetBrains Mono', Menlo, Consolas, monospace}</style><rect width="420" height="629" fill="#FFFFFF"/><text x="32" y="44" class="m" font-size="13" font-weight="700" fill="#11355B" letter-spacing="1.5">CUSTO POR METRAGEM</text><text x="32" y="78" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">Quanto menor o studio,</text><text x="32" y="108" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">mais caro o metro</text><text x="32" y="138" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">quadrado</text><text x="32" y="170" class="s" font-size="15" fill="#5A6472">Mediana do valor por m² em cada faixa de</text><text x="32" y="191" class="s" font-size="15" fill="#5A6472">metragem. O m² cai até perto de 32 m² e</text><text x="32" y="212" class="s" font-size="15" fill="#5A6472">depois se estabiliza.</text><text x="32" y="257" class="s" font-size="14.5" font-weight="600" fill="#1A2332">até 20 m²</text><text x="388" y="257" class="m" font-size="13" fill="#5A6472" text-anchor="end">42 orçamentos</text><rect x="32.0" y="265.0" width="254.4" height="16.0" rx="4" fill="#D07A3E"/><text x="294.407" y="278" class="s" font-size="14" font-weight="700" fill="#1A2332">R$ 3.825</text><text x="32" y="311" class="s" font-size="14.5" font-weight="600" fill="#1A2332">20 a 24 m²</text><text x="388" y="311" class="m" font-size="13" fill="#5A6472" text-ancho