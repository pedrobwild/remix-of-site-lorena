<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 607" width="420" height="607" role="img" aria-labelledby="t d"><title id="t">Em quantos anos a reforma se paga</title><desc id="d">Mapa de calor: anos de payback para reformas de R$ 65 mil a R$ 120 mil e ganho líquido mensal de R$ 600 a R$ 2.400. Ex.: R$ 74 mil com R$ 1.800 por mês = 3,4 anos.</desc><style>.s{font-family:Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif}.m{font-family:'JetBrains Mono', Menlo, Consolas, monospace}</style><rect width="420" height="607" fill="#FFFFFF"/><text x="32" y="44" class="m" font-size="13" font-weight="700" fill="#11355B" letter-spacing="1.5">PAYBACK SIMPLES</text><text x="32" y="78" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">Em quantos anos a reforma</text><text x="32" y="108" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">se paga?</text><text x="32" y="140" class="s" font-size="15" fill="#5A6472">Anos = investimento na reforma ÷ ganho</text><text x="32" y="161" class="s" font-size="15" fill="#5A6472">líquido que ela cria por mês. Sem juros</text><text x="32" y="182" class="s" font-size="15" fill="#5A6472">e sem valorização do imóvel.</text><text x="250" y="223" class="s" font-size="13" fill="#5A6472" text-anchor="middle">ganho líquido mensal criado pela reforma</text><text x="146.5" y="245" class="m" font-size="12" font-weight="700" fill="#1A2332" text-anchor="middle">R$ 600</text><text x="215.5" y="245" class="m" font-size="12" font-weight="700" fill="#1A2332" text-anchor="middle">R$ 1.200</text><text x="284.5" y="245" class="m" font-size="12" font-weight="700" fill="#1A2332" text-anchor="middle">R$ 1.800</text><text x="353.5" y="245" class="m" font-size="12" font-weight="700" fill="#1A2332" text-anchor="middle">R$ 2.400</text><text x="32" y="291" class="m" font-size="13" font-weight="700" fill="#1A2332">R$ 65 mil</text><rect x="115.0" y="258.0" width="63.0" height="56.0" rx="6" fill="#D9634C"/><text x="146.5" y="293" class="s" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">9,0</text><rect x="184.0" y="258.0" width="63.0" height="56.0" rx="6" fill="#E9C46A"/><text x="215.5" y="293" class="s" font-size="18" font-weight="700" fill="#1A2332" text-anchor="middle">4,5</text><rect x="253.0" y="258.0" width="63.0" height="56.0" rx="6" fill="#2E7D5B"/><text x="284.5" y="293" class="s" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">3,0</text><rect x="322.0" y="258.0" width="63.0" height="56.0" rx="6" fill="#2E7D5B"/><text x="353.5" y="293" class="s" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">2,3</text><text x="32" y="353" class="m" font-size="13" font-weight="700" fill="#1A2332">R$ 74 mil</text><rect x="115.0" y="320.0" width="63.0" height="56.0" rx="6" fill="#D9634C"/><text x="146.5" y="355" class="s" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">10,3</text><rect x="184.0" y="320.0" width="63.0" height="56.0" rx="6" fill="#E9C46A"/><text x="215.5" y="355" class="s" font-size="18" font-weight="700" fill="#1A2332" text-anchor="middle">5,1</text><rect x="253.0" y="320.0" width="63.0" height="56.0" rx="6" fill="#2E7D5B"/><text x="284.5" y="355" class="s" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">3,4</text><rect x="322.0" y="320.0" width="63.0" height="56.0" rx="6" fill="#2E7D5B"/><text x="353.5" y="355" class="s" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">2,6</text><text x="32" y="415" class="m" font-size="13" font-weight="700" fill="#1A2332">R$ 90 mil</text><rect x="115.0" y="382.0" width="63.0" height="56.0" rx="6" fill="#D9634C"/><text x="146.5" y="417" class="s" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">12,5</text><rect x="184.0" y="382.0" width="63.0" height="56.0" rx="6" fill="#E9C46A"/><text x="215.5" y="417" class="s" font-size="18" font-weight="700" fill="#1A2332" text-anchor="middle">6,2</text><rect x="253.0" y="382.0" width="63.0" height="56.0" rx="6" fill="#E9C46A"/><text x="284.5" y="417" class="s" font-size="18" font-weight="700" fill="#1A2332" text-anchor="middle">4,2</text><rect x="322.0" y="382.0" width="63.0" height="56.0" rx="6" fill="#2E7D5B"/><text x="353.5" y="417" class="s" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">3,1</text><text x="32" y="477" class="m" font-size="13" font-weight="700" fill="#1A2332">R$ 120 mil</text><rect x="115.0" y="444.0" width="63.0" height="56.0" rx="6" fill="#D9634C"/><text x="146.5" y="479" class="s" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">16,7</text><rect x="184.0" y="444.0" width="63.0" height="56.0" rx="6" fill="#D9634C"/><text x="215.5" y="479" class="s" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">8,3</text><rect x="253.0" y="444.0" width="63.0" height="56.0" rx="6" fill="#E9C46A"/><text x="284.5" y="479" class="s" font-size="18" font-weight="700" fill="#1A2332" text-anchor="middle">5,6</text><rect x="322.0" y="444.0" width="63.0" height="56.0" rx="6" fill="#E9C46A"/><text x="353.5" y="479" class="s" font-size="18" font-weight="700" fill="#1A2332" text-anchor="middle">4,2</text><text x="32" y="525" class="s" font-size="12.5" fill="#5A6472">A linha de R$ 74 mil é a mediana do Índice Bewild.</text><line x1="32.0" y1="545.0" x2="388.0" y2="545.0" stroke="#E7E2D9" stroke-width="1"/><text x="32" y="567" class="m" font-size="12" fill="#5A6472">Conta: Bewild, mediana do Índice nov/2026</text><text x="32" y="587" class="m" font-size="13" font-weight="700" fill="#11355B">bewild.com.br</text></svg>
