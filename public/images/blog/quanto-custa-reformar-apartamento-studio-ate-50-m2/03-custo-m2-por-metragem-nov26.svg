<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 560" width="720" height="672" role="img" aria-labelledby="t d"><title id="t">Valor por m² por faixa de metragem</title><desc id="d">até 20 m²: R$ 3.825 por m² (42 orçamentos); 20 a 24 m²: R$ 3.056 por m² (64 orçamentos); 24 a 28 m²: R$ 2.802 por m² (241 orçamentos); 28 a 32 m²: R$ 2.594 por m² (107 orçamentos); 32 a 40 m²: R$ 2.550 por m² (109 orçamentos); 40 a 45 m²: R$ 2.649 por m² (22 orçamentos)</desc><style>.s{font-family:Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif}.m{font-family:'JetBrains Mono', Menlo, Consolas, monospace}</style><rect width="600" height="560" fill="#FFFFFF"/><text x="32" y="44" class="m" font-size="13" font-weight="700" fill="#11355B" letter-spacing="1.5">CUSTO POR METRAGEM</text><text x="32" y="78" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">Quanto menor o studio, mais caro o</text><text x="32" y="108" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">metro quadrado</text><text x="32" y="140" class="s" font-size="15" fill="#5A6472">Mediana do valor por m² em cada faixa de metragem. O m²</text><text x="32" y="161" class="s" font-size="15" fill="#5A6472">cai até perto de 32 m² e depois se estabiliza.</text><text x="32" y="206" class="s" font-size="14.5" font-weight="600" fill="#1A2332">até 20 m²</text><text x="568" y="206" class="m" font-size="13" fill="#5A6472" text-anchor="end">42 orçamentos</text><rect x="32.0" y="214.0" width="414.5" height="16.0" rx="4" fill="#D07A3E"/><text x="454.523" y="227" class="s" font-size="14" font-weight="700" fill="#1A2332">R$ 3.825</text><text x="32" y="260" class="s" font-size="14.5" font-weight="600" fill="#1A2332">20 a 24 m²</text><text x="568" y="260" class="m" font-size="13" fill="#5A6472" text-anchor="end">64 orçamentos</text><rect x="32.0" y="268.0" width="331.2" height="16.0" rx="4" fill="#2F6FA8"/><text x="371.185" y="281" class="s" font-size="14" font-weight="700" fill="#1A2332">R$ 3.056</text><text x="32" y="314" class="s" font-size="14.5" font-weight="600" fill="#1A2332">24 a 28 m²</text><text x="568" y="314" class="m" font-size="13" fill="#5A6472" text-anchor="end">241 orçamentos</text><rect x="32.0" y="322.0" width="303.7" height="16.0" rx="4" fill="#2F6FA8"/><text x="343.659" y="335" class="s" font-size="14" font-weight="700" fill="#1A2332">R$ 2.802</text><text x="32" y="368" class="s" font-size="14.5" font-weight="600" fill="#1A2332">28 a 32 m²</text><text x="568" y="368" class="m" font-size="13" fill="#5A6472" text-anchor="end">107 orçamentos</text><rect x="32.0" y="376.0" width="281.1" height="16.0" rx="4" fill="#2F6FA8"/><text x="321.117" y="389" class="s" font-size="14" font-weight="700" fill="#1A2332">R$ 2.594</text><text x="32" y="422" class="s" font-size="14.5" font-weight="600" fill="#1A2332">32 a 40 m²</text><text x="568" y="422" class="m" font-size="13" fill="#5A6472" text-anchor="end">109 orçamentos</text><rect x="32.0" y="430.0" width="276.3" height="16.0" rx="4" fill="#2F6FA8"/><text x="316.349" y="443" class="s" font-size="14" font-weight="700" fill="#1A2332">R$ 2.550</text><text x="32" y="476" class="s" font-size="14.5" font-weight="600" fill="#1A2332">40 a 45 m²</text><text x="568" y="476" class="m" font-size="13" fill="#5A6472" text-anchor="end">22 orçamentos</text><rect x="32.0" y="484.0" width="287.1" height="16.0" rx="4" fill="#2F6FA8"/><text x="327.078" y="497" class="s" font-size="14" font-weight="700" fill="#1A2332">R$ 2.649</text><line x1="32.0" y1="516.0" x2="568.0" y2="516.0" stroke="#E7E2D9" stroke-width="1"/><text x="32" y="538" class="m" font-size="13" fill="#5A6472">Fonte: Índice Bewild, nov/2026, 585 orçamentos</text><text x="568" y="538" class="m" font-size="13" font-weight="700" fill="#11355B" text-anchor="end">bewild.com.br</text></svg>
