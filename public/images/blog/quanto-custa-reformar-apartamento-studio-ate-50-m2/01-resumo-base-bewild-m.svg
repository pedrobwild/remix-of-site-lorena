<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1203" width="420" height="1203" role="img" aria-labelledby="t d"><title id="t">Resumo: reforma turnkey em São Paulo em 188 contratos</title><desc id="d">Orçamento mediano de R$ 71,9 mil; R$ 2.744 por m² na mediana, metade entre R$ 2.457 e R$ 3.125; metragem mediana de 27,5 m²; fórmula de bolso R$ 38 mil mais R$ 1.217 por m² entre 21 e 35 m²; 60 a 80 dias úteis de obra; 59% dos clientes moram fora da capital.</desc><style>.s{font-family:Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif}.m{font-family:'JetBrains Mono', Menlo, Consolas, monospace}</style><rect width="420" height="1203" fill="#FFFFFF"/><text x="32" y="44" class="m" font-size="13" font-weight="700" fill="#11355B" letter-spacing="1.5">RESUMO DA BASE BEWILD</text><text x="32" y="78" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">Reforma turnkey em São</text><text x="32" y="108" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">Paulo: o que dizem 188</text><text x="32" y="138" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">contratos</text><text x="32" y="170" class="s" font-size="15" fill="#5A6472">Studios e apartamentos compactos, com</text><text x="32" y="191" class="s" font-size="15" fill="#5A6472">projeto, obra, marcenaria, mobiliário e</text><text x="32" y="212" class="s" font-size="15" fill="#5A6472">eletros no mesmo contrato.</text><rect x="32" y="247" width="356" height="128" rx="6" fill="#F6F3EE"/><rect x="32" y="247" width="4" height="128" rx="2" fill="#2F6FA8"/><text x="52" y="293" class="s" font-size="30" font-weight="700" fill="#1A2332" letter-spacing="-0.6">R$ 71,9 mil</text><text x="52" y="323" class="s" font-size="14.5" font-weight="600" fill="#1A2332">orçamento mediano</text><text x="52" y="347" class="s" font-size="13" fill="#5A6472">metade abaixo, metade acima</text><rect x="32" y="391" width="356" height="128" rx="6" fill="#F6F3EE"/><rect x="32" y="391" width="4" height="128" rx="2" fill="#2F6FA8"/><text x="52" y="437" class="s" font-size="30" font-weight="700" fill="#1A2332" letter-spacing="-0.6">R$ 2.744/m²</text><text x="52" y="467" class="s" font-size="14.5" font-weight="600" fill="#1A2332">valor mediano por m²</text><text x="52" y="491" class="s" font-size="13" fill="#5A6472">metade entre R$ 2.457 e R$ 3.125</text><rect x="32" y="535" width="356" height="128" rx="6" fill="#F6F3EE"/><rect x="32" y="535" width="4" height="128" rx="2" fill="#2F6FA8"/><text x="52" y="581" class="s" font-size="30" font-weight="700" fill="#1A2332" letter-spacing="-0.6">27,5 m²</text><text x="52" y="611" class="s" font-size="14.5" font-weight="600" fill="#1A2332">metragem mediana</text><text x="52" y="635" class="s" font-size="13" fill="#5A6472">79% entre 21 e 35 m²</text><rect x="32" y="679" width="356" height="128" rx="6" fill="#F6F3EE"/><rect x="32" y="679" width="4" height="128" rx="2" fill="#D07A3E"/><text x="52" y="725" class="s" font-size="19" font-weight="700" fill="#1A2332" letter-spacing="-0.6">R$ 38 mil + R$ 1.217/m²</text><text x="52" y="755" class="s" font-size="14.5" font-weight="600" fill="#1A2332">fórmula de bolso (21–35 m²)</text><text x="52" y="779" class="s" font-size="13" fill="#5A6472">3 em cada 4 contratos a ±15%</text><rect x="32" y="823" width="356" height="128" rx="6" fill="#F6F3EE"/><rect x="32" y="823" width="4" height="128" rx="2" fill="#2F6FA8"/><text x="52" y="869" class="s" font-size="30" font-weight="700" fill="#1A2332" letter-spacing="-0.6">60 a 80</text><text x="52" y="899" class="s" font-size="14.5" font-weight="600" fill="#1A2332">dias úteis de obra</text><text x="52" y="923" class="s" font-size="13" fill="#5A6472">em contrato, conforme a metragem</text><rect x="32" y="967" width="356" height="128" rx="6" fill="#F6F3EE"/><rect x="32" y="967" width="4" height="128" rx="2" fill="#2F6FA8"/><text x="52" y="1013" class="s" font-size="30" font-weight="700" fill="#1A2332" letter-spacing="-0.6">59%</text><text x="52" y="1043" class="s" font-size="14.5" font-weight="600" fill="#1A2332">moram fora da capital</text><text x="52" y="1067" class="s" font-size="13" fill="#5A6472">35% em outros estados</text><line x1="32" y1="1137" x2="388" y2="1137" stroke="#E7E2D9" stroke-width="1"/><text x="32" y="1159" class="m" font-size="13" fill="#5A6472">Fonte: base Bewild, 188 contratos turnkey</text><text x="32" y="1181" class="m" font-size="13" font-weight="700" fill="#11355B">bewild.com.br</text></svg>