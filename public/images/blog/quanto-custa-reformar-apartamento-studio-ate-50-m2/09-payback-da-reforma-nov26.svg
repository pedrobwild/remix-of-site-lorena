<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 538" width="720" height="646" role="img" aria-labelledby="t d"><title id="t">Em quantos anos a reforma se paga</title><desc id="d">Mapa de calor: anos de payback para reformas de R$ 65 mil a R$ 120 mil e ganho líquido mensal de R$ 600 a R$ 2.400. Ex.: R$ 74 mil com R$ 1.800 por mês = 3,4 anos.</desc><style>.s{font-family:Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif}.m{font-family:'JetBrains Mono', Menlo, Consolas, monospace}</style><rect width="600" height="538" fill="#FFFFFF"/><text x="32" y="44" class="m" font-size="13" font-weight="700" fill="#11355B" letter-spacing="1.5">PAYBACK SIMPLES</text><text x="32" y="78" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">Em quantos anos a reforma se paga?</text><text x="32" y="110" class="s" font-size="15" fill="#5A6472">Anos = investimento na reforma ÷ ganho líquido que ela</text><text x="32" y="131" class="s" font-size="15" fill="#5A6472">cria por mês. Sem juros e sem valorização do imóvel.</text><text x="343" y="172" class="s" font-size="13" fill="#5A6472" text-anchor="middle">ganho líquido mensal criado pela reforma</text><text x="174.25" y="194" class="m" font-size="13" font-weight="700" fill="#1A2332" text-anchor="middle">R$ 600</text><text x="286.75" y="194" class="m" font-size="13" font-weight="700" fill="#1A2332" text-anchor="middle">R$ 1.200</text><text x="399.25" y="194" class="m" font-size="13" font-weight="700" fill="#1A2332" text-anchor="middle">R$ 1.800</text><text x="511.75" y="194" class="m" font-size="13" font-weight="700" fill="#1A2332" text-anchor="middle">R$ 2.400</text><text x="32" y="240" class="m" font-size="13" font-weight="700" fill="#1A2332">R$ 65 mil</text><rect x="121.0" y="207.0" width="106.5" height="56.0" rx="6" fill="#D9634C"/><text x="174.25" y="242" class="s" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">9,0</text><rect x="233.5" y="207.0" width="106.5" height="56.0" rx="6" fill="#E9C46A"/><text x="286.75" y="242" class="s" font-size="18" font-weight="700" fill="#1A2332" text-anchor="middle">4,5</text><rect x="346.0" y="207.0" width="106.5" height="56.0" rx="6" fill="#2E7D5B"/><text x="399.25" y="242" class="s" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">3,0</text><rect x="458.5" y="207.0" width="106.5" height="56.0" rx="6" fill="#2E7D5B"/><text x="511.75" y="242" class="s" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">2,3</text><text x="32" y="302" class="m" font-size="13" font-weight="700" fill="#1A2332">R$ 74 mil</text><rect x="121.0" y="269.0" width="106.5" height="56.0" rx="6" fill="#D9634C"/><text x="174.25" y="304" class="s" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">10,3</text><rect x="233.5" y="269.0" width="106.5" height="56.0" rx="6" fill="#E9C46A"/><text x="286.75" y="304" class="s" font-size="18" font-weight="700" fill="#1A2332" text-anchor="middle">5,1</text><rect x="346.0" y="269.0" width="106.5" height="56.0" rx="6" fill="#2E7D5B"/><text x="399.25" y="304" class="s" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">3,4</text><rect x="458.5" y="269.0" width="106.5" height="56.0" rx="6" fill="#2E7D5B"/><text x="511.75" y="304" class="s" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">2,6</text><text x="32" y="364" class="m" font-size="13" font-weight="700" fill="#1A2332">R$ 90 mil</text><rect x="121.0" y="331.0" width="106.5" height="56.0" rx="6" fill="#D9634C"/><text x="174.25" y="366" class="s" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">12,5</text><rect x="233.5" y="331.0" width="106.5" height="56.0" rx="6" fill="#E9C46A"/><text x="286.75" y="366" class="s" font-size="18" font-weight="700" fill="#1A2332" text-anchor="middle">6,2</text><rect x="346.0" y="331.0" width="106.5" height="56.0" rx="6" fill="#E9C46A"/><text x="399.25" y="366" class="s" font-size="18" font-weight="700" fill="#1A2332" text-anchor="middle">4,2</text><rect x="458.5" y="331.0" width="106.5" height="56.0" rx="6" fill="#2E7D5B"/><text x="511.75" y="366" class="s" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">3,1</text><text x="32" y="426" class="m" font-size="13" font-weight="700" fill="#1A2332">R$ 120 mil</text><rect x="121.0" y="393.0" width="106.5" height="56.0" rx="6" fill="#D9634C"/><text x="174.25" y="428" class="s" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">16,7</text><rect x="233.5" y="393.0" width="106.5" height="56.0" rx="6" fill="#D9634C"/><text x="286.75" y="428" class="s" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">8,3</text><rect x="346.0" y="393.0" width="106.5" height="56.0" rx="6" fill="#E9C46A"/><text x="399.25" y="428" class="s" font-size="18" font-weight="700" fill="#1A2332" text-anchor="middle">5,6</text><rect x="458.5" y="393.0" width="106.5" height="56.0" rx="6" fill="#E9C46A"/><text x="511.75" y="428" class="s" font-size="18" font-weight="700" fill="#1A2332" text-anchor="middle">4,2</text><text x="32" y="474" class="s" font-size="12.5" fill="#5A6472">A linha de R$ 74 mil é a mediana do Índice Bewild.</text><line x1="32.0" y1="494.0" x2="568.0" y2="494.0" stroke="#E7E2D9" stroke-width="1"/><text x="32" y="516" class="m" font-size="13" fill="#5A6472">Conta: Bewild, mediana do Índice nov/2026</text><text x="568" y="516" class="m" font-size="13" font-weight="700" fill="#11355B" text-anchor="end">bewild.com.br</text></svg>
