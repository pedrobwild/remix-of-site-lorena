<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 895" width="420" height="895" role="img" aria-labelledby="t d"><title id="t">O bairro muda o m² da reforma, mas muda mais o aluguel</title><desc id="d">Reforma por m² (mediana do Índice Bewild): Bela Vista, Consolação e República R$ 3.104 (88 orçamentos); Pinheiros e Vila Madalena R$ 2.914 (54 orçamentos); Itaim Bibi e Vila Olímpia R$ 2.831 (41 orçamentos); Moema e Vila Nova Conceição R$ 2.717 (59 orçamentos); Brooklin e Campo Belo R$ 2.693 (41 orçamentos). Aluguel anunciado por m² (QuintoAndar e Imovelweb, jul/2026): Brooklin R$ 109,30; Pinheiros R$ 105,40; Moema R$ 90,30; Itaim Bibi R$ 88,90; Média da cidade R$ 75,20.</desc><style>.s{font-family:Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif}.m{font-family:'JetBrains Mono', Menlo, Consolas, monospace}</style><rect width="420" height="895" fill="#FFFFFF"/><text x="32" y="44" class="m" font-size="13" font-weight="700" fill="#11355B" letter-spacing="1.5">BAIRRO: OBRA E ALUGUEL</text><text x="32" y="78" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">O m² da reforma varia até</text><text x="32" y="108" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">15% entre regiões; o</text><text x="32" y="138" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">aluguel, até 23%</text><text x="32" y="170" class="s" font-size="15" fill="#5A6472">Mediana da reforma por m² em cinco</text><text x="32" y="191" class="s" font-size="15" fill="#5A6472">regiões e aluguel anunciado por m² em</text><text x="32" y="212" class="s" font-size="15" fill="#5A6472">quatro bairros.</text><text x="32" y="251" class="m" font-size="12.5" font-weight="700" fill="#11355B">REFORMA POR M²</text><text x="32" y="277" class="s" font-size="14.5" font-weight="600" fill="#1A2332">Bela Vista, Consolação e República</text><text x="388" y="277" class="m" font-size="12" fill="#5A6472" text-anchor="end">88 orçamentos</text><rect x="32.0" y="285.0" width="246.6" height="16.0" rx="4" fill="#D07A3E"/><text x="286.596" y="298" class="s" font-size="14" font-weight="700" fill="#1A2332">R$ 3.104</text><text x="32" y="331" class="s" font-size="14.5" font-weight="600" fill="#1A2332">Pinheiros e Vila Madalena</text><text x="388" y="331" class="m" font-size="12" fill="#5A6472" text-anchor="end">54 orçamentos</text><rect x="32.0" y="339.0" width="231.5" height="16.0" rx="4" fill="#2F6FA8"/><text x="271.501" y="352" class="s" font-size="14" font-weight="700" fill="#1A2332">R$ 2.914</text><text x="32" y="385" class="s" font-size="14.5" font-weight="600" fill="#1A2332">Itaim Bibi e Vila Olímpia</text><text x="388" y="385" class="m" font-size="12" fill="#5A6472" text-anchor="end">41 orçamentos</text><rect x="32.0" y="393.0" width="224.9" height="16.0" rx="4" fill="#2F6FA8"/><text x="264.907" y="406" class="s" font-size="14" font-weight="700" fill="#1A2332">R$ 2.831</text><text x="32" y="439" class="s" font-size="14.5" font-weight="600" fill="#1A2332">Moema e Vila Nova Conceição</text><text x="388" y="439" class="m" font-size="12" fill="#5A6472" text-anchor="end">59 orçamentos</text><rect x="32.0" y="447.0" width="215.9" height="16.0" rx="4" fill="#2F6FA8"/><text x="255.851" y="460" class="s" font-size="14" font-weight="700" fill="#1A2332">R$ 2.717</text><text x="32" y="493" class="s" font-size="14.5" font-weight="600" fill="#1A2332">Brooklin e Campo Belo</text><text x="388" y="493" class="m" font-size="12" fill="#5A6472" text-anchor="end">41 orçamentos</text><rect x="32.0" y="501.0" width="213.9" height="16.0" rx="4" fill="#2F6FA8"/><text x="253.944" y="514" class="s" font-size="14" font-weight="700" fill="#1A2332">R$ 2.693</text><text x="32" y="547" class="m" font-size="12.5" font-weight="700" fill="#11355B">ALUGUEL ANUNCIADO POR M²</text><text x="32" y="577" class="s" font-size="14.5" font-weight="600" fill="#1A2332">Brooklin</text><rect x="32.0" y="585.0" width="244.2" height="16.0" rx="