<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 443" width="720" height="532" role="img" aria-labelledby="t d"><title id="t">Quanto a reforma pesa no investimento total</title><desc id="d">Imóvel de 26 m² a R$ 12.143 por m² = R$ 315.718; ITBI R$ 9.472; reforma R$ 74.132; a reforma é 19% do total de R$ 399.322.</desc><style>.s{font-family:Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif}.m{font-family:'JetBrains Mono', Menlo, Consolas, monospace}</style><rect width="600" height="443" fill="#FFFFFF"/><text x="32" y="44" class="m" font-size="13" font-weight="700" fill="#11355B" letter-spacing="1.5">PESO NO INVESTIMENTO</text><text x="32" y="78" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">A reforma é 19% do investimento</text><text x="32" y="108" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">num studio de 26 m²</text><text x="32" y="140" class="s" font-size="15" fill="#5A6472">Imóvel ao preço médio de venda de São Paulo (FipeZap,</text><text x="32" y="161" class="s" font-size="15" fill="#5A6472">ago/2026), ITBI de 3% e a reforma mediana do Índice</text><text x="32" y="182" class="s" font-size="15" fill="#5A6472">Bewild.</text><rect x="32.0" y="217.0" width="423.8" height="44.0" fill="#2F6FA8"/><rect x="455.8" y="217.0" width="12.7" height="44.0" fill="#5A6472"/><rect x="468.5" y="217.0" width="99.5" height="44.0" fill="#D07A3E"/><rect x="32.0" y="278.0" width="12.0" height="12.0" rx="2" fill="#2F6FA8"/><text x="52" y="289" class="s" font-size="14.5" font-weight="600" fill="#1A2332">Imóvel</text><text x="568" y="289" class="m" font-size="13" font-weight="700" fill="#1A2332" text-anchor="end">R$ 315.718 · 79%</text><rect x="32.0" y="306.0" width="12.0" height="12.0" rx="2" fill="#5A6472"/><text x="52" y="317" class="s" font-size="14.5" font-weight="600" fill="#1A2332">ITBI</text><text x="568" y="317" class="m" font-size="13" font-weight="700" fill="#1A2332" text-anchor="end">R$ 9.472 · 2%</text><rect x="32.0" y="334.0" width="12.0" height="12.0" rx="2" fill="#D07A3E"/><text x="52" y="345" class="s" font-size="14.5" font-weight="600" fill="#1A2332">Reforma completa</text><text x="568" y="345" class="m" font-size="13" font-weight="700" fill="#1A2332" text-anchor="end">R$ 74.132 · 19%</text><text x="32" y="379" class="s" font-size="14.5" font-weight="700" fill="#1A2332">Total: R$ 399.322</text><line x1="32.0" y1="399.0" x2="568.0" y2="399.0" stroke="#E7E2D9" stroke-width="1"/><text x="32" y="421" class="m" font-size="13" fill="#5A6472">Fontes: Índice Bewild; FipeZap ago/2026</text><text x="568" y="421" class="m" font-size="13" font-weight="700" fill="#11355B" text-anchor="end">bewild.com.br</text></svg>
