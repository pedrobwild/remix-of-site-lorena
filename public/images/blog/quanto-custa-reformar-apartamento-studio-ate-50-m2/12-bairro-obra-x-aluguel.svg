<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 658" width="720" height="790" role="img" aria-labelledby="t d"><title id="t">O bairro muda o aluguel, não o custo da obra</title><desc id="d">Reforma por m² (mediana Bewild): Pinheiros/Vila Madalena R$ 2.721, Brooklin/Campo Belo R$ 2.654, Moema/Ibirapuera R$ 2.692, Itaim/Vila Olímpia R$ 2.734; diferença não significativa (Kruskal-Wallis p = 0,67). Aluguel anunciado por m² (QuintoAndar, jul/2026): Brooklin R$ 109,30, Pinheiros R$ 105,40, Moema R$ 90,30, Itaim Bibi R$ 88,90, média da cidade R$ 75,20.</desc><style>.s{font-family:Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif}.m{font-family:'JetBrains Mono', Menlo, Consolas, monospace}</style><rect width="600" height="658" fill="#FFFFFF"/><text x="32" y="44" class="m" font-size="13" font-weight="700" fill="#11355B" letter-spacing="1.5">ONDE O RETORNO É DECIDIDO</text><text x="32" y="78" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">O bairro muda o aluguel,</text><text x="32" y="108" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">não o custo da obra</text><text x="32" y="140" class="s" font-size="15" fill="#5A6472">À esquerda, reforma turnkey por m² (mediana Bewild).</text><text x="32" y="161" class="s" font-size="15" fill="#5A6472">À direita, aluguel anunciado por m² no bairro.</text><text x="32" y="212" class="m" font-size="13" font-weight="700" fill="#11355B">REFORMA, R$/m²</text><text x="330" y="212" class="m" font-size="13" font-weight="700" fill="#11355B">ALUGUEL, R$/m² POR MÊS</text><text x="32" y="240" class="s" font-size="14" font-weight="600" fill="#1A2332">Pinheiros / V. Madalena</text><path d="M32.0,250.0 H223.6 Q227.6,250.0 227.6,254.0 V260.0 Q227.6,264.0 223.6,264.0 H32.0 Z" fill="#2F6FA8"/><text x="233.6" y="262" class="s" font-size="13" font-weight="700" fill="#1A2332">2.721</text><text x="330" y="240" class="s" font-size="14" font-weight="600" fill="#1A2332">Pinheiros</text><path d="M330.0,250.0 H528.0 Q532.0,250.0 532.0,254.0 V260.0 Q532.0,264.0 528.0,264.0 H330.0 Z" fill="#D07A3E"/><text x="538" y="262" class="s" font-size="13" font-weight="700" fill="#1A2332">105,4</text><text x="32" y="314" class="s" font-size="14" font-weight="600" fill="#1A2332">Brooklin / Campo Belo</text><path d="M32.0,324.0 H218.8 Q222.8,324.0 222.8,328.0 V334.0 Q222.8,338.0 218.8,338.0 H32.0 Z" fill="#2F6FA8"/><text x="228.8" y="336" class="s" font-size="13" font-weight="700" fill="#1A2332">2.654</text><text x="330" y="314" class="s" font-size="14" font-weight="600" fill="#1A2332">Brooklin</text><path d="M330.0,324.0 H535.5 Q539.5,324.0 539.5,328.0 V334.0 Q539.5,338.0 535.5,338.0 H330.0 Z" fill="#D07A3E"/><text x="545.5" y="336" class="s" font-size="13" font-weight="700" fill="#1A2332">109,3</text><text x="32" y="388" class="s" font-size="14" font-weight="600" fill="#1A2332">Moema / Ibirapuera</text><path d="M32.0,398.0 H221.5 Q225.5,398.0 225.5,402.0 V408.0 Q225.5,412.0 221.5,412.0 H32.0 Z" fill="#2F6FA8"/><text x="231.5" y="410" class="s" font-size="13" font-weight="700" fill="#1A2332">2.692</text><text x="330" y="388" class="s" font-size="14" font-weight="600" fill="#1A2332">Moema</text><path d="M330.0,398.0 H499.1 Q503.1,398.0 503.1,402.0 V408.0 Q503.1,412.0 499.1,412.0 H330.0 Z" fill="#D07A3E"/><text x="509.1" y="410" class="s" font-size="13" font-weight="700" fill="#1A2332">90,3</text><text x="32" y="462" class="s" font-size="14" font-weight="600" fill="#1A2332">Itaim / V. Olímpia</text><path d="M32.0,472.0 H224.5 Q228.5,472.0 228.5,476.0 V482.0 Q228.5,486.0 224.5,486.0 H32.0 Z" fill="#2F6FA8"/><text x="234.5" y="484" class="s" font-size="13" font-weight="700" fill="#1A2332">2.734</text><text x="330" y="462" class="s" font-size="14" font-weight="600" fill="#1A2332">Itaim Bibi</text><path d="M330.0,472.0 H496.4 Q500.4,472.0 500.4,476.0 V482.0 Q500.4,486.0 496.4,486.0 H330.0 Z" fill="#D07A3E"/><text x="506.4" y="484" class="s" font-size="13" font-weight="700" fill="#1A2332">88,9</text><text x="330" y="536" class="s" font-size="14" font-weight="600" fill="#1A2332">Média da cidade</text><path d="M330.0,546.0 H470.1 Q474.1,546.0 474.1,550.0 V556.0 Q474.1,560.0 470.1,560.0 H330.0 Z" fill="#CFC8BC"/><text x="480.1" y="558" class="s" font-size="13" font-weight="700" fill="#1A2332">75,2</text><text x="32" y="536" class="s" font-size="14" font-weight="600" fill="#1A2332">Diferença entre regiões</text><text x="32" y="560" class="s" font-size="13" fill="#5A6472">dentro do ruído estatístico</text><text x="32" y="602" class="s" font-size="13" fill="#5A6472">Variação máxima: 3% na obra; 23% no aluguel entre esses bairros.</text><line x1="32" y1="614" x2="568" y2="614" stroke="#E7E2D9" stroke-width="1"/><text x="32" y="636" class="m" font-size="13" fill="#5A6472">Fontes: base Bewild; QuintoAndar jul/26</text><text x="568" y="636" class="m" font-size="13" font-weight="700" fill="#11355B" text-anchor="end">bewild.com.br</text></svg>
