<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 449" width="420" height="449" role="img" aria-labelledby="t d"><title id="t">Quanto a reforma pesa no investimento total</title><desc id="d">Imóvel de 27 m² a R$ 12.143 por m² = R$ 327.861; ITBI R$ 9.836; reforma R$ 71.850; a reforma é 18% do total.</desc><style>.s{font-family:Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif}.m{font-family:'JetBrains Mono', Menlo, Consolas, monospace}</style><rect width="420" height="449" fill="#FFFFFF"/><text x="32" y="44" class="m" font-size="13" font-weight="700" fill="#11355B" letter-spacing="1.5">TICKET COMPLETO</text><text x="32" y="78" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">Quanto a reforma pesa no</text><text x="32" y="108" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">investimento total</text><text x="32" y="140" class="s" font-size="15" fill="#5A6472">Studio de 27 m² ao preço médio de venda de</text><text x="32" y="161" class="s" font-size="15" fill="#5A6472">SP (R$ 12.143/m², FipeZap ago/26). Total: R$</text><text x="32" y="182" class="s" font-size="15" fill="#5A6472">409.547.</text><rect x="32" y="233" width="283" height="44" rx="4" fill="#CFC8BC"/><rect x="317" y="233" width="6.5" height="44" rx="4" fill="#5A6472"/><rect x="325.5" y="233" width="60.5" height="44" rx="4" fill="#D07A3E"/><text x="32" y="307" class="s" font-size="14" font-weight="700" fill="#1A2332">Imóvel: R$ 327.861</text><text x="32" y="327" class="s" font-size="13" fill="#5A6472">80% do total</text><text x="388" y="307" class="s" font-size="14" font-weight="700" fill="#1A2332" text-anchor="end">Reforma turnkey: R$ 71.850</text><text x="388" y="327" class="s" font-size="13" fill="#5A6472" text-anchor="end">18% do total</text><text x="32" y="363" class="s" font-size="13" fill="#5A6472">ITBI (3%): R$ 9.836. Cartório e registro não incluídos.</text><line x1="32" y1="383" x2="388" y2="383" stroke="#E7E2D9" stroke-width="1"/><text x="32" y="405" class="m" font-size="13" fill="#5A6472">Fontes: FipeZap ago/26, base Bewild</text><text x="32" y="427" class="m" font-size="13" font-weight="700" fill="#11355B">bewild.com.br</text></svg>
