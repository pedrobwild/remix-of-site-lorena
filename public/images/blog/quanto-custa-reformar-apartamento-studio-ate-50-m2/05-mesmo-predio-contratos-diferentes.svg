<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 686" width="720" height="823" role="img" aria-labelledby="t d"><title id="t">Mesmo prédio, contratos diferentes</title><desc id="d">Pares de contratos no mesmo empreendimento e metragem parecida: Exalt Ibirapuera 31 m²: R$ 73.000 a R$ 121.000; Nurban Vila Madalena 26–28 m²: R$ 71.303 a R$ 108.447; Nex One Pereira Coutinho 27 m²: R$ 67.000 a R$ 90.432; Level Brooklin 26 m²: R$ 56.334 a R$ 69.753; MetroCasa Berrini 26–27 m²: R$ 64.456 a R$ 71.432</desc><style>.s{font-family:Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif}.m{font-family:'JetBrains Mono', Menlo, Consolas, monospace}</style><rect width="600" height="686" fill="#FFFFFF"/><text x="32" y="44" class="m" font-size="13" font-weight="700" fill="#11355B" letter-spacing="1.5">O QUE A METRAGEM NÃO EXPLICA</text><text x="32" y="78" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">Mesmo prédio, mesma planta,</text><text x="32" y="108" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">contratos diferentes</text><text x="32" y="140" class="s" font-size="15" fill="#5A6472">Menor e maior contrato no mesmo empreendimento.</text><text x="32" y="161" class="s" font-size="15" fill="#5A6472">A diferença vem do escopo e do padrão, não do m².</text><line x1="69.4" y1="214" x2="69.4" y2="578" stroke="#E7E2D9" stroke-width="1"/><text x="69.4" y="596" class="m" font-size="13" fill="#5A6472" text-anchor="middle">R$ 50 mil</text><line x1="216.2" y1="214" x2="216.2" y2="578" stroke="#E7E2D9" stroke-width="1"/><text x="216.2" y="596" class="m" font-size="13" fill="#5A6472" text-anchor="middle">R$ 75 mil</text><line x1="363.1" y1="214" x2="363.1" y2="578" stroke="#E7E2D9" stroke-width="1"/><text x="363.1" y="596" class="m" font-size="13" fill="#5A6472" text-anchor="middle">R$ 100 mil</text><line x1="510" y1="214" x2="510" y2="578" stroke="#E7E2D9" stroke-width="1"/><text x="510" y="596" class="m" font-size="13" fill="#5A6472" text-anchor="middle">R$ 125 mil</text><text x="40" y="234" class="s" font-size="14.5" font-weight="600" fill="#1A2332">Exalt Ibirapuera · 31 m²</text><line x1="204.5" y1="254" x2="486.5" y2="254" stroke="#CFC8BC" stroke-width="4" stroke-linecap="round"/><circle cx="204.5" cy="254" r="7" fill="#2F6FA8" stroke="#fff" stroke-width="2"/><circle cx="486.5" cy="254" r="7" fill="#D07A3E" stroke="#fff" stroke-width="2"/><text x="192.5" y="259" class="m" font-size="13" font-weight="600" fill="#5A6472" text-anchor="end">73</text><text x="498.5" y="259" class="m" font-size="13" font-weight="600" fill="#5A6472">121</text><text x="568" y="259" class="s" font-size="15" font-weight="700" fill="#1A2332" text-anchor="end">+66%</text><text x="40" y="308" class="s" font-size="14.5" font-weight="600" fill="#1A2332">Nurban Vila Madalena · 26–28 m²</text><line x1="194.5" y1="328" x2="412.8" y2="328" stroke="#CFC8BC" stroke-width="4" stroke-linecap="round"/><circle cx="194.5" cy="328" r="7" fill="#2F6FA8" stroke="#fff" stroke-width="2"/><circle cx="412.8" cy="328" r="7" fill="#D07A3E" stroke="#fff" stroke-width="2"/><text x="182.5" y="333" class="m" font-size="13" font-weight="600" fill="#5A6472" text-anchor="end">71</text><text x="424.8" y="333" class="m" font-size="13" font-weight="600" fill="#5A6472">108</text><text x="568" y="333" class="s" font-size="15" font-weight="700" fill="#1A2332" text-anchor="end">+52%</text><text x="40" y="382" class="s" font-size="14.5" font-weight="600" fill="#1A2332">Nex One Pereira Coutinho · 27 m²</text><line x1="169.2" y1="402" x2="306.9" y2="402" stroke="#CFC8BC" stroke-width="4" stroke-linecap="round"/><circle cx="169.2" cy="402" r="7" fill="#2F6FA8" stroke="#fff" stroke-width="2"/><circle cx="306.9" cy="402" r="7" fill="#D07A3E" stroke="#fff" stroke-width="2"/><text x="157.2" y="407" class="m" font-size="13" font-weight="600" fill="#5A6472" text-anchor="end">67</text><text x="318.9" y="407" class="m" font-size="13" font-weight="600" fill="#5A6472">90</text><text x="568" y="407" class="s" font-size="15" font-weight="700" fill="#1A2332" text-anchor="end">+35%</text><text x="40" y="456" class="s" font-size="14.5" font-weight="600" fill="#1A2332">Level Brooklin · 26 m²</text><line x1="106.6" y1="476" x2="185.4" y2="476" stroke="#CFC8BC" stroke-width="4" stroke-linecap="round"/><circle cx="106.6" cy="476" r="7" fill="#2F6FA8" stroke="#fff" stroke-width="2"/><circle cx="185.4" cy="476" r="7" fill="#D07A3E" stroke="#fff" stroke-width="2"/><text x="94.6" y="481" class="m" font-size="13" font-weight="600" fill="#5A6472" text-anchor="end">56</text><text x="197.4" y="481" class="m" font-size="13" font-weight="600" fill="#5A6472">70</text><text x="568" y="481" class="s" font-size="15" font-weight="700" fill="#1A2332" text-anchor="end">+24%</text><text x="40" y="530" class="s" font-size="14.5" font-weight="600" fill="#1A2332">MetroCasa Berrini · 26–27 m²</text><line x1="154.3" y1="550" x2="195.3" y2="550" stroke="#CFC8BC" stroke-width="4" stroke-linecap="round"/><circle cx="154.3" cy="550" r="7" fill="#2F6FA8" stroke="#fff" stroke-width="2"/><circle cx="195.3" cy="550" r="7" fill="#D07A3E" stroke="#fff" stroke-width="2"/><text x="142.3" y="555" class="m" font-size="13" font-weight="600" fill="#5A6472" text-anchor="end">64</text><text x="207.3" y="555" class="m" font-size="13" font-weight="600" fill="#5A6472">71</text><text x="568" y="555" class="s" font-size="15" font-weight="700" fill="#1A2332" text-anchor="end">+11%</text><circle cx="46" cy="618" r="6" fill="#2F6FA8"/><text x="58" y="622" class="s" font-size="13" fill="#5A6472">menor contrato do prédio</text><circle cx="250" cy="618" r="6" fill="#D07A3E"/><text x="262" y="622" class="s" font-size="13" fill="#5A6472">maior contrato do prédio (R$ mil)</text><line x1="32" y1="642" x2="568" y2="642" stroke="#E7E2D9" stroke-width="1"/><text x="32" y="664" class="m" font-size="13" fill="#5A6472">Fonte: base Bewild, 188 contratos turnkey</text><text x="568" y="66