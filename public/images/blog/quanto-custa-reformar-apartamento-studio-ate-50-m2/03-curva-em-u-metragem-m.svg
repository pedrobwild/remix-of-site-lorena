<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 683" width="420" height="683" role="img" aria-labelledby="t d"><title id="t">Valor por m² por faixa de metragem</title><desc id="d">Curva em U: até 20 m²: R$ 4.077 por m² (13 contratos); 20 a 24 m²: R$ 2.980 por m² (29 contratos); 24 a 28 m²: R$ 2.645 por m² (70 contratos); 28 a 32 m²: R$ 2.524 por m² (48 contratos); 32 a 40 m²: R$ 2.826 por m² (17 contratos); mais de 40 m²: R$ 2.740 por m² (11 contratos)</desc><style>.s{font-family:Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif}.m{font-family:'JetBrains Mono', Menlo, Consolas, monospace}</style><rect width="420" height="683" fill="#FFFFFF"/><text x="32" y="44" class="m" font-size="13" font-weight="700" fill="#11355B" letter-spacing="1.5">A CURVA EM U</text><text x="32" y="78" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">O m² mais barato está entre</text><text x="32" y="108" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">24 e 32 m²</text><text x="32" y="140" class="s" font-size="15" fill="#5A6472">Mediana do valor por m² por faixa de</text><text x="32" y="161" class="s" font-size="15" fill="#5A6472">metragem (ponto) e metade central de cada</text><text x="32" y="182" class="s" font-size="15" fill="#5A6472">faixa (barra).</text><line x1="150" y1="223" x2="150" y2="571" stroke="#E7E2D9" stroke-width="1"/><text x="150" y="591" class="m" font-size="13" fill="#5A6472" text-anchor="middle">2.000</text><line x1="235.2" y1="223" x2="235.2" y2="571" stroke="#E7E2D9" stroke-width="1"/><text x="235.2" y="591" class="m" font-size="13" fill="#5A6472" text-anchor="middle">3.000</text><line x1="320.4" y1="223" x2="320.4" y2="571" stroke="#E7E2D9" stroke-width="1"/><text x="320.4" y="591" class="m" font-size="13" fill="#5A6472" text-anchor="middle">4.000</text><path d="M327.0,247.0 L233.5,305.0 L204.9,363.0 L194.6,421.0 L220.4,479.0 L213.0,537" fill="none" stroke="#2F6FA8" stroke-width="1.5" stroke-d