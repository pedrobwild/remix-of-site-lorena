<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 923" width="420" height="923" role="img" aria-labelledby="t d"><title id="t">O bairro muda o aluguel, não o custo da obra</title><desc id="d">Reforma por m² (mediana Bewild): Pinheiros/Vila Madalena R$ 2.721, Brooklin/Campo Belo R$ 2.654, Moema/Ibirapuera R$ 2.692, Itaim/Vila Olímpia R$ 2.734; diferença não significativa (Kruskal-Wallis p = 0,67). Aluguel anunciado por m² (QuintoAndar, jul/2026): Brooklin R$ 109,30, Pinheiros R$ 105,40, Moema R$ 90,30, Itaim Bibi R$ 88,90, média da cidade R$ 75,20.</desc><style>.s{font-family:Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif}.m{font-family:'JetBrains Mono', Menlo, Consolas, monospace}</style><rect width="420" height="923" fill="#FFFFFF"/><text x="32" y="44" class="m" font-size="13" font-weight="700" fill="#11355B" letter-spacing="1.5">ONDE O RETORNO É DECIDIDO</text><text x="32" y="78" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">O bairro muda o aluguel,</text><text x="32" y="108" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">não o custo da obra</text><text x="32" y="140" class="s" font-size="15" fill="#5A6472">Em cima, reforma turnkey por m² (mediana</text><text x="32" y="161" class="s" font-size="15" fill="#5A6472">Bewild). Embaixo, aluguel anunciado por m²</text><text x="32" y="182" class="s" font-size="15" fill="#5A6472">no bairro.</text><text x="32" y="233" class="m" font-size="13" font-weight="700" fill="#11355B">REFORMA, R$/m²</text><text x="32" y="261" class="s" font-size="14" font-weight="600" fill="#1A2332">Pinheiros / V. Madalena</text><path d="M32.0,269.0 H274.6 Q278.6,269.0 278.6,273.0 V279.0 Q278.6,283.0 274.6,283.0 H32.0 Z" fill="#2F6FA8"/><text x="284.6" y="281" class="s" font-size="13" font-weight="700" fill="#1A2332">2.721</text><text x="32" y="317" class="s" font-size="14" font-weight="600" fill="#1A2332">Brooklin / Campo Belo</text><path d="M32.0,325.0 H268.5 Q272.5,325.0 272.5,329.0 V335.0 Q272.5,339.0 268.5,339.0 H32.0 Z" fill="#2F6FA8"/><text x="278.5" y="337" class="s" font-size="13" font-weight="700" fill="#1A2332">2.654</text><text x="32" y="373" class="s" font-size="14" font-weight="600" fill="#1A2332">Moema / Ibirapuera</text><path d="M32.0,381.0 H272.0 Q276.0,381.0 276.0,385.0 V391.0 Q276.0,395.0 272.0,395.0 H32.0 Z" fill="#2F6FA8"/><text x="282" y="393" class="s" font-size="13" font-weight="700" fill="#1A2332">2.692</text><text x="32" y="429" class="s" font-size="14" font-weight="600" fill="#1A2332">Itaim / V. Olímpia</text><path d="M32.0,437.0 H275.8 Q279.8,437.0 279.8,441.0 V447.0 Q279.8,451.0 275.8,451.0 H32.0 Z" fill="#2F6FA8"/><text x="285.8" y="449" class="s" font-size="13" font-weight="700" fill="#1A2332">2.734</text><text x="32" y="497" class="m" font-size="13" font-weight="700" fill="#11355B">ALUGUEL, R$/m² POR MÊS</text><text x="32" y="525" class="s" font-size="14" font-weight="600" fill="#1A2332">Pinheiros</text><path d="M32.0,533.0 H282.7 Q286.7,533.0 286.7,537.0 V543.0 Q286.7,547.0 282.7,547.0 H32.0 Z" fill="#D07A3E"/><text x="292.7" y="545" class="s" font-size="13" font-weight="700" fill="#1A2332">105,4</text><text x="32" y="581" class="s" font-size="14" font-weight="600" fill="#1A2332">Brooklin</text><path d="M32.0,589.0 H292.1 Q296.1,589.0 296.1,593.0 V599.0 Q296.1,603.0 292.1,603.0 H32.0 Z" fill="#D07A3E"/><text x="302.1" y="601" class="s" font-size="13" font-weight="700" fill="#1A2332">109,3</text><text x="32" y="637" class="s" font-size="14" font-weight="600" fill="#1A2332">Moema</text><path d="M32.0,645.0 H246.2 Q250.2,645.0 250.2,649.0 V655.0 Q250.2,659.0 246.2,659.0 H32.0 Z" fill="#D07A3E"/><text x="256.2" y="657" class="s" font-size="13" font-weight="700" fill="#1A2332">90,3</text><text x="32" y="693" class="s" font-size="14" font-weight="600" fill="#1A2332">Itaim Bibi</text><path d="M32.0,701.0 H242.8 Q246.8,701.0 246.8,705.0 V711.0 Q246.8,715.0 242.8,715.0 H32.0 Z" fill="#D07A3E"/><text x="252.8" y="713" class="s" font-size="13" font-weight="700" fill="#1A2332">88,9</text><text x="32" y="749" class="s" font-size="14" font-weight="600" fill="#1A2332">Média da cidade</text><path d="M32.0,757.0 H209.7 Q213.7,757.0 213.7,761.0 V767.0 Q213.7,771.0 209.7,771.0 H32.0 Z" fill="#CFC8BC"/><text x="219.7" y="769" class="s" font-size="13" font-weight="700" fill="#1A2332">75,2</text><text x="32" y="801" class="s" font-size="13" fill="#5A6472">Obra: variação de 3%, dentro do ruído.</text><text x="32" y="823" class="s" font-size="13" fill="#5A6472">Aluguel: variação de 23% entre bairros.</text><line x1="32" y1="857" x2="388" y2="857" stroke="#E7E2D9" stroke-width="1"/><text x="32" y="879" class="m" font-size="13" fill="#5A6472">Fontes: base Bewild; QuintoAndar jul/26</text><text x="32" y="901" class="m" font-size="13" font-weight="700" fill="#11355B">bewild.com.br</text></svg>
