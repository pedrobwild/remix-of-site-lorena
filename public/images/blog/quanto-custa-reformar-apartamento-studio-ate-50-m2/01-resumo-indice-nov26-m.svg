<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 993" width="420" height="993" role="img" aria-labelledby="t d"><title id="t">Resumo: reforma completa em São Paulo em 585 orçamentos</title><desc id="d">Orçamento mediano de R$ 74,1 mil; R$ 2.831 por m² na mediana, metade entre R$ 2.499 e R$ 3.283; metragem mediana de 26 m²; regra de bolso R$ 33 mil mais R$ 1.514 por m² entre 21 e 35 m²; 60 a 75 dias úteis de obra; 585 orçamentos de março a novembro de 2026.</desc><style>.s{font-family:Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif}.m{font-family:'JetBrains Mono', Menlo, Consolas, monospace}</style><rect width="420" height="993" fill="#FFFFFF"/><text x="32" y="44" class="m" font-size="13" font-weight="700" fill="#11355B" letter-spacing="1.5">RESUMO DO ÍNDICE BEWILD</text><text x="32" y="78" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">Reforma completa em São</text><text x="32" y="108" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">Paulo: o que dizem 585</text><text x="32" y="138" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">orçamentos</text><text x="32" y="170" class="s" font-size="15" fill="#5A6472">Studios e apartamentos compactos de até</text><text x="32" y="191" class="s" font-size="15" fill="#5A6472">45 m², com projeto, obra, marcenaria,</text><text x="32" y="212" class="s" font-size="15" fill="#5A6472">mobiliário e eletros no mesmo orçamento.</text><rect x="32.0" y="247.0" width="356.0" height="96.0" rx="6" fill="#F6F3EE"/><rect x="32.0" y="247.0" width="4.0" height="96.0" rx="2" fill="#D07A3E"/><text x="52" y="289" class="s" font-size="28" font-weight="700" fill="#1A2332">R$ 74,1 mil</text><text x="52" y="313" class="s" font-size="13.5" fill="#5A6472">orçamento mediano</text><rect x="32.0" y="359.0" width="356.0" height="96.0" rx="6" fill="#F6F3EE"/><rect x="32.0" y="359.0" width="4.0" height="96.0" rx="2" fill="#2F6FA8"/><text x="52" y="401" 