<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 826" width="720" height="991" role="img" aria-labelledby="t d"><title id="t">O bairro muda o m² da reforma, mas muda mais o aluguel</title><desc id="d">Reforma por m² (mediana do Índice Bewild): Bela Vista, Consolação e República R$ 3.104 (88 orçamentos); Pinheiros e Vila Madalena R$ 2.919 (55 orçamentos); Itaim Bibi e Vila Olímpia R$ 2.815 (40 orçamentos); Moema e Vila Nova Conceição R$ 2.710 (60 orçamentos); Brooklin e Campo Belo R$ 2.689 (39 orçamentos). Aluguel anunciado por m² (QuintoAndar e Imovelweb, jul/2026): Brooklin R$ 109,30; Pinheiros R$ 105,40; Moema R$ 90,30; Itaim Bibi R$ 88,90; Média da cidade R$ 75,20.</desc><style>.s{font-family:Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif}.m{font-family:'JetBrains Mono', Menlo, Consolas, monospace}</style><rect width="600" height="826" fill="#FFFFFF"/><text x="32" y="44" class="m" font-size="13" font-weight="700" fill="#11355B" letter-spacing="1.5">BAIRRO: OBRA E ALUGUEL</text><text x="32" y="78" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">O m² da reforma varia até 15%</text><text x="32" y="108" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">entre regiões; o aluguel, até 23%</text><text x="32" y="140" class="s" font-size="15" fill="#5A6472">Mediana da reforma por m² em cinco regiões e aluguel</text><text x="32" y="161" class="s" font-size="15" fill="#5A6472">anunciado por m² em quatro bairros.</text><text x="32" y="200" class="m" font-size="12.5" font-weight="700" fill="#11355B">REFORMA POR M²</text><text x="32" y="226" class="s" font-size="14.5" font-weight="600" fill="#1A2332">Bela Vista, Consolação e República</text><text x="568" y="226" class="m" font-size="13" fill="#5A6472" text-anchor="end">88 orçamentos</text><rect x="32.0" y="234.0" width="401.8" height="16.0" rx="4" fill="#D07A3E"/><text x="441.796" y="247" class="s" font-size="14" font-weight="700" fill="#1A2332">R$ 3.104</text><text x="32" y="280" class="s" font-size="14.5" font-weight="600" fill="#1A2332">Pinheiros e Vila Madalena</text><text x="568" y="280" class="m" font-size="13" fill="#5A6472" text-anchor="end">55 orçamentos</text><rect x="32.0" y="288.0" width="377.8" height="16.0" rx="4" fill="#2F6FA8"/><text x="417.848" y="301" class="s" font-size="14" font-weight="700" fill="#1A2332">R$ 2.919</text><text x="32" y="334" class="s" font-size="14.5" font-weight="600" fill="#1A2332">Itaim Bibi e Vila Olímpia</text><text x="568" y="334" class="m" font-size="13" fill="#5A6472" text-anchor="end">40 orçamentos</text><rect x="32.0" y="342.0" width="364.4" height="16.0" rx="4" fill="#2F6FA8"/><text x="404.386" y="355" class="s" font-size="14" font-weight="700" fill="#1A2332">R$ 2.815</text><text x="32" y="388" class="s" font-size="14.5" font-weight="600" fill="#1A2332">Moema e Vila Nova Conceição</text><text x="568" y="388" class="m" font-size="13" fill="#5A6472" text-anchor="end">60 orçamentos</text><rect x="32.0" y="396.0" width="350.8" height="16.0" rx="4" fill="#2F6FA8"/><text x="390.794" y="409" class="s" font-size="14" font-weight="700" fill="#1A2332">R$ 2.710</text><text x="32" y="442" class="s" font-size="14.5" font-weight="600" fill="#1A2332">Brooklin e Campo Belo</text><text x="568" y="442" class="m" font-size="13" fill="#5A6472" text-anchor="end">39 orçamentos</text><rect x="32.0" y="450.0" width="348.1" height="16.0" rx="4" fill="#2F6FA8"/><text x="388.076" y="463" class="s" font-size="14" font-weight="700" fill="#1A2332">R$ 2.689</text><text x="32" y="496" class="m" font-size="12.5" font-weight="700" fill="#11355B">ALUGUEL ANUNCIADO POR M²</text><text x="32" y="526" class="s" font-size="14.5" font-weight="600" fill="#1A2332">Brooklin</text><rect x="32.0" y="534.0" width="397.9" height="16.0" rx="4" fill="#D07A3E"/><text x="437.92" y="547" class="s" font-size="14" font-weight="700" fill="#1A2332">R$ 109,30</text><text x="32" y="580" class="s" font-size="14.5" font-weight="600" fill="#1A2332">Pinheiros</text><rect x="32.0" y="588.0" width="383.7" height="16.0" rx="4" fill="#2F6FA8"/><text x="423.722" y="601" class="s" font-size="14" font-weight="700" fill="#1A2332">R$ 105,40</text><text x="32" y="634" class="s" font-size="14.5" font-weight="600" fill="#1A2332">Moema</text><rect x="32.0" y="642.0" width="328.7" height="16.0" rx="4" fill="#2F6FA8"/><text x="368.748" y="655" class="s" font-size="14" font-weight="700" fill="#1A2332">R$ 90,30</text><text x="32" y="688" class="s" font-size="14.5" font-weight="600" fill="#1A2332">Itaim Bibi</text><rect x="32.0" y="696.0" width="323.7" height="16.0" rx="4" fill="#2F6FA8"/><text x="363.652" y="709" class="s" font-size="14" font-weight="700" fill="#1A2332">R$ 88,90</text><text x="32" y="742" class="s" font-size="14.5" font-weight="600" fill="#1A2332">Média da cidade</text><rect x="32.0" y="750.0" width="273.8" height="16.0" rx="4" fill="#2F6FA8"/><text x="313.775" y="763" class="s" font-size="14" font-weight="700" fill="#1A2332">R$ 75,20</text><line x1="32.0" y1="782.0" x2="568.0" y2="782.0" stroke="#E7E2D9" stroke-width="1"/><text x="32" y="804" class="m" font-size="13" fill="#5A6472">Fontes: Índice Bewild; QuintoAndar e Imovelweb</text><text x="568" y="804" class="m" font-size="13" font-weight="700" fill="#11355B" text-anchor="end">bewild.com.br</text></svg>
