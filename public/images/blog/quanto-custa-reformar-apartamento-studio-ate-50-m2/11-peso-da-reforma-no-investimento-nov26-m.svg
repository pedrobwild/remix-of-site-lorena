<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 0 380 491" width="380" height="491" role="img" aria-labelledby="t d"><title id="t">Quanto a reforma pesa no investimento total</title><desc id="d">Imóvel de 26 m² a R$ 12.143 por m² = R$ 315.718; ITBI R$ 9.472; reforma R$ 74.132; a reforma é 19% do total de R$ 399.322.</desc><style>.s{font-family:Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif}.m{font-family:'JetBrains Mono', Menlo, Consolas, monospace}</style><rect width="420" height="491" fill="#FFFFFF"/><text x="32" y="44" class="m" font-size="13" font-weight="700" fill="#11355B" letter-spacing="1.5">PESO NO INVESTIMENTO</text><text x="32" y="78" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">A reforma é 19% do</text><text x="32" y="108" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">investimento num studio</text><text x="32" y="138" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">de 26 m²</text><text x="32" y="170" class="s" font-size="15" fill="#5A6472">Imóvel ao preço médio de venda de São</text><text x="32" y="191" class="s" font-size="15" fill="#5A6472">Paulo (FipeZap, ago/2026), ITBI de 3% e</text><text x="32" y="212" class="s" font-size="15" fill="#5A6472">a reforma mediana do Índice Bewild.</text><rect x="32.0" y="247.0" width="281.5" height="44.0" fill="#2F6FA8"/><rect x="313.5" y="247.0" width="8.4" height="44.0" fill="#5A6472"/><rect x="321.9" y="247.0" width="66.1" height="44.0" fill="#D07A3E"/><rect x="32.0" y="308.0" width="12.0" height="12.0" rx="2" fill="#2F6FA8"/><text x="52" y="319" class="s" font-size="14.5" font-weight="600" fill="#1A2332">Imóvel</text><text x="388" y="319" class="m" font-size="13" font-weight="700" fill="#1A2332" text-anchor="end">R$ 315.718 · 79%</text><rect x="32.0" y="336.0" width="12.0" height="12.0" rx="2" fill="#5A6472"/><text x="52" y="347" class="s" font-size="14.5" font-weight="600" fill="#1A2332">ITBI</text><text x="388" y="347" class="m" font-size="13" font-weight="700" fill="#1A2332" text-anchor="end">R$ 9.472 · 2%</text><rect x="32.0" y="364.0" width="12.0" height="12.0" rx="2" fill="#D07A3E"/><text x="52" y="375" class="s" font-size="14.5" font-weight="600" fill="#1A2332">Reforma completa</text><text x="388" y="375" class="m" font-size="13" font-weight="700" fill="#1A2332" text-anchor="end">R$ 74.132 · 19%</text><text x="32" y="409" class="s" font-size="14.5" font-weight="700" fill="#1A2332">Total: R$ 399.322</text><line x1="32.0" y1="429.0" x2="388.0" y2="429.0" stroke="#E7E2D9" stroke-width="1"/><text x="32" y="451" class="m" font-size="12" fill="#5A6472">Fontes: Índice Bewild; FipeZap ago/2026</text><text x="32" y="471" class="m" font-size="13" font-weight="700" fill="#11355B">bewild.com.br</text></svg>
