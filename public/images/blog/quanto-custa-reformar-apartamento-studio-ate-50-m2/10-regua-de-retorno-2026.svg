<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 588" width="720" height="706" role="img" aria-labelledby="t d"><title id="t">A régua do investidor em setembro de 2026</title><desc id="d">CDI 12 meses 14,63% bruto e 12,44% líquido; aluguel mais valorização média de SP 10,05%; rentabilidade bruta do aluguel em SP 6,42%; IPCA 4,14%; valorização do m² à venda 3,63%.</desc><style>.s{font-family:Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif}.m{font-family:'JetBrains Mono', Menlo, Consolas, monospace}</style><rect width="600" height="588" fill="#FFFFFF"/><text x="32" y="44" class="m" font-size="13" font-weight="700" fill="#11355B" letter-spacing="1.5">PÓS-OBRA: CONTRA O QUE COMPARAR</text><text x="32" y="78" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">A régua do investidor</text><text x="32" y="108" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">em setembro de 2026</text><text x="32" y="140" class="s" font-size="15" fill="#5A6472">Retornos anuais de referência. O imóvel médio de SP</text><text x="32" y="161" class="s" font-size="15" fill="#5A6472">não vence o CDI só com aluguel: o produto decide.</text><text x="32" y="214" class="s" font-size="14" font-weight="600" fill="#1A2332">CDI 12 meses (bruto)</text><path d="M32.0,222.0 H472.8 Q476.8,222.0 476.8,226.0 V234.0 Q476.8,238.0 472.8,238.0 H32.0 Z" fill="#CFC8BC"/><text x="484.8" y="236" class="s" font-size="14" font-weight="700" fill="#1A2332">14,63%</text><text x="32" y="268" class="s" font-size="14" font-weight="600" fill="#1A2332">CDI 12 meses (líquido de IR)</text><path d="M32.0,276.0 H406.2 Q410.2,276.0 410.2,280.0 V288.0 Q410.2,292.0 406.2,292.0 H32.0 Z" fill="#CFC8BC"/><text x="418.2" y="290" class="s" font-size="14" font-weight="700" fill="#1A2332">12,44%</text><text x="32" y="322" class="s" font-size="14" font-weight="600" fill="#1A2332">Aluguel + valorização (média SP)</text><path d="M32.0,330.0 H333.5 Q337.5,330.0 337.5,334.0 V342.0 Q337.5,346.0 333.5,346.0 H32.0 Z" fill="#2F6FA8"/><text x="345.5" y="344" class="s" font-size="14" font-weight="700" fill="#1A2332">10,05%</text><text x="32" y="376" class="s" font-size="14" font-weight="600" fill="#1A2332">Aluguel: rentabilidade bruta (SP)</text><path d="M32.0,384.0 H223.2 Q227.2,384.0 227.2,388.0 V396.0 Q227.2,400.0 223.2,400.0 H32.0 Z" fill="#2F6FA8"/><text x="235.2" y="398" class="s" font-size="14" font-weight="700" fill="#1A2332">6,42%</text><text x="32" y="430" class="s" font-size="14" font-weight="600" fill="#1A2332">IPCA 12 meses</text><path d="M32.0,438.0 H153.9 Q157.9,438.0 157.9,442.0 V450.0 Q157.9,454.0 153.9,454.0 H32.0 Z" fill="#CFC8BC"/><text x="165.9" y="452" class="s" font-size="14" font-weight="700" fill="#1A2332">4,14%</text><text x="32" y="484" class="s" font-size="14" font-weight="600" fill="#1A2332">Valorização do m² à venda (SP, 12m)</text><path d="M32.0,492.0 H138.4 Q142.4,492.0 142.4,496.0 V504.0 Q142.4,508.0 138.4,508.0 H32.0 Z" fill="#2F6FA8"/><text x="150.4" y="506" class="s" font-size="14" font-weight="700" fill="#1A2332">3,63%</text><line x1="32" y1="544" x2="568" y2="544" stroke="#E7E2D9" stroke-width="1"/><text x="32" y="566" class="m" font-size="13" fill="#5A6472">Fontes: FipeZap (ago/26), BCB/SGS, IBGE</text><text x="568" y="566" class="m" font-size="13" font-weight="700" fill="#11355B" text-anchor="end">bewild.com.br</text></svg>
