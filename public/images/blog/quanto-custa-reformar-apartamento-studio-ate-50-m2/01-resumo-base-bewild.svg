<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 682" width="720" height="818" role="img" aria-labelledby="t d"><title id="t">Resumo: reforma turnkey em São Paulo em 188 contratos</title><desc id="d">Orçamento mediano de R$ 71,9 mil; R$ 2.744 por m² na mediana, metade entre R$ 2.457 e R$ 3.125; metragem mediana de 27,5 m²; fórmula de bolso R$ 38 mil mais R$ 1.217 por m² entre 21 e 35 m²; 60 a 80 dias úteis de obra; 59% dos clientes moram fora da capital.</desc><style>.s{font-family:Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif}.m{font-family:'JetBrains Mono', Menlo, Consolas, monospace}</style><rect width="600" height="682" fill="#FFFFFF"/><text x="32" y="44" class="m" font-size="13" font-weight="700" fill="#11355B" letter-spacing="1.5">RESUMO DA BASE BEWILD</text><text x="32" y="78" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">Reforma turnkey em São Paulo:</text><text x="32" y="108" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">o que dizem 188 contratos</text><text x="32" y="140" class="s" font-size="15" fill="#5A6472">Studios e apartamentos compactos, com projeto, obra,</text><text x="32" y="161" class="s" font-size="15" fill="#5A6472">marcenaria, mobiliário e eletros no mesmo contrato.</text><rect x="32" y="196" width="260" height="128" rx="6" fill="#F6F3EE"/><rect x="32" y="196" width="4" height="128" rx="2" fill="#2F6FA8"/><text x="52" y="242" class="s" font-size="30" font-weight="700" fill="#1A2332" letter-spacing="-0.6">R$ 71,9 mil</text><text x="52" y="272" class="s" font-size="14.5" font-weight="600" fill="#1A2332">orçamento mediano</text><text x="52" y="296" class="s" font-size="13" fill="#5A6472">metade abaixo, metade acima</text><rect x="308" y="196" width="260" height="128" rx="6" fill="#F6F3EE"/><rect x="308" y="196" width="4" height="128" rx="2" fill="#2F6FA8"/><text x="328" y="242" class="s" font-size="30" font-weight="700" fill="#1A2332" letter-spacing="-0.6">R$ 2.744/m²</text><text x="328" y="272" class="s" font-size="14.5" font-weight="600" fill="#1A2332">valor mediano por m²</text><text x="328" y="296" class="s" font-size="13" fill="#5A6472">metade entre R$ 2.457 e R$ 3.125</text><rect x="32" y="340" width="260" height="128" rx="6" fill="#F6F3EE"/><rect x="32" y="340" width="4" height="128" rx="2" fill="#2F6FA8"/><text x="52" y="386" class="s" font-size="30" font-weight="700" fill="#1A2332" letter-spacing="-0.6">27,5 m²</text><text x="52" y="416" class="s" font-size="14.5" font-weight="600" fill="#1A2332">metragem mediana</text><text x="52" y="440" class="s" font-size="13" fill="#5A6472">79% entre 21 e 35 m²</text><rect x="308" y="340" width="260" height="128" rx="6" fill="#F6F3EE"/><rect x="308" y="340" width="4" height="128" rx="2" fill="#D07A3E"/><text x="328" y="386" class="s" font-size="19" font-weight="700" fill="#1A2332" letter-spacing="-0.6">R$ 38 mil + R$ 1.217/m²</text><text x="328" y="416" class="s" font-size="14.5" font-weight="600" fill="#1A2332">fórmula de bolso (21–35 m²)</text><text x="328" y="440" class="s" font-size="13" fill="#5A6472">3 em cada 4 contratos a ±15%</text><rect x="32" y="484" width="260" height="128" rx="6" fill="#F6F3EE"/><rect x="32" y="484" width="4" height="128" rx="2" fill="#2F6FA8"/><text x="52" y="530" class="s" font-size="30" font-weight="700" fill="#1A2332" letter-spacing="-0.6">60 a 80</text><text x="52" y="560" class="s" font-size="14.5" font-weight="600" fill="#1A2332">dias úteis de obra</text><text x="52" y="584" class="s" font-size="13" fill="#5A6472">em contrato, conforme a metragem</text><rect x="308" y="484" width="260" height="128" rx="6" fill="#F6F3EE"/><rect x="308" y="484" width="4" height="128" rx="2" fill="#2F6FA8"/><text x="328" y="530" class="s" font-size="30" font-weight="700" fill="#1A2332" letter-spacing="-0.6">59%</text><text x="328" y="560" class="s" font-size="14.5" font-weight="600" fill="#1A2332">moram fora da capital</text><text x="328" y="584" class="s" font-size="13" fill="#5A6472">35% em outros estados</text><line x1="32" y1="638" x2="568" y2="638" stroke="#E7E2D9" stroke-width="1"/><text x="32" y="660" class="m" font-size="13" fill="#5A6472">Fonte: base Bewild, 188 contratos turnkey</text><text x="568" y="660" class="m" font-size="13" font-weight="700" fill="#11355B" text-anchor="end">bewild.com.br</text></svg>