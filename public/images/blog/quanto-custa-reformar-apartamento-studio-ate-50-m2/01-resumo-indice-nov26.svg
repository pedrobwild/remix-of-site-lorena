<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 609" width="720" height="731" role="img" aria-labelledby="t d"><title id="t">Resumo: reforma completa em São Paulo em 585 orçamentos</title><desc id="d">Orçamento mediano de R$ 74,1 mil; R$ 2.831 por m² na mediana, metade entre R$ 2.499 e R$ 3.283; metragem mediana de 26 m²; regra de bolso R$ 33 mil mais R$ 1.514 por m² entre 21 e 35 m²; 60 a 75 dias úteis de obra; 585 orçamentos de março a novembro de 2026.</desc><style>.s{font-family:Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif}.m{font-family:'JetBrains Mono', Menlo, Consolas, monospace}</style><rect width="600" height="609" fill="#FFFFFF"/><text x="32" y="44" class="m" font-size="13" font-weight="700" fill="#11355B" letter-spacing="1.5">RESUMO DO ÍNDICE BEWILD</text><text x="32" y="78" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">Reforma completa em São Paulo: o</text><text x="32" y="108" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">que dizem 585 orçamentos</text><text x="32" y="140" class="s" font-size="15" fill="#5A6472">Studios e apartamentos compactos de até 45 m², com</text><text x="32" y="161" class="s" font-size="15" fill="#5A6472">projeto, obra, marcenaria, mobiliário e eletros no mesmo</text><text x="32" y="182" class="s" font-size="15" fill="#5A6472">orçamento.</text><rect x="32.0" y="217.0" width="260.0" height="96.0" rx="6" fill="#F6F3EE"/><rect x="32.0" y="217.0" width="4.0" height="96.0" rx="2" fill="#D07A3E"/><text x="52" y="259" class="s" font-size="28" font-weight="700" fill="#1A2332">R$ 74,1 mil</text><text x="52" y="283" class="s" font-size="13.5" fill="#5A6472">orçamento mediano</text><rect x="308.0" y="217.0" width="260.0" height="96.0" rx="6" fill="#F6F3EE"/><rect x="308.0" y="217.0" width="4.0" height="96.0" rx="2" fill="#2F6FA8"/><text x="328" y="259" class="s" font-size="28" font-weight="700" fill="#1A2332">R$ 2.831/m²</text><text x="328" y="283" class="s" font-size="13.5" fill="#5A6472">mediana; metade entre R$ 2.499</text><text x="328" y="300" class="s" font-size="13.5" fill="#5A6472">e R$ 3.283</text><rect x="32.0" y="329.0" width="260.0" height="96.0" rx="6" fill="#F6F3EE"/><rect x="32.0" y="329.0" width="4.0" height="96.0" rx="2" fill="#2F6FA8"/><text x="52" y="371" class="s" font-size="28" font-weight="700" fill="#1A2332">26 m²</text><text x="52" y="395" class="s" font-size="13.5" fill="#5A6472">metragem mediana</text><rect x="308.0" y="329.0" width="260.0" height="96.0" rx="6" fill="#F6F3EE"/><rect x="308.0" y="329.0" width="4.0" height="96.0" rx="2" fill="#D07A3E"/><text x="328" y="371" class="s" font-size="18" font-weight="700" fill="#1A2332">R$ 33 mil + R$ 1.514/m²</text><text x="328" y="395" class="s" font-size="13.5" fill="#5A6472">regra de bolso, de 21 a 35 m²</text><rect x="32.0" y="441.0" width="260.0" height="96.0" rx="6" fill="#F6F3EE"/><rect x="32.0" y="441.0" width="4.0" height="96.0" rx="2" fill="#2F6FA8"/><text x="52" y="483" class="s" font-size="22" font-weight="700" fill="#1A2332">60 a 75 dias úteis</text><text x="52" y="507" class="s" font-size="13.5" fill="#5A6472">prazo de obra em contrato</text><rect x="308.0" y="441.0" width="260.0" height="96.0" rx="6" fill="#F6F3EE"/><rect x="308.0" y="441.0" width="4.0" height="96.0" rx="2" fill="#2F6FA8"/><text x="328" y="483" class="s" font-size="28" font-weight="700" fill="#1A2332">585 orçamentos</text><text x="328" y="507" class="s" font-size="13.5" fill="#5A6472">de março a novembro de 2026</text><line x1="32.0" y1="565.0" x2="568.0" y2="565.0" stroke="#E7E2D9" stroke-width="1"/><text x="32" y="587" class="m" font-size="13" fill="#5A6472">Fonte: Índice Bewild, nov/2026, 585 orçamentos</text><text x="568" y="587" class="m" font-size="13" font-weight="700" fill="#11355B" text-anchor="end">bewild.com.br</text></svg>
