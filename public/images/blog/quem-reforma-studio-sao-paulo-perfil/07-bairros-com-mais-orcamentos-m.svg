<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 692" width="420" height="692" role="img" aria-labelledby="t d"><title id="t">Bairros de São Paulo com 15 orçamentos de reforma ou mais</title><desc id="d">Pinheiros 51; Brooklin 42; Moema 36; Bela Vista 33; Consolação 32; Vila Mariana 28; Perdizes 27; Vila Nova Conceição 26; Vila Olímpia 26; Butantã 22; Vila Clementino 19; Itaim Bibi 16; Jardins 15; Pompeia 15. Base: 549 orçamentos com bairro informado.</desc><style>.s{font-family:Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif}.m{font-family:'JetBrains Mono', Menlo, Consolas, monospace}</style><rect width="420" height="692" fill="#FFFFFF"/><text x="32" y="44" class="m" font-size="13" font-weight="700" fill="#11355B" letter-spacing="1.5">BAIRROS COM MAIS ORÇAMENTOS</text><text x="32" y="78" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">Pinheiros, Brooklin e</text><text x="32" y="108" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">Moema somam 129 dos 549</text><text x="32" y="138" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">orçamentos</text><text x="32" y="170" class="s" font-size="15" fill="#5A6472">Os 14 bairros com 15 orçamentos ou mais,</text><text x="32" y="191" class="s" font-size="15" fill="#5A6472">entre os 549 com bairro informado.</text><text x="32" y="245" class="s" font-size="12.5" font-weight="600" fill="#1A2332">Pinheiros</text><rect x="172.0" y="232.0" width="167.6" height="16.0" rx="4" fill="#D07A3E"/><text x="347.619" y="245" class="s" font-size="13.5" font-weight="700" fill="#1A2332">51</text><text x="32" y="273" class="s" font-size="12.5" font-weight="600" fill="#1A2332">Brooklin</text><rect x="172.0" y="260.0" width="138.0" height="16.0" rx="4" fill="#D07A3E"/><text x="318.039" y="273" class="s" font-size="13.5" font-weight="700" fill="#1A2332">42</text><text x="32" y="301" class="s" font-size="12.5" font-weight="600" fill="#1A2332"