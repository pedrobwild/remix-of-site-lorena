<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 656" width="420" height="656" role="img" aria-labelledby="t d"><title id="t">Origem do telefone de quem recebe orçamento de reforma de studio em São Paulo</title><desc id="d">Capital e Grande São Paulo (DDD 11): 51% (204 pessoas); Outros estados: 33% (130 pessoas); Interior e litoral de São Paulo: 15% (59 pessoas); Exterior: 1% (5 pessoas). Base: 398 pessoas com telefone identificado. Depois de São Paulo, os estados mais frequentes: Minas Gerais (29), Rio de Janeiro (17), Pará (16), Bahia (11).</desc><style>.s{font-family:Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif}.m{font-family:'JetBrains Mono', Menlo, Consolas, monospace}</style><rect width="420" height="656" fill="#FFFFFF"/><text x="32" y="44" class="m" font-size="13" font-weight="700" fill="#11355B" letter-spacing="1.5">DE ONDE É O TELEFONE</text><text x="32" y="78" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">49% têm telefone de fora</text><text x="32" y="108" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">da Grande São Paulo</text><text x="32" y="140" class="s" font-size="15" fill="#5A6472">DDD ou código do país de 398 pessoas com</text><text x="32" y="161" class="s" font-size="15" fill="#5A6472">telefone identificado. O DDD mostra onde</text><text x="32" y="182" class="s" font-size="15" fill="#5A6472">o número foi habilitado.</text><rect x="32.0" y="209.0" width="12.0" height="12.0" rx="3" fill="#D07A3E"/><text x="50" y="219" class="s" font-size="12.5" font-weight="600" fill="#1A2332">fora da Grande São Paulo</text><rect x="32.0" y="229.0" width="12.0" height="12.0" rx="3" fill="#2F6FA8"/><text x="50" y="239" class="s" font-size="12.5" font-weight="600" fill="#1A2332">capital e Grande São Paulo</text><text x="32" y="269" class="s" font-size="14.5" font-weight="600" fill="#1A2332">Capital e Grande São Paulo (DDD 11)</text><text x="32" y="286" class="m" font-size="11.5" fill="#5A6472">204 pessoas</text><rect x="32.0" y="294.0" width="261.1" height="16.0" rx="4" fill="#2F6FA8"/><text x="301.111" y="307" class="s" font-size="14" font-weight="700" fill="#1A2332">51%</text><text x="32" y="336" class="s" font-size="14.5" font-weight="600" fill="#1A2332">Outros estados</text><text x="32" y="353" class="m" font-size="11.5" fill="#5A6472">130 pessoas</text><rect x="32.0" y="361.0" width="166.4" height="16.0" rx="4" fill="#D07A3E"/><text x="206.394" y="374" class="s" font-size="14" font-weight="700" fill="#1A2332">33%</text><text x="32" y="403" class="s" font-size="14.5" font-weight="600" fill="#1A2332">Interior e litoral de São Paulo</text><text x="32" y="420" class="m" font-size="11.5" fill="#5A6472">59 pessoas</text><rect x="32.0" y="428.0" width="75.5" height="16.0" rx="4" fill="#D07A3E"/><text x="115.517" y="441" class="s" font-size="14" font-weight="700" fill="#1A2332">15%</text><text x="32" y="470" class="s" font-size="14.5" font-weight="600" fill="#1A2332">Exterior</text><text x="32" y="487" class="m" font-size="11.5" fill="#5A6472">5 pessoas</text><rect x="32.0" y="495.0" width="6.4" height="16.0" rx="4" fill="#D07A3E"/><text x="46.3998" y="508" class="s" font-size="14" font-weight="700" fill="#1A2332">1%</text><text x="32" y="539" class="s" font-size="12.5" fill="#5A6472">Depois de São Paulo, os estados mais frequentes entre</text><text x="32" y="556" class="s" font-size="12.5" fill="#5A6472">393 pessoas com DDD brasileiro: Minas Gerais (29), Rio</text><text x="32" y="573" class="s" font-size="12.5" fill="#5A6472">de Janeiro (17), Pará (16), Bahia (11).</text><line x1="32.0" y1="594.0" x2="388.0" y2="594.0" stroke="#E7E2D9" stroke-width="1"/><text x="32" y="616" class="m" font-size="12" fill="#5A6472">Fonte: Perfil Bewild, nov/2026, 584 orçamentos</text><text x="32" y="636" class="m" font-size="13" font-weight="700" fill="#11355B">bewild.com.br</text></svg>
