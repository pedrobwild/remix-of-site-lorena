<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 0 380 757" width="380" height="757" role="img" aria-labelledby="t d"><title id="t">Orçamentos de reforma por região de São Paulo e parcela para aluguel por temporada</title><desc id="d">Zona Sul: 277 orçamentos, 60% para temporada; Zona Oeste: 150 orçamentos, 62% para temporada; Centro: 98 orçamentos, 79% para temporada; Zona Leste e Zona Norte: 24 orçamentos, percentual não calculado. Base: 549 orçamentos com bairro informado.</desc><style>.s{font-family:Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif}.m{font-family:'JetBrains Mono', Menlo, Consolas, monospace}</style><rect width="420" height="757" fill="#FFFFFF"/><text x="32" y="44" class="m" font-size="13" font-weight="700" fill="#11355B" letter-spacing="1.5">ONDE FICAM OS IMÓVEIS</text><text x="32" y="78" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">No Centro, 79% reformam</text><text x="32" y="108" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">para alugar por temporada</text><text x="32" y="140" class="s" font-size="15" fill="#5A6472">Zona Sul, Zona Oeste e Centro somam 96%</text><text x="32" y="161" class="s" font-size="15" fill="#5A6472">dos 549 orçamentos com bairro informado.</text><text x="32" y="202" class="m" font-size="13" font-weight="700" fill="#11355B" letter-spacing="1">ORÇAMENTOS</text><text x="32" y="226" class="s" font-size="13.5" font-weight="600" fill="#1A2332">Zona Sul</text><rect x="32.0" y="233.0" width="276.4" height="15.0" rx="4" fill="#2F6FA8"/><text x="316.364" y="245" class="s" font-size="13.5" font-weight="700" fill="#1A2332">277</text><text x="32" y="272" class="s" font-size="13.5" font-weight="600" fill="#1A2332">Zona Oeste</text><rect x="32.0" y="279.0" width="149.7" height="15.0" rx="4" fill="#2F6FA8"/><text x="189.655" y="291" class="s" font-size="13.5" font-weight="700" fill="#1A2332">150</text><text x="32" y="318" class="s" font-size="13.5" font-weight="600" fill="#1A2332">Centro</text><rect x="32.0" y="325.0" width="97.8" height="15.0" rx="4" fill="#2F6FA8"/><text x="137.775" y="337" class="s" font-size="13.5" font-weight="700" fill="#1A2332">98</text><text x="32" y="364" class="s" font-size="13.5" font-weight="600" fill="#1A2332">Zona Leste e Zona Norte</text><rect x="32.0" y="371.0" width="23.9" height="15.0" rx="4" fill="#2F6FA8"/><text x="63.9449" y="383" class="s" font-size="13.5" font-weight="700" fill="#1A2332">24</text><text x="32" y="430" class="m" font-size="13" font-weight="700" fill="#11355B" letter-spacing="1">VÃO ALUGAR POR TEMPORADA</text><text x="32" y="454" class="s" font-size="13.5" font-weight="600" fill="#1A2332">Zona Sul</text><rect x="32.0" y="461.0" width="182.4" height="15.0" rx="4" fill="#D07A3E"/><text x="222.4" y="473" class="s" font-size="13.5" font-weight="700" fill="#1A2332">60%</text><text x="32" y="500" class="s" font-size="13.5" font-weight="600" fill="#1A2332">Zona Oeste</text><rect x="32.0" y="507.0" width="188.5" height="15.0" rx="4" fill="#D07A3E"/><text x="228.48" y="519" class="s" font-size="13.5" font-weight="700" fill="#1A2332">62%</text><text x="32" y="546" class="s" font-size="13.5" font-weight="600" fill="#1A2332">Centro</text><rect x="32.0" y="553.0" width="240.2" height="15.0" rx="4" fill="#D07A3E"/><text x="280.16" y="565" class="s" font-size="13.5" font-weight="700" fill="#1A2332">79%</text><text x="32" y="592" class="s" font-size="13.5" font-weight="600" fill="#1A2332">Zona Leste e Zona Norte</text><text x="32" y="612" class="s" font-size="13" fill="#5A6472">não calculado (menos de 25 respostas)</text><text x="32" y="640" class="s" font-size="13" fill="#5A6472">Temporada: percentual de quem declarou a finalidade</text><text x="32" y="657" class="s" font-size="13" fill="#5A6472">em cada região. Os Jardins entram na Zona Sul, como</text><text x="32" y="674" class="s" font-size="13" fill="#5A6472">no Índice Bewild.</text><line x1="32.0" y1="695.0" x2="388.0" y2="695.0" stroke="#E7E2D9" stroke-width="1"/><text x="32" y="717" class="m" font-size="12" fill="#5A6472">Fonte: Perfil Bewild, nov/2026, 584 orçamentos</text><text x="32" y="737" class="m" font-size="13" font-weight="700" fill="#11355B">bewild.com.br</text></svg>
