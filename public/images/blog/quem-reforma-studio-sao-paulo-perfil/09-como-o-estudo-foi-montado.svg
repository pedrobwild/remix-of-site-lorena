<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 969" width="720" height="1163" role="img" aria-labelledby="t d"><title id="t">Como o Perfil Bewild foi montado: de 793 negócios a 584 orçamentos</title><desc id="d">Partida: 793 negócios com orçamento enviado ao cliente. Saíram: 147 sem metragem informada; 31 com valor abaixo de R$ 50 mil; 24 de imóvel acima de 45 m²; 5 de imóvel fora de São Paulo; 1 sem valor calculado; 1 de teste. Ficaram 584 orçamentos de 507 pessoas. Cobertura: Metragem: 584 de 584 orçamentos; Bairro: 549 de 584 orçamentos; Nome do prédio: 493 de 584 orçamentos; Telefone identificado: 398 de 507 pessoas; Finalidade: 388 de 507 pessoas; Conversa com 3 ou mais mensagens do cliente: 337 de 507 pessoas; Momento das chaves: 110 de 507 pessoas.</desc><style>.s{font-family:Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif}.m{font-family:'JetBrains Mono', Menlo, Consolas, monospace}</style><rect width="600" height="969" fill="#FFFFFF"/><text x="32" y="44" class="m" font-size="13" font-weight="700" fill="#11355B" letter-spacing="1.5">COMO O ESTUDO FOI MONTADO</text><text x="32" y="78" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">De 793 negócios com orçamento</text><text x="32" y="108" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">enviado a 584 orçamentos</text><text x="32" y="140" class="s" font-size="15" fill="#5A6472">A regra de amostra do Índice Bewild de custo de reforma,</text><text x="32" y="161" class="s" font-size="15" fill="#5A6472">aplicada em 24/11/2026.</text><rect x="32.0" y="200.0" width="536.0" height="58.0" rx="6" fill="#F6F3EE"/><rect x="32.0" y="200.0" width="4.0" height="58.0" rx="2" fill="#2F6FA8"/><text x="52" y="238" class="s" font-size="26" font-weight="700" fill="#1A2332">793</text><text x="115" y="225.5" class="s" font-size="13.5" fill="#5A6472">negócios com orçamento enviado ao cliente,</text><text x="115" y="242.5" class="s" font-size="13.5" fill="#5A6472">contados uma vez</text><text x="32" y="280" class="m" font-size="12" font-weight="700" fill="#11355B" letter-spacing="1">SAÍRAM, NESTA ORDEM</text><text x="32" y="304" class="s" font-size="15" font-weight="700" fill="#1A2332">− 147</text><text x="92" y="304" class="s" font-size="13.5" font-weight="500" fill="#1A2332">sem metragem informada</text><rect x="332.0" y="292.0" width="236.0" height="14.0" rx="4" fill="#C9CED6"/><text x="32" y="332" class="s" font-size="15" font-weight="700" fill="#1A2332">− 31</text><text x="92" y="332" class="s" font-size="13.5" font-weight="500" fill="#1A2332">com valor abaixo de R$ 50 mil</text><rect x="332.0" y="320.0" width="49.8" height="14.0" rx="4" fill="#C9CED6"/><text x="32" y="360" class="s" font-size="15" font-weight="700" fill="#1A2332">− 24</text><text x="92" y="360" class="s" font-size="13.5" font-weight="500" fill="#1A2332">de imóvel acima de 45 m²</text><rect x="332.0" y="348.0" width="38.5" height="14.0" rx="4" fill="#C9CED6"/><text x="32" y="388" class="s" font-size="15" font-weight="700" fill="#1A2332">− 5</text><text x="92" y="388" class="s" font-size="13.5" font-weight="500" fill="#1A2332">de imóvel fora de São Paulo</text><rect x="332.0" y="376.0" width="8.0" height="14.0" rx="4" fill="#C9CED6"/><text x="32" y="416" class="s" font-size="15" font-weight="700" fill="#1A2332">− 1</text><text x="92" y="416" class="s" font-size="13.5" font-weight="500" fill="#1A2332">sem valor calculado</text><rect x="332.0" y="404.0" width="2.0" height="14.0" rx="4" fill="#C9CED6"/><text x="32" y="444" class="s" font-size="15" font-weight="700" fill="#1A2332">− 1</text><text x="92" y="444" class="s" font-size="13.5" font-weight="500" fill="#1A2332">de teste</text><rect x="332.0" y="432.0" width="2.0" height="14.0" rx="4" fill="#C9CED6"/><rect x="32.0" y="472.0" width="536.0" height="58.0" rx="6" fill="#F6F3EE"/><rect x="32.0" y="472.0" width="4.0" height="58.0" rx="2" fill="#D07A3E"/><text x="52" y="510" class="s" font-size="26" font-weight="700" fill="#1A2332">584</text><text x="115" y="497.5" class="s" font-size="13.5" fill="#5A6472">orçamentos de 507 pessoas, criados de</text><text x="115" y="514.5" class="s" font-size="13.5" fill="#5A6472">18/03/2026 a 13/11/2026</text><text x="32" y="560" class="m" font-size="12" font-weight="700" fill="#11355B" letter-spacing="1">QUANTO DA AMOSTRA TEM CADA INFORMAÇÃO</text><text x="32" y="586" class="s" font-size="14.5" font-weight="600" fill="#1A2332">Metragem</text><text x="568" y="586" class="m" font-size="12.5" fill="#5A6472" text-anchor="end">584 de 584 orçamentos</text><rect x="32.0" y="594.0" width="462.0" height="13.0" rx="4" fill="#2F6FA8"/><text x="502" y="604" class="s" font-size="14" font-weight="700" fill="#1A2332">100%</text><text x="32" y="632" class="s" font-size="14.5" font-weight="600" fill="#1A2332">Bairro</text><text x="568" y="632" class="m" font-size="12.5" fill="#5A6472" text-anchor="end">549 de 584 orçamentos</text><rect x="32.0" y="640.0" width="434.3" height="13.0" rx="4" fill="#2F6FA8"/><text x="474.312" y="650" class="s" font-size="14" font-weight="700" fill="#1A2332">94%</text><text x="32" y="678" class="s" font-size="14.5" font-weight="600" fill="#1A2332">Nome do prédio</text><text x="568" y="678" class="m" font-size="12.5" fill="#5A6472" text-anchor="end">493 de 584 orçamentos</text><rect x="32.0" y="686.0" width="390.0" height="13.0" rx="4" fill="#2F6FA8"/><text x="430.01" y="696" class="s" font-size="14" font-weight="700" fill="#1A2332">84%</text><text x="32" y="724" class="s" font-size="14.5" font-weight="600" fill="#1A2332">Telefone identificado</text><text x="568" y="724" class="m" font-size="12.5" fill="#5A6472" text-anchor="end">398 de 507 pessoas</text><rect x="32.0" y="732.0" width="362.7" height="13.0" rx="4" fill="#2F6FA8"/><text x="402.675" y="742" class="s" font-size="14" font-weight="700" fill="#1A2332">79%</text><text x="32" y="770" class="s" font-size="14.5" font-weight="600" fill="#1A2332">Finalidade</text><text x="568" y="770" class="m" font-size="12.5" fill="#5A6472" text-anchor="end">388 de 507 pessoas</text><rect x="32.0" y="778.0" width="353.6" height="13.0" rx="4" fill="#2F6FA8"/><text x="393.562" y="788" class="s" font-size="14" font-weight="700" fill="#1A2332">77%</text><text x="32" y="816" class="s" font-size="14.5" font-weight="600" fill="#1A2332">Conversa com 3 ou mais mensagens do cliente</text><text x="568" y="816" class="m" font-size="12.5" fill="#5A6472" text-anchor="end">337 de 507 pessoas</text><rect x="32.0" y="824.0" width="307.1" height="13.0" rx="4" fill="#2F6FA8"/><text x="347.089" y="834" class="s" font-size="14" font-weight="700" fill="#1A2332">66%</text><text x="32" y="862" class="s" font-size="14.5" font-weight="600" fill="#1A2332">Momento das chaves</text><text x="568" y="862" class="m" font-size="12.5" fill="#5A6472" text-anchor="end">110 de 507 pessoas</text><rect x="32.0" y="870.0" width="100.2" height="13.0" rx="4" fill="#2F6FA8"/><text x="140.237" y="880" class="s" font-size="14" font-weight="700" fill="#1A2332">22%</text><text x="32" y="904" class="s" font-size="12.5" fill="#5A6472">Cada percentual do estudo usa como base quem tem aquele dado.</text><line x1="32.0" y1="925.0" x2="568.0" y2="925.0" stroke="#E7E2D9" stroke-width="1"/><text x="32" y="947" class="m" font-size="13" fill="#5A6472">Fonte: Perfil Bewild, nov/2026, 584 orçamentos</text><text x="568" y="947" class="m" font-size="13" font-weight="700" fill="#11355B" text-anchor="end">bewild.com.br</text></svg>
