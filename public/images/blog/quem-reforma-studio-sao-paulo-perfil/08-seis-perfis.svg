<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 588" width="720" height="706" role="img" aria-labelledby="t d"><title id="t">Seis perfis de quem recebe orçamento de reforma de studio em São Paulo</title><desc id="d">Investidor de temporada com telefone de fora: 32% (115 pessoas, 26 m² de mediana, 83% com até 30 m²); Investidor de temporada da Grande SP: 28% (101 pessoas, 26 m² de mediana, 77% com até 30 m²); Investidor de aluguel tradicional: 18% (65 pessoas, 26 m² de mediana, 82% com até 30 m²); Morador da Grande SP: 13% (45 pessoas, 31 m² de mediana, 40% com até 30 m²); Morador com telefone de fora: 6% (23 pessoas); Em dúvida ou uso misto: 3% (11 pessoas). Base: 360 pessoas com finalidade e telefone identificados.</desc><style>.s{font-family:Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif}.m{font-family:'JetBrains Mono', Menlo, Consolas, monospace}</style><rect width="600" height="588" fill="#FFFFFF"/><text x="32" y="44" class="m" font-size="13" font-weight="700" fill="#11355B" letter-spacing="1.5">SEIS PERFIS</text><text x="32" y="78" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">Os dois perfis de investidor de</text><text x="32" y="108" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">temporada somam 60%</text><text x="32" y="140" class="s" font-size="15" fill="#5A6472">360 pessoas com finalidade e telefone identificados, com</text><text x="32" y="161" class="s" font-size="15" fill="#5A6472">a metragem mediana e a parcela de imóveis de até 30 m²</text><text x="32" y="182" class="s" font-size="15" fill="#5A6472">de cada perfil.</text><text x="32" y="225" class="s" font-size="14.5" font-weight="600" fill="#1A2332">Investidor de temporada com telefone de fora</text><text x="568" y="225" class="m" font-size="12.5" fill="#5A6472" text-anchor="end">26 m² · 83% até 30 m²</text><rect x="32.0" y="233.0" width="318.6" height="16.0" rx="4" fill="#D07A3E"/><text x="358.621" y="246" class="s" f