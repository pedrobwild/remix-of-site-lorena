><text x="70.4768" y="496" class="s" font-size="14" font-weight="700" fill="#1A2332">3% · 11 pessoas</text><text x="32" y="523" class="s" font-size="12.5" fill="#5A6472">Ficaram fora 119 pessoas sem finalidade declarada e 28 sem telefone identificado.</text><line x1="32.0" y1="544.0" x2="568.0" y2="544.0" stroke="#E7E2D9" stroke-width="1"/><text x="32" y="566" class="m" font-size="13" fill="#5A6472">Fonte: Perfil Bewild, nov/2026, 584 orçamentos</text><text x="568" y="566" class="m" font-size="13" font-weight="700" fill="#11355B" text-anchor="end">bewild.com.br</text></svg>
