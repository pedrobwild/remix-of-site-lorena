<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 494" width="720" height="593" role="img" aria-labelledby="t d"><title id="t">Orçamentos de reforma por região de São Paulo e parcela para aluguel por temporada</title><desc id="d">Zona Sul: 277 orçamentos, 60% para temporada; Zona Oeste: 150 orçamentos, 62% para temporada; Centro: 98 orçamentos, 79% para temporada; Zona Leste e Zona Norte: 24 orçamentos, percentual não calculado. Base: 549 orçamentos com bairro informado.</desc><style>.s{font-family:Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif}.m{font-family:'JetBrains Mono', Menlo, Consolas, monospace}</style><rect width="600" height="494" fill="#FFFFFF"/><text x="32" y="44" class="m" font-size="13" font-weight="700" fill="#11355B" letter-spacing="1.5">ONDE FICAM OS IMÓVEIS</text><text x="32" y="78" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">No Centro, 79% reformam para</text><text x="32" y="108" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">alugar por temporada</text><text x="32" y="140" class="s" font-size="15" fill="#5A6472">Zona Sul, Zona Oeste e Centro somam 96% dos 549</text><text x="32" y="161" class="s" font-size="15" fill="#5A6472">orçamentos com bairro informado.</text><text x="32" y="202" class="m" font-size="12" font-weight="700" fill="#11355B" letter-spacing="1">ORÇAMENTOS</text><text x="32" y="226" class="s" font-size="13.5" font-weight="600" fill="#1A2332">Zona Sul</text><rect x="32.0" y="233.0" width="183.6" height="15.0" rx="4" fill="#2F6FA8"/><text x="223.636" y="245" class="s" font-size="13.5" font-weight="700" fill="#1A2332">277</text><text x="32" y="272" class="s" font-size="13.5" font-weight="600" fill="#1A2332">Zona Oeste</text><rect x="32.0" y="279.0" width="99.4" height="15.0" rx="4" fill="#2F6FA8"/><text x="139.442" y="291" class="s" font-size="13.5" font-weight="700" fill="#1A2332">150</text><text x="32" y="318" class="s" font-size="13.5" font-weight="600" fill="#1A2332">Centro</text><rect x="32.0" y="325.0" width="65.0" height="15.0" rx="4" fill="#2F6FA8"/><text x="104.969" y="337" class="s" font-size="13.5" font-weight="700" fill="#1A2332">98</text><text x="32" y="364" class="s" font-size="13.5" font-weight="600" fill="#1A2332">Zona Leste e Zona Norte</text><rect x="32.0" y="371.0" width="15.9" height="15.0" rx="4" fill="#2F6FA8"/><text x="55.9107" y="383" class="s" font-size="13.5" font-weight="700" fill="#1A2332">24</text><text x="314" y="202" class="m" font-size="12" font-weight="700" fill="#11355B" letter-spacing="1">VÃO ALUGAR POR TEMPORADA</text><text x="314" y="226" class="s" font-size="13.5" font-weight="600" fill="#1A2332">Zona Sul</text><rect x="314.0" y="233.0" width="121.2" height="15.0" rx="4" fill="#D07A3E"/><text x="443.2" y="245" class="s" font-size="13.5" font-weight="700" fill="#1A2332">60%</text><text x="314" y="272" class="s" font-size="13.5" font-weight="600" fill="#1A2332">Zona Oeste</text><rect x="314.0" y="279.0" width="125.2" height="15.0" rx="4" fill="#D07A3E"/><text x="447.24" y="291" class="s" font-size="13.5" font-weight="700" fill="#1A2332">62%</text><text x="314" y="318" class="s" font-size="13.5" font-weight="600" fill="#1A2332">Centro</text><rect x="314.0" y="325.0" width="159.6" height="15.0" rx="4" fill="#D07A3E"/><text x="481.58" y="337" class="s" font-size="13.5" font-weight="700" fill="#1A2332">79%</text><text x="314" y="364" class="s" font-size="13.5" font-weight="600" fill="#1A2332">Zona Leste e Zona Norte</text><text x="314" y="384" class="s" font-size="12" fill="#5A6472">não calculado (menos de 25 respostas)</text><text x="32" y="412" class="s" font-size="12.5" fill="#5A6472">Temporada: percentual de quem declarou a finalidade em cada região. Os Jardins</text><text x="32" y="429" class="s" font-size="12.5" fill="#5A6472">entram na Zona Sul, como no Índice Bewild.</text><line x1="32.0" y1="450.0" x2="568.0" y2="450.0" stroke="#E7E2D9" stroke-width="1"/><text x="32" y="472" class="m" font-size="13" fill="#5A6472">Fonte: Perfil Bewild, nov/2026, 584 orçamentos</text><text x="568" y="472" class="m" font-size="13" font-weight="700" fill="#11355B" text-anchor="end">bewild.com.br</text></svg>
