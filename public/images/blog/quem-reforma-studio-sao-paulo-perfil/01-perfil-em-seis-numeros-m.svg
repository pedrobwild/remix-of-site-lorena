<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 0 380 993" width="380" height="993" role="img" aria-labelledby="t d"><title id="t">Quem reforma studio em São Paulo, em seis números</title><desc id="d">79%: vão alugar o imóvel (388 pessoas disseram a finalidade); 49%: têm telefone de fora da Grande São Paulo (398 pessoas); 26 m²: metragem mediana; metade entre 24 e 31 m²; 62%: pedem o orçamento antes de ter a chave (110 pessoas); 73% e 14%: falam de renda: quem vai alugar e quem vai morar; 584 orçamentos: de 507 pessoas, de março a novembro de 2026. Orçamentos de reforma completa enviados pela Bewild.</desc><style>.s{font-family:Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif}.m{font-family:'JetBrains Mono', Menlo, Consolas, monospace}</style><rect width="420" height="993" fill="#FFFFFF"/><text x="32" y="44" class="m" font-size="13" font-weight="700" fill="#11355B" letter-spacing="1.5">PERFIL BEWILD · NOV/2026</text><text x="32" y="78" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">Quem reforma studio em</text><text x="32" y="108" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">São Paulo, em seis</text><text x="32" y="138" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">números</text><text x="32" y="170" class="s" font-size="15" fill="#5A6472">Orçamentos de reforma completa enviados</text><text x="32" y="191" class="s" font-size="15" fill="#5A6472">pela Bewild para studios e apartamentos</text><text x="32" y="212" class="s" font-size="15" fill="#5A6472">de até 45 m².</text><rect x="32.0" y="247.0" width="356.0" height="96.0" rx="6" fill="#F6F3EE"/><rect x="32.0" y="247.0" width="4.0" height="96.0" rx="2" fill="#D07A3E"/><text x="52" y="289" class="s" font-size="28" font-weight="700" fill="#1A2332">79%</text><text x="52" y="313" class="s" font-size="13.5" fill="#5A6472">vão alugar o imóvel (388 pessoas disseram</text><text x="52" y="330" class="s" font-size="13.5" fill="#5A6472">a finalidade)</text><rect x="32.0" y="359.0" width="356.0" height="96.0" rx="6" fill="#F6F3EE"/><rect x="32.0" y="359.0" width="4.0" height="96.0" rx="2" fill="#2F6FA8"/><text x="52" y="401" class="s" font-size="28" font-weight="700" fill="#1A2332">49%</text><text x="52" y="425" class="s" font-size="13.5" fill="#5A6472">têm telefone de fora da Grande São Paulo</text><text x="52" y="442" class="s" font-size="13.5" fill="#5A6472">(398 pessoas)</text><rect x="32.0" y="471.0" width="356.0" height="96.0" rx="6" fill="#F6F3EE"/><rect x="32.0" y="471.0" width="4.0" height="96.0" rx="2" fill="#2F6FA8"/><text x="52" y="513" class="s" font-size="28" font-weight="700" fill="#1A2332">26 m²</text><text x="52" y="537" class="s" font-size="13.5" fill="#5A6472">metragem mediana; metade entre 24 e 31 m²</text><rect x="32.0" y="583.0" width="356.0" height="96.0" rx="6" fill="#F6F3EE"/><rect x="32.0" y="583.0" width="4.0" height="96.0" rx="2" fill="#D07A3E"/><text x="52" y="625" class="s" font-size="28" font-weight="700" fill="#1A2332">62%</text><text x="52" y="649" class="s" font-size="13.5" fill="#5A6472">pedem o orçamento antes de ter a chave</text><text x="52" y="666" class="s" font-size="13.5" fill="#5A6472">(110 pessoas)</text><rect x="32.0" y="695.0" width="356.0" height="96.0" rx="6" fill="#F6F3EE"/><rect x="32.0" y="695.0" width="4.0" height="96.0" rx="2" fill="#2F6FA8"/><text x="52" y="737" class="s" font-size="28" font-weight="700" fill="#1A2332">73% e 14%</text><text x="52" y="761" class="s" font-size="13.5" fill="#5A6472">falam de renda: quem vai alugar e quem vai</text><text x="52" y="778" class="s" font-size="13.5" fill="#5A6472">morar</text><rect x="32.0" y="807.0" width="356.0" height="96.0" rx="6" fill="#F6F3EE"/><rect x="32.0" y="807.0" width="4.0" height="96.0" rx="2" fill="#2F6FA8"/><text x="52" y="849" class="s" font-size="22" font-weight="700" fill="#1A2332">584 orçamentos</text><text x="52" y="873" class="s" font-size="13.5" fill="#5A6472">de 507 pessoas, de março a novembro de</text><text x="52" y="890" class="s" font-size="13.5" fill="#5A6472">2026</text><line x1="32.0" y1="931.0" x2="388.0" y2="931.0" stroke="#E7E2D9" stroke-width="1"/><text x="32" y="953" class="m" font-size="12" fill="#5A6472">Fonte: Perfil Bewild, nov/2026, 584 orçamentos</text><text x="32" y="973" class="m" font-size="13" font-weight="700" fill="#11355B">bewild.com.br</text></svg>
