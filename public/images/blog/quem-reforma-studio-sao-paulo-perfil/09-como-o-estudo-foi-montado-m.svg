t-size="13.5" fill="#5A6472">13/11/2026</text><text x="32" y="628" class="m" font-size="12" font-weight="700" fill="#11355B" letter-spacing="1">QUANTO DA AMOSTRA TEM CADA INFORMAÇÃO</text><text x="32" y="654" class="s" font-size="14.5" font-weight="600" fill="#1A2332">Metragem</text><text x="32" y="671" class="m" font-size="11.5" fill="#5A6472">584 de 584 orçamentos</text><rect x="32.0" y="679.0" width="282.0" height="13.0" rx="4" fill="#2F6FA8"/><text x="322" y="689" class="s" font-size="14" font-weight="700" fill="#1A2332">100%</text><text x="32" y="717" class="s" font-size="14.5" font-weight="600" fill="#1A2332">Bairro</text><text x="32" y="734" class="m" font-size="11.5" fill="#5A6472">549 de 584 orçamentos</text><rect x="32.0" y="742.0" width="265.1" height="13.0" rx="4" fill="#2F6FA8"/><text x="305.099" y="752" class="s" font-size="14" font-weight="700" fill="#1A2332">94%</text><text x="32" y="780" class="s" font-size="14.5" font-weight="600" fill="#1A2332">Nome do prédio</text><text x="32" y="797" class="m" font-size="11.5" fill="#5A6472">493 de 584 orçamentos</text><rect x="32.0" y="805.0" width="238.1" height="13.0" rx="4" fill="#2F6FA8"/><text x="278.058" y="815" class="s" font-size="14" font-weight="700" fill="#1A2332">84%</text><text x="32" y="843" class="s" font-size="14.5" font-weight="600" fill="#1A2332">Telefone identificado</text><text x="32" y="860" class="m" font-size="11.5" fill="#5A6472">398 de 507 pessoas</text><rect x="32.0" y="868.0" width="221.4" height="13.0" rx="4" fill="#2F6FA8"/><text x="261.373" y="878" class="s" font-size="14" font-weight="700" fill="#1A2332">79%</text><text x="32" y="906" class="s" font-size="14.5" font-weight="600" fill="#1A2332">Finalidade</text><text x="32" y="923" class="m" font-size="11.5" fill="#5A6472">388 de 507 pessoas</text><rect x="32.0" y="931.0" width="215.8" height="13.0" rx="4" fill="#2F6FA8"/><text x="255.811" y="941" class="s" font-size="14" font-weight="700" fill="#1A2332">77%</text><text x="32" y="9