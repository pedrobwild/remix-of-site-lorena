<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1191" width="420" height="1191" role="img" aria-labelledby="t d"><title id="t">Como o Perfil Bewild foi montado: de 793 negócios a 584 orçamentos</title><desc id="d">Partida: 793 negócios com orçamento enviado ao cliente. Saíram: 147 sem metragem informada; 31 com valor abaixo de R$ 50 mil; 24 de imóvel acima de 45 m²; 5 de imóvel fora de São Paulo; 1 sem valor calculado; 1 de teste. Ficaram 584 orçamentos de 507 pessoas. Cobertura: Metragem: 584 de 584 orçamentos; Bairro: 549 de 584 orçamentos; Nome do prédio: 493 de 584 orçamentos; Telefone identificado: 398 de 507 pessoas; Finalidade: 388 de 507 pessoas; Conversa com 3 ou mais mensagens do cliente: 337 de 507 pessoas; Momento das chaves: 110 de 507 pessoas.</desc><style>.s{font-family:Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif}.m{font-family:'JetBrains Mono', Menlo, Consolas, monospace}</style><rect width="420" height="1191" fill="#FFFFFF"/><text x="32" y="44" class="m" font-size="13" font-weight="700" fill="#11355B" letter-spacing="1.5">COMO O ESTUDO FOI MONTADO</text><text x="32" y="78" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">De 793 negócios com</text><text x="32" y="108" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">orçamento enviado a 584</text><text x="32" y="138" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">orçamentos</text><text x="32" y="170" class="s" font-size="15" fill="#5A6472">A regra de amostra do Índice Bewild de</text><text x="32" y="191" class="s" font-size="15" fill="#5A6472">custo de reforma, aplicada em</text><text x="32" y="212" class="s" font-size="15" fill="#5A6472">24/11/2026.</text><rect x="32.0" y="251.0" width="356.0" height="58.0" rx="6" fill="#F6F3EE"/><rect x="32.0" y="251.0" width="4.0" height="58.0" rx="2" fill="#2F6FA8"/><text x="52" y="289" class="s" font-size="26" font-weight="700" fill="#1A2332">793</t