<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 512" width="720" height="614" role="img" aria-labelledby="t d"><title id="t">Origem do telefone de quem recebe orçamento de reforma de studio em São Paulo</title><desc id="d">Capital e Grande São Paulo (DDD 11): 51% (204 pessoas); Outros estados: 33% (130 pessoas); Interior e litoral de São Paulo: 15% (59 pessoas); Exterior: 1% (5 pessoas). Base: 398 pessoas com telefone identificado. Depois de São Paulo, os estados mais frequentes: Minas Gerais (29), Rio de Janeiro (17), Pará (16), Bahia (11).</desc><style>.s{font-family:Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif}.m{font-family:'JetBrains Mono', Menlo, Consolas, monospace}</style><rect width="600" height="512" fill="#FFFFFF"/><text x="32" y="44" class="m" font-size="13" font-weight="700" fill="#11355B" letter-spacing="1.5">DE ONDE É O TELEFONE</text><text x="32" y="78" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">49% têm telefone de fora da Grande</text><text x="32" y="108" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">São Paulo</text><text x="32" y="140" class="s" font-size="15" fill="#5A6472">DDD ou código do país de 398 pessoas com telefone</text><text x="32" y="161" class="s" font-size="15" fill="#5A6472">identificado. O DDD mostra onde o número foi habilitado.</text><rect x="32.0" y="188.0" width="12.0" height="12.0" rx="3" fill="#D07A3E"/><text x="50" y="198" class="s" font-size="12.5" font-weight="600" fill="#1A2332">fora da Grande São Paulo</text><rect x="232.4" y="188.0" width="12.0" height="12.0" rx="3" fill="#2F6FA8"/><text x="250.4" y="198" class="s" font-size="12.5" font-weight="600" fill="#1A2332">capital e Grande São Paulo</text><text x="32" y="228" class="s" font-size="14.5" font-weight="600" fill="#1A2332">Capital e Grande São Paulo (DDD 11)</text><text x="568" y="228" class="m" font-size="12.5" fill="#5A6472" text-anchor="end">204 pessoas</text><rect x="32.0" y="236.0" width="427.8" height="16.0" rx="4" fill="#2F6FA8"/><text x="467.778" y="249" class="s" font-size="14" font-weight="700" fill="#1A2332">51%</text><text x="32" y="278" class="s" font-size="14.5" font-weight="600" fill="#1A2332">Outros estados</text><text x="568" y="278" class="m" font-size="12.5" fill="#5A6472" text-anchor="end">130 pessoas</text><rect x="32.0" y="286.0" width="272.6" height="16.0" rx="4" fill="#D07A3E"/><text x="312.603" y="299" class="s" font-size="14" font-weight="700" fill="#1A2332">33%</text><text x="32" y="328" class="s" font-size="14.5" font-weight="600" fill="#1A2332">Interior e litoral de São Paulo</text><text x="568" y="328" class="m" font-size="12.5" fill="#5A6472" text-anchor="end">59 pessoas</text><rect x="32.0" y="336.0" width="123.7" height="16.0" rx="4" fill="#D07A3E"/><text x="163.72" y="349" class="s" font-size="14" font-weight="700" fill="#1A2332">15%</text><text x="32" y="378" class="s" font-size="14.5" font-weight="600" fill="#1A2332">Exterior</text><text x="568" y="378" class="m" font-size="12.5" fill="#5A6472" text-anchor="end">5 pessoas</text><rect x="32.0" y="386.0" width="10.5" height="16.0" rx="4" fill="#D07A3E"/><text x="50.4847" y="399" class="s" font-size="14" font-weight="700" fill="#1A2332">1%</text><text x="32" y="430" class="s" font-size="12.5" fill="#5A6472">Depois de São Paulo, os estados mais frequentes entre 393 pessoas com DDD</text><text x="32" y="447" class="s" font-size="12.5" fill="#5A6472">brasileiro: Minas Gerais (29), Rio de Janeiro (17), Pará (16), Bahia (11).</text><line x1="32.0" y1="468.0" x2="568.0" y2="468.0" stroke="#E7E2D9" stroke-width="1"/><text x="32" y="490" class="m" font-size="13" fill="#5A6472">Fonte: Perfil Bewild, nov/2026, 584 orçamentos</text><text x="568" y="490" class="m" font-size="13" font-weight="700" fill="#11355B" text-anchor="end">bewild.com.br</text></svg>
