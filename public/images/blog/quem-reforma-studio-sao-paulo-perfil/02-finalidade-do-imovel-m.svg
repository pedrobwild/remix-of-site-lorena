<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 0 380 532" width="380" height="532" role="img" aria-labelledby="t d"><title id="t">Finalidade do imóvel de quem recebe orçamento de reforma de studio</title><desc id="d">Alugar por temporada: 62% (241 pessoas); Morar: 18% (71 pessoas); Alugar com contrato tradicional: 17% (65 pessoas); Morar e alugar (uso misto): 2% (9 pessoas); Ainda decide: 1% (2 pessoas). Base: 388 pessoas.</desc><style>.s{font-family:Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif}.m{font-family:'JetBrains Mono', Menlo, Consolas, monospace}</style><rect width="420" height="532" fill="#FFFFFF"/><text x="32" y="44" class="m" font-size="13" font-weight="700" fill="#11355B" letter-spacing="1.5">PARA QUE SERVE O IMÓVEL</text><text x="32" y="78" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">79% reformam para alugar,</text><text x="32" y="108" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">62% por temporada</text><text x="32" y="140" class="s" font-size="15" fill="#5A6472">Finalidade declarada por 388 pessoas que</text><text x="32" y="161" class="s" font-size="15" fill="#5A6472">receberam orçamento de reforma completa.</text><rect x="32.0" y="188.0" width="12.0" height="12.0" rx="3" fill="#D07A3E"/><text x="50" y="198" class="s" font-size="13" font-weight="600" fill="#1A2332">vai alugar</text><rect x="133.0" y="188.0" width="12.0" height="12.0" rx="3" fill="#2F6FA8"/><text x="151" y="198" class="s" font-size="13" font-weight="600" fill="#1A2332">outras finalidades</text><text x="32" y="228" class="s" font-size="14.5" font-weight="600" fill="#1A2332">Alugar por temporada</text><text x="388" y="228" class="m" font-size="13" fill="#5A6472" text-anchor="end">241 pessoas</text><rect x="32.0" y="236.0" width="261.1" height="16.0" rx="4" fill="#D07A3E"/><text x="301.111" y="249" class="s" font-size="14" font-weight="700" fill="#1A2332">62%</text><text x="32" y="278" class="s" font-size="14.5" font-weight="600" fill="#1A2332">Morar</text><text x="388" y="278" class="m" font-size="13" fill="#5A6472" text-anchor="end">71 pessoas</text><rect x="32.0" y="286.0" width="76.9" height="16.0" rx="4" fill="#2F6FA8"/><text x="116.925" y="299" class="s" font-size="14" font-weight="700" fill="#1A2332">18%</text><text x="32" y="328" class="s" font-size="14.5" font-weight="600" fill="#1A2332">Alugar com contrato tradicional</text><text x="388" y="328" class="m" font-size="13" fill="#5A6472" text-anchor="end">65 pessoas</text><rect x="32.0" y="336.0" width="70.4" height="16.0" rx="4" fill="#D07A3E"/><text x="110.424" y="349" class="s" font-size="14" font-weight="700" fill="#1A2332">17%</text><text x="32" y="378" class="s" font-size="14.5" font-weight="600" fill="#1A2332">Morar e alugar (uso misto)</text><text x="388" y="378" class="m" font-size="13" fill="#5A6472" text-anchor="end">9 pessoas</text><rect x="32.0" y="386.0" width="9.8" height="16.0" rx="4" fill="#2F6FA8"/><text x="49.751" y="399" class="s" font-size="14" font-weight="700" fill="#1A2332">2%</text><text x="32" y="428" class="s" font-size="14.5" font-weight="600" fill="#1A2332">Ainda decide</text><text x="388" y="428" class="m" font-size="13" fill="#5A6472" text-anchor="end">2 pessoas</text><rect x="32.0" y="436.0" width="2.2" height="16.0" rx="4" fill="#2F6FA8"/><text x="42.1669" y="449" class="s" font-size="14" font-weight="700" fill="#1A2332">1%</text><line x1="32.0" y1="470.0" x2="388.0" y2="470.0" stroke="#E7E2D9" stroke-width="1"/><text x="32" y="492" class="m" font-size="12" fill="#5A6472">Fonte: Perfil Bewild, nov/2026, 584 orçamentos</text><text x="32" y="512" class="m" font-size="13" font-weight="700" fill="#11355B">bewild.com.br</text></svg>
