<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 388" width="720" height="466" role="img" aria-labelledby="t d"><title id="t">Custo ilustrativo de cada mês de espera para um apartamento de 26 m² e orçamento mediano de R$ 74.132</title><desc id="d">Aluguel que não entra: de R$ 1.710 a R$ 2.370 por mês (FipeZap locação set/2026 e QuintoAndar jul/2026); reajuste da obra pelo INCC-M: R$ 408 por mês (6,60% em 12 meses); reajuste pelo IPCA: R$ 283 por mês (4,58% em 12 meses).</desc><style>.s{font-family:Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif}.m{font-family:'JetBrains Mono', Menlo, Consolas, monospace}</style><rect width="600" height="388" fill="#FFFFFF"/><text x="32" y="44" class="m" font-size="13" font-weight="700" fill="#11355B" letter-spacing="1.5">CUSTO DE ESPERAR</text><text x="32" y="78" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">O imóvel parado custa de 4 a 6</text><text x="32" y="108" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">vezes o reajuste da obra</text><text x="32" y="140" class="s" font-size="15" fill="#5A6472">Cenário ilustrativo por mês, para 26 m² e orçamento</text><text x="32" y="161" class="s" font-size="15" fill="#5A6472">mediano de R$ 74.132. Não é previsão.</text><text x="32" y="196" class="s" font-size="14.5" font-weight="600" fill="#1A2332">Aluguel que não entra, 26 m²</text><text x="568" y="196" class="m" font-size="12" fill="#5A6472" text-anchor="end">R$ 65,78 a 91,14/m²</text><rect x="32.0" y="204.0" width="267.0" height="16.0" rx="4" fill="#2F6FA8"/><rect x="299.0" y="204.0" width="103.1" height="16.0" rx="4" fill="#9DBAD6"/><text x="410.085" y="217" class="s" font-size="13.5" font-weight="700" fill="#1A2332">R$ 1.710 a R$ 2.370</text><text x="32" y="250" class="s" font-size="14.5" font-weight="600" fill="#1A2332">Reajuste da obra pelo INCC-M</text><text x="568" y="250" class="m" font-size="12" fill="#5A6472" text-anchor="end">6,60% em 12 meses</text><rect x="32.0" y="258.0" width="63.7" height="16.0" rx="4" fill="#D07A3E"/><text x="103.711" y="271" class="s" font-size="14" font-weight="700" fill="#1A2332">R$ 408</text><text x="32" y="304" class="s" font-size="14.5" font-weight="600" fill="#1A2332">Reajuste da obra pelo IPCA</text><text x="568" y="304" class="m" font-size="12" fill="#5A6472" text-anchor="end">4,58% em 12 meses</text><rect x="32.0" y="312.0" width="44.2" height="16.0" rx="4" fill="#D07A3E"/><text x="84.1915" y="325" class="s" font-size="14" font-weight="700" fill="#1A2332">R$ 283</text><line x1="32.0" y1="344.0" x2="568.0" y2="344.0" stroke="#E7E2D9" stroke-width="1"/><text x="32" y="366" class="m" font-size="13" fill="#5A6472">Fontes: Índice Bewild; FipeZap; FGV; IBGE</text><text x="568" y="366" class="m" font-size="13" font-weight="700" fill="#11355B" text-anchor="end">bewild.com.br</text></svg>
