<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-labelledby="t"><title id="t">Linha do tempo da reforma de apartamento em semanas, premissas da Bewild: contratando 8 semanas antes das chaves, o projeto 3D e o executivo (4 a 8 semanas) ficam prontos antes da entrega; depois das chaves vêm liberação do condomínio (1 a 4 semanas), mobilização (até 5 dias úteis) e obra de 60 a 75 dias úteis (12 a 15 semanas); entrega entre a 14ª e a 20ª semana após as chaves. Contratando só depois das chaves, o projeto entra na fila depois da entrega e o imóvel fica pronto entre a 20ª e a 28ª semana.</title><rect width="720" height="400" fill="#FFFFFF"/><text x="16" y="26" font-size="16" fill="#1F2937" text-anchor="start" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Contratar antes das chaves adianta a entrega em 6 a 8 semanas</text><text x="16" y="46" font-size="12" fill="#6B7280" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Semanas em relação à entrega das chaves (semana 0); premissas da Bewild, não promessa</text><text x="16" y="106" font-size="12" fill="#1F2937" text-anchor="start" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Contrato antes das chaves</text><rect x="178" y="80" width="12" height="36" fill="#6B7280" rx="3"/><rect x="190" y="80" width="85" height="36" fill="#0F4C5C" rx="3"/><text x="233" y="102" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Projeto</text><rect x="287" y="80" width="36" height="36" fill="#7FA9B3" rx="3"/><rect x="324" y="80" width="12" height="36" fill="#6B7280" rx="3"/><rect x="336" y="80" width="170" height="36" fill="#E8702A" rx="3"/><text x="421" y="102" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Obra: 60–75 dias úteis</text><text x="510" y="102" font-size="12" fill="#1F2937" text-anchor="start" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">pronto: sem. 18</text><text x="16" y="216" font-size="12" fill="#1F2937" text-anchor="start" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Contrato depois das chaves</text><rect x="287" y="190" width="12" height="36" fill="#6B7280" rx="3"/><rect x="300" y="190" width="85" height="36" fill="#0F4C5C" rx="3"/><text x="342" y="212" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Projeto</text><rect x="384" y="190" width="36" height="36" fill="#7FA9B3" rx="3"/><rect x="421" y="190" width="12" height="36" fill="#6B7280" rx="3"/><rect x="433" y="190" width="170" height="36" fill="#E8702A" rx="3"/><text x="518" y="212" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Obra: 60–75 dias úteis</text><text x="607" y="212" font-size="12" fill="#1F2937" text-anchor="start" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">pronto: sem. 26</text><line x1="190" y1="70" x2="190" y2="270" stroke="#E5E7EB"/><text x="190" y="284" font-size="12" fill="#6B7280" text-anchor="middle" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">-8</text><line x1="239" y1="70" x2="239" y2="270" stroke="#E5E7EB"/><text x="239" y="284" font-size="12" fill="#6B7280" text-anchor="middle" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">-4</text><line x1="287" y1="70" x2="287" y2="270" stroke="#E5E7EB"/><text x="287" y="284" font-size="12" fill="#6B7280" text-anchor="middle" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">chaves</text><line x1="336" y1="70" x2="336" y2="270" stroke="#E5E7EB"/><text x="336" y="284" font-size="12" fill="#6B7280" text-anchor="middle" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">+4</text><line x1="384" y1="70" x2="384" y2="270" stroke="#E5E7EB"/><text x="384" y="284" font-size="12" fill="#6B7280" text-anchor="middle" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">+8</text><line x1="433" y1="70" x2="433" y2="270" stroke="#E5E7EB"/><text x="433" y="284" font-size="12" fill="#6B7280" text-anchor="middle" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">+12</text><line x1="482" y1="70" x2="482" y2="270" stroke="#E5E7EB"/><text x="482" y="284" font-size="12" fill="#6B7280" text-anchor="middle" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">+16</text><line x1="530" y1="70" x2="530" y2="270" stroke="#E5E7EB"/><text x="530" y="284" font-size="12" fill="#6B7280" text-anchor="middle" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">+20</text><line x1="579" y1="70" x2="579" y2="270" stroke="#E5E7EB"/><text x="579" y="284" font-size="12" fill="#6B7280" text-anchor="middle" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">+24</text><line x1="627" y1="70" x2="627" y2="270" stroke="#E5E7EB"/><text x="627" y="284" font-size="12" fill="#6B7280" text-anchor="middle" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">+28</text><line x1="676" y1="70" x2="676" y2="270" stroke="#E5E7EB"/><text x="676" y="284" font-size="12" fill="#6B7280" text-anchor="middle" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">+32</text><line x1="287" y1="66" x2="287" y2="270" stroke="#E8702A" stroke-width="2" stroke-dasharray="4 3"/><text x="16" y="370" font-size="12" fill="#1F2937" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Obra em dias úteis (60 até 30 m²; até 75 em plantas maiores), contada após condomínio, chaves e energia liberados.</text><text x="16" y="390" font-size="12" fill="#6B7280" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Fonte: contrato e processo da Bewild (out/2026); duração do projeto e do condomínio variam com o cliente e o prédio.</text></svg>