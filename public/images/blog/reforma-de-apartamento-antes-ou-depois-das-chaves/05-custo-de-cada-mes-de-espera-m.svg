<svg xmlns="http://www.w3.org/2000/svg" width="420" height="320" viewBox="0 0 420 320" role="img" aria-labelledby="t"><title id="t">O que cada mês de espera custa, cenário ilustrativo para um apartamento de 28 m² e contrato mediano de R$ 72.204: aluguel não recebido de R$ 1.842 a R$ 2.552 por mês (FipeZap locação set/2026 e QuintoAndar jul/2026); reajuste de custo de obra de cerca de R$ 397 por mês pelo INCC-M (6,60% em 12 meses, FGV set/2026); ou R$ 276 por mês pelo IPCA (4,58% em 12 meses, IBGE set/2026).</title><rect width="420" height="320" fill="#FFFFFF"/><text x="16" y="26" font-size="13" fill="#1F2937" text-anchor="start" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Mês parado: aluguel pesa mais que reajuste</text><text x="16" y="46" font-size="12" fill="#6B7280" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Cenário: 28 m², contrato R$ 72.204</text><text x="16" y="70" font-size="12" fill="#1F2937" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Aluguel que não entra (28 m²)</text><rect x="16" y="76" width="154" height="34" fill="#E8702A" rx="3"/><rect x="170" y="76" width="59" height="34" fill="#E8702A" opacity="0.35" rx="3"/><text x="237" y="98" font-size="12" fill="#1F2937" text-anchor="start" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">R$ 1.842 a R$ 2.552/mês</text><text x="16" y="150" font-size="12" fill="#1F2937" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Reajuste da obra pelo INCC-M</text><rect x="16" y="156" width="33" height="34" fill="#0F4C5C" rx="3"/><text x="57" y="178" font-size="12" fill="#1F2937" text-anchor="start" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">R$ 397/mês</text><text x="16" y="230" font-size="12" fill="#1F2937" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Reajuste pelo IPCA</text><rect x="16" y="236" width="23" height="34" fill="#7FA9B3" rx="3"/><text x="47" y="258" font-size="12" fill="#1F2937" text-anchor="start" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">R$ 276/mês</text><text x="16" y="290" font-size="12" fill="#1F2937" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Para morar: é o aluguel que você continua pagando.</text><text x="16" y="310" font-size="12" fill="#6B7280" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Fonte: Bewild; FipeZap; QuintoAndar; FGV; IBGE.</text></svg>