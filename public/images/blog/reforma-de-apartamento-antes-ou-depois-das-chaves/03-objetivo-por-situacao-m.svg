<svg xmlns="http://www.w3.org/2000/svg" width="420" height="360" viewBox="0 0 420 360" role="img" aria-labelledby="t"><title id="t">Objetivo da reforma por situação das chaves nos pedidos à Bewild (8/9 a 29/10/2026): ainda não recebeu as chaves — 75% morar, 12% short stay, 8% locação, 5% uso misto (40); já recebeu — 52% morar, 21% short stay, 14% locação, 10% misto, 3% outros (29); está comprando — 80% morar, 7% locação, 13% misto (15).</title><rect width="420" height="360" fill="#FFFFFF"/><text x="16" y="26" font-size="13" fill="#1F2937" text-anchor="start" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Morar: 3 de 4 pedidos antes das chaves</text><text x="16" y="46" font-size="12" fill="#6B7280" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Objetivo por situação (84 pedidos)</text><text x="16" y="95" font-size="12" fill="#1F2937" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Ainda não recebi</text><rect x="126" y="70" width="198" height="40" fill="#0F4C5C"/><text x="225" y="95" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">75%</text><rect x="324" y="70" width="33" height="40" fill="#E8702A"/><text x="340" y="95" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">12%</text><rect x="357" y="70" width="20" height="40" fill="#7FA9B3"/><rect x="377" y="70" width="13" height="40" fill="#6B7280"/><text x="396" y="95" font-size="12" fill="#6B7280" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">40</text><text x="16" y="153" font-size="12" fill="#1F2937" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Já recebi</text><rect x="126" y="128" width="137" height="40" fill="#0F4C5C"/><text x="194" y="153" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">52%</text><rect x="263" y="128" width="55" height="40" fill="#E8702A"/><text x="290" y="153" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">21%</text><rect x="317" y="128" width="36" height="40" fill="#7FA9B3"/><text x="335" y="153" font-size="12" fill="#1F2937" text-anchor="middle" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">14%</text><rect x="354" y="128" width="27" height="40" fill="#6B7280"/><rect x="381" y="128" width="9" height="40" fill="#E5E7EB"/><text x="396" y="153" font-size="12" fill="#6B7280" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">29</text><text x="16" y="211" font-size="12" fill="#1F2937" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Estou comprando</text><rect x="126" y="186" width="211" height="40" fill="#0F4C5C"/><text x="232" y="211" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">80%</text><rect x="337" y="186" width="18" height="40" fill="#7FA9B3"/><rect x="355" y="186" width="35" height="40" fill="#6B7280"/><text x="372" y="211" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">13%</text><text x="396" y="211" font-size="12" fill="#6B7280" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">15</text><rect x="16" y="250" width="12" height="12" fill="#0F4C5C"/><