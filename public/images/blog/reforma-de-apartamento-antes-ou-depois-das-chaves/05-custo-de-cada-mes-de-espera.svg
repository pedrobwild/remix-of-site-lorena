<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320" role="img" aria-labelledby="t"><title id="t">O que cada mês de espera custa, cenário ilustrativo para um apartamento de 28 m² e contrato mediano de R$ 72.204: aluguel não recebido de R$ 1.842 a R$ 2.552 por mês (FipeZap locação set/2026 e QuintoAndar jul/2026); reajuste de custo de obra de cerca de R$ 397 por mês pelo INCC-M (6,60% em 12 meses, FGV set/2026); ou R$ 276 por mês pelo IPCA (4,58% em 12 meses, IBGE set/2026).</title><rect width="720" height="320" fill="#FFFFFF"/><text x="16" y="26" font-size="16" fill="#1F2937" text-anchor="start" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Cada mês parado custa mais em aluguel do que em reajuste de obra</text><text x="16" y="46" font-size="12" fill="#6B7280" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Custo mensal ilustrativo, apartamento de 28 m², contrato mediano de R$ 72.204</text><text x="16" y="92" font-size="12" fill="#1F2937" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Aluguel que não entra (28 m²)</text><rect x="246" y="70" width="213" height="34" fill="#E8702A" rx="3"/><rect x="459" y="70" width="82" height="34" fill="#E8702A" opacity="0.35" rx="3"/><text x="549" y="92" font-size="12" fill="#1F2937" text-anchor="start" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">R$ 1.842 a R$ 2.552/mês</text><text x="16" y="154" font-size="12" fill="#1F2937" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Reajuste da obra pelo INCC-M</text><rect x="246" y="132" width="46" height="34" fill="#0F4C5C" rx="3"/><text x="300" y="154" font-size="12" fill="#1F2937" text-anchor="start" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">R$ 397/mês</text><text x="16" y="216" font-size="12" fill="#1F2937" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Reajuste pelo IPCA</text><rect x="246" y="194" width="32" height="34" fill="#7FA9B3" rx="3"/><text x="286" y="216" font-size="12" fill="#1F2937" text-anchor="start" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">R$ 276/mês</text><text x="16" y="290" font-size="12" fill="#1F2937" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Para quem vai morar, troque o aluguel não recebido pelo aluguel que continua pagando.</text><text x="16" y="310" font-size="12" fill="#6B7280" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Fonte: contratos Bewild (198); FipeZap set/2026; QuintoAndar jul/2026; FGV INCC-M set/2026; IBGE IPCA set/2026.</text></svg>