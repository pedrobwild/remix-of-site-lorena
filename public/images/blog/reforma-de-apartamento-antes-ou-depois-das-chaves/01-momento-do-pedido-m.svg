<svg xmlns="http://www.w3.org/2000/svg" width="420" height="300" viewBox="0 0 420 300" role="img" aria-labelledby="t"><title id="t">Em que momento as pessoas pedem orçamento de reforma de apartamento: dos 84 pedidos feitos à Bewild entre 8 de setembro e 29 de outubro de 2026 que informaram a situação das chaves, 40 (48%) ainda não tinham recebido as chaves, 29 (35%) já tinham recebido e 15 (18%) ainda estavam comprando o imóvel.</title><rect width="420" height="300" fill="#FFFFFF"/><text x="16" y="26" font-size="13" fill="#1F2937" text-anchor="start" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Metade pede orçamento antes das chaves</text><text x="16" y="46" font-size="12" fill="#6B7280" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">84 pedidos à Bewild (8/9–29/10/2026)</text><text x="16" y="95" font-size="12" fill="#1F2937" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Ainda não recebi</text><rect x="136" y="70" width="155" height="40" fill="#E8702A" rx="4"/><text x="299" y="95" font-size="14" fill="#1F2937" text-anchor="start" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">48%  (40)</text><text x="16" y="153" font-size="12" fill="#1F2937" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Já recebi</text><rect x="136" y="128" width="113" height="40" fill="#0F4C5C" rx="4"/><text x="257" y="153" font-size="14" fill="#1F2937" text-anchor="start" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">35%  (29)</text><text x="16" y="211" font-size="12" fill="#1F2937" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Estou comprando</text><rect x="136" y="186" width="58" height="40" fill="#0F4C5C" rx="4"/><text x="202" y="211" font-size="14" fill="#1F2937" text-anchor="start" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">18%  (15)</text><text x="16" y="270" font-size="12" fill="#1F2937" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">31 pedidos não informaram.</text><text x="16" y="290" font-size="12" fill="#6B7280" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Fonte: formulário bewild.com.br, 8/9–29/10/2026.</text></svg>