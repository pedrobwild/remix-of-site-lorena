<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" role="img" aria-labelledby="t"><title id="t">Objetivo da reforma por situação das chaves nos pedidos à Bewild (8/9 a 29/10/2026): ainda não recebeu as chaves — 75% morar, 12% short stay, 8% locação, 5% uso misto (40); já recebeu — 52% morar, 21% short stay, 14% locação, 10% misto, 3% outros (29); está comprando — 80% morar, 7% locação, 13% misto (15).</title><rect width="720" height="330" fill="#FFFFFF"/><text x="16" y="26" font-size="16" fill="#1F2937" text-anchor="start" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Morar é o objetivo em 3 de cada 4 pedidos antes das chaves</text><text x="16" y="46" font-size="12" fill="#6B7280" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Objetivo declarado por situação das chaves (84 pedidos)</text><text x="16" y="95" font-size="12" fill="#1F2937" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Ainda não recebi</text><rect x="166" y="70" width="393" height="40" fill="#0F4C5C"/><text x="362" y="95" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">75%</text><rect x="559" y="70" width="66" height="40" fill="#E8702A"/><text x="592" y="95" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">12%</text><rect x="624" y="70" width="39" height="40" fill="#7FA9B3"/><rect x="664" y="70" width="26" height="40" fill="#6B7280"/><text x="696" y="95" font-size="12" fill="#6B7280" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">40</text><text x="16" y="153" font-size="12" fill="#1F2937" text-anchor="start" font-weight="normal" font-famil