<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 592" width="720" height="710" role="img" aria-labelledby="t d"><title id="t">Quanto reservar para a reforma completa, por metragem</title><desc id="d">Até 21 m²: mediana R$ 66.937, metade central de R$ 59.984 a R$ 73.939 (65 orçamentos); 21 a 25 m²: mediana R$ 69.491, metade central de R$ 63.447 a R$ 76.769 (194 orçamentos); 25 a 30 m²: mediana R$ 73.258, metade central de R$ 65.690 a R$ 83.315 (172 orçamentos); 30 a 35 m²: mediana R$ 89.402, metade central de R$ 78.984 a R$ 104.144 (72 orçamentos); 35 a 45 m²: mediana R$ 101.021, metade central de R$ 89.046 a R$ 118.329 (82 orçamentos).</desc><style>.s{font-family:Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif}.m{font-family:'JetBrains Mono', Menlo, Consolas, monospace}</style><rect width="600" height="592" fill="#FFFFFF"/><text x="32" y="44" class="m" font-size="13" font-weight="700" fill="#11355B" letter-spacing="1.5">QUANTO RESERVAR</text><text x="32" y="78" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">Quanto reservar para a reforma</text><text x="32" y="108" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">completa, por metragem</text><text x="32" y="140" class="s" font-size="15" fill="#5A6472">Mediana (ponto) e metade central (barra) do orçamento de</text><text x="32" y="161" class="s" font-size="15" fill="#5A6472">reforma completa em cada faixa.</text><text x="32" y="196" class="s" font-size="14.5" font-weight="600" fill="#1A2332">Até 21 m²</text><text x="568" y="196" class="m" font-size="12" fill="#5A6472" text-anchor="end">65 orçamentos</text><rect x="32.0" y="208.0" width="536.0" height="8.0" rx="4" fill="#F6F3EE"/><rect x="158.0" y="208.0" width="88.0" height="8.0" rx="4" fill="#2F6FA8"/><circle cx="201.9" cy="212.0" r="7" fill="#11355B" fill-opacity="1.0"/><text x="201.862" y="238" class="s" font-size="14" font-weight="700" fill="#1A2332" text-anchor="middle">R$ 66.937</text><text x="568" y="238" class="m" font-size="11.5" fill="#5A6472" text-anchor="end">R$ 59.984 a R$ 73.939</text><text x="32" y="268" class="s" font-size="14.5" font-weight="600" fill="#1A2332">21 a 25 m²</text><text x="568" y="268" class="m" font-size="12" fill="#5A6472" text-anchor="end">194 orçamentos</text><rect x="32.0" y="280.0" width="536.0" height="8.0" rx="4" fill="#F6F3EE"/><rect x="179.9" y="280.0" width="84.0" height="8.0" rx="4" fill="#2F6FA8"/><circle cx="218.0" cy="284.0" r="7" fill="#11355B" fill-opacity="1.0"/><text x="217.967" y="310" class="s" font-size="14" font-weight="700" fill="#1A2332" text-anchor="middle">R$ 69.491</text><text x="568" y="310" class="m" font-size="11.5" fill="#5A6472" text-anchor="end">R$ 63.447 a R$ 76.769</text><text x="32" y="340" class="s" font-size="14.5" font-weight="600" fill="#1A2332">25 a 30 m²</text><text x="568" y="340" class="m" font-size="12" fill="#5A6472" text-anchor="end">172 orçamentos</text><rect x="32.0" y="352.0" width="536.0" height="8.0" rx="4" fill="#F6F3EE"/><rect x="194.0" y="352.0" width="111.1" height="8.0" rx="4" fill="#2F6FA8"/><circle cx="241.7" cy="356.0" r="7" fill="#11355B" fill-opacity="1.0"/><text x="241.721" y="382" class="s" font-size="14" font-weight="700" fill="#1A2332" text-anchor="middle">R$ 73.258</text><text x="568" y="382" class="m" font-size="11.5" fill="#5A6472" text-anchor="end">R$ 65.690 a R$ 83.315</text><text x="32" y="412" class="s" font-size="14.5" font-weight="600" fill="#1A2332">30 a 35 m²</text><text x="568" y="412" class="m" font-size="12" fill="#5A6472" text-anchor="end">72 orçamentos</text><rect x="32.0" y="424.0" width="536.0" height="8.0" rx="4" fill="#F6F3EE"/><rect x="277.8" y="424.0" width="158.7" height="8.0" rx="4" fill="#2F6FA8"/><circle cx="343.5" cy="428.0" r="7" fill="#11355B" fill-opacity="1.0"/><text x="343.523" y="454" class="s" font-size="14" font-weight="700" fill="#1A2332" text-anchor="middle">R$ 89.402</text><text x="568" y="454" class="m" font-size="11.5" fill="#5A6472" text-anchor="end">R$ 78.984 a R$ 104.144</text><text x="32" y="484" class="s" font-size="14.5" font-weight="600" fill="#1A2332">35 a 45 m²</text><text x="568" y="484" class="m" font-size="12" fill="#5A6472" text-anchor="end">82 orçamentos</text><rect x="32.0" y="496.0" width="536.0" height="8.0" rx="4" fill="#F6F3EE"/><rect x="341.3" y="496.0" width="184.7" height="8.0" rx="4" fill="#2F6FA8"/><circle cx="416.8" cy="500.0" r="7" fill="#11355B" fill-opacity="1.0"/><text x="416.791" y="526" class="s" font-size="14" font-weight="700" fill="#1A2332" text-anchor="middle">R$ 101.021</text><text x="32" y="526" class="m" font-size="11.5" fill="#5A6472">R$ 89.046 a R$ 118.329</text><line x1="32.0" y1="548.0" x2="568.0" y2="548.0" stroke="#E7E2D9" stroke-width="1"/><text x="32" y="570" class="m" font-size="13" fill="#5A6472">Fonte: Índice Bewild, nov/2026, 585 orçamentos</text><text x="568" y="570" class="m" font-size="13" font-weight="700" fill="#11355B" text-anchor="end">bewild.com.br</text></svg>
