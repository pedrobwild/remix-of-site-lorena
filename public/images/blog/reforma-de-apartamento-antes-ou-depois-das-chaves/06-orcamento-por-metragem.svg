<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="t"><title id="t">Valor da reforma completa por faixa de metragem em 196 contratos Bewild (planilha de 27/9/2026): até 21 m² mediana R$ 75.000 (n=27); 21–25 m² R$ 65.000 (n=31); 25–30 m² R$ 71.432 (n=102); 30–35 m² R$ 89.234 (n=13); 35–45 m² R$ 108.731 (n=23). Barras mostram a metade central (Q1–Q3). Reta ajustada: R$ 17.055 + R$ 2.245 por m².</title><rect width="720" height="360" fill="#FFFFFF"/><text x="16" y="26" font-size="16" fill="#1F2937" text-anchor="start" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Quanto reservar: o contrato mediano por metragem</text><text x="16" y="46" font-size="12" fill="#6B7280" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Mediana e metade central (Q1–Q3) do valor do contrato, 196 contratos (2 acima de 45 m² omitidos)</text><line x1="66" y1="270" x2="700" y2="270" stroke="#E5E7EB"/><text x="60" y="274" font-size="12" fill="#6B7280" text-anchor="end" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">0 mil</text><line x1="66" y1="220" x2="700" y2="220" stroke="#E5E7EB"/><text x="60" y="224" font-size="12" fill="#6B7280" text-anchor="end" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">35 mil</text><line x1="66" y1="170" x2="700" y2="170" stroke="#E5E7EB"/><text x="60" y="174" font-size="12" fill="#6B7280" text-anchor="end" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">70 mil</text><line x1="66" y1="120" x2="700" y2="120" stroke="#E5E7EB"/><text x="60" y="124" font-size="12" fill="#6B7280" text-anchor="end" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">105 mil</text><line x1="66" y1="70" x2="700" y2="70" stroke="#E5E7EB"/><text