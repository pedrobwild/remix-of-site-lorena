<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 0 380 751" width="380" height="751" role="img" aria-labelledby="t d"><title id="t">Quanto reservar para a reforma completa, por metragem</title><desc id="d">Até 21 m²: mediana R$ 66.937, metade central de R$ 59.984 a R$ 73.939 (65 orçamentos); 21 a 25 m²: mediana R$ 69.491, metade central de R$ 63.447 a R$ 76.769 (194 orçamentos); 25 a 30 m²: mediana R$ 73.258, metade central de R$ 65.690 a R$ 83.315 (172 orçamentos); 30 a 35 m²: mediana R$ 89.402, metade central de R$ 78.984 a R$ 104.144 (72 orçamentos); 35 a 45 m²: mediana R$ 101.021, metade central de R$ 89.046 a R$ 118.329 (82 orçamentos).</desc><style>.s{font-family:Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif}.m{font-family:'JetBrains Mono', Menlo, Consolas, monospace}</style><rect width="420" height="751" fill="#FFFFFF"/><text x="32" y="44" class="m" font-size="13" font-weight="700" fill="#11355B" letter-spacing="1.5">QUANTO RESERVAR</text><text x="32" y="78" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">Quanto reservar para a</text><text x="32" y="108" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">reforma completa, por</text><text x="32" y="138" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">metragem</text><text x="32" y="170" class="s" font-size="15" fill="#5A6472">Mediana (ponto) e metade central (barra)</text><text x="32" y="191" class="s" font-size="15" fill="#5A6472">do orçamento de reforma completa em cada</text><text x="32" y="212" class="s" font-size="15" fill="#5A6472">faixa.</text><text x="32" y="247" class="s" font-size="14.5" font-weight="600" fill="#1A2332">Até 21 m²</text><text x="388" y="247" class="m" font-size="13" fill="#5A6472" text-anchor="end">65 orçamentos</text><rect x="32.0" y="259.0" width="356.0" height="8.0" rx="4" fill="#F6F3EE"/><rect x="115.7" y="259.0" width="58.4" height="8.0" rx="4" fill="#2F6FA8"/><circle cx="144.