<svg xmlns="http://www.w3.org/2000/svg" width="420" height="430" viewBox="0 0 420 430" role="img" aria-labelledby="t"><title id="t">Linha do tempo da reforma de apartamento em semanas, premissas da Bewild: contratando 8 semanas antes das chaves, o projeto 3D e o executivo (4 a 8 semanas) ficam prontos antes da entrega; depois das chaves vêm liberação do condomínio (1 a 4 semanas), mobilização (até 5 dias úteis) e obra de 60 a 75 dias úteis (12 a 15 semanas); entrega entre a 14ª e a 20ª semana após as chaves. Contratando só depois das chaves, o projeto entra na fila depois da entrega e o imóvel fica pronto entre a 20ª e a 28ª semana.</title><rect width="420" height="430" fill="#FFFFFF"/><text x="16" y="26" font-size="13" fill="#1F2937" text-anchor="start" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Antes das chaves: entrega 6 a 8 semanas antes</text><text x="16" y="46" font-size="12" fill="#6B7280" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Semanas em relação às chaves (semana 0)</text><text x="16" y="82" font-size="12" fill="#1F2937" text-anchor="start" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Contrato antes das chaves</text><rect x="25" y="90" width="9" height="36" fill="#6B7280" rx="3"/><rect x="33" y="90" width="61" height="36" fill="#0F4C5C" rx="3"/><text x="64" y="112" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Projeto</text><rect x="103" y="90" width="26" height="36" fill="#7FA9B3" rx="3"/><rect x="129" y="90" width="9" height="36" fill="#6B7280" rx="3"/><rect x="138" y="90" width="122" height="36" fill="#E8702A" rx="3"/><text x="199" y="112" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Obra</text><text x="258" y="142" font-size="12" fill="#1F2937" text-anchor="end" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">pronto: sem. 18</text><text x="16" y="232" font-size="12" fill="#1F2937" text-anchor="start" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Contrato depois das chaves</text><rect x="103" y="240" width="9" height="36" fill="#6B7280" rx="3"/><rect x="112" y="240" width="61" height="36" fill="#0F4C5C" rx="3"/><text x="143" y="262" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Projeto</text><rect x="173" y="240" width="26" height="36" fill="#7FA9B3" rx="3"/><rect x="199" y="240" width="9" height="36" fill="#6B7280" rx="3"/><rect x="208" y="240" width="122" height="36" fill="#E8702A" rx="3"/><text x="269" y="262" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Obra</text><text x="328" y="292" font-size="12" fill="#1F2937" text-anchor="end" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">pronto: sem. 26</text><line x1="33" y1="80" x2="33" y2="340" stroke="#E5E7EB"/><text x="33" y="354" font-size="12" fill="#6B7280" text-anchor="middle" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">-8</text><line x1="68" y1="80" x2="68" y2="340" stroke="#E5E7EB"/><text x="68" y="354" font-size="12" fill="#6B7280" text-anchor="middle" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">-4</text><line x1="103" y1="80" x2="103" y2="340" stroke="#E5E7EB"/><text x="103" y="354" font-size="12" fill="#6B7280" text-anchor="middle" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">chaves</text><line x1="138" y1="80" x2="138" y2="340" stroke="#E5E7EB"/><text x="138" y="354" font-size="12" fill="#6B7280" text-anchor="middle" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">+4</text><line x1="173" y1="80" x2="173" y2="340" stroke="#E5E7EB"/><text x="173" y="354" font-size="12" fill="#6B7280" text-anchor="middle" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">+8</text><line x1="208" y1="80" x2="208" y2="340" stroke="#E5E7EB"/><text x="208" y="354" font-size="12" fill="#6B7280" text-anchor="middle" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">+12</text><line x1="243" y1="80" x2="243" y2="340" stroke="#E5E7EB"/><text x="243" y="354" font-size="12" fill="#6B7280" text-anchor="middle" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">+16</text><line x1="278" y1="80" x2="278" y2="340" stroke="#E5E7EB"/><text x="278" y="354" font-size="12" fill="#6B7280" text-anchor="middle" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">+20</text><line x1="313" y1="80" x2="313" y2="340" stroke="#E5E7EB"/><text x="313" y="354" font-size="12" fill="#6B7280" text-anchor="middle" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">+24</text><line x1="348" y1="80" x2="348" y2="340" stroke="#E5E7EB"/><text x="348" y="354" font-size="12" fill="#6B7280" text-anchor="middle" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">+28</text><line x1="383" y1="80" x2="383" y2="340" stroke="#E5E7EB"/><text x="383" y="354" font-size="12" fill="#6B7280" text-anchor="middle" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">+32</text><line x1="103" y1="76" x2="103" y2="340" stroke="#E8702A" stroke-width="2" stroke-dasharray="4 3"/><text x="16" y="400" font-size="12" fill="#1F2937" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Obra em dias úteis, contada após condomínio, chaves e energia.</text><text x="16" y="420" font-size="12" fill="#6B7280" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Fonte: processo Bewild (out/2026); prazos variam.</text></svg>