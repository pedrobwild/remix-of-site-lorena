r="middle" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Estou comprando</text><text x="592" y="294" font-size="12" fill="#6B7280" text-anchor="middle" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">n = 15 · 40% acima de 50 m²</text><text x="16" y="330" font-size="12" fill="#1F2937" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Eixo em m². A caixa é a metade central dos pedidos; o traço, a mediana.</text><text x="16" y="350" font-size="12" fill="#6B7280" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Fonte: formulário de orçamento bewild.com.br, 8/9 a 29/10/2026 (2 pedidos sem m² válido excluídos).</text></svg>