<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="t"><title id="t">Metragem do apartamento por situação das chaves nos pedidos de orçamento à Bewild (8/9 a 29/10/2026): quem ainda não recebeu as chaves pede para 34,5 m² (mediana; metade central de 28 a 43 m²; 18% acima de 50 m²); quem já recebeu, 31 m² (25 a 54 m²; 28% acima de 50 m²); quem está comprando, 42 m² (36 a 72 m²; 40% acima de 50 m²).</title><rect width="720" height="360" fill="#FFFFFF"/><text x="16" y="26" font-size="16" fill="#1F2937" text-anchor="start" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Quem ainda está comprando pede reforma de apartamento maior</text><text x="16" y="46" font-size="12" fill="#6B7280" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Metragem mediana e metade central (Q1–Q3) por situação das chaves, 82 pedidos com m²</text><line x1="50" y1="260" x2="700" y2="260" stroke="#E5E7EB"/><text x="44" y="264" font-size="12" fill="#6B7280" text-anchor="end" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">0</text><line x1="50" y1="212" x2="700" y2="212" stroke="#E5E7EB"/><text x="44" y="216" font-size="12" fill="#6B7280" text-anchor="end" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">20</text><line x1="50" y1="165" x2="700" y2="165" stroke="#E5E7EB"/><text x="44" y="169" font-size="12" fill="#6B7280" text-anchor="end" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">40</text><line x1="50" y1="118" x2="700" y2="118" stroke="#E5E7EB"/><text x="44" y="122" font-size="12" fill="#6B7280" text-anchor="end" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">60</text><line x1="50" y1="70" x2="700" y2="70" stroke="#E5E7EB"/><text x="44" y="74"