<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 0 380 457" width="380" height="457" role="img" aria-labelledby="t d"><title id="t">Custo ilustrativo de cada mês de espera para um apartamento de 26 m² e orçamento mediano de R$ 74.132</title><desc id="d">Aluguel que não entra: de R$ 1.710 a R$ 2.370 por mês (FipeZap locação set/2026 e QuintoAndar jul/2026); reajuste da obra pelo INCC-M: R$ 408 por mês (6,60% em 12 meses); reajuste pelo IPCA: R$ 283 por mês (4,58% em 12 meses).</desc><style>.s{font-family:Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif}.m{font-family:'JetBrains Mono', Menlo, Consolas, monospace}</style><rect width="420" height="457" fill="#FFFFFF"/><text x="32" y="44" class="m" font-size="13" font-weight="700" fill="#11355B" letter-spacing="1.5">CUSTO DE ESPERAR</text><text x="32" y="78" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">O imóvel parado custa de</text><text x="32" y="108" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">4 a 6 vezes o reajuste da</text><text x="32" y="138" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">obra</text><text x="32" y="170" class="s" font-size="15" fill="#5A6472">Cenário ilustrativo por mês, para 26 m²</text><text x="32" y="191" class="s" font-size="15" fill="#5A6472">e orçamento mediano de R$ 74.132. Não é</text><text x="32" y="212" class="s" font-size="15" fill="#5A6472">previsão.</text><text x="32" y="247" class="s" font-size="14.5" font-weight="600" fill="#1A2332">Aluguel que não entra, 26 m²</text><text x="388" y="247" class="m" font-size="13" fill="#5A6472" text-anchor="end">R$ 65,78 a 91,14/m²</text><rect x="32.0" y="255.0" width="148.6" height="16.0" rx="4" fill="#2F6FA8"/><rect x="180.6" y="255.0" width="57.4" height="16.0" rx="4" fill="#9DBAD6"/><text x="246.008" y="268" class="s" font-size="13.5" font-weight="700" fill="#1A2332">R$ 1.710 a R$ 2.370</text><text x="32" y="301" class="s" font-size="14.5" font-weight="600" fill="#1A2332">Reajuste da obra pelo INCC-M</text><text x="388" y="301" class="m" font-size="13" fill="#5A6472" text-anchor="end">6,60% em 12 meses</text><rect x="32.0" y="309.0" width="35.5" height="16.0" rx="4" fill="#D07A3E"/><text x="75.4646" y="322" class="s" font-size="14" font-weight="700" fill="#1A2332">R$ 408</text><text x="32" y="355" class="s" font-size="14.5" font-weight="600" fill="#1A2332">Reajuste da obra pelo IPCA</text><text x="388" y="355" class="m" font-size="13" fill="#5A6472" text-anchor="end">4,58% em 12 meses</text><rect x="32.0" y="363.0" width="24.6" height="16.0" rx="4" fill="#D07A3E"/><text x="64.5992" y="376" class="s" font-size="14" font-weight="700" fill="#1A2332">R$ 283</text><line x1="32.0" y1="395.0" x2="388.0" y2="395.0" stroke="#E7E2D9" stroke-width="1"/><text x="32" y="417" class="m" font-size="12" fill="#5A6472">Fontes: Índice Bewild; FipeZap; FGV; IBGE</text><text x="32" y="437" class="m" font-size="13" font-weight="700" fill="#11355B">bewild.com.br</text></svg>
