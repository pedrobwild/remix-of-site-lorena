<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" role="img" aria-labelledby="t"><title id="t">Pedidos para morar: 52 com metragem (10 até 29 m², 22 de 30 a 44 m², 20 de 45 m² ou mais) e 43 com situação das chaves (21 ainda não receberam, 12 comprando, 10 já têm)</title><rect width="720" height="330" fill="#FFFFFF"/><text x="16" y="26" font-size="16" fill="#1F2937" text-anchor="start" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Quem quer morar: metragem e situação das chaves</text><text x="16" y="46" font-size="12" fill="#6B7280" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">55 pedidos com objetivo "morar" (8/9–20/10/2026)</text><text x="16" y="78" font-size="13" fill="#1F2937" text-anchor="start" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Metragem informada (n = 52)</text><text x="16" y="110" font-size="12" fill="#1F2937" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">até 29 m²</text><rect x="166" y="92" width="59" height="26" fill="#E8702A" rx="3"/><text x="231.0909090909091" y="110" font-size="12" fill="#1F2937" text-anchor="start" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">10 (19%)</text><text x="16" y="150" font-size="12" fill="#1F2937" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">30 a 44 m²</text><rect x="166" y="132" width="130" height="26" fill="#E8702A" rx="3"/><text x="302.0" y="150" font-size="12" fill="#1F2937" text-anchor="start" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">22 (42%)</text><text x="16" y="190" font-size="12" fill="#1F2937" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">45 m² ou mais</text><rect x="166" y="172" width="118" height="26" fill="#E8702A" rx="3"/><text x="290.1818181818182" y="190" font-size="12" fill="#1F2937" text-anchor="start" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">20 (38%)</text><text x="380" y="78" font-size="13" fill="#1F2937" text-anchor="start" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Situação das chaves (n = 43)</text><text x="380" y="110" font-size="12" fill="#1F2937" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Ainda sem as chaves</text><rect x="530" y="92" width="120" height="26" fill="#0F4C5C" rx="3"/><text x="656.0" y="110" font-size="12" fill="#1F2937" text-anchor="start" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">21 (49%)</text><text x="380" y="150" font-size="12" fill="#1F2937" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Estou comprando</text><rect x="530" y="132" width="69" height="26" fill="#0F4C5C" rx="3"/><text x="604.5714285714286" y="150" font-size="12" fill="#1F2937" text-anchor="start" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">12 (28%)</text><text x="380" y="190" font-size="12" fill="#1F2937" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Já tenho as chaves</text><rect x="530" y="172" width="57" height="26" fill="#0F4C5C" rx="3"/><text x="593.1428571428571" y="190" font-size="12" fill="#1F2937" text-anchor="start" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">10 (23%)</text><text x="16" y="318" font-size="11" fill="#6B7280" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Fonte: formulário de orçamento bewild.com.br. % sobre quem respondeu.</text></svg>
