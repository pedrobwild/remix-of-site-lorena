<svg xmlns="http://www.w3.org/2000/svg" width="420" height="340" viewBox="0 0 420 340" role="img" aria-labelledby="t"><title id="t">Custo mediano da reforma completa por faixa de metragem em 198 contratos Bewild: até 25 m² R$ 70.139 (n=58); 25–30 m² R$ 71.432 (n=102); 30–35 m² R$ 89.234 (n=13); 35–45 m² R$ 108.731 (n=23). Barras mostram o intervalo entre o 1º e o 3º quartil.</title><rect width="420" height="340" fill="#FFFFFF"/><text x="16" y="26" font-size="14" fill="#1F2937" text-anchor="start" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Quanto custou a reforma completa, por metragem</text><text x="16" y="46" font-size="11" fill="#6B7280" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Mediana e faixa interquartil (Q1–Q3) de 198 contratos Bewild (planilha de 27/9/2026)</text><line x1="70" y1="260" x2="400" y2="260" stroke="#E5E7EB"/><text x="64" y="264.0" font-size="11" fill="#6B7280" text-anchor="end" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">0 mil</text><line x1="70" y1="212" x2="400" y2="212" stroke="#E5E7EB"/><text x="64" y="216.5" font-size="11" fill="#6B7280" text-anchor="end" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">35 mil</text><line x1="70" y1="165" x2="400" y2="165" stroke="#E5E7EB"/><text x="64" y="169.0" font-size="11" fill="#6B7280" text-anchor="end" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">70 mil</text><line x1="70" y1="118" x2="400" y2="118" stroke="#E5E7EB"/><text x="64" y="121.5" font-size="11" fill="#6B7280" text-anchor="end" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">105 mil</text><line x1="70" y1="70" x2="400" y2="70" stroke="#E5E7EB"/><text x="64" y="74.0" font-size="11" fill="#6B7280" text-anchor="end" font-weight="normal" fo