<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" width="720" height="624" role="img" aria-labelledby="t d"><title id="t">De 35 a 45 m², a reforma completa fica em R$ 101 mil na mediana</title><desc id="d">Até 25 m²: mediana R$ 69.347, metade central de R$ 62.466 a R$ 76.049 (259 orçamentos); 25 a 30 m²: mediana R$ 73.258, metade central de R$ 65.690 a R$ 83.315 (172 orçamentos); 30 a 35 m²: mediana R$ 89.402, metade central de R$ 78.984 a R$ 104.144 (72 orçamentos); 35 a 45 m²: mediana R$ 101.021, metade central de R$ 89.046 a R$ 118.329 (82 orçamentos).</desc><style>.s{font-family:Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif}.m{font-family:'JetBrains Mono', Menlo, Consolas, monospace}</style><rect width="600" height="520" fill="#FFFFFF"/><text x="32" y="44" class="m" font-size="13" font-weight="700" fill="#11355B" letter-spacing="1.5">ORÇAMENTO POR METRAGEM</text><text x="32" y="78" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">De 35 a 45 m², a reforma completa</text><text x="32" y="108" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">fica em R$ 101 mil na mediana</text><text x="32" y="140" class="s" font-size="15" fill="#5A6472">Mediana (ponto) e metade central (barra) do orçamento de</text><text x="32" y="161" class="s" font-size="15" fill="#5A6472">reforma completa em cada faixa.</text><text x="32" y="196" class="s" font-size="14.5" font-weight="600" fill="#1A2332">Até 25 m²</text><text x="568" y="196" class="m" font-size="12" fill="#5A6472" text-anchor="end">259 orçamentos</text><rect x="32.0" y="208.0" width="536.0" height="8.0" rx="4" fill="#F6F3EE"/><rect x="173.7" y="208.0" width="85.7" height="8.0" rx="4" fill="#2F6FA8"/><circle cx="217.1" cy="212.0" r="7" fill="#11355B" fill-opacity="1.0"/><text x="217.059" y="238" class="s" font-size="14" font-weight="700" fill="#1A2332" text-anchor="middle">R$ 69.347</text><text x="568" y="238" class="m" font-size="11.5" fill="#5A6