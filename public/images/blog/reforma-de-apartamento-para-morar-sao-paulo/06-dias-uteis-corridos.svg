<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320" role="img" aria-labelledby="t"><title id="t">60 dias úteis de obra equivalem a 86 a 88 dias corridos e 75 dias úteis a 108 a 113 dias corridos, conforme a data de início (3/11/2026, 4/1/2027 ou 1/3/2027), contando feriados nacionais e municipais de São Paulo.</title><rect width="720" height="320" fill="#FFFFFF"/><text x="16" y="26" font-size="16" fill="#1F2937" text-anchor="start" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Dias úteis de obra viram quantos dias no calendário?</text><text x="16" y="46" font-size="12" fill="#6B7280" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">60 e 75 dias úteis a partir de 3 datas de início, com feriados de São Paulo</text><rect x="73" y="115" width="66" height="125" fill="#0F4C5C" rx="3"/><text x="106.0" y="109.33333333333333" font-size="12" fill="#1F2937" text-anchor="middle" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">88 dias</text><text x="106.0" y="232.0" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">60 úteis</text><rect x="145" y="80" width="66" height="160" fill="#E8702A" rx="3"/><text x="178.0" y="73.91666666666666" font-size="12" fill="#1F2937" text-anchor="middle" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">113 dias</text><text x="178.0" y="232.0" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">75 úteis</text><text x="150.0" y="258" font-size="12" fill="#1F2937" text-anchor="middle" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">início em 3/11/2026</text><rect x="293" y="115" width="66" height="125" fill="#0F4C5C" rx="3"/><text x="326.0" y="109.33333333333333" font-size="12" fill="#1F2937" text-anchor="middle" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">88 dias</text><text x="326.0" y="232.0" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">60 úteis</text><rect x="365" y="84" width="66" height="156" fill="#E8702A" rx="3"/><text x="398.0" y="78.16666666666666" font-size="12" fill="#1F2937" text-anchor="middle" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">110 dias</text><text x="398.0" y="232.0" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">75 úteis</text><text x="370.0" y="258" font-size="12" fill="#1F2937" text-anchor="middle" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">início em 4/1/2027</text><rect x="513" y="118" width="66" height="122" fill="#0F4C5C" rx="3"/><text x="546.0" y="112.16666666666667" font-size="12" fill="#1F2937" text-anchor="middle" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">86 dias</text><text x="546.0" y="232.0" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">60 úteis</text><rect x="585" y="87" width="66" height="153" fill="#E8702A" rx="3"/><text x="618.0" y="81.0" font-size="12" fill="#1F2937" text-anchor="middle" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">108 dias</text><text x="618.0" y="232.0" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">75 úteis</text><text x="590.0" y="258" font-size="12" fill="#1F2937" text-anchor="middle" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">início em 1/3/2027</text><text x="16" y="290" font-size="11" fill="#1F2937" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Regra da Bewild: 60 dias úteis até 30 m²; metragens maiores levam mais, com a data em contrato.</text><text x="16" y="310" font-size="10" fill="#6B7280" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Cálculo próprio: dias corridos do 1º ao último dia útil, descontando sábados, domingos e feriados (nacionais + SP).</text></svg>
