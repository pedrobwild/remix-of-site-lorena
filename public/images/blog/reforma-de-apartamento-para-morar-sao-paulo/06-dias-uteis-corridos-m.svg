<svg xmlns="http://www.w3.org/2000/svg" width="420" height="320" viewBox="0 0 420 320" role="img" aria-labelledby="t"><title id="t">60 dias úteis de obra equivalem a 86 a 88 dias corridos e 75 dias úteis a 108 a 113 dias corridos, conforme a data de início (3/11/2026, 4/1/2027 ou 1/3/2027), contando feriados nacionais e municipais de São Paulo.</title><rect width="420" height="320" fill="#FFFFFF"/><text x="16" y="26" font-size="14" fill="#1F2937" text-anchor="start" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Dias úteis de obra viram quantos dias no calendário?</text><text x="16" y="46" font-size="11" fill="#6B7280" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">60 e 75 dias úteis a partir de 3 datas de início, com feriados de São Paulo</text><rect x="58" y="115" width="36" height="125" fill="#0F4C5C" rx="3"/><text x="76.0" y="109.33333333333333" font-size="11" fill="#1F2937" text-anchor="middle" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">88 dias</text><text x="76.0" y="232.0" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">60 úteis</text><rect x="100" y="80" width="36" height="160" fill="#E8702A" rx="3"/><text x="118.0" y="73.91666666666666" font-size="11" fill="#1F2937" text-anchor="middle" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">113 dias</text><text x="118.0" y="232.0" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">75 úteis</text><text x="100.0" y="258" font-size="11" fill="#1F2937" text-anchor="middle" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">início em 3/11/2026</text><rect x="178" y="115" width="36" height="125" fill="#0F4C5C" rx="3"/><text x="196.0" y="109.33333333333333" font-size="11" fill="#1F2937" text-anchor="middle" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">88 dias</text><text x="196.0" y="232.0" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">60 úteis</text><rect x="220" y="84" width="36" height="156" fill="#E8702A" rx="3"/><text x="238.0" y="78.16666666666666" font-size="11" fill="#1F2937" text-anchor="middle" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">110 dias</text><text x="238.0" y="232.0" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">75 úteis</text><text x="220.0" y="258" font-size="11" fill="#1F2937" text-anchor="middle" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">início em 4/1/2027</text><rect x="298" y="118" width="36" height="122" fill="#0F4C5C" rx="3"/><text x="316.0" y="112.16666666666667" font-size="11" fill="#1F2937" text-anchor="middle" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">86 dias</text><text x="316.0" y="232.0" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">60 úteis</text><rect x="340" y="87" width="36" height="153" fill="#E8702A" rx="3"/><text x="358.0" y="81.0" font-size="11" fill="#1F2937" text-anchor="middle" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">108 dias</text><text x="358.0" y="232.0" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">75 úteis</text><text x="340.0" y="258" font-size="11" fill="#1F2937" text-anchor="middle" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">início em 1/3/2027</text><text x="16" y="290" font-size="9.5" fill="#1F2937" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Regra da Bewild: 60 dias úteis até 30 m²; metragens maiores levam mais, com a data em contrato.</text><text x="16" y="310" font-size="9" fill="#6B7280" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Cálculo próprio: dias corridos do 1º ao último dia útil, descontando sábados, domingos e feriados (nacionais + SP).</text></svg>
