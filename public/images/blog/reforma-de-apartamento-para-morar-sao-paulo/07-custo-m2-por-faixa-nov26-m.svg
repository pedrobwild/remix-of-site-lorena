<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 0 380 491" width="380" height="491" role="img" aria-labelledby="t d"><title id="t">Valor por m² da reforma completa por faixa de metragem</title><desc id="d">Até 25 m²: R$ 3.000 por m² (259 orçamentos); 25 a 30 m²: R$ 2.632 por m² (172 orçamentos); 30 a 35 m²: R$ 2.681 por m² (72 orçamentos); 35 a 45 m²: R$ 2.557 por m² (82 orçamentos). Índice Bewild geral: R$ 2.831 por m².</desc><style>.s{font-family:Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif}.m{font-family:'JetBrains Mono', Menlo, Consolas, monospace}</style><rect width="420" height="491" fill="#FFFFFF"/><text x="32" y="44" class="m" font-size="13" font-weight="700" fill="#11355B" letter-spacing="1.5">VALOR POR M²</text><text x="32" y="78" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">O m² cai até 30 m² e</text><text x="32" y="108" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">depois se estabiliza</text><text x="32" y="140" class="s" font-size="15" fill="#5A6472">Mediana do valor por m² em cada faixa.</text><text x="32" y="161" class="s" font-size="15" fill="#5A6472">No Índice Bewild inteiro, a mediana é R$</text><text x="32" y="182" class="s" font-size="15" fill="#5A6472">2.831 por m².</text><text x="32" y="227" class="s" font-size="14.5" font-weight="600" fill="#1A2332">Até 25 m²</text><text x="388" y="227" class="m" font-size="13" fill="#5A6472" text-anchor="end">259 orçamentos</text><rect x="32.0" y="235.0" width="199.5" height="16.0" rx="4" fill="#D07A3E"/><text x="239.535" y="248" class="s" font-size="14" font-weight="700" fill="#1A2332">R$ 3.000/m²</text><text x="32" y="281" class="s" font-size="14.5" font-weight="600" fill="#1A2332">25 a 30 m²</text><text x="388" y="281" class="m" font-size="13" fill="#5A6472" text-anchor="end">172 orçamentos</text><rect x="32.0" y="289.0" width="175.1" height="16.0" rx="4" fill="#2F6FA8"/><text x="215.059" y="302" class="s" font-size="14" font-weight="700" fill="#1A2332">R$ 2.632/m²</text><text x="32" y="335" class="s" font-size="14.5" font-weight="600" fill="#1A2332">30 a 35 m²</text><text x="388" y="335" class="m" font-size="13" fill="#5A6472" text-anchor="end">72 orçamentos</text><rect x="32.0" y="343.0" width="178.3" height="16.0" rx="4" fill="#2F6FA8"/><text x="218.318" y="356" class="s" font-size="14" font-weight="700" fill="#1A2332">R$ 2.681/m²</text><text x="32" y="389" class="s" font-size="14.5" font-weight="600" fill="#1A2332">35 a 45 m²</text><text x="388" y="389" class="m" font-size="13" fill="#5A6472" text-anchor="end">82 orçamentos</text><rect x="32.0" y="397.0" width="170.1" height="16.0" rx="4" fill="#2F6FA8"/><text x="210.07" y="410" class="s" font-size="14" font-weight="700" fill="#1A2332">R$ 2.557/m²</text><line x1="32.0" y1="429.0" x2="388.0" y2="429.0" stroke="#E7E2D9" stroke-width="1"/><text x="32" y="451" class="m" font-size="12" fill="#5A6472">Fonte: Índice Bewild, nov/2026, 585 orçamentos</text><text x="32" y="471" class="m" font-size="13" font-weight="700" fill="#11355B">bewild.com.br</text></svg>
