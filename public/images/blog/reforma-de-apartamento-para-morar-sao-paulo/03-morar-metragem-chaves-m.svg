<svg xmlns="http://www.w3.org/2000/svg" width="420" height="420" viewBox="0 0 420 420" role="img" aria-labelledby="t"><title id="t">Pedidos para morar: 52 com metragem (10 até 29 m², 22 de 30 a 44 m², 20 de 45 m² ou mais) e 43 com situação das chaves (21 ainda não receberam, 12 comprando, 10 já têm)</title><rect width="420" height="420" fill="#FFFFFF"/><text x="16" y="26" font-size="14" fill="#1F2937" text-anchor="start" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Quem quer morar: metragem e situação das chaves</text><text x="16" y="46" font-size="12" fill="#6B7280" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">55 pedidos com objetivo "morar" (8/9–20/10/2026)</text><text x="16" y="78" font-size="13" fill="#1F2937" text-anchor="start" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Metragem informada (n = 52)</text><text x="16" y="110" font-size="12" fill="#1F2937" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">até 29 m²</text><rect x="166" y="92" width="86" height="26" fill="#E8702A" rx="3"/><text x="258.3636363636364" y="110" font-size="12" fill="#1F2937" text-anchor="start" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">10 (19%)</text><text x="16" y="150" font-size="12" fill="#1F2937" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">30 a 44 m²</text><rect x="166" y="132" width="190" height="26" fill="#E8702A" rx="3"/><text x="362.0" y="150" font-size="12" fill="#1F2937" text-anchor="start" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">22 (42%)</text><text x="16" y="190" font-size="12" fill="#1F2937" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">45 m² ou mais</text><rect x="166" y="172" width="173" height="26" fill="#E8702A" rx="3"/><text x="344.72727272727275" y="190" font-size="12" fill="#1F2937" text-anchor="start" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">20 (38%)</text><text x="16" y="250" font-size="13" fill="#1F2937" text-anchor="start" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Situação das chaves (n = 43)</text><text x="16" y="282" font-size="12" fill="#1F2937" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Ainda sem as chaves</text><rect x="166" y="264" width="190" height="26" fill="#0F4C5C" rx="3"/><text x="362.0" y="282" font-size="12" fill="#1F2937" text-anchor="start" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">21 (49%)</text><text x="16" y="322" font-size="12" fill="#1F2937" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Estou comprando</text><rect x="166" y="304" width="109" height="26" fill="#0F4C5C" rx="3"/><text x="280.57142857142856" y="322" font-size="12" fill="#1F2937" text-anchor="start" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">12 (28%)</text><text x="16" y="362" font-size="12" fill="#1F2937" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Já tenho as chaves</text><rect x="166" y="344" width="90" height="26" fill="#0F4C5C" rx="3"/><text x="262.4761904761905" y="362" font-size="12" fill="#1F2937" text-anchor="start" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">10 (23%)</text><text x="16" y="408" font-size="10" fill="#6B7280" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Fonte: formulário de orçamento bewild.com.br. % sobre quem respondeu.</text></svg>
