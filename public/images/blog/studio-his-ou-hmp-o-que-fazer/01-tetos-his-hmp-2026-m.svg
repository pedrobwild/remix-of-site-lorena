<svg xmlns="http://www.w3.org/2000/svg" viewBox="8 0 404 637" width="404" height="637" role="img" aria-labelledby="t d"><title id="t">Tetos de 2026 para HIS e HMP em São Paulo: aluguel máximo e preço de venda</title><desc id="d">Dois painéis de barras. Aluguel máximo por mês: HIS-1, R$ 1.458,90; HIS-2, R$ 2.917,80; HMP, R$ 4.863,00 (30% do teto de renda da faixa). Teto de venda: HIS-1, R$ 276.102,20; HIS-2, R$ 383.636,74; HMP, R$ 537.672,71. Fonte: Decreto 64.895/2026 e Secretaria Municipal de Habitação de São Paulo.</desc><style>.s{font-family:Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif}.m{font-family:'JetBrains Mono', Menlo, Consolas, monospace}</style><rect width="420" height="637" fill="#FFFFFF"/><text x="16" y="34" class="m" font-size="13" font-weight="700" fill="#11355B" letter-spacing="1.5">HIS E HMP · SÃO PAULO · 2026</text><text x="16" y="60" class="s" font-size="17" font-weight="700" fill="#1A2332" letter-spacing="-0.3">No HMP, o aluguel para em</text><text x="16" y="83" class="s" font-size="17" font-weight="700" fill="#1A2332" letter-spacing="-0.3">R$ 4.863 por mês e a venda,</text><text x="16" y="106" class="s" font-size="17" font-weight="700" fill="#1A2332" letter-spacing="-0.3">em R$ 537 mil</text><text x="16" y="129" class="s" font-size="13" fill="#5A6472">Tetos por categoria. O aluguel máximo é 30%</text><text x="16" y="147" class="s" font-size="13" fill="#5A6472">do teto de renda da faixa.</text><text x="16" y="183" class="m" font-size="13" font-weight="700" fill="#11355B">ALUGUEL MÁXIMO POR MÊS</text><text x="16" y="211" class="s" font-size="13" font-weight="600" fill="#1A2332">HIS-1</text><path d="M16,220 H87 Q91,220 91,224 V230 Q91,234 87,234 H16 Z" fill="#2F6FA8"/><text x="99" y="232" class="s" font-size="13" font-weight="700" fill="#1A2332">R$ 1.458,90</text><text x="16" y="257" class="s" font-size="13" font-weight="600" fill="#1A2332">HIS-2</text><path d="M16,266 H162 Q166,266 166,270 V276 Q166,280 162,280 H16 Z" fill="#2F6FA8"/><text x="174" y="278" class="s" font-size="13" font-weight="700" fill="#1A2332">R$ 2.917,80</text><text x="16" y="303" class="s" font-size="13" font-weight="600" fill="#1A2332">HMP</text><path d="M16,312 H262 Q266,312 266,316 V322 Q266,326 262,326 H16 Z" fill="#2F6FA8"/><text x="274" y="324" class="s" font-size="13" font-weight="700" fill="#1A2332">R$ 4.863,00</text><text x="16" y="357" class="m" font-size="13" font-weight="700" fill="#11355B">TETO DE VENDA DA UNIDADE</text><text x="16" y="385" class="s" font-size="13" font-weight="600" fill="#1A2332">HIS-1</text><path d="M16,394 H140.378 Q144.378,394 144.378,398 V404 Q144.378,408 140.378,408 H16 Z" fill="#D07A3E"/><text x="152.378" y="406" class="s" font-size="13" font-weight="700" fill="#1A2332">R$ 276.102</text><text x="16" y="431" class="s" font-size="13" font-weight="600" fill="#1A2332">HIS-2</text><path d="M16,440 H190.378 Q194.378,440 194.378,444 V450 Q194.378,454 190.378,454 H16 Z" fill="#D07A3E"/><text x="202.378" y="452" class="s" font-size="13" font-weight="700" fill="#1A2332">R$ 383.637</text><text x="16" y="477" class="s" font-size="13" font-weight="600" fill="#1A2332">HMP</text><path d="M16,486 H262 Q266,486 266,490 V496 Q266,500 262,500 H16 Z" fill="#D07A3E"/><text x="274" y="498" class="s" font-size="13" font-weight="700" fill="#1A2332">R$ 537.673</text><text x="16" y="531" class="s" font-size="13" fill="#5A6472">Vinculação de 10 anos a partir da primeira</text><text x="16" y="547" class="s" font-size="13" fill="#5A6472">venda ou do Habite-se; depois, a unidade é livre.</text><line x1="16" y1="567" x2="404" y2="567" stroke="#E7E2D9" stroke-width="1"/><text x="16" y="587" class="m" font-size="12" fill="#5A6472">Fonte: Decreto 64.895/2026; Secretaria</text><text x="16" y="603" class="m" font-size="13" fill="#5A6472">Municipal de Habitação de São Paulo</text><text x="16" y="621" class="m" font-size="12" font-weight="700" fill="#11355B">bewild.com.br</text></svg>
