<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 412" width="720" height="412" role="img" aria-labelledby="t d"><title id="t">Tetos de 2026 para HIS e HMP em São Paulo: aluguel máximo e preço de venda</title><desc id="d">Dois painéis de barras. Aluguel máximo por mês: HIS-1, R$ 1.458,90; HIS-2, R$ 2.917,80; HMP, R$ 4.863,00 (30% do teto de renda da faixa). Teto de venda: HIS-1, R$ 276.102,20; HIS-2, R$ 383.636,74; HMP, R$ 537.672,71. Fonte: Decreto 64.895/2026 e Secretaria Municipal de Habitação de São Paulo.</desc><style>.s{font-family:Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif}.m{font-family:'JetBrains Mono', Menlo, Consolas, monospace}</style><rect width="720" height="412" fill="#FFFFFF"/><text x="32" y="34" class="m" font-size="12" font-weight="700" fill="#11355B" letter-spacing="1.5">HIS E HMP · SÃO PAULO · 2026</text><text x="32" y="66" class="s" font-size="22" font-weight="700" fill="#1A2332" letter-spacing="-0.3">No HMP, o aluguel para em R$ 4.863 por mês</text><text x="32" y="95" class="s" font-size="22" font-weight="700" fill="#1A2332" letter-spacing="-0.3">e a venda, em R$ 537 mil</text><text x="32" y="124" class="s" font-size="14" fill="#5A6472">Tetos por categoria. O aluguel máximo é 30% do teto de renda da faixa.</text><text x="32" y="162" class="m" font-size="12" font-weight="700" fill="#11355B">ALUGUEL MÁXIMO POR MÊS</text><text x="32" y="190" class="s" font-size="14" font-weight="600" fill="#1A2332">HIS-1</text><path d="M32,199 H85 Q89,199 89,203 V209 Q89,213 85,213 H32 Z" fill="#2F6FA8"/><text x="97" y="211" class="s" font-size="14" font-weight="700" fill="#1A2332">R$ 1.458,90</text><text x="32" y="236" class="s" font-size="14" font-weight="600" fill="#1A2332">HIS-2</text><path d="M32,245 H142 Q146,245 146,249 V255 Q146,259 142,259 H32 Z" fill="#2F6FA8"/><text x="154" y="257" class="s" font-size="14" font-weight="700" fill="#1A2332">R$ 2.917,80</text><text x="32" y="282" class="s" font-size="14" font-weight="600" fill="#1A2332">HMP</text><path d="M32,291 H218 Q222,291 222,295 V301 Q222,305 218,305 H32 Z" fill="#2F6FA8"/><text x="230" y="303" class="s" font-size="14" font-weight="700" fill="#1A2332">R$ 4.863,00</text><text x="392" y="162" class="m" font-size="12" font-weight="700" fill="#11355B">TETO DE VENDA DA UNIDADE</text><text x="392" y="190" class="s" font-size="14" font-weight="600" fill="#1A2332">HIS-1</text><path d="M392,199 H480.432 Q484.432,199 484.432,203 V209 Q484.432,213 480.432,213 H392 Z" fill="#D07A3E"/><text x="492.432" y="211" class="s" font-size="14" font-weight="700" fill="#1A2332">R$ 276.102</text><text x="392" y="236" class="s" font-size="14" font-weight="600" fill="#1A2332">HIS-2</text><path d="M392,245 H516.432 Q520.432,245 520.432,249 V255 Q520.432,259 516.432,259 H392 Z" fill="#D07A3E"/><text x="528.432" y="257" class="s" font-size="14" font-weight="700" fill="#1A2332">R$ 383.637</text><text x="392" y="282" class="s" font-size="14" font-weight="600" fill="#1A2332">HMP</text><path d="M392,291 H568 Q572,291 572,295 V301 Q572,305 568,305 H392 Z" fill="#D07A3E"/><text x="580" y="303" class="s" font-size="14" font-weight="700" fill="#1A2332">R$ 537.673</text><text x="32" y="336" class="s" font-size="13" fill="#5A6472">Vinculação de 10 anos a partir da primeira venda ou do Habite-se; depois, a unidade é livre.</text><line x1="32" y1="358" x2="688" y2="358" stroke="#E7E2D9" stroke-width="1"/><text x="32" y="378" class="m" font-size="12" fill="#5A6472">Fonte: Decreto 64.895/2026; Secretaria Municipal de Habitação de São Paulo</text><text x="32" y="396" class="m" font-size="12" font-weight="700" fill="#11355B">bewild.com.br</text></svg>
