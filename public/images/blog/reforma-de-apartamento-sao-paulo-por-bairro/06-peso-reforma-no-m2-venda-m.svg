<svg xmlns="http://www.w3.org/2000/svg" width="420" height="476" viewBox="0 0 420 476" role="img" aria-labelledby="t" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><title id="t">Quanto a reforma pesa sobre o m² à venda, por bairro</title><rect width="420" height="476" fill="#FFFFFF"/><text x="24" y="34" font-size="15" fill="#1F2A2E" text-anchor="start" font-weight="bold">Quanto a reforma pesa sobre o m² à venda,</text><text x="24" y="54" font-size="15" fill="#1F2A2E" text-anchor="start" font-weight="bold">por bairro</text><text x="24" y="72" font-size="12" fill="#5F6B70" text-anchor="start">Custo mediano da reforma (R$ 2.744/m², Índice Bewild) dividido</text><text x="24" y="88" font-size="12" fill="#5F6B70" text-anchor="start">pelo preço de venda por m² do bairro, julho de 2026</text><text x="156" y="128.4" font-size="12" fill="#1F2A2E" text-anchor="end">Itaim Bibi</text><rect x="164" y="114" width="77.5" height="20" rx="3" fill="#0F4C5C"/><text x="247.5" y="128.4" font-size="12" fill="#1F2A2E" text-anchor="start">13,7%</text><text x="156" y="156.4" font-size="12" fill="#1F2A2E" text-anchor="end">Pinheiros</text><rect x="164" y="142" width="84.8" height="20" rx="3" fill="#0F4C5C"/><text x="254.8" y="156.4" font-size="12" fill="#1F2A2E" text-anchor="start">15,0%</text><text x="156" y="184.4" font-size="12" fill="#1F2A2E" text-anchor="end">Jardins</text><rect x="164" y="170" width="87.1" height="20" rx="3" fill="#0F4C5C"/><text x="257.1" y="184.4" font-size="12" fill="#1F2A2E" text-anchor="start">15,4%</text><text x="156" y="212.4" font-size="12" fill="#1F2A2E" text-anchor="end">Moema</text><rect x="164" y="198" width="95.0" height="20" rx="3" fill="#0F4C5C"/><text x="265" y="212.4" font-size="12" fill="#1F2A2E" text-anchor="start">16,8%</text><text x="156" y="240.4" font-size="12" fill="#1F2A2E" text-anchor="end">Vila Mariana</text><rect x="164" y="226" width="105.2" height="20" rx="3" fill="#0F4C5C"/><text x="275.2" y="240.4" font-size="12" fill="#1F2A2E" text-anchor="start">18,6%</text><text x="156" y="268.4" font-size="12" fill="#1F2A2E" text-anchor="end">Paraíso</text><rect x="164" y="254" width="111.4" height="20" rx="3" fill="#0F4C5C"/><text x="281.4" y="268.4" font-size="12" fill="#1F2A2E" text-anchor="start">19,7%</text><text x="156" y="296.4" font-size="12" fill="#1F2A2E" text-anchor="end">Perdizes</text><rect x="164" y="282" width="116.5" height="20" rx="3" fill="#0F4C5C"/><text x="286.5" y="296.4" font-size="12" fill="#1F2A2E" text-anchor="start">20,6%</text><text x="156" y="324.4" font-size="12" fill="#1F2A2E" text-anchor="end">Bela Vista</text><rect x="164" y="310" width="124.4" height="20" rx="3" fill="#0F4C5C"/><text x="294.4" y="324.4" font-size="12" fill="#1F2A2E" text-anchor="start">22,0%</text><text x="156" y="352.4" font-size="12" fill="#1F2A2E" text-anchor="end">São Paulo (média)</text><rect x="164" y="338" width="128.3" height="20" rx="3" fill="#B8C2C6"/><text x="298.3" y="352.4" font-size="12" fill="#1F2A2E" text-anchor="start">22,7%</text><text x="156" y="380.4" font-size="12" fill="#1F2A2E" text-anchor="end">Santana</text><rect x="164" y="366" width="170.7" height="20" rx="3" fill="#0F4C5C"/><text x="340.7" y="380.4" font-size="12" fill="#1F2A2E" text-anchor="start">30,2%</text><text x="156" y="408.4" font-size="12" fill="#1F2A2E" text-anchor="end">Vila Andrade</text><rect x="164" y="394" width="186.0" height="20" rx="3" fill="#0F4C5C"/><text x="356" y="408.4" font-size="12" fill="#1F2A2E" text-anchor="start">32,9%</text><text x="24" y="434" font-size="12" fill="#5F6B70" text-anchor="start">Fontes: Índice FipeZap Venda jul/2026 (via Forbes,</text><text x="24" y="448" font-size="12" fill="#5F6B70" text-anchor="start">15/08/2026); Índice Bewild de custo de reforma (188</text><text x="24" y="462" font-size="12" fill="#5F6B70" text-anchor="start">contratos)</text></svg>
