<svg xmlns="http://www.w3.org/2000/svg" width="720" height="464" viewBox="0 0 720 464" role="img" aria-labelledby="t" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><title id="t">Quanto a reforma pesa sobre o m² à venda, por bairro</title><rect width="720" height="464" fill="#FFFFFF"/><text x="24" y="34" font-size="17" fill="#1F2A2E" text-anchor="start" font-weight="bold">Quanto a reforma pesa sobre o m² à venda, por bairro</text><text x="24" y="54" font-size="12" fill="#5F6B70" text-anchor="start">Custo mediano da reforma (R$ 2.744/m², Índice Bewild) dividido pelo preço de venda por m² do bairro,</text><text x="24" y="70" font-size="12" fill="#5F6B70" text-anchor="start">julho de 2026</text><text x="196" y="109.8" font-size="12" fill="#1F2A2E" text-anchor="end">Itaim Bibi</text><rect x="204" y="94" width="185.7" height="22" rx="3" fill="#0F4C5C"/><text x="395.7" y="109.8" font-size="12" fill="#1F2A2E" text-anchor="start">13,7%</text><text x="196" y="139.8" font-size="12" fill="#1F2A2E" text-anchor="end">Pinheiros</text><rect x="204" y="124" width="203.3" height="22" rx="3" fill="#0F4C5C"/><text x="413.3" y="139.8" font-size="12" fill="#1F2A2E" text-anchor="start">15,0%</text><text x="196" y="169.8" font-size="12" fill="#1F2A2E" text-anchor="end">Jardins</text><rect x="204" y="154" width="208.8" height="22" rx="3" fill="#0F4C5C"/><text x="418.8" y="169.8" font-size="12" fill="#1F2A2E" text-anchor="start">15,4%</text><text x="196" y="199.8" font-size="12" fill="#1F2A2E" text-anchor="end">Moema</text><rect x="204" y="184" width="227.7" height="22" rx="3" fill="#0F4C5C"/><text x="437.7" y="199.8" font-size="12" fill="#1F2A2E" text-anchor="start">16,8%</text><text x="196" y="229.8" font-size="12" fill="#1F2A2E" text-anchor="end">Vila Mariana</text><rect x="204" y="214" width="252.1" height="22" rx="3" fill="#0F4C5C"/><text x="462.1" y="229.8" font-size="12" fill="#1F2A2E" text-anchor="start">18,6%</text><text x="196" y="259.8" font-size="12" fill="#1F2A2E" text-anchor="end">Paraíso</text><rect x="204" y="244" width="267.1" height="22" rx="3" fill="#0F4C5C"/><text x="477.1" y="259.8" font-size="12" fill="#1F2A2E" text-anchor="start">19,7%</text><text x="196" y="289.8" font-size="12" fill="#1F2A2E" text-anchor="end">Perdizes</text><rect x="204" y="274" width="279.3" height="22" rx="3" fill="#0F4C5C"/><text x="489.3" y="289.8" font-size="12" fill="#1F2A2E" text-anchor="start">20,6%</text><text x="196" y="319.8" font-size="12" fill="#1F2A2E" text-anchor="end">Bela Vista</text><rect x="204" y="304" width="298.2" height="22" rx="3" fill="#0F4C5C"/><text x="508.2" y="319.8" font-size="12" fill="#1F2A2E" text-anchor="start">22,0%</text><text x="196" y="349.8" font-size="12" fill="#1F2A2E" text-anchor="end">São Paulo (média)</text><rect x="204" y="334" width="307.7" height="22" rx="3" fill="#B8C2C6"/><text x="517.7" y="349.8" font-size="12" fill="#1F2A2E" text-anchor="start">22,7%</text><text x="196" y="379.8" font-size="12" fill="#1F2A2E" text-anchor="end">Santana</text><rect x="204" y="364" width="409.4" height="22" rx="3" fill="#0F4C5C"/><text x="619.4" y="379.8" font-size="12" fill="#1F2A2E" text-anchor="start">30,2%</text><text x="196" y="409.8" font-size="12" fill="#1F2A2E" text-anchor="end">Vila Andrade</text><rect x="204" y="394" width="446.0" height="22" rx="3" fill="#0F4C5C"/><text x="656" y="409.8" font-size="12" fill="#1F2A2E" text-anchor="start">32,9%</text><text x="24" y="436" font-size="12" fill="#5F6B70" text-anchor="start">Fontes: Índice FipeZap Venda jul/2026 (via Forbes, 15/08/2026); Índice Bewild de custo de reforma</text><text x="24" y="450" font-size="12" fill="#5F6B70" text-anchor="start">(188 contratos)</text></svg>
