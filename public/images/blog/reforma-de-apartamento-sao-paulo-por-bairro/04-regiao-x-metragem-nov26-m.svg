<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 742" width="420" height="742" role="img" aria-labelledby="t d"><title id="t">Custo por m² por faixa de metragem e região</title><desc id="d">Abaixo de 24 m²: Centro R$ 3.794 (43), Zona Oeste R$ 3.386 (22), Zona Sul R$ 3.040 (28); 24 a 28 m²: Centro R$ 2.743 (21), Zona Oeste R$ 2.786 (60), Zona Sul R$ 2.840 (128); 28 a 32 m²: Centro R$ 2.374 (17), Zona Oeste R$ 2.661 (21), Zona Sul R$ 2.542 (43); 32 a 38 m²: Centro R$ 2.641 (7), Zona Oeste R$ 2.573 (14), Zona Sul R$ 2.472 (33); 38 a 45 m²: Centro R$ 2.651 (19), Zona Oeste R$ 2.595 (14), Zona Sul R$ 2.625 (10).</desc><style>.s{font-family:Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif}.m{font-family:'JetBrains Mono', Menlo, Consolas, monospace}</style><rect width="420" height="742" fill="#FFFFFF"/><text x="32" y="44" class="m" font-size="13" font-weight="700" fill="#11355B" letter-spacing="1.5">MESMA METRAGEM, REGIÕES LADO A LADO</text><text x="32" y="78" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">Na mesma faixa de</text><text x="32" y="108" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">metragem, as regiões se</text><text x="32" y="138" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">aproximam</text><text x="32" y="170" class="s" font-size="15" fill="#5A6472">Mediana por m² em cada faixa. A</text><text x="32" y="191" class="s" font-size="15" fill="#5A6472">diferença só é grande abaixo de 24 m²,</text><text x="32" y="212" class="s" font-size="15" fill="#5A6472">onde o Centro tem os studios menores.</text><rect x="32.0" y="237.0" width="12.0" height="12.0" rx="2" fill="#D07A3E"/><text x="50" y="247" class="s" font-size="13" font-weight="600" fill="#1A2332">Centro</text><rect x="136.0" y="237.0" width="12.0" height="12.0" rx="2" fill="#2F6FA8"/><text x="154" y="247" class="s" font-size="13" font-weight="600" fill="#1A2332">Zona Oeste</text><rect x="240.0"