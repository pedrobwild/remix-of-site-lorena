<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 588" width="720" height="706" role="img" aria-labelledby="t d"><title id="t">Resumo da análise por bairro: 585 orçamentos de reforma completa em São Paulo</title><desc id="d">535 dos 585 orçamentos têm bairro identificado; a mediana por m² vai de R$ 2.770 na Zona Sul a R$ 3.038 no Centro; na faixa de 24 a 28 m² a diferença entre regiões é de 3,5%; Zona Sul 45%, Zona Oeste 24% e Centro 20% dos orçamentos; o aluguel por m² varia 2 vezes entre bairros; a reforma pesa de 14% a 34% do m² à venda.</desc><style>.s{font-family:Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif}.m{font-family:'JetBrains Mono', Menlo, Consolas, monospace}</style><rect width="600" height="588" fill="#FFFFFF"/><text x="32" y="44" class="m" font-size="13" font-weight="700" fill="#11355B" letter-spacing="1.5">REFORMA POR BAIRRO</text><text x="32" y="78" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">O bairro muda o metro quadrado,</text><text x="32" y="108" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">não o orçamento</text><text x="32" y="140" class="s" font-size="15" fill="#5A6472">Seis números da análise por bairro do Índice Bewild,</text><text x="32" y="161" class="s" font-size="15" fill="#5A6472">edição de novembro de 2026.</text><rect x="32.0" y="196.0" width="260.0" height="96.0" rx="6" fill="#F6F3EE"/><rect x="32.0" y="196.0" width="4.0" height="96.0" rx="2" fill="#D07A3E"/><text x="52" y="238" class="s" font-size="22" font-weight="700" fill="#1A2332">585 orçamentos</text><text x="52" y="262" class="s" font-size="13.5" fill="#5A6472">535 com bairro identificado, em</text><text x="52" y="279" class="s" font-size="13.5" fill="#5A6472">mais de 60 bairros</text><rect x="308.0" y="196.0" width="260.0" height="96.0" rx="6" fill="#F6F3EE"/><rect x="308.0" y="196.0" width="4.0" height="96.0" rx="2" fill="#2F6FA8"/><text x="328" y="238" class="s" font-size="18" font-weight="700" fill="#1A2332">R$ 2.770 a R$ 3.038/m²</text><text x="328" y="262" class="s" font-size="13.5" fill="#5A6472">mediana por região, da Zona Sul</text><text x="328" y="279" class="s" font-size="13.5" fill="#5A6472">ao Centro</text><rect x="32.0" y="308.0" width="260.0" height="96.0" rx="6" fill="#F6F3EE"/><rect x="32.0" y="308.0" width="4.0" height="96.0" rx="2" fill="#2F6FA8"/><text x="52" y="350" class="s" font-size="28" font-weight="700" fill="#1A2332">3,5%</text><text x="52" y="374" class="s" font-size="13.5" fill="#5A6472">diferença entre regiões na faixa</text><text x="52" y="391" class="s" font-size="13.5" fill="#5A6472">de 24 a 28 m²</text><rect x="308.0" y="308.0" width="260.0" height="96.0" rx="6" fill="#F6F3EE"/><rect x="308.0" y="308.0" width="4.0" height="96.0" rx="2" fill="#D07A3E"/><text x="328" y="350" class="s" font-size="22" font-weight="700" fill="#1A2332">45% · 24% · 20%</text><text x="328" y="374" class="s" font-size="13.5" fill="#5A6472">Zona Sul, Zona Oeste e Centro</text><rect x="32.0" y="420.0" width="260.0" height="96.0" rx="6" fill="#F6F3EE"/><rect x="32.0" y="420.0" width="4.0" height="96.0" rx="2" fill="#2F6FA8"/><text x="52" y="462" class="s" font-size="28" font-weight="700" fill="#1A2332">2 vezes</text><text x="52" y="486" class="s" font-size="13.5" fill="#5A6472">variação do aluguel por m² entre</text><text x="52" y="503" class="s" font-size="13.5" fill="#5A6472">bairros (FipeZap)</text><rect x="308.0" y="420.0" width="260.0" height="96.0" rx="6" fill="#F6F3EE"/><rect x="308.0" y="420.0" width="4.0" height="96.0" rx="2" fill="#2F6FA8"/><text x="328" y="462" class="s" font-size="28" font-weight="700" fill="#1A2332">14% a 34%</text><text x="328" y="486" class="s" font-size="13.5" fill="#5A6472">peso da reforma no m² à venda</text><line x1="32.0" y1="544.0" x2="568.0" y2="544.0" stroke="#E7E2D9" stroke-width="1"/><text x="32" y="566" class="m" font-size="13" fill="#5A6472">Fonte: Índice Bewild, nov/2026, 585 orçamentos</text><text x="568" y="566" class="m" font-size="13" font-weight="700" fill="#11355B" text-anchor="end">bewild.com.br</text></svg>
