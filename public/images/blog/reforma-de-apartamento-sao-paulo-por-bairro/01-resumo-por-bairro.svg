<svg xmlns="http://www.w3.org/2000/svg" width="720" height="354" viewBox="0 0 720 354" role="img" aria-labelledby="t" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><title id="t">Reforma de apartamento em SP por bairro: os números da base Bewild</title><rect width="720" height="354" fill="#FFFFFF"/><text x="24" y="34" font-size="17" fill="#1F2A2E" text-anchor="start" font-weight="bold">Reforma de apartamento em SP por bairro: os números da base Bewild</text><rect x="24.0" y="60" width="216" height="118" rx="8" fill="#E6EAEC"/><text x="38" y="104" font-size="24" fill="#E07A1F" text-anchor="start" font-weight="bold">204</text><text x="38" y="128" font-size="12" fill="#1F2A2E" text-anchor="start">contratos de reforma completa</text><text x="38" y="144" font-size="12" fill="#1F2A2E" text-anchor="start">em 37 bairros de São Paulo</text><rect x="252.0" y="60" width="216" height="118" rx="8" fill="#E6EAEC"/><text x="266" y="104" font-size="24" fill="#0F4C5C" text-anchor="start" font-weight="bold">R$ 2.758/m²</text><text x="266" y="128" font-size="12" fill="#1F2A2E" text-anchor="start">mediana do custo da obra; por</text><text x="266" y="144" font-size="12" fill="#1F2A2E" text-anchor="start">região, varia de R$ 2.746 a R$</text><text x="266" y="160" font-size="12" fill="#1F2A2E" text-anchor="start">2.795</text><rect x="480.0" y="60" width="216" height="118" rx="8" fill="#E6EAEC"/><text x="494" y="104" font-size="24" fill="#0F4C5C" text-anchor="start" font-weight="bold">p = 0,40</text><text x="494" y="128" font-size="12" fill="#1F2A2E" text-anchor="start">teste de Kruskal-Wallis: o</text><text x="494" y="144" font-size="12" fill="#1F2A2E" text-anchor="start">bairro não muda o custo por m²</text><rect x="24.0" y="190" width="216" height="118" rx="8" fill="#E6EAEC"/><text x="38" y="234" font-size="24" fill="#0F4C5C" text-anchor="start" font-weight="bold">39% · 31% · 28%</text><text x="38" y="258" font-size="12" fill="#1F2A2E" text-anchor="start">Zona Sul, Zona Oeste e Centro</text><text x="38" y="274" font-size="12" fill="#1F2A2E" text-anchor="start">na base de contratos</text><rect x="252.0" y="190" width="216" height="118" rx="8" fill="#E6EAEC"/><text x="266" y="234" font-size="24" fill="#0F4C5C" text-anchor="start" font-weight="bold">2x</text><text x="266" y="258" font-size="12" fill="#1F2A2E" text-anchor="start">variação do aluguel por m²</text><text x="266" y="274" font-size="12" fill="#1F2A2E" text-anchor="start">entre bairros (R$ 49 a R$ 100,</text><text x="266" y="290" font-size="12" fill="#1F2A2E" text-anchor="start">FipeZap ago/2026)</text><rect x="480.0" y="190" width="216" height="118" rx="8" fill="#E6EAEC"/><text x="494" y="234" font-size="24" fill="#0F4C5C" text-anchor="start" font-weight="bold">14% a 30%</text><text x="494" y="258" font-size="12" fill="#1F2A2E" text-anchor="start">peso da reforma no m² à venda,</text><text x="494" y="274" font-size="12" fill="#1F2A2E" text-anchor="start">conforme o bairro (FipeZap</text><text x="494" y="290" font-size="12" fill="#1F2A2E" text-anchor="start">jul/2026)</text><text x="24" y="340" font-size="12" fill="#5F6B70" text-anchor="start">Base: 204 contratos Bewild (planilha de 27/09/2026, lida em 13/10/2026)</text></svg>
