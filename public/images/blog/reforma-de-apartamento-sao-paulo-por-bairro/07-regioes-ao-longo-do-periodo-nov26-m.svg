<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 0 380 541" width="380" height="541" role="img" aria-labelledby="t d"><title id="t">Participação de cada região nos orçamentos ao longo de 2026</title><desc id="d">Março a junho: Centro 28%, Zona Oeste 24%, Zona Sul 48%; Julho a setembro: Centro 13%, Zona Oeste 34%, Zona Sul 52%; Outubro e novembro: Centro 26%, Zona Oeste 23%, Zona Sul 51%.</desc><style>.s{font-family:Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif}.m{font-family:'JetBrains Mono', Menlo, Consolas, monospace}</style><rect width="420" height="541" fill="#FFFFFF"/><text x="32" y="44" class="m" font-size="13" font-weight="700" fill="#11355B" letter-spacing="1.5">REGIÕES AO LONGO DO PERÍODO</text><text x="32" y="78" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">A Zona Sul responde por</text><text x="32" y="108" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">metade dos orçamentos o</text><text x="32" y="138" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">ano todo</text><text x="32" y="170" class="s" font-size="15" fill="#5A6472">Participação de cada região em três</text><text x="32" y="191" class="s" font-size="15" fill="#5A6472">grupos de 160 orçamentos, pela data de</text><text x="32" y="212" class="s" font-size="15" fill="#5A6472">criação.</text><rect x="32.0" y="237.0" width="12.0" height="12.0" rx="2" fill="#D07A3E"/><text x="50" y="247" class="s" font-size="13" font-weight="600" fill="#1A2332">Centro</text><rect x="136.0" y="237.0" width="12.0" height="12.0" rx="2" fill="#2F6FA8"/><text x="154" y="247" class="s" font-size="13" font-weight="600" fill="#1A2332">Zona Oeste</text><rect x="240.0" y="237.0" width="12.0" height="12.0" rx="2" fill="#11355B"/><text x="258" y="247" class="s" font-size="13" font-weight="600" fill="#1A2332">Zona Sul</text><text x="32" y="275" class="s" font-size="14.5" font-weight="600" fill="#1A2332">Março a junho</text>