<svg xmlns="http://www.w3.org/2000/svg" width="420" height="350" viewBox="0 0 420 350" role="img" aria-labelledby="t" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><title id="t">O Centro ganhou espaço: região dos contratos por terço da base</title><rect width="420" height="350" fill="#FFFFFF"/><text x="24" y="34" font-size="15" fill="#1F2A2E" text-anchor="start" font-weight="bold">O Centro ganhou espaço: região dos</text><text x="24" y="54" font-size="15" fill="#1F2A2E" text-anchor="start" font-weight="bold">contratos por terço da base</text><text x="24" y="72" font-size="12" fill="#5F6B70" text-anchor="start">Cada terço = 66 contratos, na ordem de assinatura (1º terço =</text><text x="24" y="88" font-size="12" fill="#5F6B70" text-anchor="start">contratos mais antigos)</text><rect x="24" y="106" width="12" height="12" rx="2" fill="#0F4C5C"/><text x="40" y="116" font-size="12" fill="#1F2A2E" text-anchor="start">Zona Sul</text><rect x="114" y="106" width="12" height="12" rx="2" fill="#E07A1F"/><text x="130" y="116" font-size="12" fill="#1F2A2E" text-anchor="start">Zona Oeste</text><rect x="218" y="106" width="12" height="12" rx="2" fill="#B8C2C6"/><text x="234" y="116" font-size="12" fill="#1F2A2E" text-anchor="start">Centro</text><rect x="294" y="106" width="12" height="12" rx="2" fill="#E6EAEC"/><text x="310" y="116" font-size="12" fill="#1F2A2E" text-anchor="start">Outras</text><text x="106" y="154.1" font-size="12" fill="#1F2A2E" text-anchor="end">1º terço</text><rect x="114.0" y="132" width="117.6" height="34" rx="3" fill="#0F4C5C"/><text x="172.8" y="154.1" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">42%</text><rect x="233.6" y="132" width="117.6" height="34" rx="3" fill="#E07A1F"/><text x="292.5" y="154.1" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">42%</text><rect x="353.3" y="132" width="36.5" height="34" rx="3" fill="#B8C2C6"/><text x="371.5" y="154.1" font-size="12" fill="#1F2A2E" text-anchor="middle" font-weight="bold">14%</text><rect x="391.7" y="132" width="2.3" height="34" rx="3" fill="#E6EAEC"/><text x="106" y="202.1" font-size="12" fill="#1F2A2E" text-anchor="end">2º terço</text><rect x="114.0" y="180" width="121.9" height="34" rx="3" fill="#0F4C5C"/><text x="175" y="202.1" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">44%</text><rect x="237.9" y="180" width="62.1" height="34" rx="3" fill="#E07A1F"/><text x="269" y="202.1" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">23%</text><rect x="302.0" y="180" width="83.5" height="34" rx="3" fill="#B8C2C6"/><text x="343.7" y="202.1" font-size="12" fill="#1F2A2E" text-anchor="middle" font-weight="bold">30%</text><rect x="387.5" y="180" width="6.5" height="34" rx="3" fill="#E6EAEC"/><text x="106" y="250.1" font-size="12" fill="#1F2A2E" text-anchor="end">3º terço</text><rect x="114.0" y="228" width="74.9" height="34" rx="3" fill="#0F4C5C"/><text x="151.5" y="250.1" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">27%</text><rect x="190.9" y="228" width="79.2" height="34" rx="3" fill="#E07A1F"/><text x="230.5" y="250.1" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">29%</text><rect x="272.1" y="228" width="117.6" height="34" rx="3" fill="#B8C2C6"/><text x="330.9" y="250.1" font-size="12" fill="#1F2A2E" text-anchor="middle" font-weight="bold">42%</text><rect x="391.7" y="228" width="2.3" height="34" rx="3" fill="#E6EAEC"/><text x="24" y="308" font-size="12" fill="#5F6B70" text-anchor="start">Base: planilha de contratos Bewild de 27/09/2026, 198</text><text x="24" y="322" font-size="12" fill="#5F6B70" text-anchor="start">registros após exclusões (o Índice Bewild usa 188); lida em</text><text x="24" y="336" font-size="12" fill="#5F6B70" text-anchor="start">13/10/2026</text></svg>
