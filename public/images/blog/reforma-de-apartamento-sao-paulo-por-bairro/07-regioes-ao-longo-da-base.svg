<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-labelledby="t" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><title id="t">O Centro ganhou espaço: região dos contratos por terço da base</title><rect width="720" height="300" fill="#FFFFFF"/><text x="24" y="34" font-size="17" fill="#1F2A2E" text-anchor="start" font-weight="bold">O Centro ganhou espaço: região dos contratos por terço da base</text><text x="24" y="54" font-size="12" fill="#5F6B70" text-anchor="start">Cada terço = 66 contratos, na ordem de assinatura (1º terço = contratos mais antigos)</text><rect x="24" y="70" width="12" height="12" rx="2" fill="#0F4C5C"/><text x="40" y="80" font-size="12" fill="#1F2A2E" text-anchor="start">Zona Sul</text><rect x="114" y="70" width="12" height="12" rx="2" fill="#E07A1F"/><text x="130" y="80" font-size="12" fill="#1F2A2E" text-anchor="start">Zona Oeste</text><rect x="218" y="70" width="12" height="12" rx="2" fill="#B8C2C6"/><text x="234" y="80" font-size="12" fill="#1F2A2E" text-anchor="start">Centro</text><rect x="294" y="70" width="12" height="12" rx="2" fill="#E6EAEC"/><text x="310" y="80" font-size="12" fill="#1F2A2E" text-anchor="start">Outras</text><text x="136" y="118.1" font-size="12" fill="#1F2A2E" text-anchor="end">1º terço</text><rect x="144.0" y="96" width="232.2" height="34" rx="3" fill="#0F4C5C"/><text x="260.1" y="118.1" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">42%</text><rect x="378.2" y="96" width="232.2" height="34" rx="3" fill="#E07A1F"/><text x="494.3" y="118.1" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">42%</text><rect x="612.4" y="96" width="73.3" height="34" rx="3" fill="#B8C2C6"/><text x="649" y="118.1" font-size="12" fill="#1F2A2E" text-anchor="middle" font-weight="bold">14%</text><rect x="687.6" y="96" width="6.4" height="34" rx="3" fill="#E6EAEC"/><text x="136" y="166.1" font-size="12" fill="#1F2A2E" text-anchor="end">2º terço</text><rect x="144.0" y="144" width="240.5" height="34" rx="3" fill="#0F4C5C"/><text x="264.3" y="166.1" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">44%</text><rect x="386.5" y="144" width="123.5" height="34" rx="3" fill="#E07A1F"/><text x="448.3" y="166.1" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">23%</text><rect x="512.0" y="144" width="165.3" height="34" rx="3" fill="#B8C2C6"/><text x="594.6" y="166.1" font-size="12" fill="#1F2A2E" text-anchor="middle" font-weight="bold">30%</text><rect x="679.3" y="144" width="14.7" height="34" rx="3" fill="#E6EAEC"/><text x="136" y="214.1" font-size="12" fill="#1F2A2E" text-anchor="end">3º terço</text><rect x="144.0" y="192" width="148.5" height="34" rx="3" fill="#0F4C5C"/><text x="218.3" y="214.1" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">27%</text><rect x="294.5" y="192" width="156.9" height="34" rx="3" fill="#E07A1F"/><text x="373" y="214.1" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">29%</text><rect x="453.5" y="192" width="232.2" height="34" rx="3" fill="#B8C2C6"/><text x="569.5" y="214.1" font-size="12" fill="#1F2A2E" text-anchor="middle" font-weight="bold">42%</text><rect x="687.6" y="192" width="6.4" height="34" rx="3" fill="#E6EAEC"/><text x="24" y="272" font-size="12" fill="#5F6B70" text-anchor="start">Base: planilha de contratos Bewild de 27/09/2026, 198 registros após exclusões (o Índice Bewild</text><text x="24" y="286" font-size="12" fill="#5F6B70" text-anchor="start">usa 188); lida em 13/10/2026</text></svg>
