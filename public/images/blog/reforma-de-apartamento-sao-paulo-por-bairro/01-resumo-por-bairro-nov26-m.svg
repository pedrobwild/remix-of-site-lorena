<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 0 380 963" width="380" height="963" role="img" aria-labelledby="t d"><title id="t">Resumo da análise por bairro: 585 orçamentos de reforma completa em São Paulo</title><desc id="d">585 orçamentos em mais de 60 bairros; a mediana por m² vai de R$ 2.762 na Zona Sul a R$ 3.038 no Centro; na faixa de 24 a 28 m² a diferença entre regiões é de 3,5%; o orçamento mediano fica entre R$ 73 mil e R$ 74 mil nas três regiões; o aluguel por m² varia 2 vezes entre bairros; a reforma pesa de 14% a 34% do m² à venda.</desc><style>.s{font-family:Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif}.m{font-family:'JetBrains Mono', Menlo, Consolas, monospace}</style><rect width="420" height="963" fill="#FFFFFF"/><text x="32" y="44" class="m" font-size="13" font-weight="700" fill="#11355B" letter-spacing="1.5">REFORMA POR BAIRRO</text><text x="32" y="78" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">O bairro muda o metro</text><text x="32" y="108" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">quadrado, não o orçamento</text><text x="32" y="140" class="s" font-size="15" fill="#5A6472">Seis números da análise por bairro do</text><text x="32" y="161" class="s" font-size="15" fill="#5A6472">Índice Bewild, edição de novembro de</text><text x="32" y="182" class="s" font-size="15" fill="#5A6472">2026.</text><rect x="32.0" y="217.0" width="356.0" height="96.0" rx="6" fill="#F6F3EE"/><rect x="32.0" y="217.0" width="4.0" height="96.0" rx="2" fill="#D07A3E"/><text x="52" y="259" class="s" font-size="22" font-weight="700" fill="#1A2332">585 orçamentos</text><text x="52" y="283" class="s" font-size="13.5" fill="#5A6472">de reforma completa, em mais de 60 bairros</text><rect x="32.0" y="329.0" width="356.0" height="96.0" rx="6" fill="#F6F3EE"/><rect x="32.0" y="329.0" width="4.0" height="96.0" rx="2" fill="#2F6FA8"/><text x="52" y="371" class="s" font-size="18" font-weight="700" fill="#1A2332">R$ 2.762 a R$ 3.038/m²</text><text x="52" y="395" class="s" font-size="13.5" fill="#5A6472">mediana por região, da Zona Sul ao Centro</text><rect x="32.0" y="441.0" width="356.0" height="96.0" rx="6" fill="#F6F3EE"/><rect x="32.0" y="441.0" width="4.0" height="96.0" rx="2" fill="#2F6FA8"/><text x="52" y="483" class="s" font-size="28" font-weight="700" fill="#1A2332">3,5%</text><text x="52" y="507" class="s" font-size="13.5" fill="#5A6472">diferença entre regiões na faixa de 24 a</text><text x="52" y="524" class="s" font-size="13.5" fill="#5A6472">28 m²</text><rect x="32.0" y="553.0" width="356.0" height="96.0" rx="6" fill="#F6F3EE"/><rect x="32.0" y="553.0" width="4.0" height="96.0" rx="2" fill="#D07A3E"/><text x="52" y="595" class="s" font-size="18" font-weight="700" fill="#1A2332">R$ 73 mil a R$ 74 mil</text><text x="52" y="619" class="s" font-size="13.5" fill="#5A6472">orçamento mediano nas três regiões</text><rect x="32.0" y="665.0" width="356.0" height="96.0" rx="6" fill="#F6F3EE"/><rect x="32.0" y="665.0" width="4.0" height="96.0" rx="2" fill="#2F6FA8"/><text x="52" y="707" class="s" font-size="28" font-weight="700" fill="#1A2332">2 vezes</text><text x="52" y="731" class="s" font-size="13.5" fill="#5A6472">variação do aluguel por m² entre bairros</text><text x="52" y="748" class="s" font-size="13.5" fill="#5A6472">(FipeZap)</text><rect x="32.0" y="777.0" width="356.0" height="96.0" rx="6" fill="#F6F3EE"/><rect x="32.0" y="777.0" width="4.0" height="96.0" rx="2" fill="#2F6FA8"/><text x="52" y="819" class="s" font-size="28" font-weight="700" fill="#1A2332">14% a 34%</text><text x="52" y="843" class="s" font-size="13.5" fill="#5A6472">peso da reforma no m² à venda</text><line x1="32.0" y1="901.0" x2="388.0" y2="901.0" stroke="#E7E2D9" stroke-width="1"/><text x="32" y="923" class="m" font-size="12" fill="#5A6472">Fonte: Índice Bewild, nov/2026, 585 orçamentos</text><text x="32" y="943" class="m" font-size="13" font-weight="700" fill="#11355B">bewild.com.br</text></svg>
