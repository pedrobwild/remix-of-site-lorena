<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 472" width="720" height="566" role="img" aria-labelledby="t d"><title id="t">Participação de cada região nos orçamentos ao longo de 2026</title><desc id="d">Março a junho: Centro 28%, Zona Oeste 24%, Zona Sul 48%; Julho a setembro: Centro 13%, Zona Oeste 34%, Zona Sul 52%; Outubro e novembro: Centro 26%, Zona Oeste 23%, Zona Sul 51%.</desc><style>.s{font-family:Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif}.m{font-family:'JetBrains Mono', Menlo, Consolas, monospace}</style><rect width="600" height="472" fill="#FFFFFF"/><text x="32" y="44" class="m" font-size="13" font-weight="700" fill="#11355B" letter-spacing="1.5">REGIÕES AO LONGO DO PERÍODO</text><text x="32" y="78" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">A Zona Sul responde por metade dos</text><text x="32" y="108" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">orçamentos o ano todo</text><text x="32" y="140" class="s" font-size="15" fill="#5A6472">Participação de cada região em três grupos de 160</text><text x="32" y="161" class="s" font-size="15" fill="#5A6472">orçamentos, pela data de criação.</text><rect x="32.0" y="186.0" width="12.0" height="12.0" rx="2" fill="#D07A3E"/><text x="50" y="196" class="s" font-size="13" font-weight="600" fill="#1A2332">Centro</text><rect x="142.0" y="186.0" width="12.0" height="12.0" rx="2" fill="#2F6FA8"/><text x="160" y="196" class="s" font-size="13" font-weight="600" fill="#1A2332">Zona Oeste</text><rect x="252.0" y="186.0" width="12.0" height="12.0" rx="2" fill="#11355B"/><text x="270" y="196" class="s" font-size="13" font-weight="600" fill="#1A2332">Zona Sul</text><text x="32" y="224" class="s" font-size="14.5" font-weight="600" fill="#1A2332">Março a junho</text><rect x="32.0" y="234.0" width="150.1" height="34.0" fill="#D07A3E"/><text x="107.04" y="256" class="s" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">28%</text><rect x="182.1" y="234.0" width="128.6" height="34.0" fill="#2F6FA8"/><text x="246.4" y="256" class="s" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">24%</text><rect x="310.7" y="234.0" width="257.3" height="34.0" fill="#11355B"/><text x="439.36" y="256" class="s" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">48%</text><text x="32" y="296" class="s" font-size="14.5" font-weight="600" fill="#1A2332">Julho a setembro</text><rect x="32.0" y="306.0" width="70.4" height="34.0" fill="#D07A3E"/><text x="67.1919" y="328" class="s" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">13%</text><rect x="102.4" y="306.0" width="184.1" height="34.0" fill="#2F6FA8"/><text x="194.424" y="328" class="s" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">34%</text><rect x="286.5" y="306.0" width="281.5" height="34.0" fill="#11355B"/><text x="427.232" y="328" class="s" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">52%</text><text x="32" y="368" class="s" font-size="14.5" font-weight="600" fill="#1A2332">Outubro e novembro</text><rect x="32.0" y="378.0" width="139.4" height="34.0" fill="#D07A3E"/><text x="101.68" y="400" class="s" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">26%</text><rect x="171.4" y="378.0" width="123.3" height="34.0" fill="#2F6FA8"/><text x="233" y="400" class="s" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">23%</text><rect x="294.6" y="378.0" width="273.4" height="34.0" fill="#11355B"/><text x="431.32" y="400" class="s" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">51%</text><line x1="32.0" y1="428.0" x2="568.0" y2="428.0" stroke="#E7E2D9" stroke-width="1"/><text x="32" y="450" class="m" font-size="13" fill="#5A6472">Fonte: Índice Bewild, nov/2026, 585 orçamentos</text><text x="568" y="450" class="m" font-size="13" font-weight="700" fill="#11355B" text-anchor="end">bewild.com.br</text></svg>
