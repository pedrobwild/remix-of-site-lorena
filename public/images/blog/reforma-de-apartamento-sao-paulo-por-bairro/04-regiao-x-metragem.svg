middle">2,7k</text><rect x="290.0" y="192.9" width="26.0" height="133.1" rx="3" fill="#B8C2C6"/><text x="303.0" y="188.9" font-size="12" fill="#1F2A2E" text-anchor="middle">2,6k</text><text x="276" y="344" font-size="12" fill="#1F2A2E" text-anchor="middle">24–28 m²</text><rect x="402.0" y="196.4" width="26.0" height="129.6" rx="3" fill="#0F4C5C"/><text x="415.0" y="192.4" font-size="12" fill="#1F2A2E" text-anchor="middle">2,5k</text><rect x="430.0" y="192.0" width="26.0" height="134.0" rx="3" fill="#E07A1F"/><text x="443.0" y="188.0" font-size="12" fill="#1F2A2E" text-anchor="middle">2,6k</text><rect x="458.0" y="199.8" width="26.0" height="126.2" rx="3" fill="#B8C2C6"/><text x="471.0" y="195.8" font-size="12" fill="#1F2A2E" text-anchor="middle">2,5k</text><text x="444" y="344" font-size="12" fill="#1F2A2E" text-anchor="middle">28–32 m²</text><rect x="570.0" y="192.9" width="26.0" height="133.1" rx="3" fill="#0F4C5C"/><text x="583.0" y="188.9" font-size="12" fill="#1F2A2E" text-anchor="middle">2,6k</text><rect x="598.0" y="174.2" width="26.0" height="151.8" rx="3" fill="#E07A1F"/><text x="611.0" y="170.2" font-size="12" fill="#1F2A2E" text-anchor="middle">3,0k</text><rect x="626.0" y="173.5" width="26.0" height="152.5" rx="3" fill="#B8C2C6"/><text x="639.0" y="169.5" font-size="12" fill="#1F2A2E" text-anchor="middle">3,0k</text><text x="612" y="344" font-size="12" fill="#1F2A2E" text-anchor="middle">≥ 38 m²</text><line x1="24" x2="696" y1="326" y2="326" stroke="#B8C2C6"/><text x="24" y="398" font-size="12" fill="#5F6B70" text-anchor="start">Base: planilha de contratos Bewild de 27/09/2026, 198 registros após exclusões (o Índice Bewild</text><text x="24" y="412" font-size="12" fill="#5F6B70" text-anchor="start">usa 188); lida em 13/10/2026</text></svg>
