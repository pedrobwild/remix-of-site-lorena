<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 0 380 825" width="380" height="825" role="img" aria-labelledby="t d"><title id="t">Peso da reforma sobre o preço de venda por m² em cada bairro</title><desc id="d">Reforma de R$ 2.831 por m² como parcela do m² à venda (FipeZap, julho de 2026): Itaim Bibi 14,2%; Pinheiros 15,5%; Jardins 15,9%; Moema 17,3%; Vila Mariana 19,1%; Paraíso 20,3%; Perdizes 21,3%; Bela Vista 22,7%; São Paulo (média) 23,4%; Santana 31,1%; Vila Andrade 33,9%.</desc><style>.s{font-family:Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif}.m{font-family:'JetBrains Mono', Menlo, Consolas, monospace}</style><rect width="420" height="825" fill="#FFFFFF"/><text x="32" y="44" class="m" font-size="13" font-weight="700" fill="#11355B" letter-spacing="1.5">PESO DA REFORMA NO M² À VENDA</text><text x="32" y="78" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">A reforma vai de 14% a</text><text x="32" y="108" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">34% do metro quadrado à</text><text x="32" y="138" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">venda</text><text x="32" y="170" class="s" font-size="15" fill="#5A6472">Mediana do Índice Bewild (R$ 2.831/m²)</text><text x="32" y="191" class="s" font-size="15" fill="#5A6472">dividida pelo preço de venda por m² de</text><text x="32" y="212" class="s" font-size="15" fill="#5A6472">cada bairro.</text><text x="32" y="257" class="s" font-size="14" font-weight="600" fill="#1A2332">Itaim Bibi</text><text x="388" y="257" class="m" font-size="13" fill="#5A6472" text-anchor="end">R$ 19.990/m²</text><rect x="32.0" y="264.0" width="100.9" height="16.0" rx="4" fill="#2F6FA8"/><text x="140.895" y="277" class="s" font-size="13.5" font-weight="700" fill="#1A2332">14,2%</text><text x="32" y="303" class="s" font-size="14" font-weight="600" fill="#1A2332">Pinheiros</text><text x="388" y="303" class="m" font-size="13" fi