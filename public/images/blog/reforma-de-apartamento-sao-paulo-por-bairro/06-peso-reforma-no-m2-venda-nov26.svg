<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 602" width="720" height="722" role="img" aria-labelledby="t d"><title id="t">Peso da reforma sobre o preço de venda por m² em cada bairro</title><desc id="d">Reforma de R$ 2.831 por m² como parcela do m² à venda (FipeZap, julho de 2026): Itaim Bibi 14,2%; Pinheiros 15,5%; Jardins 15,9%; Moema 17,3%; Vila Mariana 19,1%; Paraíso 20,3%; Perdizes 21,3%; Bela Vista 22,7%; São Paulo (média) 23,4%; Santana 31,1%; Vila Andrade 33,9%.</desc><style>.s{font-family:Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif}.m{font-family:'JetBrains Mono', Menlo, Consolas, monospace}</style><rect width="600" height="602" fill="#FFFFFF"/><text x="32" y="44" class="m" font-size="13" font-weight="700" fill="#11355B" letter-spacing="1.5">PESO DA REFORMA NO M² À VENDA</text><text x="32" y="78" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">A reforma vai de 14% a 34% do</text><text x="32" y="108" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">metro quadrado à venda</text><text x="32" y="140" class="s" font-size="15" fill="#5A6472">Mediana do Índice Bewild (R$ 2.831/m²) dividida pelo</text><text x="32" y="161" class="s" font-size="15" fill="#5A6472">preço de venda por m² de cada bairro.</text><text x="32" y="215" class="s" font-size="14" font-weight="600" fill="#1A2332">Itaim Bibi</text><rect x="200.0" y="202.0" width="62.8" height="16.0" rx="4" fill="#2F6FA8"/><text x="270.779" y="215" class="s" font-size="13.5" font-weight="700" fill="#1A2332">14,2%</text><text x="568" y="215" class="m" font-size="11.5" fill="#5A6472" text-anchor="end">R$ 19.990/m²</text><text x="32" y="247" class="s" font-size="14" font-weight="600" fill="#1A2332">Pinheiros</text><rect x="200.0" y="234.0" width="68.5" height="16.0" rx="4" fill="#2F6FA8"/><text x="276.526" y="247" class="s" font-size="13.5" font-weight="700" fill="#1A2332">15,5%</text><text x="568" y="247" class="m" font-size="11.5" fill="#5A6472" text-anchor="end">R$ 18.302/m²</text><text x="32" y="279" class="s" font-size="14" font-weight="600" fill="#1A2332">Jardins</text><rect x="200.0" y="266.0" width="70.3" height="16.0" rx="4" fill="#2F6FA8"/><text x="278.295" y="279" class="s" font-size="13.5" font-weight="700" fill="#1A2332">15,9%</text><text x="568" y="279" class="m" font-size="11.5" fill="#5A6472" text-anchor="end">R$ 17.833/m²</text><text x="32" y="311" class="s" font-size="14" font-weight="600" fill="#1A2332">Moema</text><rect x="200.0" y="298.0" width="76.5" height="16.0" rx="4" fill="#2F6FA8"/><text x="284.484" y="311" class="s" font-size="13.5" font-weight="700" fill="#1A2332">17,3%</text><text x="568" y="311" class="m" font-size="11.5" fill="#5A6472" text-anchor="end">R$ 16.349/m²</text><text x="32" y="343" class="s" font-size="14" font-weight="600" fill="#1A2332">Vila Mariana</text><rect x="200.0" y="330.0" width="84.4" height="16.0" rx="4" fill="#2F6FA8"/><text x="292.442" y="343" class="s" font-size="13.5" font-weight="700" fill="#1A2332">19,1%</text><text x="568" y="343" class="m" font-size="11.5" fill="#5A6472" text-anchor="end">R$ 14.792/m²</text><text x="32" y="375" class="s" font-size="14" font-weight="600" fill="#1A2332">Paraíso</text><rect x="200.0" y="362.0" width="89.7" height="16.0" rx="4" fill="#2F6FA8"/><text x="297.747" y="375" class="s" font-size="13.5" font-weight="700" fill="#1A2332">20,3%</text><text x="568" y="375" class="m" font-size="11.5" fill="#5A6472" text-anchor="end">R$ 13.943/m²</text><text x="32" y="407" class="s" font-size="14" font-weight="600" fill="#1A2332">Perdizes</text><rect x="200.0" y="394.0" width="94.2" height="16.0" rx="4" fill="#2F6FA8"/><text x="302.168" y="407" class="s" font-size="13.5" font-weight="700" fill="#1A2332">21,3%</text><text x="568" y="407" class="m" font-size="11.5" fill="#5A6472" text-anchor="end">R$ 13.303/m²</text><text x="32" y="439" class="s" font-size="14" font-weight="600" fill="#1A2332">Bela Vista</text><rect x="200.0" y="426.0" width="100.4" height="16.0" rx="4" fill="#2F6FA8"/><text x="308.358" y="439" class="s" font-size="13.5" font-weight="700" fill="#1A2332">22,7%</text><text x="568" y="439" class="m" font-size="11.5" fill="#5A6472" text-anchor="end">R$ 12.454/m²</text><text x="32" y="471" class="s" font-size="14" font-weight="600" fill="#1A2332">São Paulo (média)</text><rect x="200.0" y="458.0" width="103.5" height="16.0" rx="4" fill="#D07A3E"/><text x="311.453" y="471" class="s" font-size="13.5" font-weight="700" fill="#1A2332">23,4%</text><text x="568" y="471" class="m" font-size="11.5" fill="#5A6472" text-anchor="end">R$ 12.099/m²</text><text x="32" y="503" class="s" font-size="14" font-weight="600" fill="#1A2332">Santana</text><rect x="200.0" y="490.0" width="137.5" height="16.0" rx="4" fill="#2F6FA8"/><text x="345.495" y="503" class="s" font-size="13.5" font-weight="700" fill="#1A2332">31,1%</text><text x="568" y="503" class="m" font-size="11.5" fill="#5A6472" text-anchor="end">R$ 9.090/m²</text><text x="32" y="535" class="s" font-size="14" font-weight="600" fill="#1A2332">Vila Andrade</text><rect x="200.0" y="522.0" width="149.9" height="16.0" rx="4" fill="#2F6FA8"/><text x="357.874" y="535" class="s" font-size="13.5" font-weight="700" fill="#1A2332">33,9%</text><text x="568" y="535" class="m" font-size="11.5" fill="#5A6472" text-anchor="end">R$ 8.347/m²</text><line x1="32.0" y1="558.0" x2="568.0" y2="558.0" stroke="#E7E2D9" stroke-width="1"/><text x="32" y="580" class="m" font-size="13" fill="#5A6472">Fontes: Índice Bewild nov/2026; FipeZap jul/2026</text><text x="568" y="580" class="m" font-size="13" font-weight="700" fill="#11355B" text-anchor="end">bewild.com.br</text></svg>
