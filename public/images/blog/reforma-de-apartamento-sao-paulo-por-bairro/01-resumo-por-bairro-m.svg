<svg xmlns="http://www.w3.org/2000/svg" width="420" height="518" viewBox="0 0 420 518" role="img" aria-labelledby="t" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><title id="t">Reforma de apartamento em SP por bairro: os números da base Bewild</title><rect width="420" height="518" fill="#FFFFFF"/><text x="24" y="34" font-size="15" fill="#1F2A2E" text-anchor="start" font-weight="bold">Reforma de apartamento em SP por bairro:</text><text x="24" y="54" font-size="15" fill="#1F2A2E" text-anchor="start" font-weight="bold">os números da base Bewild</text><rect x="24.0" y="80" width="180" height="118" rx="8" fill="#E6EAEC"/><text x="38" y="124" font-size="21" fill="#E07A1F" text-anchor="start" font-weight="bold">198</text><text x="38" y="148" font-size="12" fill="#1F2A2E" text-anchor="start">registros de reforma</text><text x="38" y="164" font-size="12" fill="#1F2A2E" text-anchor="start">completa em 37 bairros de</text><text x="38" y="180" font-size="12" fill="#1F2A2E" text-anchor="start">São Paulo</text><rect x="216.0" y="80" width="180" height="118" rx="8" fill="#E6EAEC"/><text x="230" y="124" font-size="21" fill="#0F4C5C" text-anchor="start" font-weight="bold">R$ 2.744/m²</text><text x="230" y="148" font-size="12" fill="#1F2A2E" text-anchor="start">mediana do custo da obra,</text><text x="230" y="164" font-size="12" fill="#1F2A2E" text-anchor="start">igual ao Índice Bewild;</text><text x="230" y="180" font-size="12" fill="#1F2A2E" text-anchor="start">por região, de R$ 2.720 a</text><text x="230" y="196" font-size="12" fill="#1F2A2E" text-anchor="start">R$ 2.795</text><rect x="24.0" y="210" width="180" height="118" rx="8" fill="#E6EAEC"/><text x="38" y="254" font-size="21" fill="#0F4C5C" text-anchor="start" font-weight="bold">p = 0,15</text><text x="38" y="278" font-size="12" fill="#1F2A2E" text-anchor="start">teste de Kruskal-Wallis</text><text x="38" y="294" font-size="12" fill="#1F2A2E" text-anchor="start">entre Centro, Zona Oeste</text><text x="38" y="310" font-size="12" fill="#1F2A2E" text-anchor="start">e Zona Sul: a região não</text><text x="38" y="326" font-size="12" fill="#1F2A2E" text-anchor="start">muda o custo por m²</text><rect x="216.0" y="210" width="180" height="118" rx="8" fill="#E6EAEC"/><text x="230" y="254" font-size="18" fill="#0F4C5C" text-anchor="start" font-weight="bold">38% · 31% · 29%</text><text x="230" y="278" font-size="12" fill="#1F2A2E" text-anchor="start">Zona Sul, Zona Oeste e</text><text x="230" y="294" font-size="12" fill="#1F2A2E" text-anchor="start">Centro na base de</text><text x="230" y="310" font-size="12" fill="#1F2A2E" text-anchor="start">contratos</text><rect x="24.0" y="340" width="180" height="118" rx="8" fill="#E6EAEC"/><text x="38" y="384" font-size="21" fill="#0F4C5C" text-anchor="start" font-weight="bold">2x</text><text x="38" y="408" font-size="12" fill="#1F2A2E" text-anchor="start">variação do aluguel por</text><text x="38" y="424" font-size="12" fill="#1F2A2E" text-anchor="start">m² entre bairros (R$ 49 a</text><text x="38" y="440" font-size="12" fill="#1F2A2E" text-anchor="start">R$ 100, FipeZap ago/2026)</text><rect x="216.0" y="340" width="180" height="118" rx="8" fill="#E6EAEC"/><text x="230" y="384" font-size="21" fill="#0F4C5C" text-anchor="start" font-weight="bold">14% a 33%</text><text x="230" y="408" font-size="12" fill="#1F2A2E" text-anchor="start">peso da reforma no m² à</text><text x="230" y="424" font-size="12" fill="#1F2A2E" text-anchor="start">venda, conforme o bairro</text><text x="230" y="440" font-size="12" fill="#1F2A2E" text-anchor="start">(FipeZap jul/2026)</text><text x="24" y="476" font-size="12" fill="#5F6B70" text-anchor="start">Base: planilha de contratos Bewild de 27/09/2026, 198</text><text x="24" y="490" font-size="12" fill="#5F6B70" text-anchor="start">registros após exclusões (o Índice Bewild usa 188); lida em</text><text x="24" y="504" font-size="12" fill="#5F6B70" text-anchor="start">13/10/2026</text></svg>
