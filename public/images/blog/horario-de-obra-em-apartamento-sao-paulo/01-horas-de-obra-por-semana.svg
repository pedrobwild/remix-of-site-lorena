<svg xmlns='http://www.w3.org/2000/svg' width='720' height='309' viewBox='0 0 720 309' role='img' font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif'>
<rect width='720' height='309' fill='#FFFFFF'/>
<text x='16' y='26' font-size='16' font-weight='700' fill='#1F2933'>Horas de obra por semana: a lei permite mais do que o prédio</text>
<text x='16' y='46' font-size='12' fill='#5B6670'>Janelas de ruído e de trabalho que limitam uma reforma de apartamento em SP</text>
<text x='16' y='69' font-size='12' fill='#1F2933'>Janela de 85 dB (obra com alvará): seg–sex 7h–19h e sáb 8h–14h</text>
<rect x='16' y='74' width='598' height='18' rx='3' fill='#9AA3AB'/>
<text x='620' y='86' font-size='12' font-weight='600' fill='#1F2933'>66 h</text>
<text x='16' y='117' font-size='12' fill='#1F2933'>Jornada máxima da equipe (CLT): 44 h</text>
<rect x='16' y='122' width='399' height='18' rx='3' fill='#9AA3AB'/>
<text x='421' y='134' font-size='12' font-weight='600' fill='#1F2933'>44 h</text>
<text x='16' y='165' font-size='12' fill='#1F2933'>Regimento típico: seg–sex 8h–17h, 1 h de almoço</text>
<rect x='16' y='170' width='362' height='18' rx='3' fill='#0A7FA0'/>
<text x='384' y='182' font-size='12' font-weight='600' fill='#1F2933'>40 h</text>
<text x='16' y='213' font-size='12' fill='#1F2933'>Regimento restritivo: seg–sex 9h–16h, pausa 12h–14h</text>
<rect x='16' y='218' width='226' height='18' rx='3' fill='#D4691A'/>
<text x='248' y='230' font-size='12' font-weight='600' fill='#1F2933'>25 h</text>
<text x='16' y='286' font-size='11' fill='#5B6670'>Fontes: PL 403/2026 (Quadro 4B.1) e Decreto 60.581/2021; CF art. 7º, XIII; regimentos típicos</text>
<text x='16' y='299' font-size='11' fill='#5B6670'>(Sindiconet, Blink, Unihands, 2025–26).</text>
</svg>