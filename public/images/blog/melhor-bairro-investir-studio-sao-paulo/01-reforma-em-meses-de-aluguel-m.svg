<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 589" width="420" height="589" role="img" aria-labelledby="t d"><title id="t">Em Brooklin e Vila Olímpia, 24 meses de aluguel pagam a reforma do studio</title><desc id="d">Reforma em meses de aluguel = custo médio da reforma por m² dividido pelo aluguel mensal por m² do bairro, em valores brutos. Vila Olímpia: R$ 2.819 ÷ R$ 116,50 = 24 meses. Brooklin: R$ 2.624 ÷ R$ 109,30 = 24 meses. Pinheiros: R$ 2.995 ÷ R$ 105,40 = 28 meses. Bela Vista (reforma a R$ 3.160 por m²) e Perdizes (R$ 2.903 por m²) não têm índice público de aluguel por m², por isso não foram calculados. Fontes: orçamentos de reforma completa enviados pela Bewild até 17/10/2026 e Índice QuintoAndar Imovelweb, julho de 2026.</desc><style>.s{font-family:Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif}.m{font-family:'JetBrains Mono', Menlo, Consolas, monospace}</style><rect width="420" height="589" fill="#FFFFFF"/><text x="16" y="34" class="m" font-size="12" font-weight="700" fill="#11355B" letter-spacing="1.5">LONGA TEMPORADA</text><text x="16" y="60" class="s" font-size="17" font-weight="700" fill="#1A2332" letter-spacing="-0.3">Em Brooklin e Vila Olímpia,</text><text x="16" y="83" class="s" font-size="17" font-weight="700" fill="#1A2332" letter-spacing="-0.3">24 meses de aluguel pagam</text><text x="16" y="106" class="s" font-size="17" font-weight="700" fill="#1A2332" letter-spacing="-0.3">a reforma do studio</text><text x="16" y="129" class="s" font-size="13" fill="#5A6472">Custo médio da reforma por m² ÷ aluguel</text><text x="16" y="147" class="s" font-size="13" fill="#5A6472">mensal por m² do bairro, em valores brutos.</text><text x="16" y="183" class="m" font-size="12" font-weight="700" fill="#11355B">MESES DE ALUGUEL</text><text x="404" y="183" class="m" font-size="12" font-weight="700" fill="#11355B" text-anchor="end">REFORMA ÷ ALUGUEL, R$/m²</text><text x="16" y="213" class="s" font-size="13" font-weight="600" fill="#1A2332">Vila Olímpia</text><text x="404" y="213" class="s" font-size="12" fill="#5A6472" text-anchor="end">2.819 ÷ 116,50</text><path d="M16,223 H212 Q216,223 216,227 V233 Q216,237 212,237 H16 Z" fill="#2F6FA8"/><text x="224" y="235" class="s" font-size="13" font-weight="700" fill="#1A2332">24 meses</text><text x="16" y="269" class="s" font-size="13" font-weight="600" fill="#1A2332">Brooklin</text><text x="404" y="269" class="s" font-size="12" fill="#5A6472" text-anchor="end">2.624 ÷ 109,30</text><path d="M16,279 H212 Q216,279 216,283 V289 Q216,293 212,293 H16 Z" fill="#2F6FA8"/><text x="224" y="291" class="s" font-size="13" font-weight="700" fill="#1A2332">24 meses</text><text x="16" y="325" class="s" font-size="13" font-weight="600" fill="#1A2332">Pinheiros</text><text x="404" y="325" class="s" font-size="12" fill="#5A6472" text-anchor="end">2.995 ÷ 105,40</text><path d="M16,335 H245.333 Q249.333,335 249.333,339 V345 Q249.333,349 245.333,349 H16 Z" fill="#2F6FA8"/><text x="257.333" y="347" class="s" font-size="13" font-weight="700" fill="#1A2332">28 meses</text><text x="16" y="381" class="s" font-size="13" font-weight="600" fill="#1A2332">Bela Vista</text><text x="404" y="381" class="s" font-size="12" fill="#5A6472" text-anchor="end">3.160 ÷ não divulgado</text><text x="16" y="403" class="s" font-size="12" fill="#5A6472">Sem índice público de aluguel: não calculado</text><text x="16" y="437" class="s" font-size="13" font-weight="600" fill="#1A2332">Perdizes</text><text x="404" y="437" class="s" font-size="12" fill="#5A6472" text-anchor="end">2.903 ÷ não divulgado</text><text x="16" y="459" class="s" font-size="12" fill="#5A6472">Sem índice público de aluguel: não calculado</text><text x="16" y="485" class="s" font-size="12" fill="#5A6472">Aluguel bruto: não desconta vacância,</text><text x="16" y="501" class="s" font-size="12" fill="#5A6472">administração nem imposto.</text><line x1="16" y1="519" x2="404" y2="519" stroke="#E7E2D9" stroke-width="1"/><text x="16" y="539" class="m" font-size="12" fill="#5A6472">Fontes: orçamentos Bewild (até 17/10/26);</text><text x="16" y="555" class="m" font-size="12" fill="#5A6472">QuintoAndar Imovelweb (jul/26)</text><text x="16" y="573" class="m" font-size="12" font-weight="700" fill="#11355B">bewild.com.br</text></svg>
