<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 560" width="420" height="560" role="img" aria-labelledby="t d"><title id="t">No Airbnb, Bela Vista e Pinheiros ocupam acima da média de São Paulo</title><desc id="d">Dispersão de ocupação e diária média no Airbnb, janeiro a setembro de 2026. Bela Vista: ocupação de 64% e diária de R$ 237. Pinheiros: 62% e R$ 300. Perdizes: 53% e R$ 254. Itaim Bibi, usado como referência para Vila Olímpia e Brooklin, que não têm dado público por bairro: 59% e R$ 359. Média da cidade de São Paulo: 60% e R$ 266. Fonte: Radar Bewild, com dados do GuestFavorites; todos os tipos de anúncio.</desc><style>.s{font-family:Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif}.m{font-family:'JetBrains Mono', Menlo, Consolas, monospace}</style><rect width="420" height="560" fill="#FFFFFF"/><text x="16" y="34" class="m" font-size="12" font-weight="700" fill="#11355B" letter-spacing="1.5">SHORT STAY</text><text x="16" y="60" class="s" font-size="17" font-weight="700" fill="#1A2332" letter-spacing="-0.3">No Airbnb, Bela Vista e Pinheiros</text><text x="16" y="83" class="s" font-size="17" font-weight="700" fill="#1A2332" letter-spacing="-0.3">ocupam acima da média de São Paulo</text><text x="16" y="106" class="s" font-size="13" fill="#5A6472">Ocupação e diária média por bairro,</text><text x="16" y="124" class="s" font-size="13" fill="#5A6472">jan–set/2026. Linhas: média da cidade.</text><text x="16" y="160" class="m" font-size="12" font-weight="700" fill="#11355B">OCUPAÇÃO</text><line x1="52" y1="372" x2="404" y2="372" stroke="#E7E2D9" stroke-width="1"/><text x="44" y="376" class="s" font-size="12" fill="#5A6472" text-anchor="end">50%</text><line x1="52" y1="317" x2="404" y2="317" stroke="#E7E2D9" stroke-width="1"/><text x="44" y="321" class="s" font-size="12" fill="#5A6472" text-anchor="end">55%</text><line x1="52" y1="262" x2="404" y2="262" stroke="#B9B1A3" stroke-width="1"/><text x="44" y="266" class="s" font-size="12" fill="#5A6472" text-anchor="end">60%</text><line x1="52" y1="207" x2="404" y2="207" stroke="#E7E2D9" stroke-width="1"/><text x="44" y="211" class="s" font-size="12" fill="#5A6472" text-anchor="end">65%</text><line x1="153.2" y1="174" x2="153.2" y2="394" stroke="#B9B1A3" stroke-width="1"/><text x="118" y="412" class="s" font-size="12" fill="#5A6472" text-anchor="middle">R$ 250</text><text x="228" y="412" class="s" font-size="12" fill="#5A6472" text-anchor="middle">R$ 300</text><text x="338" y="412" class="s" font-size="12" fill="#5A6472" text-anchor="middle">R$ 350</text><text x="404" y="432" class="m" font-size="12" font-weight="700" fill="#11355B" text-anchor="end">DIÁRIA MÉDIA</text><text x="159.2" y="186" class="s" font-size="12" fill="#5A6472" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">média de SP: R$ 266</text><text x="404" y="256" class="s" font-size="12" fill="#5A6472" text-anchor="end" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">média de SP: 60%</text><circle cx="89.4" cy="218" r="7" fill="#2F6FA8" stroke="#FFFFFF" stroke-width="2"/><text x="89.4" y="188" class="s" font-size="13" font-weight="700" fill="#1A2332" text-anchor="middle" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Bela Vista</text><text x="89.4" y="204" class="s" font-size="12" fill="#5A6472" text-anchor="middle" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">64% · R$ 237</text><circle cx="228" cy="240" r="7" fill="#2F6FA8" stroke="#FFFFFF" stroke-width="2"/><text x="228" y="210" class="s" font-size="13" font-weight="700" fill="#1A2332" text-anchor="middle" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Pinheiros</text><text x="228" y="226" class="s" font-size="12" fill="#5A6472" text-anchor="middle" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">62% · R$ 300</text><circle cx="126.8" cy="339" r="7" fill="#2F6FA8" stroke="#FFFFFF" stroke-width="2"/><text x="128.8" y="363" class="s" font-size="13" font-weight="700" fill="#1A2332" text-anchor="end" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Perdizes</text><text x="128.8" y="379" class="s" font-size="12" fill="#5A6472" text-anchor="end" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">53% · R$ 254</text><circle cx="357.8" cy="273" r="6" fill="#FFFFFF" stroke="#2F6FA8" stroke-width="2.5"/><text x="357.8" y="297" class="s" font-size="13" font-weight="700" fill="#1A2332" text-anchor="middle" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Itaim Bibi*</text><text x="357.8" y="313" class="s" font-size="12" fill="#5A6472" text-anchor="middle" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">59% · R$ 359</text><text x="16" y="456" class="s" font-size="12" fill="#5A6472">*Referência para Vila Olímpia e Brooklin,</text><text x="16" y="472" class="s" font-size="12" fill="#5A6472">que não têm dado público por bairro.</text><line x1="16" y1="490" x2="404" y2="490" stroke="#E7E2D9" stroke-width="1"/><text x="16" y="510" class="m" font-size="12" fill="#5A6472">Fonte: Radar Bewild (GuestFavorites,</text><text x="16" y="526" class="m" font-size="12" fill="#5A6472">jan–set/26), todos os tipos de anúncio</text><text x="16" y="544" class="m" font-size="12" font-weight="700" fill="#11355B">bewild.com.br</text></svg>
