<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 0 380 537" width="380" height="537" role="img" aria-labelledby="t d"><title id="t">Meses de aluguel bruto que pagam a reforma do studio</title><desc id="d">Vila Olímpia: 24 meses (R$ 2.795 ÷ R$ 116,50 por m²); Brooklin: 25 meses (R$ 2.715 ÷ R$ 109,30 por m²); Pinheiros: 28 meses (R$ 2.971 ÷ R$ 105,40 por m²). Bela Vista e Perdizes não têm índice público de aluguel e não foram calculados.</desc><style>.s{font-family:Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif}.m{font-family:'JetBrains Mono', Menlo, Consolas, monospace}</style><rect width="420" height="537" fill="#FFFFFF"/><text x="32" y="44" class="m" font-size="13" font-weight="700" fill="#11355B" letter-spacing="1.5">REFORMA EM MESES DE ALUGUEL</text><text x="32" y="78" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">De 24 a 28 meses de</text><text x="32" y="108" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">aluguel bruto pagam a</text><text x="32" y="138" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">reforma</text><text x="32" y="170" class="s" font-size="15" fill="#5A6472">Mediana da reforma por m² no bairro</text><text x="32" y="191" class="s" font-size="15" fill="#5A6472">dividida pelo aluguel mensal por m². Sem</text><text x="32" y="212" class="s" font-size="15" fill="#5A6472">vacância, administração nem imposto.</text><text x="32" y="257" class="s" font-size="15" font-weight="700" fill="#1A2332">Vila Olímpia</text><text x="388" y="257" class="m" font-size="13" fill="#5A6472" text-anchor="end">R$ 2.795 ÷ R$ 116,50</text><rect x="32.0" y="267.0" width="212.7" height="22.0" rx="4" fill="#2F6FA8"/><text x="252.724" y="284" class="s" font-size="15" font-weight="700" fill="#1A2332">24 meses</text><text x="32" y="323" class="s" font-size="15" font-weight="700" fill="#1A2332">Brooklin</text><text x="388" y="323" class="m" font-size="13" fill="#5A6472" text-anchor="end">R$ 2.715 ÷ R$ 109,30</text><rect x="32.0" y="333.0" width="220.2" height="22.0" rx="4" fill="#2F6FA8"/><text x="260.247" y="350" class="s" font-size="15" font-weight="700" fill="#1A2332">25 meses</text><text x="32" y="389" class="s" font-size="15" font-weight="700" fill="#1A2332">Pinheiros</text><text x="388" y="389" class="m" font-size="13" fill="#5A6472" text-anchor="end">R$ 2.971 ÷ R$ 105,40</text><rect x="32.0" y="399.0" width="249.9" height="22.0" rx="4" fill="#D07A3E"/><text x="289.932" y="416" class="s" font-size="15" font-weight="700" fill="#1A2332">28 meses</text><text x="32" y="455" class="s" font-size="13" fill="#5A6472">Bela Vista e Perdizes: sem índice público de aluguel.</text><line x1="32.0" y1="475.0" x2="388.0" y2="475.0" stroke="#E7E2D9" stroke-width="1"/><text x="32" y="497" class="m" font-size="12" fill="#5A6472">Fontes: Índice Bewild; QuintoAndar jul/2026</text><text x="32" y="517" class="m" font-size="13" font-weight="700" fill="#11355B">bewild.com.br</text></svg>
