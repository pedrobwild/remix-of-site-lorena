<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 708" width="420" height="708" role="img" aria-labelledby="t d"><title id="t">A procura por reforma chega anos depois do lançamento</title><desc id="d">Unidades residenciais lançadas em 12 meses, por distrito (Secovi-SP), ao lado das pessoas com imóvel no bairro que pediram orçamento de reforma à Bewild até 17/10/2026. Vila Mariana: 4.748 unidades lançadas e 35 pessoas. Saúde: 3.408 unidades (maio de 2025 a abril de 2026) e 3 pessoas. Pinheiros: 2.785 unidades e 72 pessoas. Perdizes: 617 unidades e 43 pessoas. Período dos lançamentos: junho de 2025 a maio de 2026, exceto Saúde. Brooklin, Bela Vista e Vila Olímpia não têm o acumulado de 12 meses divulgado.</desc><style>.s{font-family:Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif}.m{font-family:'JetBrains Mono', Menlo, Consolas, monospace}</style><rect width="420" height="708" fill="#FFFFFF"/><text x="16" y="34" class="m" font-size="12" font-weight="700" fill="#11355B" letter-spacing="1.5">LANÇAMENTOS E PROCURA</text><text x="16" y="60" class="s" font-size="17" font-weight="700" fill="#1A2332" letter-spacing="-0.3">A procura por reforma chega</text><text x="16" y="83" class="s" font-size="17" font-weight="700" fill="#1A2332" letter-spacing="-0.3">anos depois do lançamento</text><text x="16" y="106" class="s" font-size="13" fill="#5A6472">Perdizes lança pouco e tem mais pedidos que</text><text x="16" y="124" class="s" font-size="13" fill="#5A6472">a Vila Mariana, líder em lançamentos.</text><text x="16" y="160" class="m" font-size="12" font-weight="700" fill="#11355B">LANÇAMENTOS EM 12 MESES (UNIDADES)</text><text x="16" y="188" class="s" font-size="13" font-weight="600" fill="#1A2332">Vila Mariana</text><path d="M16,197 H302 Q306,197 306,201 V207 Q306,211 302,211 H16 Z" fill="#2F6FA8"/><text x="314" y="209" class="s" font-size="13" font-weight="700" fill="#1A2332">4.748</text><text x="16" y="234" class="s" font-size="13" font-weight="600" fill="#1A2332">Saúde*</text><path d="M16,243 H220.155 Q224.155,243 224.155,247 V253 Q224.155,257 220.155,257 H16 Z" fill="#2F6FA8"/><text x="232.155" y="255" class="s" font-size="13" font-weight="700" fill="#1A2332">3.408</text><text x="16" y="280" class="s" font-size="13" font-weight="600" fill="#1A2332">Pinheiros</text><path d="M16,289 H182.103 Q186.103,289 186.103,293 V299 Q186.103,303 182.103,303 H16 Z" fill="#2F6FA8"/><text x="194.103" y="301" class="s" font-size="13" font-weight="700" fill="#1A2332">2.785</text><text x="16" y="326" class="s" font-size="13" font-weight="600" fill="#1A2332">Perdizes</text><path d="M16,335 H49.6853 Q53.6853,335 53.6853,339 V345 Q53.6853,349 49.6853,349 H16 Z" fill="#2F6FA8"/><text x="61.6853" y="347" class="s" font-size="13" font-weight="700" fill="#1A2332">617</text><text x="16" y="382" class="m" font-size="12" font-weight="700" fill="#11355B">PEDIDOS DE REFORMA NA BEWILD (PESSOAS)</text><text x="16" y="410" class="s" font-size="13" font-weight="600" fill="#1A2332">Vila Mariana</text><path d="M16,419 H152.972 Q156.972,419 156.972,423 V429 Q156.972,433 152.972,433 H16 Z" fill="#D07A3E"/><text x="164.972" y="431" class="s" font-size="13" font-weight="700" fill="#1A2332">35</text><text x="16" y="456" class="s" font-size="13" font-weight="600" fill="#1A2332">Saúde*</text><path d="M16,465 H24.0833 Q28.0833,465 28.0833,469 V475 Q28.0833,479 24.0833,479 H16 Z" fill="#D07A3E"/><text x="36.0833" y="477" class="s" font-size="13" font-weight="700" fill="#1A2332">3</text><text x="16" y="502" class="s" font-size="13" font-weight="600" fill="#1A2332">Pinheiros</text><path d="M16,511 H302 Q306,511 306,515 V521 Q306,525 302,525 H16 Z" fill="#D07A3E"/><text x="314" y="523" class="s" font-size="13" font-weight="700" fill="#1A2332">72</text><text x="16" y="548" class="s" font-size="13" font-weight="600" fill="#1A2332">Perdizes</text><path d="M16,557 H185.194 Q189.194,557 189.194,561 V567 Q189.194,571 185.194,571 H16 Z" fill="#D07A3E"/><text x="197.194" y="569" class="s" font-size="13" font-weight="700" fill="#1A2332">43</text><text x="16" y="602" class="s" font-size="12" fill="#5A6472">*Saúde: mai/2025 a abr/2026; demais bairros,</text><text x="16" y="618" class="s" font-size="12" fill="#5A6472">jun/2025 a mai/2026. Brooklin, Bela Vista e</text><text x="16" y="634" class="s" font-size="12" fill="#5A6472">Vila Olímpia: acumulado não divulgado.</text><line x1="16" y1="654" x2="404" y2="654" stroke="#E7E2D9" stroke-width="1"/><text x="16" y="674" class="m" font-size="12" fill="#5A6472">Fontes: Secovi-SP; CRM Bewild (até 17/10/26)</text><text x="16" y="692" class="m" font-size="12" font-weight="700" fill="#11355B">bewild.com.br</text></svg>
