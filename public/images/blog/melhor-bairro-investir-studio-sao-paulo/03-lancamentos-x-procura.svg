<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 506" width="720" height="506" role="img" aria-labelledby="t d"><title id="t">A procura por reforma chega anos depois do lançamento</title><desc id="d">Unidades residenciais lançadas em 12 meses, por distrito (Secovi-SP), ao lado das pessoas com imóvel no bairro que pediram orçamento de reforma à Bewild até 17/10/2026. Vila Mariana: 4.748 unidades lançadas e 35 pessoas. Saúde: 3.408 unidades (maio de 2025 a abril de 2026) e 3 pessoas. Pinheiros: 2.785 unidades e 72 pessoas. Perdizes: 617 unidades e 43 pessoas. Período dos lançamentos: junho de 2025 a maio de 2026, exceto Saúde. Brooklin, Bela Vista e Vila Olímpia não têm o acumulado de 12 meses divulgado.</desc><style>.s{font-family:Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif}.m{font-family:'JetBrains Mono', Menlo, Consolas, monospace}</style><rect width="720" height="506" fill="#FFFFFF"/><text x="32" y="34" class="m" font-size="12" font-weight="700" fill="#11355B" letter-spacing="1.5">LANÇAMENTOS E PROCURA</text><text x="32" y="66" class="s" font-size="22" font-weight="700" fill="#1A2332" letter-spacing="-0.3">A procura por reforma chega anos</text><text x="32" y="95" class="s" font-size="22" font-weight="700" fill="#1A2332" letter-spacing="-0.3">depois do lançamento</text><text x="32" y="126" class="s" font-size="14" fill="#5A6472">Perdizes lança pouco e tem mais pedidos que a Vila Mariana, líder em lançamentos.</text><text x="32" y="164" class="m" font-size="12" font-weight="700" fill="#11355B">LANÇAMENTOS EM 12 MESES (UNIDADES)</text><text x="392" y="164" class="m" font-size="12" font-weight="700" fill="#11355B">PEDIDOS DE REFORMA NA BEWILD (PESSOAS)</text><text x="32" y="194" class="s" font-size="14" font-weight="600" fill="#1A2332">Vila Mariana</text><path d="M32,204 H288 Q292,204 292,208 V214 Q292,218 288,218 H32 Z" fill="#2F6FA8"/><text x="300" y="216" class="s" font-size="14" font-weight="700" fill="#1A2332">4.748</text><text x="392" y="194" class="s" font-size="14" font-weight="600" fill="#1A2332">Vila Mariana</text><path d="M392,204 H499.806 Q503.806,204 503.806,208 V214 Q503.806,218 499.806,218 H392 Z" fill="#D07A3E"/><text x="511.806" y="216" class="s" font-size="14" font-weight="700" fill="#1A2332">35</text><text x="32" y="250" class="s" font-size="14" font-weight="600" fill="#1A2332">Saúde*</text><path d="M32,260 H214.622 Q218.622,260 218.622,264 V270 Q218.622,274 214.622,274 H32 Z" fill="#2F6FA8"/><text x="226.622" y="272" class="s" font-size="14" font-weight="700" fill="#1A2332">3.408</text><text x="392" y="250" class="s" font-size="14" font-weight="600" fill="#1A2332">Saúde*</text><path d="M392,260 H397.583 Q401.583,260 401.583,264 V270 Q401.583,274 397.583,274 H392 Z" fill="#D07A3E"/><text x="409.583" y="272" class="s" font-size="14" font-weight="700" fill="#1A2332">3</text><text x="32" y="306" class="s" font-size="14" font-weight="600" fill="#1A2332">Pinheiros</text><path d="M32,316 H180.506 Q184.506,316 184.506,320 V326 Q184.506,330 180.506,330 H32 Z" fill="#2F6FA8"/><text x="192.506" y="328" class="s" font-size="14" font-weight="700" fill="#1A2332">2.785</text><text x="392" y="306" class="s" font-size="14" font-weight="600" fill="#1A2332">Pinheiros</text><path d="M392,316 H618 Q622,316 622,320 V326 Q622,330 618,330 H392 Z" fill="#D07A3E"/><text x="630" y="328" class="s" font-size="14" font-weight="700" fill="#1A2332">72</text><text x="32" y="362" class="s" font-size="14" font-weight="600" fill="#1A2332">Perdizes</text><path d="M32,372 H61.7869 Q65.7869,372 65.7869,376 V382 Q65.7869,386 61.7869,386 H32 Z" fill="#2F6FA8"/><text x="73.7869" y="384" class="s" font-size="14" font-weight="700" fill="#1A2332">617</text><text x="392" y="362" class="s" font-size="14" font-weight="600" fill="#1A2332">Perdizes</text><path d="M392,372 H525.361 Q529.361,372 529.361,376 V382 Q529.361,386 525.361,386 H392 Z" fill="#D07A3E"/><text x="537.361" y="384" class="s" font-size="14" font-weight="700" fill="#1A2332">43</text><text x="32" y="412" class="s" font-size="13" fill="#5A6472">*Saúde: mai/2025 a abr/2026; demais bairros, jun/2025 a mai/2026.</text><text x="32" y="430" class="s" font-size="13" fill="#5A6472">Brooklin, Bela Vista e Vila Olímpia: acumulado de 12 meses não divulgado.</text><line x1="32" y1="452" x2="688" y2="452" stroke="#E7E2D9" stroke-width="1"/><text x="32" y="472" class="m" font-size="12" fill="#5A6472">Fontes: Secovi-SP (lançamentos por distrito); CRM Bewild (até 17/10/26)</text><text x="32" y="490" class="m" font-size="12" font-weight="700" fill="#11355B">bewild.com.br</text></svg>
