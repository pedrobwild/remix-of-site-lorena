<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" width="720" height="540" role="img" aria-labelledby="t d"><title id="t">Em Brooklin e Vila Olímpia, 24 meses de aluguel pagam a reforma do studio</title><desc id="d">Reforma em meses de aluguel = custo médio da reforma por m² dividido pelo aluguel mensal por m² do bairro, em valores brutos. Vila Olímpia: R$ 2.819 ÷ R$ 116,50 = 24 meses. Brooklin: R$ 2.624 ÷ R$ 109,30 = 24 meses. Pinheiros: R$ 2.995 ÷ R$ 105,40 = 28 meses. Bela Vista (reforma a R$ 3.160 por m²) e Perdizes (R$ 2.903 por m²) não têm índice público de aluguel por m², por isso não foram calculados. Fontes: orçamentos de reforma completa enviados pela Bewild até 17/10/2026 e Índice QuintoAndar Imovelweb, julho de 2026.</desc><style>.s{font-family:Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif}.m{font-family:'JetBrains Mono', Menlo, Consolas, monospace}</style><rect width="720" height="540" fill="#FFFFFF"/><text x="32" y="34" class="m" font-size="12" font-weight="700" fill="#11355B" letter-spacing="1.5">LONGA TEMPORADA</text><text x="32" y="66" class="s" font-size="22" font-weight="700" fill="#1A2332" letter-spacing="-0.3">Em Brooklin e Vila Olímpia, 24 meses</text><text x="32" y="95" class="s" font-size="22" font-weight="700" fill="#1A2332" letter-spacing="-0.3">de aluguel pagam a reforma do studio</text><text x="32" y="126" class="s" font-size="14" fill="#5A6472">Custo médio da reforma por m² ÷ aluguel mensal por m² do bairro, em valores brutos.</text><text x="32" y="164" class="m" font-size="12" font-weight="700" fill="#11355B">MESES DE ALUGUEL</text><text x="688" y="164" class="m" font-size="12" font-weight="700" fill="#11355B" text-anchor="end">REFORMA ÷ ALUGUEL, R$/m²</text><text x="32" y="194" class="s" font-size="14" font-weight="600" fill="#1A2332">Vila Olímpia</text><text x="688" y="194" class="s" font-size="13" fill="#5A6472" text-anchor="end">2.819 ÷ 116,50</text><path d="M32,204 H380 Q384,204 384,208 V214 Q384,218 380,218 H32 Z" fill="#2F6FA8"/><text x="392" y="216" class="s" font-size="14" font-weight="700" fill="#1A2332">24 meses</text><text x="32" y="250" class="s" font-size="14" font-weight="600" fill="#1A2332">Brooklin</text><text x="688" y="250" class="s" font-size="13" fill="#5A6472" text-anchor="end">2.624 ÷ 109,30</text><path d="M32,260 H380 Q384,260 384,264 V270 Q384,274 380,274 H32 Z" fill="#2F6FA8"/><text x="392" y="272" class="s" font-size="14" font-weight="700" fill="#1A2332">24 meses</text><text x="32" y="306" class="s" font-size="14" font-weight="600" fill="#1A2332">Pinheiros</text><text x="688" y="306" class="s" font-size="13" fill="#5A6472" text-anchor="end">2.995 ÷ 105,40</text><path d="M32,316 H438.667 Q442.667,316 442.667,320 V326 Q442.667,330 438.667,330 H32 Z" fill="#2F6FA8"/><text x="450.667" y="328" class="s" font-size="14" font-weight="700" fill="#1A2332">28 meses</text><text x="32" y="362" class="s" font-size="14" font-weight="600" fill="#1A2332">Bela Vista</text><text x="688" y="362" class="s" font-size="13" fill="#5A6472" text-anchor="end">3.160 ÷ não divulgado</text><text x="32" y="384" class="s" font-size="13" fill="#5A6472">Sem índice público de aluguel: não calculado</text><text x="32" y="418" class="s" font-size="14" font-weight="600" fill="#1A2332">Perdizes</text><text x="688" y="418" class="s" font-size="13" fill="#5A6472" text-anchor="end">2.903 ÷ não divulgado</text><text x="32" y="440" class="s" font-size="13" fill="#5A6472">Sem índice público de aluguel: não calculado</text><text x="32" y="466" class="s" font-size="13" fill="#5A6472">Aluguel bruto: a conta não desconta vacância, administração nem imposto.</text><line x1="32" y1="486" x2="688" y2="486" stroke="#E7E2D9" stroke-width="1"/><text x="32" y="506" class="m" font-size="12" fill="#5A6472">Fontes: orçamentos Bewild (até 17/10/26); Índice QuintoAndar Imovelweb (jul/26)</text><text x="32" y="524" class="m" font-size="12" font-weight="700" fill="#11355B">bewild.com.br</text></svg>
