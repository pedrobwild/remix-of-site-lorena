<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 489" width="720" height="587" role="img" aria-labelledby="t d"><title id="t">Meses de aluguel bruto que pagam a reforma do studio</title><desc id="d">Vila Olímpia: 24 meses (R$ 2.795 ÷ R$ 116,50 por m²); Brooklin: 25 meses (R$ 2.715 ÷ R$ 109,30 por m²); Pinheiros: 28 meses (R$ 2.971 ÷ R$ 105,40 por m²). Bela Vista e Perdizes não têm índice público de aluguel e não foram calculados.</desc><style>.s{font-family:Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif}.m{font-family:'JetBrains Mono', Menlo, Consolas, monospace}</style><rect width="600" height="489" fill="#FFFFFF"/><text x="32" y="44" class="m" font-size="13" font-weight="700" fill="#11355B" letter-spacing="1.5">REFORMA EM MESES DE ALUGUEL</text><text x="32" y="78" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">De 24 a 28 meses de aluguel bruto</text><text x="32" y="108" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">pagam a reforma</text><text x="32" y="140" class="s" font-size="15" fill="#5A6472">Mediana da reforma por m² no bairro dividida pelo</text><text x="32" y="161" class="s" font-size="15" fill="#5A6472">aluguel mensal por m². Sem vacância, administração nem</text><text x="32" y="182" class="s" font-size="15" fill="#5A6472">imposto.</text><text x="32" y="227" class="s" font-size="15" font-weight="700" fill="#1A2332">Vila Olímpia</text><text x="568" y="227" class="m" font-size="12" fill="#5A6472" text-anchor="end">R$ 2.795 ÷ R$ 116,50</text><rect x="32.0" y="237.0" width="356.7" height="22.0" rx="4" fill="#2F6FA8"/><text x="396.672" y="254" class="s" font-size="15" font-weight="700" fill="#1A2332">24 meses</text><text x="32" y="293" class="s" font-size="15" font-weight="700" fill="#1A2332">Brooklin</text><text x="568" y="293" class="m" font-size="12" fill="#5A6472" text-anchor="end">R$ 2.715 ÷ R$ 109,30</text><rect x="32.0" y="303.0" width="369.3" height="22.0" rx="4" fill="#2F6FA8"/><text x="409.286" y="320" class="s" font-size="15" font-weight="700" fill="#1A2332">25 meses</text><text x="32" y="359" class="s" font-size="15" font-weight="700" fill="#1A2332">Pinheiros</text><text x="568" y="359" class="m" font-size="12" fill="#5A6472" text-anchor="end">R$ 2.971 ÷ R$ 105,40</text><rect x="32.0" y="369.0" width="419.1" height="22.0" rx="4" fill="#D07A3E"/><text x="459.059" y="386" class="s" font-size="15" font-weight="700" fill="#1A2332">28 meses</text><text x="32" y="425" class="s" font-size="12.5" fill="#5A6472">Bela Vista e Perdizes: sem índice público de aluguel.</text><line x1="32.0" y1="445.0" x2="568.0" y2="445.0" stroke="#E7E2D9" stroke-width="1"/><text x="32" y="467" class="m" font-size="13" fill="#5A6472">Fontes: Índice Bewild; QuintoAndar jul/2026</text><text x="568" y="467" class="m" font-size="13" font-weight="700" fill="#11355B" text-anchor="end">bewild.com.br</text></svg>
