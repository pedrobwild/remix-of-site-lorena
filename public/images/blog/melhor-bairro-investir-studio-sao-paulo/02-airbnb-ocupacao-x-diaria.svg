<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 554" width="720" height="554" role="img" aria-labelledby="t d"><title id="t">No Airbnb, Bela Vista e Pinheiros ocupam acima da média de São Paulo</title><desc id="d">Dispersão de ocupação e diária média no Airbnb, janeiro a setembro de 2026. Bela Vista: ocupação de 64% e diária de R$ 237. Pinheiros: 62% e R$ 300. Perdizes: 53% e R$ 254. Itaim Bibi, usado como referência para Vila Olímpia e Brooklin, que não têm dado público por bairro: 59% e R$ 359. Média da cidade de São Paulo: 60% e R$ 266. Fonte: Radar Bewild, com dados do GuestFavorites; todos os tipos de anúncio.</desc><style>.s{font-family:Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif}.m{font-family:'JetBrains Mono', Menlo, Consolas, monospace}</style><rect width="720" height="554" fill="#FFFFFF"/><text x="32" y="34" class="m" font-size="12" font-weight="700" fill="#11355B" letter-spacing="1.5">SHORT STAY</text><text x="32" y="66" class="s" font-size="22" font-weight="700" fill="#1A2332" letter-spacing="-0.3">No Airbnb, Bela Vista e Pinheiros ocupam</text><text x="32" y="95" class="s" font-size="22" font-weight="700" fill="#1A2332" letter-spacing="-0.3">acima da média de São Paulo</text><text x="32" y="126" class="s" font-size="14" fill="#5A6472">Ocupação e diária média por bairro, jan–set/2026. Linhas: média da cidade.</text><text x="32" y="164" class="m" font-size="12" font-weight="700" fill="#11355B">OCUPAÇÃO</text><line x1="76" y1="394" x2="688" y2="394" stroke="#E7E2D9" stroke-width="1"/><text x="68" y="398" class="s" font-size="12" fill="#5A6472" text-anchor="end">50%</text><line x1="76" y1="334" x2="688" y2="334" stroke="#E7E2D9" stroke-width="1"/><text x="68" y="338" class="s" font-size="12" fill="#5A6472" text-anchor="end">55%</text><line x1="76" y1="274" x2="688" y2="274" stroke="#B9B1A3" stroke-width="1"/><text x="68" y="278" class="s" font-size="12" fill="#5A6472" text-anchor="end">60%</text><line x1="76" y1="214" x2="688" y2="214" stroke="#E7E2D9" stroke-width="1"/><text x="68" y="218" class="s" font-size="12" fill="#5A6472" text-anchor="end">65%</text><line x1="251.95" y1="178" x2="251.95" y2="418" stroke="#B9B1A3" stroke-width="1"/><text x="190.75" y="436" class="s" font-size="12" fill="#5A6472" text-anchor="middle">R$ 250</text><text x="382" y="436" class="s" font-size="12" fill="#5A6472" text-anchor="middle">R$ 300</text><text x="573.25" y="436" class="s" font-size="12" fill="#5A6472" text-anchor="middle">R$ 350</text><text x="688" y="456" class="m" font-size="12" font-weight="700" fill="#11355B" text-anchor="end">DIÁRIA MÉDIA</text><text x="257.95" y="190" class="s" font-size="12" fill="#5A6472" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">média de SP: R$ 266</text><text x="688" y="268" class="s" font-size="12" fill="#5A6472" text-anchor="end" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">média de SP: 60%</text><circle cx="141.025" cy="226" r="7" fill="#2F6FA8" stroke="#FFFFFF" stroke-width="2"/><text x="141.025" y="196" class="s" font-size="14" font-weight="700" fill="#1A2332" text-anchor="middle" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Bela Vista</text><text x="141.025" y="212" class="s" font-size="12" fill="#5A6472" text-anchor="middle" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">64% · R$ 237</text><circle cx="382" cy="250" r="7" fill="#2F6FA8" stroke="#FFFFFF" stroke-width="2"/><text x="395" y="247" class="s" font-size="14" font-weight="700" fill="#1A2332" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Pinheiros</text><text x="395" y="263" class="s" font-size="12" fill="#5A6472" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">62% · R$ 300</text><circle cx="206.05" cy="358" r="7" fill="#2F6FA8" stroke="#FFFFFF" stroke-width="2"/><text x="193.05" y="355" class="s" font-size="14" font-weight="700" fill="#1A2332" text-anchor="end" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Perdizes</text><text x="193.05" y="371" class="s" font-size="12" fill="#5A6472" text-anchor="end" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">53% · R$ 254</text><circle cx="607.675" cy="286" r="6" fill="#FFFFFF" stroke="#2F6FA8" stroke-width="2.5"/><text x="594.675" y="295" class="s" font-size="14" font-weight="700" fill="#1A2332" text-anchor="end" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Itaim Bibi*</text><text x="594.675" y="311" class="s" font-size="12" fill="#5A6472" text-anchor="end" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">59% · R$ 359</text><text x="32" y="480" class="s" font-size="13" fill="#5A6472">*Referência para Vila Olímpia e Brooklin, que não têm dado público por bairro.</text><line x1="32" y1="500" x2="688" y2="500" stroke="#E7E2D9" stroke-width="1"/><text x="32" y="520" class="m" font-size="12" fill="#5A6472">Fonte: Radar Bewild (GuestFavorites, jan–set/26), todos os tipos de anúncio</text><text x="32" y="538" class="m" font-size="12" font-weight="700" fill="#11355B">bewild.com.br</text></svg>
