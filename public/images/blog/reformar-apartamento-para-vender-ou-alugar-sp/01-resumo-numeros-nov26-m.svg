<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 0 380 993" width="380" height="993" role="img" aria-labelledby="t d"><title id="t">Reformar apartamento para vender ou alugar em SP: os números</title><desc id="d">Reforma completa a R$ 2.831 por m² na mediana de 585 orçamentos; 14% a 34% do preço de venda do imóvel conforme o bairro; cerca de 43 meses de aluguel bruto na média da cidade e 28 a 33 meses em Pinheiros, Itaim Bibi e Moema; preço de venda +3,64% e custo de construção +6,61% em 12 meses; R$ 80 mil de reforma comprovada zeram R$ 10.372 de imposto no exemplo.</desc><style>.s{font-family:Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif}.m{font-family:'JetBrains Mono', Menlo, Consolas, monospace}</style><rect width="420" height="993" fill="#FFFFFF"/><text x="32" y="44" class="m" font-size="13" font-weight="700" fill="#11355B" letter-spacing="1.5">VENDER OU ALUGAR</text><text x="32" y="78" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">Reformar apartamento para</text><text x="32" y="108" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">vender ou alugar em SP:</text><text x="32" y="138" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">os números</text><text x="32" y="170" class="s" font-size="15" fill="#5A6472">Índice Bewild de novembro de 2026</text><text x="32" y="191" class="s" font-size="15" fill="#5A6472">cruzado com FipeZap, INCC e regras da</text><text x="32" y="212" class="s" font-size="15" fill="#5A6472">Receita Federal.</text><rect x="32.0" y="247.0" width="356.0" height="96.0" rx="6" fill="#F6F3EE"/><rect x="32.0" y="247.0" width="4.0" height="96.0" rx="2" fill="#D07A3E"/><text x="52" y="289" class="s" font-size="28" font-weight="700" fill="#1A2332">R$ 2.831/m²</text><text x="52" y="313" class="s" font-size="13.5" fill="#5A6472">mediana da reforma completa em 585</text><text x="52" y="330" class="s" font-size="13.5" fill="#5A6472">orçamentos</text><rect x="32.0" y="359.0" width="356.0" height="96.0" rx="6" fill="#F6F3EE"/><rect x="32.0" y="359.0" width="4.0" height="96.0" rx="2" fill="#2F6FA8"/><text x="52" y="401" class="s" font-size="28" font-weight="700" fill="#1A2332">14% a 34%</text><text x="52" y="425" class="s" font-size="13.5" fill="#5A6472">do preço de venda do imóvel, conforme o</text><text x="52" y="442" class="s" font-size="13.5" fill="#5A6472">bairro</text><rect x="32.0" y="471.0" width="356.0" height="96.0" rx="6" fill="#F6F3EE"/><rect x="32.0" y="471.0" width="4.0" height="96.0" rx="2" fill="#2F6FA8"/><text x="52" y="513" class="s" font-size="28" font-weight="700" fill="#1A2332">43 meses</text><text x="52" y="537" class="s" font-size="13.5" fill="#5A6472">de aluguel bruto na média de São Paulo</text><rect x="32.0" y="583.0" width="356.0" height="96.0" rx="6" fill="#F6F3EE"/><rect x="32.0" y="583.0" width="4.0" height="96.0" rx="2" fill="#D07A3E"/><text x="52" y="625" class="s" font-size="28" font-weight="700" fill="#1A2332">28 a 33 meses</text><text x="52" y="649" class="s" font-size="13.5" fill="#5A6472">em Pinheiros, Itaim Bibi e Moema</text><rect x="32.0" y="695.0" width="356.0" height="96.0" rx="6" fill="#F6F3EE"/><rect x="32.0" y="695.0" width="4.0" height="96.0" rx="2" fill="#2F6FA8"/><text x="52" y="737" class="s" font-size="22" font-weight="700" fill="#1A2332">+3,64% e +6,61%</text><text x="52" y="761" class="s" font-size="13.5" fill="#5A6472">preço de venda e custo de construção em 12</text><text x="52" y="778" class="s" font-size="13.5" fill="#5A6472">meses</text><rect x="32.0" y="807.0" width="356.0" height="96.0" rx="6" fill="#F6F3EE"/><rect x="32.0" y="807.0" width="4.0" height="96.0" rx="2" fill="#2F6FA8"/><text x="52" y="849" class="s" font-size="22" font-weight="700" fill="#1A2332">R$ 10.372 a zero</text><text x="52" y="873" class="s" font-size="13.5" fill="#5A6472">imposto no exemplo, com R$ 80 mil</text><text x="52" y="890" class="s" font-size="13.5" fill="#5A6472">comprovados</text><line x1="32.0" y1="931.0" x2="388.0" y2="931.0" stroke="#E7E2D9" stroke-width="1"/><text x="32" y="953" class="m" font-size="12" fill="#5A6472">Fontes: Índice Bewild; FipeZap; FGV; Receita</text><text x="32" y="973" class="m" font-size="13" font-weight="700" fill="#11355B">bewild.com.br</text></svg>
