<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 588" width="720" height="706" role="img" aria-labelledby="t d"><title id="t">Reformar apartamento para vender ou alugar em SP: os números</title><desc id="d">Reforma completa a R$ 2.831 por m² na mediana de 585 orçamentos; 14% a 34% do preço de venda do imóvel conforme o bairro; cerca de 43 meses de aluguel bruto na média da cidade e 28 a 33 meses em Pinheiros, Itaim Bibi e Moema; preço de venda +3,64% e custo de construção +6,61% em 12 meses; R$ 80 mil de reforma comprovada zeram R$ 10.372 de imposto no exemplo.</desc><style>.s{font-family:Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif}.m{font-family:'JetBrains Mono', Menlo, Consolas, monospace}</style><rect width="600" height="588" fill="#FFFFFF"/><text x="32" y="44" class="m" font-size="13" font-weight="700" fill="#11355B" letter-spacing="1.5">VENDER OU ALUGAR</text><text x="32" y="78" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">Reformar apartamento para vender</text><text x="32" y="108" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">ou alugar em SP: os números</text><text x="32" y="140" class="s" font-size="15" fill="#5A6472">Índice Bewild de novembro de 2026 cruzado com FipeZap,</text><text x="32" y="161" class="s" font-size="15" fill="#5A6472">INCC e regras da Receita Federal.</text><rect x="32.0" y="196.0" width="260.0" height="96.0" rx="6" fill="#F6F3EE"/><rect x="32.0" y="196.0" width="4.0" height="96.0" rx="2" fill="#D07A3E"/><text x="52" y="238" class="s" font-size="28" font-weight="700" fill="#1A2332">R$ 2.831/m²</text><text x="52" y="262" class="s" font-size="13.5" fill="#5A6472">mediana da reforma completa em</text><text x="52" y="279" class="s" font-size="13.5" fill="#5A6472">585 orçamentos</text><rect x="308.0" y="196.0" width="260.0" height="96.0" rx="6" fill="#F6F3EE"/><rect x="308.0" y="196.0" width="4.0" height="96.0" rx="2" fill="#2F6FA8"/><text x="328" y="238" class="s" font-size="28" font-weight="700" fill="#1A2332">14% a 34%</text><text x="328" y="262" class="s" font-size="13.5" fill="#5A6472">do preço de venda do imóvel,</text><text x="328" y="279" class="s" font-size="13.5" fill="#5A6472">conforme o bairro</text><rect x="32.0" y="308.0" width="260.0" height="96.0" rx="6" fill="#F6F3EE"/><rect x="32.0" y="308.0" width="4.0" height="96.0" rx="2" fill="#2F6FA8"/><text x="52" y="350" class="s" font-size="28" font-weight="700" fill="#1A2332">43 meses</text><text x="52" y="374" class="s" font-size="13.5" fill="#5A6472">de aluguel bruto na média de São</text><text x="52" y="391" class="s" font-size="13.5" fill="#5A6472">Paulo</text><rect x="308.0" y="308.0" width="260.0" height="96.0" rx="6" fill="#F6F3EE"/><rect x="308.0" y="308.0" width="4.0" height="96.0" rx="2" fill="#D07A3E"/><text x="328" y="350" class="s" font-size="28" font-weight="700" fill="#1A2332">28 a 33 meses</text><text x="328" y="374" class="s" font-size="13.5" fill="#5A6472">em Pinheiros, Itaim Bibi e Moema</text><rect x="32.0" y="420.0" width="260.0" height="96.0" rx="6" fill="#F6F3EE"/><rect x="32.0" y="420.0" width="4.0" height="96.0" rx="2" fill="#2F6FA8"/><text x="52" y="462" class="s" font-size="22" font-weight="700" fill="#1A2332">+3,64% e +6,61%</text><text x="52" y="486" class="s" font-size="13.5" fill="#5A6472">preço de venda e custo de</text><text x="52" y="503" class="s" font-size="13.5" fill="#5A6472">construção em 12 meses</text><rect x="308.0" y="420.0" width="260.0" height="96.0" rx="6" fill="#F6F3EE"/><rect x="308.0" y="420.0" width="4.0" height="96.0" rx="2" fill="#2F6FA8"/><text x="328" y="462" class="s" font-size="22" font-weight="700" fill="#1A2332">R$ 10.372 a zero</text><text x="328" y="486" class="s" font-size="13.5" fill="#5A6472">imposto no exemplo, com R$ 80</text><text x="328" y="503" class="s" font-size="13.5" fill="#5A6472">mil comprovados</text><line x1="32.0" y1="544.0" x2="568.0" y2="544.0" stroke="#E7E2D9" stroke-width="1"/><