<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 0 380 607" width="380" height="607" role="img" aria-labelledby="t d"><title id="t">Valor do orçamento de reforma completa por faixa de metragem</title><desc id="d">Até 20 m²: R$ 66.969 (42 orçamentos); 20 a 24 m²: R$ 69.160 (64 orçamentos); 24 a 28 m²: R$ 70.537 (241 orçamentos); 28 a 32 m²: R$ 75.656 (107 orçamentos); 32 a 40 m²: R$ 95.459 (109 orçamentos); 40 a 45 m²: R$ 109.938 (22 orçamentos).</desc><style>.s{font-family:Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif}.m{font-family:'JetBrains Mono', Menlo, Consolas, monospace}</style><rect width="420" height="607" fill="#FFFFFF"/><text x="32" y="44" class="m" font-size="13" font-weight="700" fill="#11355B" letter-spacing="1.5">ORÇAMENTO POR METRAGEM</text><text x="32" y="78" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">Valor do orçamento de</text><text x="32" y="108" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">reforma completa por</text><text x="32" y="138" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">faixa de metragem</text><text x="32" y="170" class="s" font-size="15" fill="#5A6472">Orçamento mediano em cada faixa. Abaixo</text><text x="32" y="191" class="s" font-size="15" fill="#5A6472">de 28 m², o valor fica perto de R$ 70</text><text x="32" y="212" class="s" font-size="15" fill="#5A6472">mil; acima de 32 m², sobe de patamar.</text><text x="32" y="257" class="s" font-size="14" font-weight="600" fill="#1A2332">Até 20 m²</text><text x="388" y="257" class="m" font-size="13" fill="#5A6472" text-anchor="end">42 orç.</text><rect x="32.0" y="264.0" width="144.7" height="16.0" rx="4" fill="#2F6FA8"/><text x="184.653" y="277" class="s" font-size="13.5" font-weight="700" fill="#1A2332">R$ 66.969</text><text x="32" y="305" class="s" font-size="14" font-weight="600" fill="#1A2332">20 a 24 m²</text><text x="388" y="305" class="m" font-size="13" fill="#5A6472" text-anchor="end">64 orç.</text><rect x="32.0" y="312.0" width="149.4" height="16.0" rx="4" fill="#2F6FA8"/><text x="189.386" y="325" class="s" font-size="13.5" font-weight="700" fill="#1A2332">R$ 69.160</text><text x="32" y="353" class="s" font-size="14" font-weight="600" fill="#1A2332">24 a 28 m²</text><text x="388" y="353" class="m" font-size="13" fill="#5A6472" text-anchor="end">241 orç.</text><rect x="32.0" y="360.0" width="152.4" height="16.0" rx="4" fill="#2F6FA8"/><text x="192.36" y="373" class="s" font-size="13.5" font-weight="700" fill="#1A2332">R$ 70.537</text><text x="32" y="401" class="s" font-size="14" font-weight="600" fill="#1A2332">28 a 32 m²</text><text x="388" y="401" class="m" font-size="13" fill="#5A6472" text-anchor="end">107 orç.</text><rect x="32.0" y="408.0" width="163.4" height="16.0" rx="4" fill="#2F6FA8"/><text x="203.417" y="421" class="s" font-size="13.5" font-weight="700" fill="#1A2332">R$ 75.656</text><text x="32" y="449" class="s" font-size="14" font-weight="600" fill="#1A2332">32 a 40 m²</text><text x="388" y="449" class="m" font-size="13" fill="#5A6472" text-anchor="end">109 orç.</text><rect x="32.0" y="456.0" width="206.2" height="16.0" rx="4" fill="#D07A3E"/><text x="246.191" y="469" class="s" font-size="13.5" font-weight="700" fill="#1A2332">R$ 95.459</text><text x="32" y="497" class="s" font-size="14" font-weight="600" fill="#1A2332">40 a 45 m²</text><text x="388" y="497" class="m" font-size="13" fill="#5A6472" text-anchor="end">22 orç.</text><rect x="32.0" y="504.0" width="237.5" height="16.0" rx="4" fill="#D07A3E"/><text x="277.466" y="517" class="s" font-size="13.5" font-weight="700" fill="#1A2332">R$ 109.938</text><line x1="32.0" y1="545.0" x2="388.0" y2="545.0" stroke="#E7E2D9" stroke-width="1"/><text x="32" y="567" class="m" font-size="12" fill="#5A6472">Fonte: Índice Bewild, nov/2026, 585 orçamentos</text><text x="32" y="587" class="m" font-size="13" font-weight="700" fill="#11355B">bewild.com.br</text></svg>
