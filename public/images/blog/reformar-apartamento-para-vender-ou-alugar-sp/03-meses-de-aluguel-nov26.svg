<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 394" width="720" height="473" role="img" aria-labelledby="t d"><title id="t">Quantos meses de aluguel bruto cobrem a reforma completa</title><desc id="d">Pinheiros: 28,4 meses (aluguel de R$ 99,60 por m²); Itaim Bibi: 30,1 meses (aluguel de R$ 94,00 por m²); Moema: 33,4 meses (aluguel de R$ 84,80 por m²); São Paulo (média): 43,3 meses (aluguel de R$ 65,36 por m²).</desc><style>.s{font-family:Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif}.m{font-family:'JetBrains Mono', Menlo, Consolas, monospace}</style><rect width="600" height="394" fill="#FFFFFF"/><text x="32" y="44" class="m" font-size="13" font-weight="700" fill="#11355B" letter-spacing="1.5">REFORMA EM MESES DE ALUGUEL</text><text x="32" y="78" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">Quantos meses de aluguel bruto</text><text x="32" y="108" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">cobrem a reforma completa</text><text x="32" y="140" class="s" font-size="15" fill="#5A6472">Mediana da reforma por m² (R$ 2.831) dividida pelo</text><text x="32" y="161" class="s" font-size="15" fill="#5A6472">aluguel anunciado por m² ao mês.</text><text x="32" y="215" class="s" font-size="14" font-weight="600" fill="#1A2332">Pinheiros</text><rect x="200.0" y="202.0" width="95.4" height="16.0" rx="4" fill="#2F6FA8"/><text x="303.424" y="215" class="s" font-size="13.5" font-weight="700" fill="#1A2332">28,4 meses</text><text x="568" y="215" class="m" font-size="11.5" fill="#5A6472" text-anchor="end">R$ 99,60/m²</text><text x="32" y="251" class="s" font-size="14" font-weight="600" fill="#1A2332">Itaim Bibi</text><rect x="200.0" y="238.0" width="101.1" height="16.0" rx="4" fill="#2F6FA8"/><text x="309.136" y="251" class="s" font-size="13.5" font-weight="700" fill="#1A2332">30,1 meses</text><text x="568" y="251" class="m" font-size="11.5" fill="#5A6472" text-anchor="end">R$ 94,00/m²</text><text x="32" y="287" class="s" font-size="14" font-weight="600" fill="#1A2332">Moema</text><rect x="200.0" y="274.0" width="112.2" height="16.0" rx="4" fill="#2F6FA8"/><text x="320.224" y="287" class="s" font-size="13.5" font-weight="700" fill="#1A2332">33,4 meses</text><text x="568" y="287" class="m" font-size="11.5" fill="#5A6472" text-anchor="end">R$ 84,80/m²</text><text x="32" y="323" class="s" font-size="14" font-weight="600" fill="#1A2332">São Paulo (média)</text><rect x="200.0" y="310.0" width="145.5" height="16.0" rx="4" fill="#D07A3E"/><text x="353.488" y="323" class="s" font-size="13.5" font-weight="700" fill="#1A2332">43,3 meses</text><text x="568" y="323" class="m" font-size="11.5" fill="#5A6472" text-anchor="end">R$ 65,36/m²</text><line x1="32.0" y1="350.0" x2="568.0" y2="350.0" stroke="#E7E2D9" stroke-width="1"/><text x="32" y="372" class="m" font-size="13" fill="#5A6472">Fontes: Índice Bewild; FipeZap ago/2026</text><text x="568" y="372" class="m" font-size="13" font-weight="700" fill="#11355B" text-anchor="end">bewild.com.br</text></svg>
