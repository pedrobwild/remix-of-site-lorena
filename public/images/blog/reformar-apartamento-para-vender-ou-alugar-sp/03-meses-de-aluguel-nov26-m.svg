<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 0 380 519" width="380" height="519" role="img" aria-labelledby="t d"><title id="t">Quantos meses de aluguel bruto cobrem a reforma completa</title><desc id="d">Pinheiros: 28,4 meses (aluguel de R$ 99,60 por m²); Itaim Bibi: 30,1 meses (aluguel de R$ 94,00 por m²); Moema: 33,4 meses (aluguel de R$ 84,80 por m²); São Paulo (média): 43,3 meses (aluguel de R$ 65,36 por m²).</desc><style>.s{font-family:Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif}.m{font-family:'JetBrains Mono', Menlo, Consolas, monospace}</style><rect width="420" height="519" fill="#FFFFFF"/><text x="32" y="44" class="m" font-size="13" font-weight="700" fill="#11355B" letter-spacing="1.5">REFORMA EM MESES DE ALUGUEL</text><text x="32" y="78" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">Quantos meses de aluguel</text><text x="32" y="108" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">bruto cobrem a reforma</text><text x="32" y="138" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">completa</text><text x="32" y="170" class="s" font-size="15" fill="#5A6472">Mediana da reforma por m² (R$ 2.831)</text><text x="32" y="191" class="s" font-size="15" fill="#5A6472">dividida pelo aluguel anunciado por m²</text><text x="32" y="212" class="s" font-size="15" fill="#5A6472">ao mês.</text><text x="32" y="257" class="s" font-size="14" font-weight="600" fill="#1A2332">Pinheiros</text><text x="388" y="257" class="m" font-size="13" fill="#5A6472" text-anchor="end">R$ 99,60/m²</text><rect x="32.0" y="264.0" width="153.4" height="16.0" rx="4" fill="#2F6FA8"/><text x="193.36" y="277" class="s" font-size="13.5" font-weight="700" fill="#1A2332">28,4 meses</text><text x="32" y="307" class="s" font-size="14" font-weight="600" fill="#1A2332">Itaim Bibi</text><text x="388" y="307" class="m" font-size="13" fill="#5A6472" text-anchor="end">R$ 94,00/m²</text><rect x="32.0" y="314.0" width="162.5" height="16.0" rx="4" fill="#2F6FA8"/><text x="202.54" y="327" class="s" font-size="13.5" font-weight="700" fill="#1A2332">30,1 meses</text><text x="32" y="357" class="s" font-size="14" font-weight="600" fill="#1A2332">Moema</text><text x="388" y="357" class="m" font-size="13" fill="#5A6472" text-anchor="end">R$ 84,80/m²</text><rect x="32.0" y="364.0" width="180.4" height="16.0" rx="4" fill="#2F6FA8"/><text x="220.36" y="377" class="s" font-size="13.5" font-weight="700" fill="#1A2332">33,4 meses</text><text x="32" y="407" class="s" font-size="14" font-weight="600" fill="#1A2332">São Paulo (média)</text><text x="388" y="407" class="m" font-size="13" fill="#5A6472" text-anchor="end">R$ 65,36/m²</text><rect x="32.0" y="414.0" width="233.8" height="16.0" rx="4" fill="#D07A3E"/><text x="273.82" y="427" class="s" font-size="13.5" font-weight="700" fill="#1A2332">43,3 meses</text><line x1="32.0" y1="457.0" x2="388.0" y2="457.0" stroke="#E7E2D9" stroke-width="1"/><text x="32" y="479" class="m" font-size="12" fill="#5A6472">Fontes: Índice Bewild; FipeZap ago/2026</text><text x="32" y="499" class="m" font-size="13" font-weight="700" fill="#11355B">bewild.com.br</text></svg>
