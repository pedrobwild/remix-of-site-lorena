<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif">
  <title id="t">Três prazos correm a partir do dia das chaves</title>
  <desc id="d">Linha do tempo com três barras que começam no dia das chaves: vício aparente, 90 dias contados da entrega (CDC, art. 26); vício oculto, 90 dias contados de quando o defeito fica evidente (CDC, art. 26, § 3º); solidez e segurança, 5 anos de garantia com ação em até 180 dias do aparecimento (Código Civil, art. 618). A reclamação com protocolo interrompe a contagem dos 90 dias.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>

  <text x="24" y="34" font-size="19" font-weight="700" fill="#1A2332">Três prazos correm a partir do dia das chaves</text>
  <text x="24" y="56" font-size="13" fill="#5A6472">Prazos do Código de Defesa do Consumidor e do Código Civil para quem recebe um imóvel novo</text>

  <!-- marco: dia das chaves -->
  <line x1="200" y1="92" x2="200" y2="332" stroke="#1A2332" stroke-width="1.5" stroke-dasharray="3 4"/>
  <circle cx="200" cy="92" r="5" fill="#1A2332"/>
  <text x="200" y="80" font-size="12" font-weight="700" fill="#1A2332" text-anchor="middle">Dia das chaves</text>
  <text x="200" y="348" font-size="11" fill="#5A6472" text-anchor="middle">termo de vistoria assinado</text>

  <!-- linha 1: vício aparente -->
  <text x="186" y="128" font-size="13" font-weight="700" fill="#1A2332" text-anchor="end">Vício aparente</text>
  <text x="186" y="144" font-size="11.5" fill="#5A6472" text-anchor="end">visível na entrega</text>
  <rect x="200" y="120" width="120" height="18" rx="4" fill="#2F6FA8"/>
  <text x="330" y="129" font-size="14" font-weight="700" fill="#1A2332">90 dias</text>
  <text x="330" y="145" font-size="11.5" fill="#5A6472">contados da entrega · CDC, art. 26</text>

  <!-- linha 2: vício oculto -->
  <text x="186" y="203" font-size="13" font-weight="700" fill="#1A2332" text-anchor="end">Vício oculto</text>
  <text x="186" y="219" font-size="11.5" fill="#5A6472" text-anchor="end">aparece depois</text>
  <line x1="200" y1="204" x2="352" y2="204" stroke="#9AA3AE" stroke-width="1.5" stroke-dasharray="4 4"/>
  <circle cx="360" cy="204" r="5" fill="#FFFFFF" stroke="#D07A3E" stroke-width="2.5"/>
  <text x="360" y="186" font-size="11" fill="#5A6472" text-anchor="middle">defeito fica evidente</text>
  <rect x="366" y="195" width="120" height="18" rx="4" fill="#D07A3E"/>
  <text x="496" y="204" font-size="14" font-weight="700" fill="#1A2332">90 dias</text>
  <text x="496" y="220" font-size="11.5" fill="#5A6472">de quando aparece · CDC, art. 26, § 3º</text>

  <!-- linha 3: solidez e segurança -->
  <text x="186" y="278" font-size="13" font-weight="700" fill="#1A2332" text-anchor="end">Solidez e segurança</text>
  <text x="186" y="294" font-size="11.5" fill="#5A6472" text-anchor="end">estrutura e fundação</text>
  <rect x="200" y="270" width="440" height="18" rx="4" fill="#11355B"/>
  <text x="648" y="279" font-size="14" font-weight="700" fill="#1A2332">5 anos</text>
  <text x="648" y="295" font-size="11.5" fill="#5A6472">CC, art. 618</text>
  <text x="206" y="312" font-size="11.5" fill="#5A6472">ação em até 180 dias do aparecimento do vício</text>

  <line x1="24" y1="366" x2="696" y2="366" stroke="#E5E8EC" stroke-width="1"/>
  <text x="24" y="386" font-size="11.5" fill="#5A6472">Reclamação com protocolo na construtora interrompe a contagem dos 90 dias (CDC, art. 26, § 2º).</text>
  <text x="24" y="404" font-size="11.5" fill="#5A6472">Demais sistemas: prazo do manual do proprietário (referência ABNT NBR 17170:2022). Barras fora de escala.</text>
</svg>
