<svg xmlns="http://www.w3.org/2000/svg" width="420" height="350" viewBox="0 0 420 350" role="img" aria-labelledby="t"><title id="t">Peso mediano da reforma no valor do imóvel por faixa de metragem (m² do bairro): até 21 m² 30,0% (n=27); 21–25 m² 21,8% (n=31); 25–30 m² 18,7% (n=102); 30–35 m² 18,4% (n=13); 35–45 m² 19,6% (n=23). Barras mostram a metade central (Q1–Q3).</title><rect width="420" height="350" fill="#FFFFFF"/><text x="16" y="26" font-size="13" fill="#1F2937" text-anchor="start" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Abaixo de 21 m², a reforma passa de 30%</text><text x="16" y="46" font-size="12" fill="#6B7280" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Mediana e Q1–Q3 por metragem, 196 contratos</text><line x1="50" y1="260" x2="400" y2="260" stroke="#E5E7EB"/><text x="44" y="264" font-size="12" fill="#6B7280" text-anchor="end" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">0%</text><line x1="50" y1="212" x2="400" y2="212" stroke="#E5E7EB"/><text x="44" y="216" font-size="12" fill="#6B7280" text-anchor="end" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">9%</text><line x1="50" y1="165" x2="400" y2="165" stroke="#E5E7EB"/><text x="44" y="169" font-size="12" fill="#6B7280" text-anchor="end" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">18%</text><line x1="50" y1="118" x2="400" y2="118" stroke="#E5E7EB"/><text x="44" y="122" font-size="12" fill="#6B7280" text-anchor="end" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">27%</text><line x1="50" y1="70" x2="400" y2="70" stroke="#E5E7EB"/><text x="44" y="74" font-size="12" fill="#6B7280" text-anchor="end" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">36%</tex