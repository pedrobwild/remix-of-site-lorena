ormal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">n = 102</text><rect x="278" y="142" width="35" height="32" fill="#0F4C5C" opacity="0.25" rx="3"/><line x1="278" y1="163" x2="312" y2="163" stroke="#0F4C5C" stroke-width="4"/><text x="295" y="134" font-size="13" fill="#1F2937" text-anchor="middle" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">18,4%</text><text x="295" y="278" font-size="12" fill="#1F2937" text-anchor="middle" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">30–35 m²</text><text x="295" y="294" font-size="12" fill="#6B7280" text-anchor="middle" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">n = 13</text><rect x="348" y="139" width="35" height="39" fill="#0F4C5C" opacity="0.25" rx="3"/><line x1="348" y1="157" x2="382" y2="157" stroke="#0F4C5C" stroke-width="4"/><text x="365" y="131" font-size="13" fill="#1F2937" text-anchor="middle" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">19,6%</text><text x="365" y="278" font-size="12" fill="#1F2937" text-anchor="middle" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">35–45 m²</text><text x="365" y="294" font-size="12" fill="#6B7280" text-anchor="middle" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">n = 23</text><text x="16" y="320" font-size="12" fill="#1F2937" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Parte fixa pesa mais no imóvel menor.</text><text x="16" y="340" font-size="12" fill="#6B7280" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Fonte: contratos Bewild × FipeZap set/2026.</text></svg>
