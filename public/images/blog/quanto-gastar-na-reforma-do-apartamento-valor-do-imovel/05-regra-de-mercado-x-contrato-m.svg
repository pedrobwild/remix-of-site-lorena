<svg xmlns="http://www.w3.org/2000/svg" width="420" height="340" viewBox="0 0 420 340" role="img" aria-labelledby="t"><title id="t">Para um apartamento de 27,5 m² (área mediana dos contratos), a regra de mercado de 20% a 35% daria: média de São Paulo (imóvel de R$ 335 mil) R$ 67 mil a R$ 117 mil; imóvel novo (R$ 434 mil) R$ 87 mil a R$ 152 mil; Pinheiros (R$ 502 mil) R$ 100 mil a R$ 176 mil; Bela Vista (R$ 349 mil) R$ 70 mil a R$ 122 mil. O contrato mediano Bewild foi R$ 72.204 nos 4 casos.</title><rect width="420" height="340" fill="#FFFFFF"/><text x="16" y="26" font-size="13" fill="#1F2937" text-anchor="start" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">A regra de 20–35% superestima no imóvel novo</text><text x="16" y="46" font-size="12" fill="#6B7280" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Imóvel de 27,5 m²: regra (cinza) × contrato (laranja)</text><line x1="66" y1="240" x2="400" y2="240" stroke="#E5E7EB"/><text x="60" y="244" font-size="12" fill="#6B7280" text-anchor="end" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">0 mil</text><line x1="66" y1="198" x2="400" y2="198" stroke="#E5E7EB"/><text x="60" y="202" font-size="12" fill="#6B7280" text-anchor="end" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">45 mil</text><line x1="66" y1="155" x2="400" y2="155" stroke="#E5E7EB"/><text x="60" y="159" font-size="12" fill="#6B7280" text-anchor="end" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">90 mil</text><line x1="66" y1="112" x2="400" y2="112" stroke="#E5E7EB"/><text x="60" y="116" font-size="12" fill="#6B7280" text-anchor="end" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">135 mil</text><line x1="66" y1="70" x2="400" y2="70" stroke="#E5E7EB"/><text x="60" y="