<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 602" width="720" height="722" role="img" aria-labelledby="t d"><title id="t">Quanto a reforma completa pesa no preço do apartamento, por bairro</title><desc id="d">Mediana da reforma por m² (R$ 2.831) dividida pelo preço de venda por m² do FipeZap de setembro de 2026: Itaim Bibi 14,2%; Pinheiros 15,5%; Jardins 15,7%; Moema 17,1%; Vila Mariana 19,0%; Paraíso 20,1%; Perdizes 21,0%; Bela Vista 22,3%; São Paulo (média) 23,2%; Santana 30,5%; Vila Andrade 33,8%.</desc><style>.s{font-family:Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif}.m{font-family:'JetBrains Mono', Menlo, Consolas, monospace}</style><rect width="600" height="602" fill="#FFFFFF"/><text x="32" y="44" class="m" font-size="13" font-weight="700" fill="#11355B" letter-spacing="1.5">PESO POR BAIRRO</text><text x="32" y="78" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">Quanto a reforma completa pesa no</text><text x="32" y="108" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">preço do apartamento, por bairro</text><text x="32" y="140" class="s" font-size="15" fill="#5A6472">Mediana do Índice Bewild (R$ 2.831/m²) dividida pelo</text><text x="32" y="161" class="s" font-size="15" fill="#5A6472">preço de venda por m² de cada bairro.</text><text x="32" y="215" class="s" font-size="14" font-weight="600" fill="#1A2332">Itaim Bibi</text><rect x="200.0" y="202.0" width="62.8" height="16.0" rx="4" fill="#2F6FA8"/><text x="270.779" y="215" class="s" font-size="13.5" font-weight="700" fill="#1A2332">14,2%</text><text x="568" y="215" class="m" font-size="11.5" fill="#5A6472" text-anchor="end">R$ 19.989/m²</text><text x="32" y="247" class="s" font-size="14" font-weight="600" fill="#1A2332">Pinheiros</text><rect x="200.0" y="234.0" width="68.5" height="16.0" rx="4" fill="#2F6FA8"/><text x="276.526" y="247" class="s" font-size="13.5" font-weight="700" fill="#1A2332">15,5%</text><text x="568" y="