<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" role="img" aria-labelledby="t"><title id="t">Peso da reforma completa no valor do imóvel em 198 contratos Bewild: 19,7% usando o preço do m² do bairro (FipeZap set/2026), 22,5% usando a média de São Paulo (R$ 12.206/m²) e 17,4% usando o m² de imóvel novo (R$ 15.800, Brain out/2025). A regra de mercado citada em guias é de 20% a 35%.</title><rect width="720" height="330" fill="#FFFFFF"/><text x="16" y="26" font-size="16" fill="#1F2937" text-anchor="start" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">A reforma completa pesa 17% a 23% do valor do imóvel</text><text x="16" y="46" font-size="12" fill="#6B7280" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Mediana dos 198 contratos Bewild ÷ valor estimado do imóvel</text><rect x="480" y="58" width="135" height="142" fill="#E5E7EB" opacity="0.7"/><text x="548" y="54" font-size="12" fill="#6B7280" text-anchor="middle" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">regra de mercado: 20% a 35%</text><text x="16" y="86" font-size="12" fill="#1F2937" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">m² do bairro (FipeZap set/2026)</text><line x1="448" y1="83" x2="503" y2="83" stroke="#E8702A" stroke-width="18" opacity="0.25"/><line x1="477" y1="74" x2="477" y2="92" stroke="#E8702A" stroke-width="5"/><text x="485" y="88" font-size="13" fill="#1F2937" text-anchor="start" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">19,7%</text><text x="16" y="132" font-size="12" fill="#1F2937" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">m² de imóvel novo (Brain out/2025)</text><line x1="441" y1="129" x2="479" y2="129" stroke="#0F4C5C" stroke-width="18" opacity="0.25"/><line x1="457" y1="120" x2="457" y2="138" stroke="#0F4C5C" stroke-width="5"/><text x="465" y="134" font-size="13" fill="#1F2937" text-anchor="start" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">17,4%</text><text x="16" y="178" font-size="12" fill="#1F2937" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">m² médio de São Paulo (FipeZap)</text><line x1="483" y1="175" x2="532" y2="175" stroke="#0F4C5C" stroke-width="18" opacity="0.25"/><line x1="502" y1="166" x2="502" y2="184" stroke="#0F4C5C" stroke-width="5"/><text x="510" y="180" font-size="13" fill="#1F2937" text-anchor="start" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">22,5%</text><text x="300" y="218" font-size="12" fill="#6B7280" text-anchor="middle" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">0%</text><text x="390" y="218" font-size="12" fill="#6B7280" text-anchor="middle" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">10%</text><text x="480" y="218" font-size="12" fill="#6B7280" text-anchor="middle" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">20%</text><text x="570" y="218" font-size="12" fill="#6B7280" text-anchor="middle" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">30%</text><text x="660" y="218" font-size="12" fill="#6B7280" text-anchor="middle" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">40%</text><line x1="310" y1="294" x2="330" y2="294" stroke="#0F4C5C" stroke-width="12" opacity="0.25"/><text x="336" y="298" font-size="12" fill="#6B7280" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">metade central (Q1–Q3)</text><text x="16" y="320" font-size="12" fill="#6B7280" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Fonte: contratos Bewild (planilha 27/9/2026, 198 reg.); FipeZap set/2026; Brain/Exame 18/12/2025.</text></svg>
