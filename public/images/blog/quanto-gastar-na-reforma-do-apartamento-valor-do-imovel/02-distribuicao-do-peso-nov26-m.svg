<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 0 380 607" width="380" height="607" role="img" aria-labelledby="t d"><title id="t">Orçamentos por faixa de peso no valor do imóvel</title><desc id="d">Abaixo de 10%: 3; 10% a 15%: 96; 15% a 20%: 177; 20% a 25%: 182; 25% a 30%: 72; 30% ou mais: 55.</desc><style>.s{font-family:Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif}.m{font-family:'JetBrains Mono', Menlo, Consolas, monospace}</style><rect width="420" height="607" fill="#FFFFFF"/><text x="32" y="44" class="m" font-size="13" font-weight="700" fill="#11355B" letter-spacing="1.5">DISTRIBUIÇÃO DO PESO</text><text x="32" y="78" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">6 em cada 10 orçamentos</text><text x="32" y="108" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">pesam de 15% a 25% do</text><text x="32" y="138" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">imóvel</text><text x="32" y="170" class="s" font-size="15" fill="#5A6472">Orçamentos por faixa de peso no valor do</text><text x="32" y="191" class="s" font-size="15" fill="#5A6472">imóvel, com o m² do bairro de</text><text x="32" y="212" class="s" font-size="15" fill="#5A6472">referência.</text><text x="32" y="257" class="s" font-size="14" font-weight="600" fill="#1A2332">Abaixo de 10%</text><rect x="32.0" y="264.0" width="3.8" height="16.0" rx="4" fill="#2F6FA8"/><text x="43.7674" y="277" class="s" font-size="13.5" font-weight="700" fill="#1A2332">3 orçamentos</text><text x="32" y="305" class="s" font-size="14" font-weight="600" fill="#1A2332">10% a 15%</text><rect x="32.0" y="312.0" width="120.6" height="16.0" rx="4" fill="#2F6FA8"/><text x="160.558" y="325" class="s" font-size="13.5" font-weight="700" fill="#1A2332">96 orçamentos</text><text x="32" y="353" class="s" font-size="14" font-weight="600" fill="#1A2332">15% a 20%</text><rect x="32.0" y="360.0" width="222.3" height="16.0" rx="4" fill="#D07A3E"/><text x="262.279" y="373" class="s" font-size="13.5" font-weight="700" fill="#1A2332">177 orçamentos</text><text x="32" y="401" class="s" font-size="14" font-weight="600" fill="#1A2332">20% a 25%</text><rect x="32.0" y="408.0" width="228.6" height="16.0" rx="4" fill="#D07A3E"/><text x="268.558" y="421" class="s" font-size="13.5" font-weight="700" fill="#1A2332">182 orçamentos</text><text x="32" y="449" class="s" font-size="14" font-weight="600" fill="#1A2332">25% a 30%</text><rect x="32.0" y="456.0" width="90.4" height="16.0" rx="4" fill="#2F6FA8"/><text x="130.419" y="469" class="s" font-size="13.5" font-weight="700" fill="#1A2332">72 orçamentos</text><text x="32" y="497" class="s" font-size="14" font-weight="600" fill="#1A2332">30% ou mais</text><rect x="32.0" y="504.0" width="69.1" height="16.0" rx="4" fill="#2F6FA8"/><text x="109.07" y="517" class="s" font-size="13.5" font-weight="700" fill="#1A2332">55 orçamentos</text><line x1="32.0" y1="545.0" x2="388.0" y2="545.0" stroke="#E7E2D9" stroke-width="1"/><text x="32" y="567" class="m" font-size="12" fill="#5A6472">Fontes: Índice Bewild; FipeZap set/2026</text><text x="32" y="587" class="m" font-size="13" font-weight="700" fill="#11355B">bewild.com.br</text></svg>
