<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 454" width="720" height="545" role="img" aria-labelledby="t d"><title id="t">Orçamentos por faixa de peso no valor do imóvel</title><desc id="d">Abaixo de 10%: 3; 10% a 15%: 96; 15% a 20%: 177; 20% a 25%: 182; 25% a 30%: 72; 30% ou mais: 55.</desc><style>.s{font-family:Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif}.m{font-family:'JetBrains Mono', Menlo, Consolas, monospace}</style><rect width="600" height="454" fill="#FFFFFF"/><text x="32" y="44" class="m" font-size="13" font-weight="700" fill="#11355B" letter-spacing="1.5">DISTRIBUIÇÃO DO PESO</text><text x="32" y="78" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">6 em cada 10 orçamentos pesam de</text><text x="32" y="108" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">15% a 25% do imóvel</text><text x="32" y="140" class="s" font-size="15" fill="#5A6472">Orçamentos por faixa de peso no valor do imóvel, com o</text><text x="32" y="161" class="s" font-size="15" fill="#5A6472">m² do bairro de referência.</text><text x="32" y="215" class="s" font-size="14" font-weight="600" fill="#1A2332">Abaixo de 10%</text><rect x="200.0" y="202.0" width="3.9" height="16.0" rx="4" fill="#2F6FA8"/><text x="211.935" y="215" class="s" font-size="13.5" font-weight="700" fill="#1A2332">3 orçamentos</text><text x="32" y="249" class="s" font-size="14" font-weight="600" fill="#1A2332">10% a 15%</text><rect x="200.0" y="236.0" width="125.9" height="16.0" rx="4" fill="#2F6FA8"/><text x="333.916" y="249" class="s" font-size="13.5" font-weight="700" fill="#1A2332">96 orçamentos</text><text x="32" y="283" class="s" font-size="14" font-weight="600" fill="#1A2332">15% a 20%</text><rect x="200.0" y="270.0" width="232.2" height="16.0" rx="4" fill="#D07A3E"/><text x="440.158" y="283" class="s" font-size="13.5" font-weight="700" fill="#1A2332">177 orçamentos</text><text x="32" y="317" class="s" font-size="14" font-weight="600" fill="#1A2332">20% a 25%</text><rect x="200.0" y="304.0" width="238.7" height="16.0" rx="4" fill="#D07A3E"/><text x="446.716" y="317" class="s" font-size="13.5" font-weight="700" fill="#1A2332">182 orçamentos</text><text x="32" y="351" class="s" font-size="14" font-weight="600" fill="#1A2332">25% a 30%</text><rect x="200.0" y="338.0" width="94.4" height="16.0" rx="4" fill="#2F6FA8"/><text x="302.437" y="351" class="s" font-size="13.5" font-weight="700" fill="#1A2332">72 orçamentos</text><text x="32" y="385" class="s" font-size="14" font-weight="600" fill="#1A2332">30% ou mais</text><rect x="200.0" y="372.0" width="72.1" height="16.0" rx="4" fill="#2F6FA8"/><text x="280.14" y="385" class="s" font-size="13.5" font-weight="700" fill="#1A2332">55 orçamentos</text><line x1="32.0" y1="410.0" x2="568.0" y2="410.0" stroke="#E7E2D9" stroke-width="1"/><text x="32" y="432" class="m" font-size="13" fill="#5A6472">Fontes: Índice Bewild; FipeZap set/2026</text><text x="568" y="432" class="m" font-size="13" font-weight="700" fill="#11355B" text-anchor="end">bewild.com.br</text></svg>
