<svg xmlns="http://www.w3.org/2000/svg" width="420" height="320" viewBox="0 0 420 320" role="img" aria-labelledby="t"><title id="t">Estabilidade do peso da reforma: nos três terços da base (66 contratos cada, ordenados pelo número do projeto) a mediana foi 19,6%, 18,9% e 21,5%. Sensibilidade ao preço do imóvel: se o m² do bairro estiver 15% abaixo do FipeZap, o peso sobe para 23,1%; se estiver 15% acima, cai para 17,1%.</title><rect width="420" height="320" fill="#FFFFFF"/><text x="16" y="26" font-size="13" fill="#1F2937" text-anchor="start" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">O peso ficou entre 19% e 22% ao longo de toda a base</text><text x="16" y="46" font-size="12" fill="#6B7280" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Terços da série e sensibilidade ao preço</text><line x1="46" y1="220" x2="400" y2="220" stroke="#E5E7EB"/><text x="40" y="224" font-size="12" fill="#6B7280" text-anchor="end" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">0%</text><line x1="46" y1="170" x2="400" y2="170" stroke="#E5E7EB"/><text x="40" y="174" font-size="12" fill="#6B7280" text-anchor="end" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">10%</text><line x1="46" y1="120" x2="400" y2="120" stroke="#E5E7EB"/><text x="40" y="124" font-size="12" fill="#6B7280" text-anchor="end" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">20%</text><line x1="46" y1="70" x2="400" y2="70" stroke="#E5E7EB"/><text x="40" y="74" font-size="12" fill="#6B7280" text-anchor="end" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">30%</text><rect x="76" y="122" width="59" height="98" fill="#0F4C5C" rx="3"/><text x="105" y="116" font-size="13" fill="#1F2937" text-anchor="middle" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">19,6%</text><text x="105" y="236" font-size="12" fill="#1F2937" text-anchor="middle" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">nº 8–77</text><rect x="194" y="126" width="59" height="94" fill="#0F4C5C" rx="3"/><text x="223" y="120" font-size="13" fill="#1F2937" text-anchor="middle" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">18,9%</text><text x="223" y="236" font-size="12" fill="#1F2937" text-anchor="middle" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">nº 78–146</text><rect x="312" y="112" width="59" height="108" fill="#0F4C5C" rx="3"/><text x="341" y="106" font-size="13" fill="#1F2937" text-anchor="middle" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">21,5%</text><text x="341" y="236" font-size="12" fill="#1F2937" text-anchor="middle" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">nº 147–214</text><text x="16" y="286" font-size="12" fill="#1F2937" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">m² 15% abaixo: 23,1% · igual: 19,7% · 15% acima: 17,1%</text><text x="16" y="310" font-size="12" fill="#6B7280" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Fonte: contratos Bewild × FipeZap set/2026.</text></svg>
