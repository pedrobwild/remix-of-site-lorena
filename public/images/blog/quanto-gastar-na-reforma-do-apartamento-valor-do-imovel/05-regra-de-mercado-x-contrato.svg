<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340" role="img" aria-labelledby="t"><title id="t">Para um apartamento de 27,5 m² (área mediana dos contratos), a regra de mercado de 20% a 35% daria: média de São Paulo (imóvel de R$ 335 mil) R$ 67 mil a R$ 117 mil; imóvel novo (R$ 434 mil) R$ 87 mil a R$ 152 mil; Pinheiros (R$ 502 mil) R$ 100 mil a R$ 176 mil; Bela Vista (R$ 349 mil) R$ 70 mil a R$ 122 mil. O contrato mediano Bewild foi R$ 72.204 nos 4 casos.</title><rect width="720" height="340" fill="#FFFFFF"/><text x="16" y="26" font-size="16" fill="#1F2937" text-anchor="start" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">A regra de 20% a 35% superestima o orçamento no imóvel novo</text><text x="16" y="46" font-size="12" fill="#6B7280" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Apartamento de 27,5 m²: faixa da regra (cinza) × contrato mediano Bewild (laranja)</text><line x1="66" y1="240" x2="700" y2="240" stroke="#E5E7EB"/><text x="60" y="244" font-size="12" fill="#6B7280" text-anchor="end" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">0 mil</text><line x1="66" y1="198" x2="700" y2="198" stroke="#E5E7EB"/><text x="60" y="202" font-size="12" fill="#6B7280" text-anchor="end" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">45 mil</text><line x1="66" y1="155" x2="700" y2="155" stroke="#E5E7EB"/><text x="60" y="159" font-size="12" fill="#6B7280" text-anchor="end" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">90 mil</text><line x1="66" y1="112" x2="700" y2="112" stroke="#E5E7EB"/><text x="60" y="116" font-size="12" fill="#6B7280" text-anchor="end" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">135 mil</text><line x1="66" y1="70" x2="700" y2="70" stroke="#E5E7EB"/><text x="60" y="74" font-size="12" fill="#6B7280" text-anchor="end" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">180 mil</text><rect x="94" y="129" width="48" height="48" fill="#6B7280" opacity="0.35" rx="3"/><text x="117" y="123" font-size="12" fill="#6B7280" text-anchor="middle" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">117 mil</text><text x="117" y="191" font-size="12" fill="#6B7280" text-anchor="middle" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">67 mil</text><rect x="149" y="172" width="48" height="68" fill="#E8702A" rx="3"/><text x="173" y="166" font-size="12" fill="#1F2937" text-anchor="middle" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">72 mil</text><text x="145" y="274" font-size="12" fill="#1F2937" text-anchor="middle" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Média SP</text><text x="145" y="290" font-size="12" fill="#6B7280" text-anchor="middle" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">imóvel 335 mil</text><rect x="252" y="97" width="48" height="61" fill="#6B7280" opacity="0.35" rx="3"/><text x="276" y="91" font-size="12" fill="#6B7280" text-anchor="middle" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">151 mil</text><text x="276" y="172" font-size="12" fill="#6B7280" text-anchor="middle" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">86 mil</text><rect x="308" y="172" width="48" height="68" fill="#E8702A" rx="3"/><text x="332" y="166" font-size="12" fill="#1F2937" text-anchor="middle" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">72 mil</text><text x="304" y="274" font-size="12" fill="#1F293