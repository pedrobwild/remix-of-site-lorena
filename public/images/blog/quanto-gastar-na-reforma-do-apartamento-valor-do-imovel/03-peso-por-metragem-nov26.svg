<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 575" width="720" height="690" role="img" aria-labelledby="t d"><title id="t">Peso mediano da reforma no valor do imóvel por faixa de metragem</title><desc id="d">Até 21 m²: 28,7% (65 orçamentos, metade central de 25,1% a 31,7%); 21 a 25 m²: 20,1% (194 orçamentos, metade central de 15,9% a 23,7%); 25 a 30 m²: 19,3% (172 orçamentos, metade central de 16,1% a 21,5%); 30 a 35 m²: 20,2% (72 orçamentos, metade central de 16,6% a 25,5%); 35 a 45 m²: 20,2% (82 orçamentos, metade central de 16,9% a 22,6%).</desc><style>.s{font-family:Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif}.m{font-family:'JetBrains Mono', Menlo, Consolas, monospace}</style><rect width="600" height="575" fill="#FFFFFF"/><text x="32" y="44" class="m" font-size="13" font-weight="700" fill="#11355B" letter-spacing="1.5">PESO POR METRAGEM</text><text x="32" y="78" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">Até 21 m², a reforma pesa 29% do</text><text x="32" y="108" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">imóvel; acima disso, perto de 20%</text><text x="32" y="140" class="s" font-size="15" fill="#5A6472">Peso mediano e metade central em cada faixa de metragem.</text><text x="32" y="183" class="s" font-size="14.5" font-weight="600" fill="#1A2332">Até 21 m²</text><text x="568" y="183" class="m" font-size="12" fill="#5A6472" text-anchor="end">65 orçamentos</text><rect x="32.0" y="195.0" width="536.0" height="8.0" rx="4" fill="#F6F3EE"/><rect x="405.7" y="195.0" width="98.3" height="8.0" rx="4" fill="#2F6FA8"/><circle cx="459.3" cy="199.0" r="7" fill="#D07A3E" fill-opacity="1.0"/><text x="459.311" y="225" class="s" font-size="14" font-weight="700" fill="#1A2332" text-anchor="middle">28,7%</text><text x="32" y="225" class="m" font-size="11.5" fill="#5A6472">metade central: 25,1% a 31,7%</text><text x="32" y="255" class="s" font-size="14.5" font-weight="600" fill="#1A2332"