<svg xmlns="http://www.w3.org/2000/svg" width="720" height="350" viewBox="0 0 720 350" role="img" aria-labelledby="t"><title id="t">Peso mediano da reforma no valor do imóvel por faixa de metragem (m² do bairro): até 21 m² 30,0% (n=27); 21–25 m² 21,8% (n=31); 25–30 m² 18,7% (n=102); 30–35 m² 18,4% (n=13); 35–45 m² 19,6% (n=23). Barras mostram a metade central (Q1–Q3).</title><rect width="720" height="350" fill="#FFFFFF"/><text x="16" y="26" font-size="16" fill="#1F2937" text-anchor="start" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Abaixo de 21 m², a reforma passa de 30% do valor do imóvel</text><text x="16" y="46" font-size="12" fill="#6B7280" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Peso mediano e metade central (Q1–Q3) por faixa de metragem, 196 contratos</text><line x1="50" y1="260" x2="700" y2="260" stroke="#E5E7EB"/><text x="44" y="264" font-size="12" fill="#6B7280" text-anchor="end" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">0%</text><line x1="50" y1="212" x2="700" y2="212" stroke="#E5E7EB"/><text x="44" y="216" font-size="12" fill="#6B7280" text-anchor="end" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">9%</text><line x1="50" y1="165" x2="700" y2="165" stroke="#E5E7EB"/><text x="44" y="169" font-size="12" fill="#6B7280" text-anchor="end" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">18%</text><line x1="50" y1="118" x2="700" y2="118" stroke="#E5E7EB"/><text x="44" y="122" font-size="12" fill="#6B7280" text-anchor="end" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">27%</text><line x1="50" y1="70" x2="700" y2="70" stroke="#E5E7EB"/><text x="44" y="74" font-size="12" fill="#6B7280" text-anchor="end" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">36%</text><rect x="82" y="90" width="65" height="59" fill="#0F4C5C" opacity="0.25" rx="3"/><line x1="82" y1="102" x2="148" y2="102" stroke="#E8702A" stroke-width="4"/><text x="115" y="82" font-size="13" fill="#1F2937" text-anchor="middle" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">30,0%</text><text x="115" y="278" font-size="12" fill="#1F2937" text-anchor="middle" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">até 21 m²</text><text x="115" y="294" font-size="12" fill="#6B7280" text-anchor="middle" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">n = 27</text><rect x="212" y="139" width="65" height="21" fill="#0F4C5C" opacity="0.25" rx="3"/><line x1="212" y1="145" x2="278" y2="145" stroke="#0F4C5C" stroke-width="4"/><text x="245" y="131" font-size="13" fill="#1F2937" text-anchor="middle" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">21,8%</text><text x="245" y="278" font-size="12" fill="#1F2937" text-anchor="middle" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">21–25 m²</text><text x="245" y="294" font-size="12" fill="#6B7280" text-anchor="middle" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">n = 31</text><rect x="342" y="148" width="65" height="27" fill="#0F4C5C" opacity="0.25" rx="3"/><line x1="342" y1="161" x2="408" y2="161" stroke="#0F4C5C" stroke-width="4"/><text x="375" y="140" font-size="13" fill="#1F2937" text-anchor="middle" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">18,7%</text><text x="375" y="278" font-size="12" fill="#1F2937" text-anchor="middle" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">25–30 m²</text><text x="375" y="294" font-size="12" fill="#6B7280" text-anchor="middle" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">n = 102</text><rect x="472" y="142" width="65" height="32" fill="#0F4C5C" opacity="0.25" rx="3"/><line x1="472" y1="163" x2="538" y2="163" stroke="#0F4C5C" stroke-width="4"/><text x="505" y="134" font-size="13" fill="#1F2937" text-anchor="middle" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">18,4%</text><text x="505" y="278" font-size="12" fill="#1F2937" text-anchor="middle" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">30–35 m²</text><text x="505" y="294" font-size="12" fill="#6B7280" text-anchor="middle" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">n = 13</text><rect x="602" y="139" width="65" height="39" fill="#0F4C5C" opacity="0.25" rx="3"/><line x1="602" y1="157" x2="668" y2="157" stroke="#0F4C5C" stroke-width="4"/><text x="635" y="131" font-size="13" fill="#1F2937" text-anchor="middle" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">19,6%</text><text x="635" y="278" font-size="12" fill="#1F2937" text-anchor="middle" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">35–45 m²</text><text x="635" y="294" font-size="12" fill="#6B7280" text-anchor="middle" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">n = 23</text><text x="16" y="320" font-size="12" fill="#1F2937" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">A parte fixa da reforma (projeto, eletros, marcenaria) pesa mais quanto menor o imóvel.</text><text x="16" y="340" font-size="12" fill="#6B7280" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Fonte: contratos Bewild (27/9/2026) × FipeZap set/2026. 2 contratos >45 m² omitidos.</text></svg>
