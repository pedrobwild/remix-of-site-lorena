<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 647" width="420" height="647" role="img" aria-labelledby="t d"><title id="t">Estabilidade e sensibilidade do peso da reforma no valor do imóvel</title><desc id="d">Medianas por período: Março a junho 20,1%; Junho a setembro 20,8%; Setembro a novembro 20,5%. Sensibilidade ao preço do imóvel: m² 15% abaixo 24,0%; m² do FipeZap 20,4%; m² 15% acima 17,7%.</desc><style>.s{font-family:Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif}.m{font-family:'JetBrains Mono', Menlo, Consolas, monospace}</style><rect width="420" height="647" fill="#FFFFFF"/><text x="32" y="44" class="m" font-size="13" font-weight="700" fill="#11355B" letter-spacing="1.5">ESTABILIDADE E SENSIBILIDADE</text><text x="32" y="78" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">O peso fica perto de 20%</text><text x="32" y="108" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">o ano todo e muda com o</text><text x="32" y="138" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">preço do imóvel</text><text x="32" y="170" class="s" font-size="15" fill="#5A6472">Mediana do peso em três grupos de 195</text><text x="32" y="191" class="s" font-size="15" fill="#5A6472">orçamentos, pela data, e com o m² do</text><text x="32" y="212" class="s" font-size="15" fill="#5A6472">imóvel 15% abaixo ou acima do FipeZap.</text><text x="32" y="251" class="m" font-size="12.5" font-weight="700" fill="#11355B">POR PERÍODO DE 2026</text><text x="32" y="277" class="s" font-size="14" font-weight="600" fill="#1A2332">Março a junho</text><rect x="32.0" y="284.0" width="180.9" height="16.0" rx="4" fill="#2F6FA8"/><text x="220.9" y="297" class="s" font-size="13.5" font-weight="700" fill="#1A2332">20,1%</text><text x="32" y="323" class="s" font-size="14" font-weight="600" fill="#1A2332">Junho a setembro</text><rect x="32.0" y="330.0" width="187.2" height="16.0" rx="4" fill="#2F6FA8"/><text x="227.2" y="343" class="s" font-size="13.5" font-weight="700" fill="#1A2332">20,8%</text><text x="32" y="369" class="s" font-size="14" font-weight="600" fill="#1A2332">Setembro a novembro</text><rect x="32.0" y="376.0" width="184.5" height="16.0" rx="4" fill="#2F6FA8"/><text x="224.5" y="389" class="s" font-size="13.5" font-weight="700" fill="#1A2332">20,5%</text><text x="32" y="421" class="m" font-size="12.5" font-weight="700" fill="#11355B">POR PREÇO DO IMÓVEL</text><text x="32" y="447" class="s" font-size="14" font-weight="600" fill="#1A2332">m² 15% abaixo</text><rect x="32.0" y="454.0" width="216.0" height="16.0" rx="4" fill="#2F6FA8"/><text x="256" y="467" class="s" font-size="13.5" font-weight="700" fill="#1A2332">24,0%</text><text x="32" y="493" class="s" font-size="14" font-weight="600" fill="#1A2332">m² do FipeZap</text><rect x="32.0" y="500.0" width="183.6" height="16.0" rx="4" fill="#D07A3E"/><text x="223.6" y="513" class="s" font-size="13.5" font-weight="700" fill="#1A2332">20,4%</text><text x="32" y="539" class="s" font-size="14" font-weight="600" fill="#1A2332">m² 15% acima</text><rect x="32.0" y="546.0" width="159.3" height="16.0" rx="4" fill="#2F6FA8"/><text x="199.3" y="559" class="s" font-size="13.5" font-weight="700" fill="#1A2332">17,7%</text><line x1="32.0" y1="585.0" x2="388.0" y2="585.0" stroke="#E7E2D9" stroke-width="1"/><text x="32" y="607" class="m" font-size="12" fill="#5A6472">Fontes: Índice Bewild; FipeZap set/2026</text><text x="32" y="627" class="m" font-size="13" font-weight="700" fill="#11355B">bewild.com.br</text></svg>
