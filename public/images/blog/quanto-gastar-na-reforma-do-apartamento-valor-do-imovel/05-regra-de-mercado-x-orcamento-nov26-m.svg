<svg xmlns="http://www.w3.org/2000/svg" viewBox="12 0 396 622" width="396" height="622" role="img" aria-labelledby="t d"><title id="t">Regra de 20% a 35% do valor do imóvel contra o orçamento mediano, para 26 m²</title><desc id="d">Média de São Paulo (imóvel de R$ 317 mil): R$ 63 mil a R$ 111 mil; Bela Vista (imóvel de R$ 330 mil): R$ 66 mil a R$ 115 mil; Imóvel novo (imóvel de R$ 411 mil): R$ 82 mil a R$ 144 mil; Pinheiros (imóvel de R$ 475 mil): R$ 95 mil a R$ 166 mil. O orçamento mediano do Índice Bewild é R$ 74.132.</desc><style>.s{font-family:Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif}.m{font-family:'JetBrains Mono', Menlo, Consolas, monospace}</style><rect width="420" height="622" fill="#FFFFFF"/><text x="32" y="44" class="m" font-size="13" font-weight="700" fill="#11355B" letter-spacing="1.5">A REGRA CONTRA O ORÇAMENTO</text><text x="32" y="78" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">A regra de 20% a 35%</text><text x="32" y="108" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">passa do orçamento em</text><text x="32" y="138" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">quase todos os casos</text><text x="32" y="170" class="s" font-size="15" fill="#5A6472">Faixa que a regra manda reservar para um</text><text x="32" y="191" class="s" font-size="15" fill="#5A6472">apartamento de 26 m² (cinza) e o</text><text x="32" y="212" class="s" font-size="15" fill="#5A6472">orçamento mediano do Índice, R$ 74 mil</text><text x="32" y="233" class="s" font-size="15" fill="#5A6472">(laranja).</text><text x="32" y="276" class="s" font-size="14.5" font-weight="600" fill="#1A2332">Média de São Paulo</text><text x="388" y="276" class="m" font-size="13" fill="#5A6472" text-anchor="end">imóvel de R$ 317 mil</text><rect x="32.0" y="288.0" width="356.0" height="10.0" rx="5" fill="#F6F3EE"/><rect x="157.4" y="288.0" width="94.0" height="10.0" rx="5" fill="#B9C0C9"/><line x1="178.6" y1="282.0" x2="178.6" y2="304.0" stroke="#D07A3E" stroke-width="3"/><text x="157.391" y="320" class="m" font-size="13" font-weight="700" fill="#1A2332" text-anchor="middle">R$ 63 mil</text><text x="251.434" y="320" class="m" font-size="13" font-weight="700" fill="#1A2332" text-anchor="middle">R$ 111 mil</text><text x="32" y="350" class="s" font-size="14.5" font-weight="600" fill="#1A2332">Bela Vista</text><text x="388" y="350" class="m" font-size="13" fill="#5A6472" text-anchor="end">imóvel de R$ 330 mil</text><rect x="32.0" y="362.0" width="356.0" height="10.0" rx="5" fill="#F6F3EE"/><rect x="162.5" y="362.0" width="97.9" height="10.0" rx="5" fill="#B9C0C9"/><line x1="178.6" y1="356.0" x2="178.6" y2="378.0" stroke="#D07A3E" stroke-width="3"/><text x="162.533" y="394" class="m" font-size="13" font-weight="700" fill="#1A2332" text-anchor="middle">R$ 66 mil</text><text x="260.433" y="394" class="m" font-size="13" font-weight="700" fill="#1A2332" text-anchor="middle">R$ 115 mil</text><text x="32" y="424" class="s" font-size="14.5" font-weight="600" fill="#1A2332">Imóvel novo</text><text x="388" y="424" class="m" font-size="13" fill="#5A6472" text-anchor="end">imóvel de R$ 411 mil</text><rect x="32.0" y="436.0" width="356.0" height="10.0" rx="5" fill="#F6F3EE"/><rect x="194.6" y="436.0" width="121.9" height="10.0" rx="5" fill="#B9C0C9"/><line x1="178.6" y1="430.0" x2="178.6" y2="452.0" stroke="#D07A3E" stroke-width="3"/><text x="194.573" y="468" class="m" font-size="13" font-weight="700" fill="#1A2332" text-anchor="middle">R$ 82 mil</text><text x="316.503" y="468" class="m" font-size="13" font-weight="700" fill="#1A2332" text-anchor="middle">R$ 144 mil</text><text x="32" y="498" class="s" font-size="14.5" font-weight="600" fill="#1A2332">Pinheiros</text><text x="388" y="498" class="m" font-size="13" fill="#5A6472" text-anchor="end">imóvel de R$ 475 mil</text><rect x="32.0" y="510.0" width="356.0" height="10.0" rx="5" fill="#F6F3EE"/><rect x="219.9" y="510.0" width="140.9" height="10.0" rx="5" fill="#B9C0C9"/><line x1="178.6" y1="504.0" x2="178.6" y2="526.0" stroke="#D07A3E" stroke-width="3"/><text x="219.889" y="542" class="m" font-size="13" font-weight="700" fill="#1A2332" text-anchor="middle">R$ 95 mil</text><text x="360.806" y="542" class="m" font-size="13" font-weight="700" fill="#1A2332" text-anchor="middle">R$ 166 mil</text><line x1="32.0" y1="560.0" x2="388.0" y2="560.0" stroke="#E7E2D9" stroke-width="1"/><text x="32" y="582" class="m" font-size="12" fill="#5A6472">Fontes: Índice Bewild; FipeZap set/2026; Brain</text><text x="32" y="602" class="m" font-size="13" font-weight="700" fill="#11355B">bewild.com.br</text></svg>
