<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 473" width="720" height="568" role="img" aria-labelledby="t d"><title id="t">Peso da reforma completa no valor do imóvel em três cenários de preço</title><desc id="d">Preço do m² do bairro (FipeZap): 20,4% (metade central de 16,7% a 24,3%); Média de São Paulo (R$ 12.206/m²): 23,2% (metade central de 20,5% a 26,9%); Imóvel novo (R$ 15.800/m², Brain): 17,9% (metade central de 15,8% a 20,8%). A regra citada em guias é de 20% a 35%.</desc><style>.s{font-family:Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif}.m{font-family:'JetBrains Mono', Menlo, Consolas, monospace}</style><rect width="600" height="473" fill="#FFFFFF"/><text x="32" y="44" class="m" font-size="13" font-weight="700" fill="#11355B" letter-spacing="1.5">PESO DA REFORMA NO IMÓVEL</text><text x="32" y="78" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">A reforma completa pesa de 18% a</text><text x="32" y="108" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">23% do valor do imóvel</text><text x="32" y="140" class="s" font-size="15" fill="#5A6472">Mediana e metade central do peso em 585 orçamentos,</text><text x="32" y="161" class="s" font-size="15" fill="#5A6472">conforme o preço usado para o imóvel. A regra dos guias</text><text x="32" y="182" class="s" font-size="15" fill="#5A6472">é de 20% a 35%.</text><text x="32" y="225" class="s" font-size="14.5" font-weight="600" fill="#1A2332">Preço do m² do bairro (FipeZap)</text><rect x="32.0" y="237.0" width="536.0" height="8.0" rx="4" fill="#F6F3EE"/><rect x="280.6" y="237.0" width="113.2" height="8.0" rx="4" fill="#2F6FA8"/><circle cx="335.7" cy="241.0" r="7" fill="#D07A3E" fill-opacity="1.0"/><text x="335.733" y="267" class="s" font-size="14" font-weight="700" fill="#1A2332" text-anchor="middle">20,4%</text><text x="32" y="267" class="m" font-size="11.5" fill="#5A6472">metade central: 16,7% a 24,3%</text><text x="32" y="297" class="s" font-size="14.5" font-weight="600" fill="#1A2332">Média de São Paulo (R$ 12.206/m²)</text><rect x="32.0" y="309.0" width="536.0" height="8.0" rx="4" fill="#F6F3EE"/><rect x="337.2" y="309.0" width="95.3" height="8.0" rx="4" fill="#2F6FA8"/><circle cx="377.4" cy="313.0" r="7" fill="#D07A3E" fill-opacity="1.0"/><text x="377.422" y="339" class="s" font-size="14" font-weight="700" fill="#1A2332" text-anchor="middle">23,2%</text><text x="32" y="339" class="m" font-size="11.5" fill="#5A6472">metade central: 20,5% a 26,9%</text><text x="32" y="369" class="s" font-size="14.5" font-weight="600" fill="#1A2332">Imóvel novo (R$ 15.800/m², Brain)</text><rect x="32.0" y="381.0" width="536.0" height="8.0" rx="4" fill="#F6F3EE"/><rect x="267.2" y="381.0" width="74.4" height="8.0" rx="4" fill="#2F6FA8"/><circle cx="298.5" cy="385.0" r="7" fill="#D07A3E" fill-opacity="1.0"/><text x="298.511" y="411" class="s" font-size="14" font-weight="700" fill="#1A2332" text-anchor="middle">17,9%</text><text x="32" y="411" class="m" font-size="11.5" fill="#5A6472">metade central: 15,8% a 20,8%</text><line x1="32.0" y1="429.0" x2="568.0" y2="429.0" stroke="#E7E2D9" stroke-width="1"/><text x="32" y="451" class="m" font-size="13" fill="#5A6472">Fontes: Índice Bewild; FipeZap set/2026; Brain</text><text x="568" y="451" class="m" font-size="13" font-weight="700" fill="#11355B" text-anchor="end">bewild.com.br</text></svg>
