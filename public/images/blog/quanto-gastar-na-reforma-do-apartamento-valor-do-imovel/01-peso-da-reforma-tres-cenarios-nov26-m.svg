<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 596" width="420" height="596" role="img" aria-labelledby="t d"><title id="t">Peso da reforma completa no valor do imóvel em três cenários de preço</title><desc id="d">Preço do m² do bairro (FipeZap): 20,4% (metade central de 16,7% a 24,3%); Média de São Paulo (R$ 12.206/m²): 23,2% (metade central de 20,5% a 26,9%); Imóvel novo (R$ 15.800/m², Brain): 17,9% (metade central de 15,8% a 20,8%). A regra citada em guias é de 20% a 35%.</desc><style>.s{font-family:Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif}.m{font-family:'JetBrains Mono', Menlo, Consolas, monospace}</style><rect width="420" height="596" fill="#FFFFFF"/><text x="32" y="44" class="m" font-size="13" font-weight="700" fill="#11355B" letter-spacing="1.5">PESO DA REFORMA NO IMÓVEL</text><text x="32" y="78" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">A reforma completa pesa</text><text x="32" y="108" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">de 18% a 23% do valor do</text><text x="32" y="138" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">imóvel</text><text x="32" y="170" class="s" font-size="15" fill="#5A6472">Mediana e metade central do peso em 585</text><text x="32" y="191" class="s" font-size="15" fill="#5A6472">orçamentos, conforme o preço usado para</text><text x="32" y="212" class="s" font-size="15" fill="#5A6472">o imóvel. A regra dos guias é de 20% a</text><text x="32" y="233" class="s" font-size="15" fill="#5A6472">35%.</text><text x="32" y="276" class="s" font-size="14.5" font-weight="600" fill="#1A2332">Preço do m² do bairro (FipeZap)</text><rect x="32.0" y="288.0" width="356.0" height="8.0" rx="4" fill="#F6F3EE"/><rect x="197.1" y="288.0" width="75.2" height="8.0" rx="4" fill="#2F6FA8"/><circle cx="233.7" cy="292.0" r="7" fill="#D07A3E" fill-opacity="1.0"/><text x="233.733" y="318" class="s" font-size="14" font-weight="700" fill="#1A2332" text-anchor="middle">20,4%</text><text x="32" y="336" class="m" font-size="11.5" fill="#5A6472">metade central: 16,7% a 24,3%</text><text x="32" y="366" class="s" font-size="14.5" font-weight="600" fill="#1A2332">Média de São Paulo (R$ 12.206/m²)</text><rect x="32.0" y="378.0" width="356.0" height="8.0" rx="4" fill="#F6F3EE"/><rect x="234.7" y="378.0" width="63.3" height="8.0" rx="4" fill="#2F6FA8"/><circle cx="261.4" cy="382.0" r="7" fill="#D07A3E" fill-opacity="1.0"/><text x="261.422" y="408" class="s" font-size="14" font-weight="700" fill="#1A2332" text-anchor="middle">23,2%</text><text x="32" y="426" class="m" font-size="11.5" fill="#5A6472">metade central: 20,5% a 26,9%</text><text x="32" y="456" class="s" font-size="14.5" font-weight="600" fill="#1A2332">Imóvel novo (R$ 15.800/m², Brain)</text><rect x="32.0" y="468.0" width="356.0" height="8.0" rx="4" fill="#F6F3EE"/><rect x="188.2" y="468.0" width="49.4" height="8.0" rx="4" fill="#2F6FA8"/><circle cx="209.0" cy="472.0" r="7" fill="#D07A3E" fill-opacity="1.0"/><text x="209.011" y="498" class="s" font-size="14" font-weight="700" fill="#1A2332" text-anchor="middle">17,9%</text><text x="32" y="516" class="m" font-size="11.5" fill="#5A6472">metade central: 15,8% a 20,8%</text><line x1="32.0" y1="534.0" x2="388.0" y2="534.0" stroke="#E7E2D9" stroke-width="1"/><text x="32" y="556" class="m" font-size="12" fill="#5A6472">Fontes: Índice Bewild; FipeZap set/2026; Brain</text><text x="32" y="576" class="m" font-size="13" font-weight="700" fill="#11355B">bewild.com.br</text></svg>
