<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320" role="img" aria-labelledby="t"><title id="t">Distribuição dos 198 contratos Bewild por peso da reforma no valor do imóvel (m² do bairro, FipeZap set/2026): 24 contratos entre 10% e 15%, 82 entre 15% e 20%, 58 entre 20% e 25%, 18 entre 25% e 30% e 16 acima de 30%. Nenhum abaixo de 10%.</title><rect width="720" height="320" fill="#FFFFFF"/><text x="16" y="26" font-size="16" fill="#1F2937" text-anchor="start" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Em 140 dos 198 contratos, a reforma ficou entre 10% e 25% do imóvel</text><text x="16" y="46" font-size="12" fill="#6B7280" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Contratos por faixa de peso (valor do contrato ÷ área × m² do bairro)</text><line x1="46" y1="240" x2="700" y2="240" stroke="#E5E7EB"/><text x="40" y="244" font-size="12" fill="#6B7280" text-anchor="end" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">0</text><line x1="46" y1="183" x2="700" y2="183" stroke="#E5E7EB"/><text x="40" y="187" font-size="12" fill="#6B7280" text-anchor="end" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">30</text><line x1="46" y1="127" x2="700" y2="127" stroke="#E5E7EB"/><text x="40" y="131" font-size="12" fill="#6B7280" text-anchor="end" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">60</text><line x1="46" y1="70" x2="700" y2="70" stroke="#E5E7EB"/><text x="40" y="74" font-size="12" fill="#6B7280" text-anchor="end" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">90</text><rect x="67" y="240" width="68" height="1" fill="#0F4C5C" rx="3"/><text x="100" y="234" font-size="13" fill="#1F2937" text-anchor="middle" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">0</text><text x="100" y="258" font-size="12" fill="#1F2937" text-anchor="middle" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">até 10%</text><rect x="176" y="195" width="68" height="45" fill="#0F4C5C" rx="3"/><text x="210" y="189" font-size="13" fill="#1F2937" text-anchor="middle" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">24</text><text x="210" y="258" font-size="12" fill="#1F2937" text-anchor="middle" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">10–15%</text><rect x="285" y="85" width="68" height="155" fill="#E8702A" rx="3"/><text x="318" y="79" font-size="13" fill="#1F2937" text-anchor="middle" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">82</text><text x="318" y="258" font-size="12" fill="#1F2937" text-anchor="middle" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">15–20%</text><rect x="394" y="130" width="68" height="110" fill="#E8702A" rx="3"/><text x="428" y="124" font-size="13" fill="#1F2937" text-anchor="middle" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">58</text><text x="428" y="258" font-size="12" fill="#1F2937" text-anchor="middle" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">20–25%</text><rect x="503" y="206" width="68" height="34" fill="#0F4C5C" rx="3"/><text x="536" y="200" font-size="13" fill="#1F2937" text-anchor="middle" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">18</text><text x="536" y="258" font-size="12" fill="#1F2937" text-anchor="middle" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">25–30%</text><rect x="612" y="210" width="68" height="30" fill="#0F4C5C" rx="3"/><text x="646" y="204" font-size="13" fill="#1F2937" text-anchor="middle" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">16</text><text x="646" y="258" font-size="12" fill="#1F2937" text-anchor="middle" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">acima de 30%</text><text x="16" y="310" font-size="12" fill="#6B7280" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Fonte: contratos Bewild (198 reg., 27/9/2026) × FipeZap set/2026 por bairro de referência.</text></svg>
