<svg xmlns="http://www.w3.org/2000/svg" width="420" height="360" viewBox="0 0 420 360" role="img" aria-labelledby="t"><title id="t">Peso da reforma completa no valor do imóvel em 198 contratos Bewild: 19,7% usando o preço do m² do bairro (FipeZap set/2026), 22,5% usando a média de São Paulo (R$ 12.206/m²) e 17,4% usando o m² de imóvel novo (R$ 15.800, Brain out/2025). A regra de mercado citada em guias é de 20% a 35%.</title><rect width="420" height="360" fill="#FFFFFF"/><text x="16" y="26" font-size="14" fill="#1F2937" text-anchor="start" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">A reforma completa pesa 17% a 23% do valor do imóvel</text><text x="16" y="46" font-size="12" fill="#6B7280" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Mediana de 198 contratos ÷ valor do imóvel</text><rect x="188" y="62" width="129" height="196" fill="#E5E7EB" opacity="0.7"/><text x="188" y="58" font-size="12" fill="#6B7280" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">regra de mercado: 20% a 35%</text><text x="16" y="80" font-size="12" fill="#1F2937" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">m² do bairro (FipeZap set/2026)</text><line x1="157" y1="95" x2="210" y2="95" stroke="#E8702A" stroke-width="18" opacity="0.25"/><line x1="185" y1="86" x2="185" y2="104" stroke="#E8702A" stroke-width="5"/><text x="193" y="100" font-size="13" fill="#1F2937" text-anchor="start" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">19,7%</text><text x="16" y="144" font-size="12" fill="#1F2937" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">m² de imóvel novo (Brain out/2025)</text><line x1="151" y1="159" x2="187" y2="159" stroke="#0F4C5C" stroke-width="18" opacity="0.25"/><line x1="166" y1="150" x2="166" y2="168" stroke="#0F4C5C" stroke-width="5"/><text x="174" y="164" font-size="13" fill="#1F2937" text-anchor="start" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">17,4%</text><text x="16" y="208" font-size="12" fill="#1F2937" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">m² médio de São Paulo (FipeZap)</text><line x1="191" y1="223" x2="238" y2="223" stroke="#0F4C5C" stroke-width="18" opacity="0.25"/><line x1="210" y1="214" x2="210" y2="232" stroke="#0F4C5C" stroke-width="5"/><text x="218" y="228" font-size="13" fill="#1F2937" text-anchor="start" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">22,5%</text><text x="16" y="276" font-size="12" fill="#6B7280" text-anchor="middle" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">0%</text><text x="102" y="276" font-size="12" fill="#6B7280" text-anchor="middle" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">10%</text><text x="188" y="276" font-size="12" fill="#6B7280" text-anchor="middle" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">20%</text><text x="274" y="276" font-size="12" fill="#6B7280" text-anchor="middle" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">30%</text><text x="360" y="276" font-size="12" fill="#6B7280" text-anchor="middle" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">40%</text><line x1="26" y1="324" x2="46" y2="324" stroke="#0F4C5C" stroke-width="12" opacity="0.25"/><text x="52" y="328" font-size="12" fill="#6B7280" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">metade central (Q1–Q3)</text><text x="16" y="350" font-size="12" fill="#6B7280" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Fonte: contratos Bewild; FipeZap set/2026; Brain 2025.</text></svg>
