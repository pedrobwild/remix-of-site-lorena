<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="t"><title id="t">Peso do m² mediano de reforma Bewild (R$ 2.744) sobre o preço do m² de venda por bairro (FipeZap set/2026): Itaim Bibi 13,7% (R$ 19.989/m²); Pinheiros 15,0%; Jardins 15,2%; Moema 16,6%; Vila Mariana 18,4%; Paraíso 19,4%; Perdizes 20,4%; Bela Vista 21,6%; média de São Paulo 22,5% (R$ 12.206); Santana 29,5%; Vila Andrade 32,8% (R$ 8.372).</title><rect width="720" height="420" fill="#FFFFFF"/><text x="16" y="26" font-size="15" fill="#1F2937" text-anchor="start" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">O mesmo R$ 2.744/m² de reforma pesa 14% no Itaim e 33% na Vila Andrade</text><text x="16" y="46" font-size="12" fill="#6B7280" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">R$/m² mediano de reforma ÷ R$/m² de venda do bairro (FipeZap set/2026)</text><text x="16" y="79" font-size="12" fill="#1F2937" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Itaim Bibi</text><rect x="166" y="62" width="139" height="24" fill="#0F4C5C" rx="3"/><text x="311" y="79" font-size="12" fill="#1F2937" text-anchor="start" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">13,7%  ·  R$ 19.989/m²</text><text x="16" y="109" font-size="12" fill="#1F2937" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Pinheiros</text><rect x="166" y="92" width="152" height="24" fill="#0F4C5C" rx="3"/><text x="324" y="109" font-size="12" fill="#1F2937" text-anchor="start" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">15,0%  ·  R$ 18.260/m²</text><text x="16" y="139" font-size="12" fill="#1F2937" text-anchor="start" font-weight="normal" font-family="-apple-