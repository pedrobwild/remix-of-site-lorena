<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 515" width="720" height="618" role="img" aria-labelledby="t d"><title id="t">Estabilidade e sensibilidade do peso da reforma no valor do imóvel</title><desc id="d">Medianas por período: Março a junho 20,1%; Junho a setembro 20,8%; Setembro a novembro 20,5%. Sensibilidade ao preço do imóvel: m² 15% abaixo 24,0%; m² do FipeZap 20,4%; m² 15% acima 17,7%.</desc><style>.s{font-family:Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif}.m{font-family:'JetBrains Mono', Menlo, Consolas, monospace}</style><rect width="600" height="515" fill="#FFFFFF"/><text x="32" y="44" class="m" font-size="13" font-weight="700" fill="#11355B" letter-spacing="1.5">ESTABILIDADE E SENSIBILIDADE</text><text x="32" y="78" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">O peso fica perto de 20% o ano</text><text x="32" y="108" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">todo e muda com o preço do imóvel</text><text x="32" y="140" class="s" font-size="15" fill="#5A6472">Mediana do peso em três grupos de 195 orçamentos, pela</text><text x="32" y="161" class="s" font-size="15" fill="#5A6472">data, e com o m² do imóvel 15% abaixo ou acima do</text><text x="32" y="182" class="s" font-size="15" fill="#5A6472">FipeZap.</text><text x="32" y="221" class="m" font-size="12.5" font-weight="700" fill="#11355B">POR PERÍODO DE 2026</text><text x="32" y="256" class="s" font-size="14" font-weight="600" fill="#1A2332">Março a junho</text><rect x="200.0" y="243.0" width="188.9" height="16.0" rx="4" fill="#2F6FA8"/><text x="396.94" y="256" class="s" font-size="13.5" font-weight="700" fill="#1A2332">20,1%</text><text x="32" y="288" class="s" font-size="14" font-weight="600" fill="#1A2332">Junho a setembro</text><rect x="200.0" y="275.0" width="195.5" height="16.0" rx="4" fill="#2F6FA8"/><text x="403.52" y="288" class="s" font-size="13.5" font-weight="700" fill="#1A2332">20,8%</text><text x="32" y="320" class="s" font-size="14" font-weight="600" fill="#1A2332">Setembro a novembro</text><rect x="200.0" y="307.0" width="192.7" height="16.0" rx="4" fill="#2F6FA8"/><text x="400.7" y="320" class="s" font-size="13.5" font-weight="700" fill="#1A2332">20,5%</text><text x="32" y="349" class="m" font-size="12.5" font-weight="700" fill="#11355B">POR PREÇO DO IMÓVEL</text><text x="32" y="384" class="s" font-size="14" font-weight="600" fill="#1A2332">m² 15% abaixo</text><rect x="200.0" y="371.0" width="225.6" height="16.0" rx="4" fill="#2F6FA8"/><text x="433.6" y="384" class="s" font-size="13.5" font-weight="700" fill="#1A2332">24,0%</text><text x="32" y="416" class="s" font-size="14" font-weight="600" fill="#1A2332">m² do FipeZap</text><rect x="200.0" y="403.0" width="191.8" height="16.0" rx="4" fill="#D07A3E"/><text x="399.76" y="416" class="s" font-size="13.5" font-weight="700" fill="#1A2332">20,4%</text><text x="32" y="448" class="s" font-size="14" font-weight="600" fill="#1A2332">m² 15% acima</text><rect x="200.0" y="435.0" width="166.4" height="16.0" rx="4" fill="#2F6FA8"/><text x="374.38" y="448" class="s" font-size="13.5" font-weight="700" fill="#1A2332">17,7%</text><line x1="32.0" y1="471.0" x2="568.0" y2="471.0" stroke="#E7E2D9" stroke-width="1"/><text x="32" y="493" class="m" font-size="13" fill="#5A6472">Fontes: Índice Bewild; FipeZap set/2026</text><text x="568" y="493" class="m" font-size="13" font-weight="700" fill="#11355B" text-anchor="end">bewild.com.br</text></svg>
