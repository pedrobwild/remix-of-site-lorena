<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 553" width="720" height="664" role="img" aria-labelledby="t d"><title id="t">Regra de 20% a 35% do valor do imóvel contra o orçamento mediano, para 26 m²</title><desc id="d">Média de São Paulo (imóvel de R$ 317 mil): R$ 63 mil a R$ 111 mil; Bela Vista (imóvel de R$ 330 mil): R$ 66 mil a R$ 115 mil; Imóvel novo (imóvel de R$ 411 mil): R$ 82 mil a R$ 144 mil; Pinheiros (imóvel de R$ 475 mil): R$ 95 mil a R$ 166 mil. O orçamento mediano do Índice Bewild é R$ 74.132.</desc><style>.s{font-family:Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif}.m{font-family:'JetBrains Mono', Menlo, Consolas, monospace}</style><rect width="600" height="553" fill="#FFFFFF"/><text x="32" y="44" class="m" font-size="13" font-weight="700" fill="#11355B" letter-spacing="1.5">A REGRA CONTRA O ORÇAMENTO</text><text x="32" y="78" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">A regra de 20% a 35% passa do</text><text x="32" y="108" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">orçamento em quase todos os casos</text><text x="32" y="140" class="s" font-size="15" fill="#5A6472">Faixa que a regra manda reservar para um apartamento de</text><text x="32" y="161" class="s" font-size="15" fill="#5A6472">26 m² (cinza) e o orçamento mediano do Índice, R$ 74 mil</text><text x="32" y="182" class="s" font-size="15" fill="#5A6472">(laranja).</text><text x="32" y="225" class="s" font-size="14.5" font-weight="600" fill="#1A2332">Média de São Paulo</text><text x="568" y="225" class="m" font-size="12" fill="#5A6472" text-anchor="end">imóvel de R$ 317 mil</text><rect x="32.0" y="237.0" width="536.0" height="10.0" rx="5" fill="#F6F3EE"/><rect x="220.8" y="237.0" width="141.6" height="10.0" rx="5" fill="#B9C0C9"/><line x1="252.7" y1="231.0" x2="252.7" y2="253.0" stroke="#D07A3E" stroke-width="3"/><text x="220.791" y="269" class="m" font-size="12.5" font-weight="700" fill="#1A2332" text-anchor="middle">R$ 63 mil</text><text x="362.384" y="269" class="m" font-size="12.5" font-weight="700" fill="#1A2332" text-anchor="middle">R$ 111 mil</text><text x="32" y="299" class="s" font-size="14.5" font-weight="600" fill="#1A2332">Bela Vista</text><text x="568" y="299" class="m" font-size="12" fill="#5A6472" text-anchor="end">imóvel de R$ 330 mil</text><rect x="32.0" y="311.0" width="536.0" height="10.0" rx="5" fill="#F6F3EE"/><rect x="228.5" y="311.0" width="147.4" height="10.0" rx="5" fill="#B9C0C9"/><line x1="252.7" y1="305.0" x2="252.7" y2="327.0" stroke="#D07A3E" stroke-width="3"/><text x="228.533" y="343" class="m" font-size="12.5" font-weight="700" fill="#1A2332" text-anchor="middle">R$ 66 mil</text><text x="375.933" y="343" class="m" font-size="12.5" font-weight="700" fill="#1A2332" text-anchor="middle">R$ 115 mil</text><text x="32" y="373" class="s" font-size="14.5" font-weight="600" fill="#1A2332">Imóvel novo</text><text x="568" y="373" class="m" font-size="12" fill="#5A6472" text-anchor="end">imóvel de R$ 411 mil</text><rect x="32.0" y="385.0" width="536.0" height="10.0" rx="5" fill="#F6F3EE"/><rect x="276.8" y="385.0" width="183.6" height="10.0" rx="5" fill="#B9C0C9"/><line x1="252.7" y1="379.0" x2="252.7" y2="401.0" stroke="#D07A3E" stroke-width="3"/><text x="276.773" y="417" class="m" font-size="12.5" font-weight="700" fill="#1A2332" text-anchor="middle">R$ 82 mil</text><text x="460.353" y="417" class="m" font-size="12.5" font-weight="700" fill="#1A2332" text-anchor="middle">R$ 144 mil</text><text x="32" y="447" class="s" font-size="14.5" font-weight="600" fill="#1A2332">Pinheiros</text><text x="568" y="447" class="m" font-size="12" fill="#5A6472" text-anchor="end">imóvel de R$ 475 mil</text><rect x="32.0" y="459.0" width="536.0" height="10.0" rx="5" fill="#F6F3EE"/><rect x="314.9" y="459.0" width="212.2" height="10.0" rx="5" fill="#B9C0C9"/><line x1="252.7" y1="453.0" x2="252.7" y2="475.0" stroke="#D07A3E" stroke-width="3"/><text x="314.889" y="491" class="m" font-size="12.5" font-weight="700" fill="#1A2332" text-anchor="middle">R$ 95 mil</text><text x="527.056" y="491" class="m" font-size="12.5" font-weight="700" fill="#1A2332" text-anchor="middle">R$ 166 mil</text><line x1="32.0" y1="509.0" x2="568.0" y2="509.0" stroke="#E7E2D9" stroke-width="1"/><text x="32" y="531" class="m" font-size="13" fill="#5A6472">Fontes: Índice Bewild; FipeZap set/2026; Brain</text><text x="568" y="531" class="m" font-size="13" font-weight="700" fill="#11355B" text-anchor="end">bewild.com.br</text></svg>
