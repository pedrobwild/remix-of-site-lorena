<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 628" width="420" height="628" role="img" aria-labelledby="t d"><title id="t">Quanto você precisa pagar: orçamento de reforma completa por faixa de metragem</title><desc id="d">Até 20 m²: R$ 66.969 (42 orçamentos); 20 a 24 m²: R$ 69.160 (64 orçamentos); 24 a 28 m²: R$ 70.537 (241 orçamentos); 28 a 32 m²: R$ 75.656 (107 orçamentos); 32 a 40 m²: R$ 95.459 (109 orçamentos); 40 a 45 m²: R$ 109.938 (22 orçamentos).</desc><style>.s{font-family:Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif}.m{font-family:'JetBrains Mono', Menlo, Consolas, monospace}</style><rect width="420" height="628" fill="#FFFFFF"/><text x="32" y="44" class="m" font-size="13" font-weight="700" fill="#11355B" letter-spacing="1.5">O VALOR A PAGAR</text><text x="32" y="78" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">Quanto você precisa</text><text x="32" y="108" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">pagar: orçamento por</text><text x="32" y="138" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">faixa de metragem</text><text x="32" y="170" class="s" font-size="15" fill="#5A6472">Orçamento mediano de reforma completa em</text><text x="32" y="191" class="s" font-size="15" fill="#5A6472">cada faixa. Até 32 m², fica entre R$ 67</text><text x="32" y="212" class="s" font-size="15" fill="#5A6472">mil e R$ 76 mil; acima disso, sobe de</text><text x="32" y="233" class="s" font-size="15" fill="#5A6472">patamar.</text><text x="32" y="278" class="s" font-size="14" font-weight="600" fill="#1A2332">Até 20 m²</text><text x="388" y="278" class="m" font-size="11.5" fill="#5A6472" text-anchor="end">42 orç.</text><rect x="32.0" y="285.0" width="144.7" height="16.0" rx="4" fill="#2F6FA8"/><text x="184.653" y="298" class="s" font-size="13.5" font-weight="700" fill="#1A2332">R$ 66.969</text><text x="32" y="326" class="s" font-size="14" font-weight="600" fi