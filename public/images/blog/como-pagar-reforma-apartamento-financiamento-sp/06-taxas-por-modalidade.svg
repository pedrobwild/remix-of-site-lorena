<svg xmlns="http://www.w3.org/2000/svg" width="720" height="398" viewBox="0 0 720 398" role="img" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif">
<rect width="720" height="398" fill="#FFFFFF"/>
<text x="20" y="34" font-size="19" font-weight="700" fill="#1F2937">Taxa de juros ao mês por modalidade de crédito para reforma</text>
<text x="20" y="58" font-size="13" fill="#4B5563">% ao mês. O CDI aparece como referência: é quanto o dinheiro aplicado rende antes do IR</text>
