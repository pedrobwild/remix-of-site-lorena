<text x="316" y="306" font-size="13" font-weight="600" fill="#1F2937">1,07% a.m.</text>
<text x="20" y="366" font-size="12" fill="#9CA3AF">Fontes: Banco Central, séries 20742 (ago/2026) e 20747 (jul/2026, 28,43% a.a.); Caixa, Reforma Casa Brasil e</text>
<text x="20" y="384" font-size="12" fill="#9CA3AF">Reforma com Garantia de Imóvel (nov/2025); CDI estimado a partir da Selic de 13,75% (Copom, 16/09/2026).</text>
