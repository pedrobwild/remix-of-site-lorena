<rect x="263" y="122" width="92" height="18" rx="2" fill="#0F4C5C"/>
<text x="361" y="136" font-size="13" font-weight="600" fill="#1F2937">2,11% a.m.</text>
<text x="255" y="169" font-size="13" text-anchor="end" fill="#1F2937">Reforma Casa Brasil, faixa 2</text>
<rect x="263" y="156" width="85" height="18" rx="2" fill="#0F4C5C"/>
<text x="354" y="170" font-size="13" font-weight="600" fill="#1F2937">1,95% a.m.</text>
<text x="255" y="203" font-size="13" text-anchor="end" fill="#1F2937">Garantia de imóvel (máx.)</text>
<rect x="263" y="190" width="85" height="18" rx="2" fill="#0F4C5C"/>
<text x="354" y="204" font-size="13" font-weight="600" fill="#1F2937">1,95% a.m.</text>
<text x="255" y="237" font-size="13" text-anchor="end" fill="#1F2937">Garantia de imóvel (mín.)</text>
<rect x="263" y="224" width="58" height="18" rx="2" fill="#0F4C5C"/>
<text x="327" y="238" font-size="13" font-weight="600" fill="#1F2937">1,33% a.m.</text>
<text x="255" y="271" font-size="13" text-anchor="end" fill="#1F2937">Reforma Casa Brasil, faixa 1</text>
<rect x="263" y="258" width="51" height="18" rx="2" fill="#0F4C5C"/>
<text x="320" y="272" font-size="13" font-weight="600" fill="#1F2937">1,17% a.m.</text>
