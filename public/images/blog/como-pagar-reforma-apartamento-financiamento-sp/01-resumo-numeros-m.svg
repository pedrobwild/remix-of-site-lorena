<svg xmlns="http://www.w3.org/2000/svg" width="420" height="556" viewBox="0 0 420 556" role="img" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif">
<rect width="420" height="556" fill="#FFFFFF"/>
<text x="20" y="34" font-size="19" font-weight="700" fill="#1F2937">Como pagar a reforma:</text>
<text x="20" y="58" font-size="19" font-weight="700" fill="#1F2937">os números</text>
<text x="20" y="82" font-size="13" fill="#4B5563">Base Bewild (204 contratos) + BCB e Caixa</text>
<rect x="20.0" y="108" width="184.0" height="124" rx="6" fill="#F3F6F7" stroke="#E5E7EB"/>
<text x="34.0" y="148" font-size="19" font-weight="700" fill="#0F4C5C">R$ 72.584</text>
<text x="34.0" y="172" font-size="13" fill="#4B5563">valor mediano de 204</text>
<text x="34.0" y="189" font-size="13" fill="#4B5563">contratos de reforma</text>
<text x="34.0" y="206" font-size="13" fill="#4B5563">completa</text>
<rect x="216.0" y="108" width="184.0" height="124" rx="6" fill="#F3F6F7" stroke="#E5E7EB"/>
<text x="230.0" y="148" font-size="19" font-weight="700" fill="#0F4C5C">6,39% a.m.</text>
<text x="230.0" y="172" font-size="13" fill="#4B5563">crédito pessoal sem</text>
<text x="230.0" y="189" font-size="13" fill="#4B5563">garantia (BCB, ago/2026)</text>
<rect x="20.0" y="244" width="184.0" height="124" rx="6" fill="#F3F6F7" stroke="#E5E7EB"/>
<text x="34.0" y="284" font-size="19" font-weight="700" fill="#E07A1F">R$ 114 mil</text>
<text x="34.0" y="308" font-size="13" fill="#4B5563">de juros nesse crédito em</text>
<text x="34.0" y="325" font-size="13" fill="#4B5563">36 meses</text>
<rect x="216.0" y="244" width="184.0" height="124" rx="6" fill="#F3F6F7" stroke="#E5E7EB"/>
<text x="230.0" y="284" font-size="19" font-weight="700" fill="#0F4C5C">1,33% a 1,95%</text>
<text x="230.0" y="308" font-size="13" fill="#4B5563">ao mês no crédito com</text>
<text x="230.0" y="325" font-size="13" fill="#4B5563">garantia de imóvel</text>
<text x="230.0" y="342" font-size="13" fill="#4B5563">(Caixa)</text>
<rect x="20.0" y="380" width="184.0" height="124" rx="6" fill="#F3F6F7" stroke="#E5E7EB"/>
<text x="34.0" y="420" font-size="19" font-weight="700" fill="#0F4C5C">R$ 4.834</text>
<text x="34.0" y="444" font-size="13" fill="#4B5563">alta da obra mediana em</text>
<text x="34.0" y="461" font-size="13" fill="#4B5563">12 meses de INCC</text>
<rect x="216.0" y="380" width="184.0" height="124" rx="6" fill="#F3F6F7" stroke="#E5E7EB"/>
<text x="230.0" y="420" font-size="19" font-weight="700" fill="#0F4C5C">30% + 12x</text>
<text x="230.0" y="444" font-size="13" fill="#4B5563">entrada e saldo no cartão</text>
<text x="230.0" y="461" font-size="13" fill="#4B5563">sem juros (Bewild)</text>
<text x="20" y="542" font-size="12" fill="#9CA3AF">Fontes no fim do artigo. Out/2026.</text>
</svg>
