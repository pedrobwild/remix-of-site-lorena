<svg xmlns="http://www.w3.org/2000/svg" width="720" height="396" viewBox="0 0 720 396" role="img" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif">
<rect width="720" height="396" fill="#FFFFFF"/>
<text x="20" y="34" font-size="19" font-weight="700" fill="#1F2937">Como pagar a reforma do apartamento: os números</text>
<text x="20" y="58" font-size="13" fill="#4B5563">Base Bewild de 204 contratos + Banco Central, Caixa e FGV</text>
<rect x="20.0" y="84" width="218.7" height="124" rx="6" fill="#F3F6F7" stroke="#E5E7EB"/>
<text x="34.0" y="124" font-size="24" font-weight="700" fill="#0F4C5C">R$ 72.584</text>
<text x="34.0" y="148" font-size="13" fill="#4B5563">valor mediano de 204 contratos</text>
<text x="34.0" y="165" font-size="13" fill="#4B5563">de reforma completa</text>
<rect x="250.7" y="84" width="218.7" height="124" rx="6" fill="#F3F6F7" stroke="#E5E7EB"/>
<text x="264.7" y="124" font-size="24" font-weight="700" fill="#0F4C5C">6,39% a.m.</text>
<text x="264.7" y="148" font-size="13" fill="#4B5563">crédito pessoal sem garantia</text>
<text x="264.7" y="165" font-size="13" fill="#4B5563">(BCB, ago/2026)</text>
<rect x="481.3" y="84" width="218.7" height="124" rx="6" fill="#F3F6F7" stroke="#E5E7EB"/>
<text x="495.3" y="124" font-size="24" font-weight="700" fill="#E07A1F">R$ 114 mil</text>
<text x="495.3" y="148" font-size="13" fill="#4B5563">de juros nesse crédito em 36</text>
<text x="495.3" y="165" font-size="13" fill="#4B5563">meses</text>
<rect x="20.0" y="220" width="218.7" height="124" rx="6" fill="#F3F6F7" stroke="#E5E7EB"/>
<text x="34.0" y="260" font-size="24" font-weight="700" fill="#0F4C5C">1,33% a 1,95%</text>
<text x="34.0" y="284" font-size="13" fill="#4B5563">ao mês no crédito com garantia</text>
<text x="34.0" y="301" font-size="13" fill="#4B5563">de imóvel (Caixa)</text>
<rect x="250.7" y="220" width="218.7" height="124" rx="6" fill="#F3F6F7" stroke="#E5E7EB"/>
<text x="264.7" y="260" font-size="24" font-weight="700" fill="#0F4C5C">R$ 4.834</text>
<text x="264.7" y="284" font-size="13" fill="#4B5563">alta da obra mediana em 12</text>
<text x="264.7" y="301" font-size="13" fill="#4B5563">meses de INCC</text>
<rect x="481.3" y="220" width="218.7" height="124" rx="6" fill="#F3F6F7" stroke="#E5E7EB"/>
<text x="495.3" y="260" font-size="24" font-weight="700" fill="#0F4C5C">30% + 12x</text>
<text x="495.3" y="284" font-size="13" fill="#4B5563">entrada e saldo no cartão sem</text>
<text x="495.3" y="301" font-size="13" fill="#4B5563">juros (Bewild)</text>
<text x="20" y="382" font-size="12" fill="#9CA3AF">Fontes no fim do artigo. Out/2026.</text>
