<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 588" width="720" height="706" role="img" aria-labelledby="t d"><title id="t">Como pagar a reforma do apartamento: os números</title><desc id="d">Orçamento mediano de R$ 74.132 em 585 orçamentos de reforma completa da Bewild; crédito pessoal a 6,39% ao mês (Banco Central, agosto de 2026); R$ 116.950 de juros nesse crédito em 36 meses; 1,33% a 1,95% ao mês no crédito com garantia de imóvel da Caixa; R$ 4.937 de alta da obra em 12 meses de INCC; 30% de entrada e saldo em até 12 vezes sem juros no cartão na Bewild.</desc><style>.s{font-family:Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif}.m{font-family:'JetBrains Mono', Menlo, Consolas, monospace}</style><rect width="600" height="588" fill="#FFFFFF"/><text x="32" y="44" class="m" font-size="13" font-weight="700" fill="#11355B" letter-spacing="1.5">COMO PAGAR A REFORMA</text><text x="32" y="78" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">Como pagar a reforma do</text><text x="32" y="108" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">apartamento: os números</text><text x="32" y="140" class="s" font-size="15" fill="#5A6472">Índice Bewild de novembro de 2026 com as taxas do Banco</text><text x="32" y="161" class="s" font-size="15" fill="#5A6472">Central, da Caixa e o INCC da FGV.</text><rect x="32.0" y="196.0" width="260.0" height="96.0" rx="6" fill="#F6F3EE"/><rect x="32.0" y="196.0" width="4.0" height="96.0" rx="2" fill="#D07A3E"/><text x="52" y="238" class="s" font-size="28" font-weight="700" fill="#1A2332">R$ 74.132</text><text x="52" y="262" class="s" font-size="13.5" fill="#5A6472">orçamento mediano de reforma</text><text x="52" y="279" class="s" font-size="13.5" fill="#5A6472">completa, 585 orçamentos</text><rect x="308.0" y="196.0" width="260.0" height="96.0" rx="6" fill="#F6F3EE"/><rect x="308.0" y="196.0" width="4.0" height="96.0" rx="2" fill="#2F6FA8"/><text x="328" y="238" class="s" font-size="28" font-weight="700" fill="#1A2332">6,39% a.m.</text><text x="328" y="262" class="s" font-size="13.5" fill="#5A6472">crédito pessoal sem garantia</text><text x="328" y="279" class="s" font-size="13.5" fill="#5A6472">(BCB, ago/2026)</text><rect x="32.0" y="308.0" width="260.0" height="96.0" rx="6" fill="#F6F3EE"/><rect x="32.0" y="308.0" width="4.0" height="96.0" rx="2" fill="#2F6FA8"/><text x="52" y="350" class="s" font-size="28" font-weight="700" fill="#1A2332">R$ 117 mil</text><text x="52" y="374" class="s" font-size="13.5" fill="#5A6472">de juros nesse crédito em 36</text><text x="52" y="391" class="s" font-size="13.5" fill="#5A6472">parcelas</text><rect x="308.0" y="308.0" width="260.0" height="96.0" rx="6" fill="#F6F3EE"/><rect x="308.0" y="308.0" width="4.0" height="96.0" rx="2" fill="#D07A3E"/><text x="328" y="350" class="s" font-size="28" font-weight="700" fill="#1A2332">1,33% a 1,95%</text><text x="328" y="374" class="s" font-size="13.5" fill="#5A6472">ao mês com garantia de imóvel</text><text x="328" y="391" class="s" font-size="13.5" fill="#5A6472">(Caixa)</text><rect x="32.0" y="420.0" width="260.0" height="96.0" rx="6" fill="#F6F3EE"/><rect x="32.0" y="420.0" width="4.0" height="96.0" rx="2" fill="#2F6FA8"/><text x="52" y="462" class="s" font-size="28" font-weight="700" fill="#1A2332">R$ 4.937</text><text x="52" y="486" class="s" font-size="13.5" fill="#5A6472">alta da obra mediana em 12 meses</text><text x="52" y="503" class="s" font-size="13.5" fill="#5A6472">de INCC</text><rect x="308.0" y="420.0" width="260.0" height="96.0" rx="6" fill="#F6F3EE"/><rect x="308.0" y="420.0" width="4.0" height="96.0" rx="2" fill="#2F6FA8"/><text x="328" y="462" class="s" font-size="28" font-weight="700" fill="#1A2332">30% + 12x</text><text x="328" y="486" class="s" font-size="13.5" fill="#5A6472">entrada e saldo no cartão sem</text><text x="328" y="503" class="s" font-size="13.5" fill="#5A6472">juros (Bewild)</text><line x1="32.0" y1="544.0" x2="568.0" y2="544.0" stroke="#E7E2D9" stroke-width="1"/><text x="32" y="566" class="m" font-size="13" fill="#5A6472">Fontes: Índice Bewild; BCB; Caixa; FGV</text><text x="568" y="566" class="m" font-size="13" font-weight="700" fill="#11355B" text-anchor="end">bewild.com.br</text></svg>
