<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 0 380 963" width="380" height="963" role="img" aria-labelledby="t d"><title id="t">Como pagar a reforma do apartamento: os números</title><desc id="d">Orçamento mediano de R$ 74.132 em 585 orçamentos de reforma completa da Bewild; crédito pessoal a 6,39% ao mês (Banco Central, agosto de 2026); R$ 116.950 de juros nesse crédito em 36 meses; 1,33% a 1,95% ao mês no crédito com garantia de imóvel da Caixa; R$ 4.937 de alta da obra em 12 meses de INCC; 30% de entrada e saldo em até 12 vezes sem juros no cartão na Bewild.</desc><style>.s{font-family:Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif}.m{font-family:'JetBrains Mono', Menlo, Consolas, monospace}</style><rect width="420" height="963" fill="#FFFFFF"/><text x="32" y="44" class="m" font-size="13" font-weight="700" fill="#11355B" letter-spacing="1.5">COMO PAGAR A REFORMA</text><text x="32" y="78" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">Como pagar a reforma do</text><text x="32" y="108" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">apartamento: os números</text><text x="32" y="140" class="s" font-size="15" fill="#5A6472">Índice Bewild de novembro de 2026 com as</text><text x="32" y="161" class="s" font-size="15" fill="#5A6472">taxas do Banco Central, da Caixa e o</text><text x="32" y="182" class="s" font-size="15" fill="#5A6472">INCC da FGV.</text><rect x="32.0" y="217.0" width="356.0" height="96.0" rx="6" fill="#F6F3EE"/><rect x="32.0" y="217.0" width="4.0" height="96.0" rx="2" fill="#D07A3E"/><text x="52" y="259" class="s" font-size="28" font-weight="700" fill="#1A2332">R$ 74.132</text><text x="52" y="283" class="s" font-size="13.5" fill="#5A6472">orçamento mediano de reforma completa, 585</text><text x="52" y="300" class="s" font-size="13.5" fill="#5A6472">orçamentos</text><rect x="32.0" y="329.0" width="356.0" height="96.0" rx="6" fill="#F6F3EE"/><rect x="32.0" y="329.0" width="4.0" height="96.0" rx="2" fill="#2F6FA8"/><text x="52" y="371" class="s" font-size="28" font-weight="700" fill="#1A2332">6,39% a.m.</text><text x="52" y="395" class="s" font-size="13.5" fill="#5A6472">crédito pessoal sem garantia (BCB,</text><text x="52" y="412" class="s" font-size="13.5" fill="#5A6472">ago/2026)</text><rect x="32.0" y="441.0" width="356.0" height="96.0" rx="6" fill="#F6F3EE"/><rect x="32.0" y="441.0" width="4.0" height="96.0" rx="2" fill="#2F6FA8"/><text x="52" y="483" class="s" font-size="28" font-weight="700" fill="#1A2332">R$ 117 mil</text><text x="52" y="507" class="s" font-size="13.5" fill="#5A6472">de juros nesse crédito em 36 parcelas</text><rect x="32.0" y="553.0" width="356.0" height="96.0" rx="6" fill="#F6F3EE"/><rect x="32.0" y="553.0" width="4.0" height="96.0" rx="2" fill="#D07A3E"/><text x="52" y="595" class="s" font-size="28" font-weight="700" fill="#1A2332">1,33% a 1,95%</text><text x="52" y="619" class="s" font-size="13.5" fill="#5A6472">ao mês com garantia de imóvel (Caixa)</text><rect x="32.0" y="665.0" width="356.0" height="96.0" rx="6" fill="#F6F3EE"/><rect x="32.0" y="665.0" width="4.0" height="96.0" rx="2" fill="#2F6FA8"/><text x="52" y="707" class="s" font-size="28" font-weight="700" fill="#1A2332">R$ 4.937</text><text x="52" y="731" class="s" font-size="13.5" fill="#5A6472">alta da obra mediana em 12 meses de INCC</text><rect x="32.0" y="777.0" width="356.0" height="96.0" rx="6" fill="#F6F3EE"/><rect x="32.0" y="777.0" width="4.0" height="96.0" rx="2" fill="#2F6FA8"/><text x="52" y="819" class="s" font-size="28" font-weight="700" fill="#1A2332">30% + 12x</text><text x="52" y="843" class="s" font-size="13.5" fill="#5A6472">entrada e saldo no cartão sem juros</text><text x="52" y="860" class="s" font-size="13.5" fill="#5A6472">(Bewild)</text><line x1="32.0" y1="901.0" x2="388.0" y2="901.0" stroke="#E7E2D9" stroke-width="1"/><text x="32" y="923" class="m" font-size="12" fill="#5A6472">Fontes: Índice Bewild; BCB; Caixa; FGV</text><text x="32" y="943" class="m" font-size="13" font-weight="700" fill="#11355B">bewild.com.br</text></svg>
