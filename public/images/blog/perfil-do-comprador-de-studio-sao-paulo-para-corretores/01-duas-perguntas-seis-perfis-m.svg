<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 0 380 772" width="380" height="772" role="img" aria-labelledby="t d"><title id="t">Duas perguntas separam o comprador de studio em seis perfis</title><desc id="d">Vai alugar por temporada, mora fora da Grande São Paulo: 32% (115 pessoas); Vai alugar por temporada, mora na Grande São Paulo: 28% (101 pessoas); Vai alugar com contrato tradicional, mora em São Paulo ou fora: 18% (65 pessoas); Vai morar, mora na Grande São Paulo: 13% (45 pessoas); Vai morar, mora fora da Grande São Paulo: 6% (23 pessoas); Ainda decide ou uso misto, mora em São Paulo ou fora: 3% (11 pessoas). Base: 360 pessoas com finalidade e telefone identificados, entre as que receberam orçamento de reforma da Bewild.</desc><style>.s{font-family:Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif}.m{font-family:'JetBrains Mono', Menlo, Consolas, monospace}</style><rect width="420" height="772" fill="#FFFFFF"/><text x="32" y="44" class="m" font-size="13" font-weight="700" fill="#11355B" letter-spacing="1.5">PERFIL BEWILD · NOV/2026</text><text x="32" y="78" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">Duas perguntas separam o</text><text x="32" y="108" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">comprador de studio em</text><text x="32" y="138" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">seis perfis</text><text x="32" y="170" class="s" font-size="15" fill="#5A6472">Para que é o imóvel e onde a pessoa</text><text x="32" y="191" class="s" font-size="15" fill="#5A6472">mora. Base: 360 pessoas que receberam</text><text x="32" y="212" class="s" font-size="15" fill="#5A6472">orçamento de reforma da Bewild.</text><text x="32" y="247" class="m" font-size="13" font-weight="700" fill="#11355B" letter-spacing="1">VAI ALUGAR POR TEMPORADA</text><text x="32" y="273" class="s" font-size="14.5" font-weight="600" fill="#1A2332">Mora fora da Grande São Paulo</text><text x="388" y="273" class="m" font-size="13" fill="#5A6472" text-anchor="end">115 pessoas</text><rect x="32.0" y="281.0" width="282.0" height="16.0" rx="4" fill="#D07A3E"/><text x="322" y="294" class="s" font-size="14" font-weight="700" fill="#1A2332">32%</text><text x="32" y="321" class="s" font-size="14.5" font-weight="600" fill="#1A2332">Mora na Grande São Paulo</text><text x="388" y="321" class="m" font-size="13" fill="#5A6472" text-anchor="end">101 pessoas</text><rect x="32.0" y="329.0" width="247.7" height="16.0" rx="4" fill="#2F6FA8"/><text x="287.67" y="342" class="s" font-size="14" font-weight="700" fill="#1A2332">28%</text><text x="32" y="375" class="m" font-size="13" font-weight="700" fill="#11355B" letter-spacing="1">VAI ALUGAR COM CONTRATO TRADICIONAL</text><text x="32" y="401" class="s" font-size="14.5" font-weight="600" fill="#1A2332">Mora em São Paulo ou fora</text><text x="388" y="401" class="m" font-size="13" fill="#5A6472" text-anchor="end">65 pessoas</text><rect x="32.0" y="409.0" width="159.4" height="16.0" rx="4" fill="#2F6FA8"/><text x="199.391" y="422" class="s" font-size="14" font-weight="700" fill="#1A2332">18%</text><text x="32" y="455" class="m" font-size="13" font-weight="700" fill="#11355B" letter-spacing="1">VAI MORAR</text><text x="32" y="481" class="s" font-size="14.5" font-weight="600" fill="#1A2332">Mora na Grande São Paulo</text><text x="388" y="481" class="m" font-size="13" fill="#5A6472" text-anchor="end">45 pessoas</text><rect x="32.0" y="489.0" width="110.3" height="16.0" rx="4" fill="#2F6FA8"/><text x="150.348" y="502" class="s" font-size="14" font-weight="700" fill="#1A2332">13%</text><text x="32" y="529" class="s" font-size="14.5" font-weight="600" fill="#1A2332">Mora fora da Grande São Paulo</text><text x="388" y="529" class="m" font-size="13" fill="#5A6472" text-anchor="end">23 pessoas</text><rect x="32.0" y="537.0" width="56.4" height="16.0" rx="4" fill="#2F6FA8"/><text x="96.4" y="550" class="s" font-size="14" font-weight="700" fill="#1A2332">6%</text><text x="32" y="583" class="m" font-size="13" font-weight="700" fill="#11355B" letter-spacing="1">AINDA DECIDE OU USO MISTO</text><text x="32" y="609" class="s" font-size="14.5" font-weight="600" fill="#1A2332">Mora em São Paulo ou fora</text><text x="388" y="609" class="m" font-size="13" fill="#5A6472" text-anchor="end">11 pessoas</text><rect x="32.0" y="617.0" width="27.0" height="16.0" rx="4" fill="#2F6FA8"/><text x="66.9739" y="630" class="s" font-size="14" font-weight="700" fill="#1A2332">3%</text><text x="32" y="655" class="s" font-size="13" fill="#5A6472">Onde mora é lido pelo DDD do telefone, que mostra</text><text x="32" y="672" class="s" font-size="13" fill="#5A6472">onde o número foi habilitado, não o endereço atual.</text><text x="32" y="689" class="s" font-size="13" fill="#5A6472">Laranja: o maior grupo.</text><line x1="32.0" y1="710.0" x2="388.0" y2="710.0" stroke="#E7E2D9" stroke-width="1"/><text x="32" y="732" class="m" font-size="12" fill="#5A6472">Fonte: Perfil Bewild, nov/2026, 584 orçamentos</text><text x="32" y="752" class="m" font-size="13" font-weight="700" fill="#11355B">bewild.com.br</text></svg>
