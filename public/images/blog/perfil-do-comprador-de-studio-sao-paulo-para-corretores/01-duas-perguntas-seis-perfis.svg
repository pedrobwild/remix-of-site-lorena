<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 686" width="720" height="823" role="img" aria-labelledby="t d"><title id="t">Duas perguntas separam o comprador de studio em seis perfis</title><desc id="d">Vai alugar por temporada, mora fora da Grande São Paulo: 32% (115 pessoas); Vai alugar por temporada, mora na Grande São Paulo: 28% (101 pessoas); Vai alugar com contrato tradicional, mora em São Paulo ou fora: 18% (65 pessoas); Vai morar, mora na Grande São Paulo: 13% (45 pessoas); Vai morar, mora fora da Grande São Paulo: 6% (23 pessoas); Ainda decide ou uso misto, mora em São Paulo ou fora: 3% (11 pessoas). Base: 360 pessoas com finalidade e telefone identificados, entre as que receberam orçamento de reforma da Bewild.</desc><style>.s{font-family:Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif}.m{font-family:'JetBrains Mono', Menlo, Consolas, monospace}</style><rect width="600" height="686" fill="#FFFFFF"/><text x="32" y="44" class="m" font-size="13" font-weight="700" fill="#11355B" letter-spacing="1.5">PERFIL BEWILD · NOV/2026</text><text x="32" y="78" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">Duas perguntas separam o comprador</text><text x="32" y="108" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">de studio em seis perfis</text><text x="32" y="140" class="s" font-size="15" fill="#5A6472">Para que é o imóvel e onde a pessoa mora. Base: 360</text><text x="32" y="161" class="s" font-size="15" fill="#5A6472">pessoas que receberam orçamento de reforma da Bewild.</text><text x="32" y="196" class="m" font-size="12" font-weight="700" fill="#11355B" letter-spacing="1">VAI ALUGAR POR TEMPORADA</text><text x="32" y="222" class="s" font-size="14.5" font-weight="600" fill="#1A2332">Mora fora da Grande São Paulo</text><text x="568" y="222" class="m" font-size="12.5" fill="#5A6472" text-anchor="end">115 pessoas</text><rect x="32.0" y="230.0" width="462.0" height="16.0" rx="4" fill="#D07A3E"/><text x="502" y="243" class="s" font-size="14" font-weight="700" fill="#1A2332">32%</text><text x="32" y="270" class="s" font-size="14.5" font-weight="600" fill="#1A2332">Mora na Grande São Paulo</text><text x="568" y="270" class="m" font-size="12.5" fill="#5A6472" text-anchor="end">101 pessoas</text><rect x="32.0" y="278.0" width="405.8" height="16.0" rx="4" fill="#2F6FA8"/><text x="445.757" y="291" class="s" font-size="14" font-weight="700" fill="#1A2332">28%</text><text x="32" y="324" class="m" font-size="12" font-weight="700" fill="#11355B" letter-spacing="1">VAI ALUGAR COM CONTRATO TRADICIONAL</text><text x="32" y="350" class="s" font-size="14.5" font-weight="600" fill="#1A2332">Mora em São Paulo ou fora</text><text x="568" y="350" class="m" font-size="12.5" fill="#5A6472" text-anchor="end">65 pessoas</text><rect x="32.0" y="358.0" width="261.1" height="16.0" rx="4" fill="#2F6FA8"/><text x="301.13" y="371" class="s" font-size="14" font-weight="700" fill="#1A2332">18%</text><text x="32" y="404" class="m" font-size="12" font-weight="700" fill="#11355B" letter-spacing="1">VAI MORAR</text><text x="32" y="430" class="s" font-size="14.5" font-weight="600" fill="#1A2332">Mora na Grande São Paulo</text><text x="568" y="430" class="m" font-size="12.5" fill="#5A6472" text-anchor="end">45 pessoas</text><rect x="32.0" y="438.0" width="180.8" height="16.0" rx="4" fill="#2F6FA8"/><text x="220.783" y="451" class="s" font-size="14" font-weight="700" fill="#1A2332">13%</text><text x="32" y="478" class="s" font-size="14.5" font-weight="600" fill="#1A2332">Mora fora da Grande São Paulo</text><text x="568" y="478" class="m" font-size="12.5" fill="#5A6472" text-anchor="end">23 pessoas</text><rect x="32.0" y="486.0" width="92.4" height="16.0" rx="4" fill="#2F6FA8"/><text x="132.4" y="499" class="s" font-size="14" font-weight="700" fill="#1A2332">6%</text><text x="32" y="532" class="m" font-size="12" font-weight="700" fill="#11355B" letter-spacing="1">AINDA DECIDE OU USO MISTO</text><text x="32" y="558" class="s" font-size="14.5" font-weight="600" fill="#1A2332">Mora em São Paulo ou fora</text><text x="568" y="558" class="m" font-size="12.5" fill="#5A6472" text-anchor="end">11 pessoas</text><rect x="32.0" y="566.0" width="44.2" height="16.0" rx="4" fill="#2F6FA8"/><text x="84.1913" y="579" class="s" font-size="14" font-weight="700" fill="#1A2332">3%</text><text x="32" y="604" class="s" font-size="12.5" fill="#5A6472">Onde mora é lido pelo DDD do telefone, que mostra onde o número foi habilitado, não</text><text x="32" y="621" class="s" font-size="12.5" fill="#5A6472">o endereço atual. Laranja: o maior grupo.</text><line x1="32.0" y1="642.0" x2="568.0" y2="642.0" stroke="#E7E2D9" stroke-width="1"/><text x="32" y="664" class="m" font-size="13" fill="#5A6472">Fonte: Perfil Bewild, nov/2026, 584 orçamentos</text><text x="568" y="664" class="m" font-size="13" font-weight="700" fill="#11355B" text-anchor="end">bewild.com.br</text></svg>
