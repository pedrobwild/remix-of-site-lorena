<svg xmlns="http://www.w3.org/2000/svg" width="420" height="340" viewBox="0 0 420 340" role="img" aria-labelledby="t"><title id="t">Custo mediano da reforma completa por faixa de metragem em 198 contratos Bewild: até 21 m² R$ 75.000 (n=27); 21–25 m² R$ 65.000 (n=31); 25–30 m² R$ 71.432 (n=102); 30–45 m² R$ 102.682 (n=36). Barras mostram o intervalo entre o 1º e o 3º quartil.</title><rect width="420" height="340" fill="#FFFFFF"/><text x="16" y="26" font-size="14" fill="#1F2937" text-anchor="start" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Studio de até 21 m² custa mais que o de 21 a 30 m²</text><text x="16" y="46" font-size="10.5" fill="#6B7280" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Mediana e metade central (Q1–Q3) do valor do contrato, 198 contratos Bewild</text><line x1="70" y1="260" x2="400" y2="260" stroke="#E5E7EB"/><text x="64" y="264" font-size="11" fill="#6B7280" text-anchor="end" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">0 mil</text><line x1="70" y1="212" x2="400" y2="212" stroke="#E5E7EB"/><text x="64" y="216" font-size="11" fill="#6B7280" text-anchor="end" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">30 mil</text><line x1="70" y1="165" x2="400" y2="165" stroke="#E5E7EB"/><text x="64" y="169" font-size="11" fill="#6B7280" text-anchor="end" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">60 mil</text><line x1="70" y1="118" x2="400" y2="118" stroke="#E5E7EB"/><text x="64" y="122" font-size="11" fill="#6B7280" text-anchor="end" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">90 mil</text><line x1="70" y1="70" x2="400" y2="70" stroke="#E5E7EB"/><text x="64" y="74" font-size="11" fill="#6B7280" text-anchor="end" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">120 mil</text><rect x="91" y="133" width="41" height="19" fill="#0F4C5C" opacity="0.25" rx="3"/><line x1="91" y1="141" x2="132" y2="141" stroke="#E8702A" stroke-width="4"/><text x="111" y="125" font-size="10.5" fill="#1F2937" text-anchor="middle" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">R$ 75.000</text><text x="111" y="278" font-size="12" fill="#1F2937" text-anchor="middle" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">até 21 m²</text><text x="111" y="294" font-size="11" fill="#6B7280" text-anchor="middle" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">n = 27</text><rect x="173" y="146" width="41" height="15" fill="#0F4C5C" opacity="0.25" rx="3"/><line x1="173" y1="157" x2="214" y2="157" stroke="#0F4C5C" stroke-width="4"/><text x="194" y="138" font-size="10.5" fill="#1F2937" text-anchor="middle" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">R$ 65.000</text><text x="194" y="278" font-size="12" fill="#1F2937" text-anchor="middle" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">21–25 m²</text><text x="194" y="294" font-size="11" fill="#6B7280" text-anchor="middle" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">n = 31</text><rect x="256" y="138" width="41" height="18" fill="#0F4C5C" opacity="0.25" rx="3"/><line x1="256" y1="147" x2="297" y2="147" stroke="#0F4C5C" stroke-width="4"/><text x="276" y="130" font-size="10.5" fill="#1F2937" text-anchor="middle" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">R$ 71.432</text><text x="276" y="278" font-size="12" fill="#1F2937" text-anchor="middle" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">25–30 m²</