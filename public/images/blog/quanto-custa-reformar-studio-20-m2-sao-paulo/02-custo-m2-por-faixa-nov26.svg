<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 452" width="720" height="542" role="img" aria-labelledby="t d"><title id="t">Valor por m² da reforma completa por faixa de metragem</title><desc id="d">Até 21 m²: R$ 3.665 por m² (65 orçamentos); 21 a 25 m²: R$ 2.887 por m² (194 orçamentos); 25 a 30 m²: R$ 2.632 por m² (172 orçamentos); 30 a 45 m²: R$ 2.603 por m² (154 orçamentos). Índice Bewild geral: R$ 2.831 por m².</desc><style>.s{font-family:Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif}.m{font-family:'JetBrains Mono', Menlo, Consolas, monospace}</style><rect width="600" height="452" fill="#FFFFFF"/><text x="32" y="44" class="m" font-size="13" font-weight="700" fill="#11355B" letter-spacing="1.5">VALOR POR M²</text><text x="32" y="78" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">O m² do studio de até 21 m² sai</text><text x="32" y="108" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">39% acima do de 25 a 30 m²</text><text x="32" y="140" class="s" font-size="15" fill="#5A6472">Mediana do valor por m² em cada faixa. No Índice Bewild</text><text x="32" y="161" class="s" font-size="15" fill="#5A6472">inteiro, a mediana é R$ 2.831 por m².</text><text x="32" y="206" class="s" font-size="14.5" font-weight="600" fill="#1A2332">Até 21 m²</text><text x="568" y="206" class="m" font-size="13" fill="#5A6472" text-anchor="end">65 orçamentos</text><rect x="32.0" y="214.0" width="397.2" height="16.0" rx="4" fill="#D07A3E"/><text x="437.184" y="227" class="s" font-size="14" font-weight="700" fill="#1A2332">R$ 3.665/m²</text><text x="32" y="260" class="s" font-size="14.5" font-weight="600" fill="#1A2332">21 a 25 m²</text><text x="568" y="260" class="m" font-size="13" fill="#5A6472" text-anchor="end">194 orçamentos</text><rect x="32.0" y="268.0" width="312.9" height="16.0" rx="4" fill="#2F6FA8"/><text x="352.87" y="281" class="s" font-size="14" font-weight="700" fill="#1A2332">R$ 2.887/m²</text><text x="32" y="314" class="s" font-size="14.5" font-weight="600" fill="#1A2332">25 a 30 m²</text><text x="568" y="314" class="m" font-size="13" fill="#5A6472" text-anchor="end">172 orçamentos</text><rect x="32.0" y="322.0" width="285.2" height="16.0" rx="4" fill="#2F6FA8"/><text x="325.235" y="335" class="s" font-size="14" font-weight="700" fill="#1A2332">R$ 2.632/m²</text><text x="32" y="368" class="s" font-size="14.5" font-weight="600" fill="#1A2332">30 a 45 m²</text><text x="568" y="368" class="m" font-size="13" fill="#5A6472" text-anchor="end">154 orçamentos</text><rect x="32.0" y="376.0" width="282.1" height="16.0" rx="4" fill="#2F6FA8"/><text x="322.093" y="389" class="s" font-size="14" font-weight="700" fill="#1A2332">R$ 2.603/m²</text><line x1="32.0" y1="408.0" x2="568.0" y2="408.0" stroke="#E7E2D9" stroke-width="1"/><text x="32" y="430" class="m" font-size="13" fill="#5A6472">Fonte: Índice Bewild, nov/2026, 585 orçamentos</text><text x="568" y="430" class="m" font-size="13" font-weight="700" fill="#11355B" text-anchor="end">bewild.com.br</text></svg>
