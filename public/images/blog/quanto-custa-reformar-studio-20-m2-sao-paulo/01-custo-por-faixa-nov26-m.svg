<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 0 380 661" width="380" height="661" role="img" aria-labelledby="t d"><title id="t">Orçamento de reforma completa por faixa de metragem: mediana e metade central</title><desc id="d">Até 21 m²: mediana R$ 66.937, metade central de R$ 59.984 a R$ 73.939 (65 orçamentos); 21 a 25 m²: mediana R$ 69.491, metade central de R$ 63.447 a R$ 76.769 (194 orçamentos); 25 a 30 m²: mediana R$ 73.258, metade central de R$ 65.690 a R$ 83.315 (172 orçamentos); 30 a 45 m²: mediana R$ 96.296, metade central de R$ 81.218 a R$ 112.952 (154 orçamentos).</desc><style>.s{font-family:Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif}.m{font-family:'JetBrains Mono', Menlo, Consolas, monospace}</style><rect width="420" height="661" fill="#FFFFFF"/><text x="32" y="44" class="m" font-size="13" font-weight="700" fill="#11355B" letter-spacing="1.5">ORÇAMENTO POR METRAGEM</text><text x="32" y="78" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">O studio de até 21 m²</text><text x="32" y="108" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">custa 9% menos que o de</text><text x="32" y="138" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">25 a 30 m²</text><text x="32" y="170" class="s" font-size="15" fill="#5A6472">Mediana (ponto) e metade central (barra)</text><text x="32" y="191" class="s" font-size="15" fill="#5A6472">do orçamento de reforma completa. A área</text><text x="32" y="212" class="s" font-size="15" fill="#5A6472">é 33% menor; o valor, 9%.</text><text x="32" y="247" class="s" font-size="14.5" font-weight="600" fill="#1A2332">Até 21 m²</text><text x="388" y="247" class="m" font-size="13" fill="#5A6472" text-anchor="end">65 orçamentos</text><rect x="32.0" y="259.0" width="356.0" height="8.0" rx="4" fill="#F6F3EE"/><rect x="120.9" y="259.0" width="62.1" height="8.0" rx="4" fill="#D07A3E"/><circle cx="151.9" cy="263.0" r="7" fill="#11355B" f