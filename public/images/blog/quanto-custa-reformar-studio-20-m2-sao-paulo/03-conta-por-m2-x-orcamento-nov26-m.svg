<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 0 380 705" width="380" height="705" role="img" aria-labelledby="t d"><title id="t">Conta por m² contra o orçamento mediano em studios de até 21 m²</title><desc id="d">15 a 17 m² (13 orçamentos): conta por m² R$ 48.127, regra de bolso R$ 58.688, mediana dos orçamentos R$ 59.998; 18 e 19 m² (27 orçamentos): conta por m² R$ 50.958, regra de bolso R$ 60.202, mediana dos orçamentos R$ 69.633; 20 m² (16 orçamentos): conta por m² R$ 56.620, regra de bolso R$ 63.230, mediana dos orçamentos R$ 69.300; 21 m² (9 orçamentos): conta por m² R$ 59.451, regra de bolso R$ 64.744, mediana dos orçamentos R$ 65.445.</desc><style>.s{font-family:Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif}.m{font-family:'JetBrains Mono', Menlo, Consolas, monospace}</style><rect width="420" height="705" fill="#FFFFFF"/><text x="32" y="44" class="m" font-size="13" font-weight="700" fill="#11355B" letter-spacing="1.5">A CONTA POR M² ERRA</text><text x="32" y="78" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">Abaixo de 21 m², a conta</text><text x="32" y="108" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">por m² fica 10% a 37%</text><text x="32" y="138" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">abaixo do orçamento</text><text x="32" y="170" class="s" font-size="15" fill="#5A6472">Índice × área (cinza), regra de bolso de</text><text x="32" y="191" class="s" font-size="15" fill="#5A6472">R$ 32.950 + R$ 1.514/m² (azul) e mediana</text><text x="32" y="212" class="s" font-size="15" fill="#5A6472">dos orçamentos (laranja).</text><text x="32" y="247" class="s" font-size="14.5" font-weight="600" fill="#1A2332">15 a 17 m²</text><text x="388" y="247" class="m" font-size="13" fill="#5A6472" text-anchor="end">13 orçamentos</text><rect x="32.0" y="257.0" width="162.4" height="14.0" rx="3" fill="#B9C0C9"/><text x="202.429" y="269" class="s" font-size="13"