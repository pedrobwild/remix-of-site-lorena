<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-labelledby="t"><title id="t">Custo mediano por m² por faixa: até 21 m² R$ 3.800; 21–25 m² R$ 2.824; 25–30 m² R$ 2.602; 30–45 m² R$ 2.806 (198 contratos Bewild). Índice Bewild geral: R$ 2.744/m².</title><rect width="720" height="300" fill="#FFFFFF"/><text x="16" y="26" font-size="16" fill="#1F2937" text-anchor="start" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">O m² do studio de até 21 m² sai 46% acima do de 25–30 m²</text><text x="16" y="46" font-size="12" fill="#6B7280" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Mediana do valor por m² por faixa, 198 contratos Bewild · linha tracejada = Índice Bewild, R$ 2.744/m²</text><line x1="60" y1="125" x2="700" y2="125" stroke="#6B7280" stroke-dasharray="4 3"/><rect x="100" y="85" width="80" height="145" fill="#E8702A" rx="3"/><text x="140" y="79" font-size="12" fill="#1F2937" text-anchor="middle" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">R$ 3.800/m²</text><text x="140" y="248" font-size="12" fill="#1F2937" text-anchor="middle" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">até 21 m²</text><text x="140" y="264" font-size="11" fill="#6B7280" text-anchor="middle" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">n = 27</text><rect x="260" y="122" width="80" height="108" fill="#0F4C5C" rx="3"/><text x="300" y="116" font-size="12" fill="#1F2937" text-anchor="middle" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">R$ 2.824/m²</text><text x="300" y="248" font-size="12" fill="#1F2937" text-anchor="middle" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">21–25 m²</text><text x="300" y="264" font-size="11" fill="#6B7280" text-anchor="middle" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">n = 31</text><rect x="420" y="131" width="80" height="99" fill="#0F4C5C" rx="3"/><text x="460" y="125" font-size="12" fill="#1F2937" text-anchor="middle" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">R$ 2.602/m²</text><text x="460" y="248" font-size="12" fill="#1F2937" text-anchor="middle" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">25–30 m²</text><text x="460" y="264" font-size="11" fill="#6B7280" text-anchor="middle" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">n = 102</text><rect x="580" y="123" width="80" height="107" fill="#0F4C5C" rx="3"/><text x="620" y="117" font-size="12" fill="#1F2937" text-anchor="middle" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">R$ 2.806/m²</text><text x="620" y="248" font-size="12" fill="#1F2937" text-anchor="middle" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">30–45 m²</text><text x="620" y="264" font-size="11" fill="#6B7280" text-anchor="middle" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">n = 36</text><text x="16" y="290" font-size="10" fill="#6B7280" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Fonte: contratos Bewild (planilha 27/9/2026). Mediana de valor ÷ área de cada contrato.</text></svg>
