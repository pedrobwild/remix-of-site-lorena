<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" role="img" aria-labelledby="t"><title id="t">Dispersão de 160 contratos Bewild de até 30 m²: área contra valor. A reta de tendência da base inteira (valor ≈ R$ 17.055 + R$ 2.245 por m²) e a linha do índice (R$ 2.744 × m²) ficam abaixo da maioria dos contratos de 15 a 21 m², que se concentram entre R$ 65 mil e R$ 90 mil.</title><rect width="720" height="380" fill="#FFFFFF"/><text x="16" y="26" font-size="16" fill="#1F2937" text-anchor="start" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Abaixo de 21 m², os contratos ficam acima das duas retas</text><text x="16" y="46" font-size="12" fill="#6B7280" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">160 contratos de até 30 m²; reta da base (198) e linha do índice R$ 2.744/m²</text><line x1="66" y1="296" x2="700" y2="296" stroke="#E5E7EB"/><text x="60" y="300" font-size="11" fill="#6B7280" text-anchor="end" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">0 mil</text><line x1="66" y1="250" x2="700" y2="250" stroke="#E5E7EB"/><text x="60" y="254" font-size="11" fill="#6B7280" text-anchor="end" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">26 mil</text><line x1="66" y1="204" x2="700" y2="204" stroke="#E5E7EB"/><text x="60" y="208" font-size="11" fill="#6B7280" text-anchor="end" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">52 mil</text><line x1="66" y1="158" x2="700" y2="158" stroke="#E5E7EB"/><text x="60" y="162" font-size="11" fill="#6B7280" text-anchor="end" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">78 mil</text><line x1="66" y1="112" x2="700" y2="112" stroke="#E5E7EB"/><text x="60" y="116" font-size="11" fill="#6B7280" text-anchor="end