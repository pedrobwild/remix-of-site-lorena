<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340" role="img" aria-labelledby="t"><title id="t">Custo mediano da reforma completa por faixa de metragem em 198 contratos Bewild: até 21 m² R$ 75.000 (n=27); 21–25 m² R$ 65.000 (n=31); 25–30 m² R$ 71.432 (n=102); 30–45 m² R$ 102.682 (n=36). Barras mostram o intervalo entre o 1º e o 3º quartil.</title><rect width="720" height="340" fill="#FFFFFF"/><text x="16" y="26" font-size="16" fill="#1F2937" text-anchor="start" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Studio de até 21 m² custa mais que o de 21 a 30 m²</text><text x="16" y="46" font-size="12" fill="#6B7280" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Mediana e metade central (Q1–Q3) do valor do contrato, 198 contratos Bewild</text><line x1="70" y1="260" x2="700" y2="260" stroke="#E5E7EB"/><text x="64" y="264" font-size="11" fill="#6B7280" text-anchor="end" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">0 mil</text><line x1="70" y1="212" x2="700" y2="212" stroke="#E5E7EB"/><text x="64" y="216" font-size="11" fill="#6B7280" text-anchor="end" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">30 mil</text><line x1="70" y1="165" x2="700" y2="165" stroke="#E5E7EB"/><text x="64" y="169" font-size="11" fill="#6B7280" text-anchor="end" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">60 mil</text><line x1="70" y1="118" x2="700" y2="118" stroke="#E5E7EB"/><text x="64" y="122" font-size="11" fill="#6B7280" text-anchor="end" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">90 mil</text><line x1="70" y1="70" x2="700" y2="70" stroke="#E5E7EB"/><text x="64" y="74" font-size="11" fill="#6B7280" text-anchor="end" font-weight="normal" font-family="-appl