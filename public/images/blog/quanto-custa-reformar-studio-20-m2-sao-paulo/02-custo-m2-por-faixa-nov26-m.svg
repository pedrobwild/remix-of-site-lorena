<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 521" width="420" height="521" role="img" aria-labelledby="t d"><title id="t">Valor por m² da reforma completa por faixa de metragem</title><desc id="d">Até 21 m²: R$ 3.665 por m² (65 orçamentos); 21 a 25 m²: R$ 2.887 por m² (194 orçamentos); 25 a 30 m²: R$ 2.632 por m² (172 orçamentos); 30 a 45 m²: R$ 2.603 por m² (154 orçamentos). Índice Bewild geral: R$ 2.831 por m².</desc><style>.s{font-family:Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif}.m{font-family:'JetBrains Mono', Menlo, Consolas, monospace}</style><rect width="420" height="521" fill="#FFFFFF"/><text x="32" y="44" class="m" font-size="13" font-weight="700" fill="#11355B" letter-spacing="1.5">VALOR POR M²</text><text x="32" y="78" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">O m² do studio de até 21</text><text x="32" y="108" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">m² sai 39% acima do de 25</text><text x="32" y="138" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">a 30 m²</text><text x="32" y="170" class="s" font-size="15" fill="#5A6472">Mediana do valor por m² em cada faixa.</text><text x="32" y="191" class="s" font-size="15" fill="#5A6472">No Índice Bewild inteiro, a mediana é R$</text><text x="32" y="212" class="s" font-size="15" fill="#5A6472">2.831 por m².</text><text x="32" y="257" class="s" font-size="14.5" font-weight="600" fill="#1A2332">Até 21 m²</text><text x="388" y="257" class="m" font-size="12" fill="#5A6472" text-anchor="end">65 orçamentos</text><rect x="32.0" y="265.0" width="243.8" height="16.0" rx="4" fill="#D07A3E"/><text x="283.765" y="278" class="s" font-size="14" font-weight="700" fill="#1A2332">R$ 3.665/m²</text><text x="32" y="311" class="s" font-size="14.5" font-weight="600" fill="#1A2332">21 a 25 m²</text><text x="388" y="311" class="m" font-size="12" fill="#5A6472" text-anchor="end">194 orçamentos</text><rect x="32.0" y="319.0" width="192.0" height="16.0" rx="4" fill="#2F6FA8"/><text x="232.019" y="332" class="s" font-size="14" font-weight="700" fill="#1A2332">R$ 2.887/m²</text><text x="32" y="365" class="s" font-size="14.5" font-weight="600" fill="#1A2332">25 a 30 m²</text><text x="388" y="365" class="m" font-size="12" fill="#5A6472" text-anchor="end">172 orçamentos</text><rect x="32.0" y="373.0" width="175.1" height="16.0" rx="4" fill="#2F6FA8"/><text x="215.059" y="386" class="s" font-size="14" font-weight="700" fill="#1A2332">R$ 2.632/m²</text><text x="32" y="419" class="s" font-size="14.5" font-weight="600" fill="#1A2332">30 a 45 m²</text><text x="388" y="419" class="m" font-size="12" fill="#5A6472" text-anchor="end">154 orçamentos</text><rect x="32.0" y="427.0" width="173.1" height="16.0" rx="4" fill="#2F6FA8"/><text x="213.13" y="440" class="s" font-size="14" font-weight="700" fill="#1A2332">R$ 2.603/m²</text><line x1="32.0" y1="459.0" x2="388.0" y2="459.0" stroke="#E7E2D9" stroke-width="1"/><text x="32" y="481" class="m" font-size="12" fill="#5A6472">Fonte: Índice Bewild, nov/2026, 585 orçamentos</text><text x="32" y="501" class="m" font-size="13" font-weight="700" fill="#11355B">bewild.com.br</text></svg>
