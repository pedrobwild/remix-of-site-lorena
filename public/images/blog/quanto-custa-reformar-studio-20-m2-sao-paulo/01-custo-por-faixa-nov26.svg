<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" width="720" height="624" role="img" aria-labelledby="t d"><title id="t">Orçamento de reforma completa por faixa de metragem: mediana e metade central</title><desc id="d">Até 21 m²: mediana R$ 66.937, metade central de R$ 59.984 a R$ 73.939 (65 orçamentos); 21 a 25 m²: mediana R$ 69.491, metade central de R$ 63.447 a R$ 76.769 (194 orçamentos); 25 a 30 m²: mediana R$ 73.258, metade central de R$ 65.690 a R$ 83.315 (172 orçamentos); 30 a 45 m²: mediana R$ 96.296, metade central de R$ 81.218 a R$ 112.952 (154 orçamentos).</desc><style>.s{font-family:Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif}.m{font-family:'JetBrains Mono', Menlo, Consolas, monospace}</style><rect width="600" height="520" fill="#FFFFFF"/><text x="32" y="44" class="m" font-size="13" font-weight="700" fill="#11355B" letter-spacing="1.5">ORÇAMENTO POR METRAGEM</text><text x="32" y="78" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">O studio de até 21 m² custa 9%</text><text x="32" y="108" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">menos que o de 25 a 30 m²</text><text x="32" y="140" class="s" font-size="15" fill="#5A6472">Mediana (ponto) e metade central (barra) do orçamento de</text><text x="32" y="161" class="s" font-size="15" fill="#5A6472">reforma completa. A área é 33% menor; o valor, 9%.</text><text x="32" y="196" class="s" font-size="14.5" font-weight="600" fill="#1A2332">Até 21 m²</text><text x="568" y="196" class="m" font-size="12" fill="#5A6472" text-anchor="end">65 orçamentos</text><rect x="32.0" y="208.0" width="536.0" height="8.0" rx="4" fill="#F6F3EE"/><rect x="165.9" y="208.0" width="93.5" height="8.0" rx="4" fill="#D07A3E"/><circle cx="212.5" cy="212.0" r="7" fill="#11355B" fill-opacity="1.0"/><text x="212.478" y="238" class="s" font-size="14" font-weight="700" fill="#1A2332" text-anchor="middle">R$ 66.937</text><text x="32" y="238" class="m" font-size="11.5" fill="#5A6472"></text><text x="568" y="238" class="m" font-size="11.5" fill="#5A6472" text-anchor="end">R$ 59.984 a R$ 73.939</text><text x="32" y="268" class="s" font-size="14.5" font-weight="600" fill="#1A2332">21 a 25 m²</text><text x="568" y="268" class="m" font-size="12" fill="#5A6472" text-anchor="end">194 orçamentos</text><rect x="32.0" y="280.0" width="536.0" height="8.0" rx="4" fill="#F6F3EE"/><rect x="189.1" y="280.0" width="89.3" height="8.0" rx="4" fill="#2F6FA8"/><circle cx="229.6" cy="284.0" r="7" fill="#11355B" fill-opacity="1.0"/><text x="229.59" y="310" class="s" font-size="14" font-weight="700" fill="#1A2332" text-anchor="middle">R$ 69.491</text><text x="32" y="310" class="m" font-size="11.5" fill="#5A6472"></text><text x="568" y="310" class="m" font-size="11.5" fill="#5A6472" text-anchor="end">R$ 63.447 a R$ 76.769</text><text x="32" y="340" class="s" font-size="14.5" font-weight="600" fill="#1A2332">25 a 30 m²</text><text x="568" y="340" class="m" font-size="12" fill="#5A6472" text-anchor="end">172 orçamentos</text><rect x="32.0" y="352.0" width="536.0" height="8.0" rx="4" fill="#F6F3EE"/><rect x="204.1" y="352.0" width="118.1" height="8.0" rx="4" fill="#2F6FA8"/><circle cx="254.8" cy="356.0" r="7" fill="#11355B" fill-opacity="1.0"/><text x="254.829" y="382" class="s" font-size="14" font-weight="700" fill="#1A2332" text-anchor="middle">R$ 73.258</text><text x="32" y="382" class="m" font-size="11.5" fill="#5A6472"></text><text x="568" y="382" class="m" font-size="11.5" fill="#5A6472" text-anchor="end">R$ 65.690 a R$ 83.315</text><text x="32" y="412" class="s" font-size="14.5" font-weight="600" fill="#1A2332">30 a 45 m²</text><text x="568" y="412" class="m" font-size="12" fill="#5A6472" text-anchor="end">154 orçamentos</text><rect x="32.0" y="424.0" width="536.0" height="8.0" rx="4" fill="#F6F3EE"/><rect x="308.2" y="424.0" width="212.6" height="8.0" rx="4" fill="#2F6FA8"/><circle cx="409.2" cy="428.0" r="7" fill="#11355B" fill-opacity="1.0"/><text x="409.183" y="454" class="s" font-size="14" font-weight="700" fill="#1A2332" text-anchor="middle">R$ 96.296</text><text x="32" y="454" class="m" font-size="11.5" fill="#5A6472"></text><text x="32" y="454" class="m" font-size="11.5" fill="#5A6472">R$ 81.218 a R$ 112.952</text><line x1="32.0" y1="476.0" x2="568.0" y2="476.0" stroke="#E7E2D9" stroke-width="1"/><text x="32" y="498" class="m" font-size="13" fill="#5A6472">Fonte: Índice Bewild, nov/2026, 585 orçamentos</text><text x="568" y="498" class="m" font-size="13" font-weight="700" fill="#11355B" text-anchor="end">bewild.com.br</text></svg>
