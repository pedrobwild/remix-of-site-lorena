<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 622" width="720" height="746" role="img" aria-labelledby="t d"><title id="t">Reforma completa: de R$ 67 mil a R$ 101 mil na mediana, conforme a metragem</title><desc id="d">Até 21 m²: mediana R$ 66.937, metade central de R$ 59.984 a R$ 73.939 (65 orçamentos); 21 a 25 m²: mediana R$ 69.491, metade central de R$ 63.447 a R$ 76.769 (194 orçamentos); 25 a 30 m²: mediana R$ 73.258, metade central de R$ 65.690 a R$ 83.315 (172 orçamentos); 30 a 35 m²: mediana R$ 89.402, metade central de R$ 78.984 a R$ 104.144 (72 orçamentos); 35 a 45 m²: mediana R$ 101.021, metade central de R$ 89.046 a R$ 118.329 (82 orçamentos).</desc><style>.s{font-family:Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif}.m{font-family:'JetBrains Mono', Menlo, Consolas, monospace}</style><rect width="600" height="622" fill="#FFFFFF"/><text x="32" y="44" class="m" font-size="13" font-weight="700" fill="#11355B" letter-spacing="1.5">REFORMA COMPLETA POR METRAGEM</text><text x="32" y="78" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">Reforma completa: de R$ 67 mil a</text><text x="32" y="108" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">R$ 101 mil na mediana, conforme a</text><text x="32" y="138" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">metragem</text><text x="32" y="170" class="s" font-size="15" fill="#5A6472">Mediana (ponto) e metade central (barra) do orçamento de</text><text x="32" y="191" class="s" font-size="15" fill="#5A6472">reforma completa em cada faixa.</text><text x="32" y="226" class="s" font-size="14.5" font-weight="600" fill="#1A2332">Até 21 m²</text><text x="568" y="226" class="m" font-size="12" fill="#5A6472" text-anchor="end">65 orçamentos</text><rect x="32.0" y="238.0" width="536.0" height="8.0" rx="4" fill="#F6F3EE"/><rect x="158.0" y="238.0" width="88.0" height="8.0" rx="4" fill="#2F6FA8"/><circle cx="201.9" cy="242