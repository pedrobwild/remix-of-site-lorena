<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 0 380 586" width="380" height="586" role="img" aria-labelledby="t d"><title id="t">Parte do orçamento que não depende da metragem, pela regra de bolso do Índice Bewild</title><desc id="d">20 m²: 52,1% de R$ 63.230; 25 m²: 46,5% de R$ 70.800; 30 m²: 42,0% de R$ 78.370; 35 m²: 38,3% de R$ 85.940; 40 m²: 35,2% de R$ 93.510; 45 m²: 32,6% de R$ 101.080. Regra ajustada de 21 a 35 m²; fora dessa faixa é extrapolação.</desc><style>.s{font-family:Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif}.m{font-family:'JetBrains Mono', Menlo, Consolas, monospace}</style><rect width="420" height="586" fill="#FFFFFF"/><text x="32" y="44" class="m" font-size="13" font-weight="700" fill="#11355B" letter-spacing="1.5">O CUSTO QUE NÃO ENCOLHE</text><text x="32" y="78" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">A parte fixa pesa metade</text><text x="32" y="108" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">do orçamento em 20 m² e</text><text x="32" y="138" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">um terço em 45 m²</text><text x="32" y="170" class="s" font-size="15" fill="#5A6472">Parcela de R$ 32.950 da regra de bolso</text><text x="32" y="191" class="s" font-size="15" fill="#5A6472">sobre o valor estimado em cada metragem.</text><text x="32" y="236" class="s" font-size="14" font-weight="600" fill="#1A2332">20 m²</text><text x="388" y="236" class="m" font-size="13" fill="#5A6472" text-anchor="end">R$ 63.230</text><rect x="32.0" y="243.0" width="201.0" height="16.0" rx="4" fill="#D07A3E"/><text x="240.957" y="256" class="s" font-size="13.5" font-weight="700" fill="#1A2332">52,1%</text><text x="32" y="284" class="s" font-size="14" font-weight="600" fill="#1A2332">25 m²</text><text x="388" y="284" class="m" font-size="13" fill="#5A6472" text-anchor="end">R$ 70.800</text><rect x="32.0" y="291.0" width="179.4" height="16.0" rx="