<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-labelledby="t"><title id="t">Para onde vai o dinheiro em um orçamento real de reforma completa de 24 m² da Bewild (maio de 2026, R$ 67.191): marcenaria 33,9%; administração e gestão 18,6%; infraestrutura, obra civil e acabamentos 18,0%; eletrodomésticos 13,5%; mobiliário 5,2%; arquitetura e documentação 4,4%; luminárias e acessórios 3,7%; vidraçaria 2,7%. A obra civil (pintura, piso, elétrica, revestimento) é só 18% do total.</title><rect width="720" height="400" fill="#FFFFFF"/><text x="16" y="26" font-size="16" fill="#1F2937" text-anchor="start" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">A obra civil é 18% de uma reforma completa; o resto é o que fica no imóvel</text><text x="16" y="46" font-size="12" fill="#6B7280" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Orçamento real de um studio de 24 m², R$ 67.191 (Bewild, maio de 2026), por grupo</text><text x="16" y="88" font-size="12" fill="#1F2937" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Marcenaria</text><rect x="266" y="70" width="324" height="26" fill="#0F4C5C" rx="3"/><text x="596" y="88" font-size="12" fill="#1F2937" text-anchor="start" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">33,9%  R$ 22.790</text><text x="16" y="124" font-size="12" fill="#1F2937" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Administração e gestão</text><rect x="266" y="106" width="178" height="26" fill="#0F4C5C" rx="3"/><text x="450" y="124" font-size="12" fill="#1F2937" text-anchor="start" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">18,6%  R$ 12.531</text><text x="16" y="160" font-size="12" fill="#1F2937" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Infraestrutura, obra civil e acabamentos</text><rect x="266" y="142" width="172" height="26" fill="#E8702A" rx="3"/><text x="444" y="160" font-size="12" fill="#1F2937" text-anchor="start" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">18,0%  R$ 12.072</text><text x="16" y="196" font-size="12" fill="#1F2937" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Eletrodomésticos</text><rect x="266" y="178" width="129" height="26" fill="#0F4C5C" rx="3"/><text x="401" y="196" font-size="12" fill="#1F2937" text-anchor="start" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">13,5%  R$ 9.058</text><text x="16" y="232" font-size="12" fill="#1F2937" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Mobiliário</text><rect x="266" y="214" width="50" height="26" fill="#0F4C5C" rx="3"/><text x="322" y="232" font-size="12" fill="#1F2937" text-anchor="start" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">5,2%  R$ 3.520</text><text x="16" y="268" font-size="12" fill="#1F2937" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Arquitetura e documentações</text><rect x="266" y="250" width="42" height="26" fill="#0F4C5C" rx="3"/><text x="314" y="268" font-size="12" fill="#1F2937" text-anchor="start" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">4,4%  R$ 2.956</text><text x="16" y="304" font-size="12" fill="#1F2937" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Luminárias e acessórios</text><rect x="266" y="286" width="35" height="26" fill="#0F4C5C" rx="3"/><text x="307" y="304" font-size="12" fill="#1F2937" text-anchor="start" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">3,7%  R$ 2.477</text><text x="16" y="340" font-size="12" fill="#1F2937" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Vidraçaria</text><rect x="266" y="322" width="26" height="26" fill="#0F4C5C" rx="3"/><text x="298" y="340" font-size="12" fill="#1F2937" text-anchor="start" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">2,7%  R$ 1.788</text><text x="16" y="370" font-size="12" fill="#1F2937" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Em laranja, o grupo que uma "reforma simples" (pintura, piso, elétrica) costuma cobrir.</text><text x="16" y="390" font-size="12" fill="#6B7280" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Fonte: orçamento Bewild publicado em 1/10/2026 (orcamento-reforma-studio-25-m2-item-a-item).</text></svg>