<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" role="img" aria-labelledby="t"><title id="t">Reforma simples e reforma completa por metragem em São Paulo: faixa de mercado da Lar Pontual (atualizada 21/7/2026, custo SP out/2026) para 40, 50, 60, 70 e 80 m²: simples R$ 47.500, 62.500, 75.000, 87.500 e 100.000; completa R$ 85.000, 135.000, 170.000, 205.000 e 240.000. Contratos Bewild de reforma completa com mobília: mediana R$ 108.731 em 35–45 m² (n=23) e reta R$ 17.055 + R$ 2.245/m², que dá R$ 129 mil em 50 m² e R$ 197 mil em 80 m² (estimativa, 2 contratos acima de 45 m²).</title><rect width="720" height="380" fill="#FFFFFF"/><text x="16" y="26" font-size="16" fill="#1F2937" text-anchor="start" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Simples ou completa: a diferença cresce com a metragem</text><text x="16" y="46" font-size="12" fill="#6B7280" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Total em R$ mil por metragem; mercado (Lar Pontual) e contratos Bewild (reforma completa com mobília)</text><line x1="60" y1="280" x2="700" y2="280" stroke="#E5E7EB"/><text x="54" y="284" font-size="12" fill="#6B7280" text-anchor="end" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">0</text><line x1="60" y1="228" x2="700" y2="228" stroke="#E5E7EB"/><text x="54" y="232" font-size="12" fill="#6B7280" text-anchor="end" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">65</text><line x1="60" y1="175" x2="700" y2="175" stroke="#E5E7EB"/><text x="54" y="179" font-size="12" fill="#6B7280" text-anchor="end" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">130</text><line x1="60" y1="122" x2="700" y2="122" stroke="#E5E7EB"/><text x="54" y="126" font-size="12" fill="#6B7280" text-anchor="end" font-weight=