<svg xmlns="http://www.w3.org/2000/svg" width="420" height="400" viewBox="0 0 420 400" role="img" aria-labelledby="t"><title id="t">Quanto o custo de construir e reformar subiu em 12 meses: INCC-M Brasil 6,75% e São Paulo capital 7,60% (FGV, outubro de 2026); SINAPI Brasil 6,81%, mão de obra 8,53%, materiais 5,54%, estado de São Paulo 6,02% (IBGE, setembro de 2026); CUB SindusCon-SP 6,17% (setembro de 2026). A mão de obra sobe mais que os materiais.</title><rect width="420" height="400" fill="#FFFFFF"/><text x="16" y="26" font-size="13" fill="#1F2937" text-anchor="start" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Custo da obra: +6% a +8,5% em 12 meses</text><text x="16" y="46" font-size="12" fill="#6B7280" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Acumulado 12 meses, índices oficiais</text><text x="16" y="69" font-size="12" fill="#1F2937" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">INCC-M Brasil</text><rect x="16" y="74" width="243" height="20" fill="#7FA9B3" rx="3"/><text x="265" y="89" font-size="12" fill="#1F2937" text-anchor="start" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">6,75%</text><text x="16" y="111" font-size="12" fill="#1F2937" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">INCC-M São Paulo (capital)</text><rect x="16" y="116" width="274" height="20" fill="#0F4C5C" rx="3"/><text x="296" y="131" font-size="12" fill="#1F2937" text-anchor="start" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">7,6%</text><text x="16" y="153" font-size="12" fill="#1F2937" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">SINAPI Brasil</text><rect x="16" y="158" width="245" height="20" fill="#7FA9B3" rx="3"/><text x="267" y="173" font-size="12" fill="#1F2937" text-anchor="start" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">6,81%</text><text x="16" y="195" font-size="12" fill="#1F2937" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">SINAPI mão de obra</text><rect x="16" y="200" width="307" height="20" fill="#E8702A" rx="3"/><text x="329" y="215" font-size="12" fill="#1F2937" text-anchor="start" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">8,53%</text><text x="16" y="237" font-size="12" fill="#1F2937" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">SINAPI materiais</text><rect x="16" y="242" width="199" height="20" fill="#7FA9B3" rx="3"/><text x="221" y="257" font-size="12" fill="#1F2937" text-anchor="start" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">5,54%</text><text x="16" y="279" font-size="12" fill="#1F2937" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">SINAPI São Paulo (estado)</text><rect x="16" y="284" width="217" height="20" fill="#0F4C5C" rx="3"/><text x="239" y="299" font-size="12" fill="#1F2937" text-anchor="start" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">6,02%</text><text x="16" y="321" font-size="12" fill="#1F2937" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">CUB SindusCon-SP</text><rect x="16" y="326" width="222" height="20" fill="#7FA9B3" rx="3"/><text x="244" y="341" font-size="12" fill="#1F2937" text-anchor="start" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">6,17%</text><text x="16" y="370" font-size="12" fill="#1F2937" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">A obra sobe acima da inflação geral.</text><text x="16" y="390" font-size="12" fill="#6B7280" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Fontes: FGV out/26; IBGE set/26; SindusCon-SP set/26.</text></svg>