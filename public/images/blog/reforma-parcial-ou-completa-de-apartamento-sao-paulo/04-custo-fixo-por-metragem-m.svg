<svg xmlns="http://www.w3.org/2000/svg" width="420" height="330" viewBox="0 0 420 330" role="img" aria-labelledby="t"><title id="t">Parte fixa do custo da reforma completa por metragem, pela reta ajustada em 198 contratos Bewild (R$ 17.055 fixos + R$ 2.245 por m²): 27,5% em 20 m²; 23,3% em 25 m²; 20,2% em 30 m²; 16,0% em 40 m²; 13,2% em 50 m²; 11,2% em 60 m²; 8,7% em 80 m². Projeto, documentação, gestão e mobilização não encolhem com o apartamento, e por isso a reforma parcial não custa a fração proporcional da completa.</title><rect width="420" height="330" fill="#FFFFFF"/><text x="16" y="26" font-size="13" fill="#1F2937" text-anchor="start" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">O custo que não encolhe com o m²</text><text x="16" y="46" font-size="12" fill="#6B7280" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Parte fixa R$ 17.055 sobre a reta</text><line x1="50" y1="250" x2="400" y2="250" stroke="#E5E7EB"/><text x="44" y="254" font-size="12" fill="#6B7280" text-anchor="end" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">0%</text><line x1="50" y1="190" x2="400" y2="190" stroke="#E5E7EB"/><text x="44" y="194" font-size="12" fill="#6B7280" text-anchor="end" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">10%</text><line x1="50" y1="130" x2="400" y2="130" stroke="#E5E7EB"/><text x="44" y="134" font-size="12" fill="#6B7280" text-anchor="end" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">20%</text><line x1="50" y1="70" x2="400" y2="70" stroke="#E5E7EB"/><text x="44" y="74" font-size="12" fill="#6B7280" text-anchor="end" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">30%</text><rect x="61" y="85" width="28" height="165" fill="#0F4C5C" rx="3"/><text x="75" y="79" font-size="12" fill="#1F2937" text-anchor="middle" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">27,5%</text><text x="75" y="266" font-size="12" fill="#1F2937" text-anchor="middle" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">20 m²</text><rect x="111" y="110" width="28" height="140" fill="#0F4C5C" rx="3"/><text x="125" y="104" font-size="12" fill="#1F2937" text-anchor="middle" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">23,3%</text><text x="125" y="266" font-size="12" fill="#1F2937" text-anchor="middle" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">25 m²</text><rect x="161" y="129" width="28" height="121" fill="#0F4C5C" rx="3"/><text x="175" y="123" font-size="12" fill="#1F2937" text-anchor="middle" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">20,2%</text><text x="175" y="266" font-size="12" fill="#1F2937" text-anchor="middle" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">30 m²</text><rect x="211" y="154" width="28" height="96" fill="#0F4C5C" rx="3"/><text x="225" y="148" font-size="12" fill="#1F2937" text-anchor="middle" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">16,0%</text><text x="225" y="266" font-size="12" fill="#1F2937" text-anchor="middle" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">40 m²</text><rect x="261" y="171" width="28" height="79" fill="#7FA9B3" rx="3"/><text x="275" y="165" font-size="12" fill="#1F2937" text-anchor="middle" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">13,2%</text><text x="275" y="266" font-size="12" fill="#1F2937" text-anchor="middle" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">50 m²</text><rect x="311" y="183" width="28" height="67" fill="#7FA9B3" rx="3"/><text x="325" y="177" font-size="12" fill="#1F2937" text-anchor="middle" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">11,2%</text><text x="325" y="266" font-size="12" fill="#1F2937" text-anchor="middle" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">60 m²</text><rect x="361" y="198" width="28" height="52" fill="#7FA9B3" rx="3"/><text x="375" y="192" font-size="12" fill="#1F2937" text-anchor="middle" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">8,7%</text><text x="375" y="266" font-size="12" fill="#1F2937" text-anchor="middle" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">80 m²</text><text x="16" y="300" font-size="12" fill="#1F2937" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Claras: extrapolação acima de 45 m².</text><text x="16" y="320" font-size="12" fill="#6B7280" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Fonte: contratos Bewild (198 reg.), regressão.</text></svg>