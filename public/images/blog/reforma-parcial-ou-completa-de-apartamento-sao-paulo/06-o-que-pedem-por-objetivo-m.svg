<svg xmlns="http://www.w3.org/2000/svg" width="420" height="370" viewBox="0 0 420 370" role="img" aria-labelledby="t"><title id="t">O que as pessoas pedem à Bewild por objetivo e metragem, 140 pedidos de orçamento entre 8 de setembro e 11 de novembro de 2026: morar 86 pedidos (19 até 30 m², 40 de 31 a 50, 15 de 51 a 80, 12 acima de 80 m²); short stay 27 (23 até 30 m²); locação tradicional 16 (8 até 30, 7 de 31 a 50); uso misto 11. Quem vai morar pede apartamentos maiores, onde a decisão entre parcial e completa pesa mais.</title><rect width="420" height="370" fill="#FFFFFF"/><text x="16" y="26" font-size="13" fill="#1F2937" text-anchor="start" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Morar: apartamentos maiores</text><text x="16" y="46" font-size="12" fill="#6B7280" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">140 pedidos (8/9–11/11/2026)</text><text x="16" y="70" font-size="12" fill="#1F2937" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Moradia (86)</text><rect x="16" y="76" width="75" height="28" fill="#0F4C5C"/><text x="53" y="95" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">19</text><rect x="91" y="76" width="157" height="28" fill="#7FA9B3"/><text x="169" y="95" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">40</text><rect x="248" y="76" width="59" height="28" fill="#E8702A"/><text x="278" y="95" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">15</text><rect x="307" y="76" width="47" height="28" fill="#6B7280"/><text x="331" y="95" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">12</text><text x="16" y="128" font-size="12" fill="#1F2937" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Short stay (27)</text><rect x="16" y="134" width="90" height="28" fill="#0F4C5C"/><text x="61" y="153" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">23</text><rect x="106" y="134" width="12" height="28" fill="#7FA9B3"/><rect x="118" y="134" width="4" height="28" fill="#E8702A"/><text x="16" y="186" font-size="12" fill="#1F2937" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Locação tradicional (16)</text><rect x="16" y="192" width="31" height="28" fill="#0F4C5C"/><text x="32" y="211" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">8</text><rect x="47" y="192" width="28" height="28" fill="#7FA9B3"/><text x="61" y="211" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">7</text><rect x="75" y="192" width="4" height="28" fill="#E8702A"/><text x="16" y="244" font-size="12" fill="#1F2937" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Uso misto (11)</text><rect x="16" y="250" width="16" height="28" fill="#0F4C5C"/><rect x="32" y="250" width="28" height="28" fill="#7FA9B3"/><text x="46" y="269" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">7</text><rect x="16" y="310" width="12" height="12" fill="#0F4C5C"/><text x="32" y="321" font-size="12" fill="#6B7280" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">até 30 m²</text><rect x="110" y="310" width="12" height="12" fill="#7FA9B3"/><text x="126" y="321" font-size="12" fill="#6B7280" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">31–50 m²</text><rect x="196" y="310" width="12" height="12" fill="#E8702A"/><text x="212" y="321" font-size="12" fill="#6B7280" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">51–80 m²</text><rect x="282" y="310" width="12" height="12" fill="#6B7280"/><text x="298" y="321" font-size="12" fill="#6B7280" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">>80 m²</text><text x="16" y="360" font-size="12" fill="#6B7280" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Fonte: formulário bewild.com.br, 8/9–11/11/2026.</text></svg>