<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 667" width="420" height="667" role="img" aria-labelledby="t d"><title id="t">Reforma simples e reforma completa por metragem em São Paulo</title><desc id="d">Faixa de mercado da Lar Pontual (custo de São Paulo em outubro de 2026) para 40, 50, 60, 70 e 80 m²: simples R$ 47.500, 62.500, 75.000, 87.500 e 100.000; completa sem mobília R$ 85.000, 135.000, 170.000, 205.000 e 240.000. Orçamentos Bewild de reforma completa com mobília: mediana de R$ 89.402 em 30 a 35 m² (72 orçamentos) e R$ 101.021 em 35 a 45 m² (82). O Índice Bewild vai até 45 m².</desc><style>.s{font-family:Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif}.m{font-family:'JetBrains Mono', Menlo, Consolas, monospace}</style><rect width="420" height="667" fill="#FFFFFF"/><text x="32" y="44" class="m" font-size="13" font-weight="700" fill="#11355B" letter-spacing="1.5">SIMPLES × COMPLETA</text><text x="32" y="78" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">Simples ou completa: a</text><text x="32" y="108" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">diferença cresce com a</text><text x="32" y="138" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">metragem</text><text x="32" y="170" class="s" font-size="15" fill="#5A6472">Total por metragem na tabela de mercado</text><text x="32" y="191" class="s" font-size="15" fill="#5A6472">(Lar Pontual) e mediana dos orçamentos</text><text x="32" y="212" class="s" font-size="15" fill="#5A6472">Bewild, que vão até 45 m².</text><line x1="78.0" y1="547.0" x2="388.0" y2="547.0" stroke="#E7E2D9" stroke-width="1"/><text x="70" y="551" class="m" font-size="12" fill="#5A6472" text-anchor="end">0 mil</text><line x1="78.0" y1="472.0" x2="388.0" y2="472.0" stroke="#E7E2D9" stroke-width="1"/><text x="70" y="476" class="m" font-size="12" fill="#5A6472" text-anchor="end">65 mil</text><line x1="78.0" y1="397.0" x2="388.0" y2