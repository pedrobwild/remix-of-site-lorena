<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 598" width="720" height="718" role="img" aria-labelledby="t d"><title id="t">Reforma simples e reforma completa por metragem em São Paulo</title><desc id="d">Faixa de mercado da Lar Pontual (custo de São Paulo em outubro de 2026) para 40, 50, 60, 70 e 80 m²: simples R$ 47.500, 62.500, 75.000, 87.500 e 100.000; completa sem mobília R$ 85.000, 135.000, 170.000, 205.000 e 240.000. Orçamentos Bewild de reforma completa com mobília: mediana de R$ 89.402 em 30 a 35 m² (72 orçamentos) e R$ 101.021 em 35 a 45 m² (82). O Índice Bewild vai até 45 m².</desc><style>.s{font-family:Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif}.m{font-family:'JetBrains Mono', Menlo, Consolas, monospace}</style><rect width="600" height="598" fill="#FFFFFF"/><text x="32" y="44" class="m" font-size="13" font-weight="700" fill="#11355B" letter-spacing="1.5">SIMPLES × COMPLETA</text><text x="32" y="78" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">Simples ou completa: a diferença</text><text x="32" y="108" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">cresce com a metragem</text><text x="32" y="140" class="s" font-size="15" fill="#5A6472">Total por metragem na tabela de mercado (Lar Pontual) e</text><text x="32" y="161" class="s" font-size="15" fill="#5A6472">mediana dos orçamentos Bewild, que vão até 45 m².</text><line x1="78.0" y1="496.0" x2="568.0" y2="496.0" stroke="#E7E2D9" stroke-width="1"/><text x="70" y="500" class="m" font-size="12" fill="#5A6472" text-anchor="end">0 mil</text><line x1="78.0" y1="421.0" x2="568.0" y2="421.0" stroke="#E7E2D9" stroke-width="1"/><text x="70" y="425" class="m" font-size="12" fill="#5A6472" text-anchor="end">65 mil</text><line x1="78.0" y1="346.0" x2="568.0" y2="346.0" stroke="#E7E2D9" stroke-width="1"/><text x="70" y="350" class="m" font-size="12" fill="#5A6472" text-anchor="end">130 mil</text><line x1="78.0" y1="271.0" x2="568.0" y2="271.0" stroke="#E7E2D9" stroke-width="1"/><text x="70" y="275" class="m" font-size="12" fill="#5A6472" text-anchor="end">195 mil</text><line x1="78.0" y1="196.0" x2="568.0" y2="196.0" stroke="#E7E2D9" stroke-width="1"/><text x="70" y="200" class="m" font-size="12" fill="#5A6472" text-anchor="end">260 mil</text><text x="96.1481" y="514" class="m" font-size="12" fill="#5A6472" text-anchor="middle">30 m²</text><text x="186.889" y="514" class="m" font-size="12" fill="#5A6472" text-anchor="middle">40 m²</text><text x="277.63" y="514" class="m" font-size="12" fill="#5A6472" text-anchor="middle">50 m²</text><text x="368.37" y="514" class="m" font-size="12" fill="#5A6472" text-anchor="middle">60 m²</text><text x="459.111" y="514" class="m" font-size="12" fill="#5A6472" text-anchor="middle">70 m²</text><text x="549.852" y="514" class="m" font-size="12" fill="#5A6472" text-anchor="middle">80 m²</text><polyline points="186.9,441.2 277.6,423.9 368.4,409.5 459.1,395.0 549.9,380.6" fill="none" stroke="#8B95A1" stroke-width="2.5"/><circle cx="186.9" cy="441.2" r="3.5" fill="#8B95A1" fill-opacity="1.0"/><circle cx="277.6" cy="423.9" r="3.5" fill="#8B95A1" fill-opacity="1.0"/><circle cx="368.4" cy="409.5" r="3.5" fill="#8B95A1" fill-opacity="1.0"/><circle cx="459.1" cy="395.0" r="3.5" fill="#8B95A1" fill-opacity="1.0"/><circle cx="549.9" cy="380.6" r="3.5" fill="#8B95A1" fill-opacity="1.0"/><polyline points="186.9,397.9 277.6,340.2 368.4,299.8 459.1,259.5 549.9,219.1" fill="none" stroke="#1A2332" stroke-width="2.5"/><circle cx="186.9" cy="397.9" r="3.5" fill="#1A2332" fill-opacity="1.0"/><circle cx="277.6" cy="340.2" r="3.5" fill="#1A2332" fill-opacity="1.0"/><circle cx="368.4" cy="299.8" r="3.5" fill="#1A2332" fill-opacity="1.0"/><circle cx="459.1" cy="259.5" r="3.5" fill="#1A2332" fill-opacity="1.0"/><circle cx="549.9" cy="219.1" r="3.5" fill="#1A2332" fill-opacity="1.0"/><circle cx="123.4" cy="392.8" r="7" fill="#D07A3E" fill-opacity="1.0"/><circle cx="173.3" cy="379.4" r="7