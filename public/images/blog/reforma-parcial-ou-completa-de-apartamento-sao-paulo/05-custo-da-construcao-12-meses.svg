<svg xmlns="http://www.w3.org/2000/svg" width="720" height="390" viewBox="0 0 720 390" role="img" aria-labelledby="t"><title id="t">Quanto o custo de construir e reformar subiu em 12 meses: INCC-M Brasil 6,75% e São Paulo capital 7,60% (FGV, outubro de 2026); SINAPI Brasil 6,81%, mão de obra 8,53%, materiais 5,54%, estado de São Paulo 6,02% (IBGE, setembro de 2026); CUB SindusCon-SP 6,17% (setembro de 2026). A mão de obra sobe mais que os materiais.</title><rect width="720" height="390" fill="#FFFFFF"/><text x="16" y="26" font-size="16" fill="#1F2937" text-anchor="start" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">O custo da obra subiu de 6% a 8,5% em 12 meses; mão de obra puxa</text><text x="16" y="46" font-size="12" fill="#6B7280" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Variação acumulada em 12 meses, índices oficiais de custo da construção</text><text x="16" y="88" font-size="12" fill="#1F2937" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">INCC-M Brasil</text><rect x="246" y="70" width="296" height="26" fill="#7FA9B3" rx="3"/><text x="548" y="88" font-size="12" fill="#1F2937" text-anchor="start" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">6,75%</text><text x="16" y="126" font-size="12" fill="#1F2937" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">INCC-M São Paulo (capital)</text><rect x="246" y="108" width="333" height="26" fill="#0F4C5C" rx="3"/><text x="585" y="126" font-size="12" fill="#1F2937" text-anchor="start" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">7,6%</text><text x="16" y="164" font-size="12" fill="#1F2937" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">SINAPI Brasil</text><rect x="246" y="146" width="298" height="26" fill="#7FA9B3" rx="3"/><text x="550" y="164" font-size="12" fill="#1F2937" text-anchor="start" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">6,81%</text><text x="16" y="202" font-size="12" fill="#1F2937" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">SINAPI mão de obra</text><rect x="246" y="184" width="373" height="26" fill="#E8702A" rx="3"/><text x="625" y="202" font-size="12" fill="#1F2937" text-anchor="start" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">8,53%</text><text x="16" y="240" font-size="12" fill="#1F2937" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">SINAPI materiais</text><rect x="246" y="222" width="243" height="26" fill="#7FA9B3" rx="3"/><text x="495" y="240" font-size="12" fill="#1F2937" text-anchor="start" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">5,54%</text><text x="16" y="278" font-size="12" fill="#1F2937" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">SINAPI São Paulo (estado)</text><rect x="246" y="260" width="264" height="26" fill="#0F4C5C" rx="3"/><text x="516" y="278" font-size="12" fill="#1F2937" text-anchor="start" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">6,02%</text><text x="16" y="316" font-size="12" fill="#1F2937" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">CUB SindusCon-SP</text><rect x="246" y="298" width="270" height="26" fill="#7FA9B3" rx="3"/><text x="522" y="316" font-size="12" fill="#1F2937" text-anchor="start" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">6,17%</text><text x="16" y="360" font-size="12" fill="#1F2937" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Compare com o IPCA de 12 meses na data: a obra sobe acima da inflação geral.</text><text x="16" y="380" font-size="12" fill="#6B7280" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Fontes: FGV INCC-M out/2026 (27/10); IBGE SINAPI set/2026 (9/10); SindusCon-SP CUB set/2026 (1/10).</text></svg>