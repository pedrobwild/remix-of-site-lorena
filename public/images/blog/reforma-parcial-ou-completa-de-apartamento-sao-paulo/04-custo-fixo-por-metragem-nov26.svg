<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 484" width="720" height="581" role="img" aria-labelledby="t d"><title id="t">Parte do orçamento que não depende da metragem, pela regra de bolso do Índice Bewild</title><desc id="d">20 m²: 52,1% de R$ 63.230; 25 m²: 46,5% de R$ 70.800; 30 m²: 42,0% de R$ 78.370; 35 m²: 38,3% de R$ 85.940; 40 m²: 35,2% de R$ 93.510; 45 m²: 32,6% de R$ 101.080. Regra ajustada de 21 a 35 m²; fora dessa faixa é extrapolação.</desc><style>.s{font-family:Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif}.m{font-family:'JetBrains Mono', Menlo, Consolas, monospace}</style><rect width="600" height="484" fill="#FFFFFF"/><text x="32" y="44" class="m" font-size="13" font-weight="700" fill="#11355B" letter-spacing="1.5">O CUSTO QUE NÃO ENCOLHE</text><text x="32" y="78" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">A parte fixa pesa metade do</text><text x="32" y="108" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">orçamento em 20 m² e um terço em</text><text x="32" y="138" class="s" font-size="24" font-weight="700" fill="#1A2332" letter-spacing="-0.5">45 m²</text><text x="32" y="170" class="s" font-size="15" fill="#5A6472">Parcela de R$ 32.950 da regra de bolso sobre o valor</text><text x="32" y="191" class="s" font-size="15" fill="#5A6472">estimado em cada metragem.</text><text x="32" y="245" class="s" font-size="14" font-weight="600" fill="#1A2332">20 m²</text><rect x="200.0" y="232.0" width="125.0" height="16.0" rx="4" fill="#D07A3E"/><text x="333.04" y="245" class="s" font-size="13.5" font-weight="700" fill="#1A2332">52,1%</text><text x="568" y="245" class="m" font-size="11.5" fill="#5A6472" text-anchor="end">R$ 63.230</text><text x="32" y="279" class="s" font-size="14" font-weight="600" fill="#1A2332">25 m²</text><rect x="200.0" y="266.0" width="111.6" height="16.0" rx="4" fill="#2F6FA8"/><text x="319.6" y="279" class="s" font-size="13.5" font-weight="700" fill="#1A2332">46,5%</text><text x="568" y="279" class="m" font-size="11.5" fill="#5A6472" text-anchor="end">R$ 70.800</text><text x="32" y="313" class="s" font-size="14" font-weight="600" fill="#1A2332">30 m²</text><rect x="200.0" y="300.0" width="100.8" height="16.0" rx="4" fill="#2F6FA8"/><text x="308.8" y="313" class="s" font-size="13.5" font-weight="700" fill="#1A2332">42,0%</text><text x="568" y="313" class="m" font-size="11.5" fill="#5A6472" text-anchor="end">R$ 78.370</text><text x="32" y="347" class="s" font-size="14" font-weight="600" fill="#1A2332">35 m²</text><rect x="200.0" y="334.0" width="91.9" height="16.0" rx="4" fill="#2F6FA8"/><text x="299.92" y="347" class="s" font-size="13.5" font-weight="700" fill="#1A2332">38,3%</text><text x="568" y="347" class="m" font-size="11.5" fill="#5A6472" text-anchor="end">R$ 85.940</text><text x="32" y="381" class="s" font-size="14" font-weight="600" fill="#1A2332">40 m²</text><rect x="200.0" y="368.0" width="84.5" height="16.0" rx="4" fill="#2F6FA8"/><text x="292.48" y="381" class="s" font-size="13.5" font-weight="700" fill="#1A2332">35,2%</text><text x="568" y="381" class="m" font-size="11.5" fill="#5A6472" text-anchor="end">R$ 93.510</text><text x="32" y="415" class="s" font-size="14" font-weight="600" fill="#1A2332">45 m²</text><rect x="200.0" y="402.0" width="78.2" height="16.0" rx="4" fill="#2F6FA8"/><text x="286.24" y="415" class="s" font-size="13.5" font-weight="700" fill="#1A2332">32,6%</text><text x="568" y="415" class="m" font-size="11.5" fill="#5A6472" text-anchor="end">R$ 101.080</text><line x1="32.0" y1="440.0" x2="568.0" y2="440.0" stroke="#E7E2D9" stroke-width="1"/><text x="32" y="462" class="m" font-size="13" fill="#5A6472">Fonte: Índice Bewild, nov/2026, 585 orçamentos</text><text x="568" y="462" class="m" font-size="13" font-weight="700" fill="#11355B" text-anchor="end">bewild.com.br</text></svg>
