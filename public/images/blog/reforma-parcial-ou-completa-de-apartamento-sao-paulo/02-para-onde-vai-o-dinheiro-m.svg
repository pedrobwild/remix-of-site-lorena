<svg xmlns="http://www.w3.org/2000/svg" width="420" height="470" viewBox="0 0 420 470" role="img" aria-labelledby="t"><title id="t">Para onde vai o dinheiro em um orçamento real de reforma completa de 24 m² da Bewild (maio de 2026, R$ 67.191): marcenaria 33,9%; administração e gestão 18,6%; infraestrutura, obra civil e acabamentos 18,0%; eletrodomésticos 13,5%; mobiliário 5,2%; arquitetura e documentação 4,4%; luminárias e acessórios 3,7%; vidraçaria 2,7%. A obra civil (pintura, piso, elétrica, revestimento) é só 18% do total.</title><rect width="420" height="470" fill="#FFFFFF"/><text x="16" y="26" font-size="13" fill="#1F2937" text-anchor="start" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Obra civil: 18% da reforma completa</text><text x="16" y="46" font-size="12" fill="#6B7280" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Orçamento real de 24 m², R$ 67.191 (mai/2026)</text><text x="16" y="67" font-size="12" fill="#1F2937" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Marcenaria</text><rect x="16" y="72" width="286" height="22" fill="#0F4C5C" rx="3"/><text x="308" y="88" font-size="12" fill="#1F2937" text-anchor="start" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">33,9%</text><text x="16" y="109" font-size="12" fill="#1F2937" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Administração e gestão</text><rect x="16" y="114" width="157" height="22" fill="#0F4C5C" rx="3"/><text x="179" y="130" font-size="12" fill="#1F2937" text-anchor="start" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">18,6%</text><text x="16" y="151" font-size="12" fill="#1F2937" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Infraestrutura, obra civil e acabamentos</text><rect x="16" y="156" width="152" height="22" fill="#E8702A" rx="3"/><text x="174" y="172" font-size="12" fill="#1F2937" text-anchor="start" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">18,0%</text><text x="16" y="193" font-size="12" fill="#1F2937" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Eletrodomésticos</text><rect x="16" y="198" width="114" height="22" fill="#0F4C5C" rx="3"/><text x="136" y="214" font-size="12" fill="#1F2937" text-anchor="start" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">13,5%</text><text x="16" y="235" font-size="12" fill="#1F2937" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Mobiliário</text><rect x="16" y="240" width="44" height="22" fill="#0F4C5C" rx="3"/><text x="66" y="256" font-size="12" fill="#1F2937" text-anchor="start" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">5,2%</text><text x="16" y="277" font-size="12" fill="#1F2937" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Arquitetura e documentações</text><rect x="16" y="282" width="37" height="22" fill="#0F4C5C" rx="3"/><text x="59" y="298" font-size="12" fill="#1F2937" text-anchor="start" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">4,4%</text><text x="16" y="319" font-size="12" fill="#1F2937" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Luminárias e acessórios</text><rect x="16" y="324" width="31" height="22" fill="#0F4C5C" rx="3"/><text x="53" y="340" font-size="12" fill="#1F2937" text-anchor="start" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">3,7%</text><text x="16" y="361" font-size="12" fill="#1F2937" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Vidraçaria</text><rect x="16" y="366" width="23" height="22" fill="#0F4C5C" rx="3"/><text x="45" y="382" font-size="12" fill="#1F2937" text-anchor="start" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">2,7%</text><text x="16" y="440" font-size="12" fill="#1F2937" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Laranja: o que a "reforma simples" cobre.</text><text x="16" y="460" font-size="12" fill="#6B7280" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Fonte: orçamento Bewild (post de 1/10/2026).</text></svg>