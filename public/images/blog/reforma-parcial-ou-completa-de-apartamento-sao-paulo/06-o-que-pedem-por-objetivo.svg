<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" role="img" aria-labelledby="t"><title id="t">O que as pessoas pedem à Bewild por objetivo e metragem, 140 pedidos de orçamento entre 8 de setembro e 11 de novembro de 2026: morar 86 pedidos (19 até 30 m², 40 de 31 a 50, 15 de 51 a 80, 12 acima de 80 m²); short stay 27 (23 até 30 m²); locação tradicional 16 (8 até 30, 7 de 31 a 50); uso misto 11. Quem vai morar pede apartamentos maiores, onde a decisão entre parcial e completa pesa mais.</title><rect width="720" height="330" fill="#FFFFFF"/><text x="16" y="26" font-size="16" fill="#1F2937" text-anchor="start" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Quem vai morar pede reforma de apartamento maior</text><text x="16" y="46" font-size="12" fill="#6B7280" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">140 pedidos de orçamento (8/9 a 11/11/2026) por objetivo e faixa de metragem</text><text x="16" y="93" font-size="12" fill="#1F2937" text-anchor="start" font-weight="normal" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Moradia</text><rect x="166" y="70" width="106" height="36" fill="#0F4C5C"/><text x="219" y="93" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">19</text><rect x="272" y="70" width="224" height="36" fill="#7FA9B3"/><text x="384" y="93" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">40</text><rect x="496" y="70" width="84" height="36" fill="#E8702A"/><text x="538" y="93" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">15</text><rect x="580" y="70" width="67" height="36" fill="#6B7280"/><text x="614" y