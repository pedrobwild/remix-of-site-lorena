<svg xmlns="http://www.w3.org/2000/svg" width="420" height="400" viewBox="0 0 420 400" role="img" aria-labelledby="t"><title id="t">Quando a marcenaria planejada fica pronta conforme a data do pedido à fábrica (25 dias úteis de produção, premissa Bewild): pedido em 16/11/26 fica pronto em 21/12 pelo calendário oficial ou 4/1/27 na hipótese de fábrica parada de 21/12 a 3/1 (35 contra 49 dias corridos); pedido em 1/12 fica pronto em 6/1 ou 18/1; pedido em 15/12, 20/1 ou 2/2; pedido em 5/1/27, 9/2 ou 12/2; pedido em 18/1, 22/2 ou 25/2.</title><style>text{font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:12px;fill:#1F2937}.b{font-weight:bold}.g{fill:#6B7280}.w{fill:#FFFFFF}.m{text-anchor:middle}.e{text-anchor:end}</style><rect width="420" height="400" fill="#FFFFFF"/><text x="16" y="26" style="font-size:13px" class="b">Marcenaria pedida em dez. chega em jan.</text><text x="16" y="46" class="g">Dias corridos, 25 dias úteis de fábrica</text><text x="16" y="90">16/11</text><rect x="86" y="70" width="124" height="30" fill="#0F4C5C" rx="3"/><rect x="210" y="70" width="50" height="30" fill="#E8702A" rx="3"/><text x="265" y="90" class="b">21/12/4/1</text><text x="16" y="134">1/12</text><rect x="86" y="114" width="127" height="30" fill="#0F4C5C" rx="3"/><rect x="213" y="114" width="42" height="30" fill="#E8702A" rx="3"/><text x="262" y="134" class="b">6/1/18/1</text><text x="16" y="178">15/12</text><rect x="86" y="158" width="127" height="30" fill="#0F4C5C" rx="3"/><rect x="213" y="158" width="46" height="30" fill="#E8702A" rx="3"/><text x="265" y="178" class="b">20/1/2/2</text><text x="16" y="222">5/1</text><rect x="86" y="202" width="124" height="30" fill="#0F4C5C" rx="3"/><rect x="210" y="202" width="11" height="30" fill="#E8702A" rx="3"/><text x="226" y="222" class="b">9/2/12/2</text><text x="16" y="266">18/1</text><rect x="86" y="246" width="124" height="30" fill="#0F4C5C" rx="3"/><rect x="210" y="246" width="11" height="30" fill="#E8702A" rx="3"/><text x="226" y="266" class="b">22/2/25/2</text><rect x="16" y="300" width="12" height="12" fill="#0F4C5C"/><text x="32" y="311" class="g">Oficial</text><rect x="106" y="300" width="12" height="12" fill="#E8702A"/><text x="122" y="311" class="g">Fábrica parada 21/12–3/1 (hipótese)</text><text x="16" y="370">Pedido sai com paredes prontas; montagem 5 d.u.</text><text x="16" y="390" class="g">Fonte: processo Bewild; calendário SP; hipótese Bewild.</text></svg>