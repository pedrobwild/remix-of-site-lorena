<svg xmlns="http://www.w3.org/2000/svg" width="420" height="500" viewBox="0 0 420 500" role="img" aria-labelledby="t"><title id="t">Linha do tempo de uma reforma de apartamento contratada em 16 de novembro de 2026, em quatro cenários (premissas da Bewild): projeto 3D e executivo em 4 semanas e condomínio em 1 semana levam a obra de 60 dias úteis a começar em 28/12 e terminar em 23/3/27 (até 30 m²) ou 14/4/27 (75 dias úteis, acima de 30 m²); projeto em 8 semanas e condomínio em 4 semanas levam a obra a começar em 12/2/27 e terminar em 10/5/27 (60 dias úteis) ou 1/6/27 (75 dias úteis).</title><style>text{font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:12px;fill:#1F2937}.b{font-weight:bold}.g{fill:#6B7280}.w{fill:#FFFFFF}.m{text-anchor:middle}.e{text-anchor:end}</style><rect width="420" height="500" fill="#FFFFFF"/><text x="16" y="26" style="font-size:13px" class="b">Contrato em nov.: pronto entre mar. e jun./27</text><text x="16" y="46" class="g">Contrato 16/11/2026, 4 cenários (premissas)</text><text x="16" y="80" class="b">Proj. 4 sem + cond. 1 · 60 d.u.</text><rect x="25" y="86" width="35" height="30" fill="#0F4C5C" rx="3"/><rect x="60" y="86" width="9" height="30" fill="#7FA9B3" rx="3"/><rect x="69" y="86" width="9" height="30" fill="#6B7280" rx="3"/><rect x="77" y="86" width="106" height="30" fill="#E8702A" rx="3"/><text x="130" y="106" class="b w m">Obra</text><text x="184" y="132" class="b e">pronto 23/3</text><text x="16" y="164" class="b">Proj. 4 sem + cond. 1 · 75 d.u.</text><rect x="25" y="170" width="35" height="30" fill="#0F4C5C" rx="3"/><rect x="60" y="170" width="9" height="30" fill="#7FA9B3" rx="3"/><rect x="69" y="170" width="9" height="30" fill="#6B7280" rx="3"/><rect x="77" y="170" width="134" height="30" fill="#E8702A" rx="3"/><text x="144" y="190" class="b w m">Obra</text><text x="211" y="216" class="b e">pronto 14/4</text><text x="16" y="248" class="b">Proj. 8 sem + cond. 4 · 60 d.u.</text><rect x="25" y="254" width="70" height="30" fill="#0F4C5C" rx="3"/><text x="60" y="274" class="b w m">Projeto</text><rect x="95" y="254" width="35" height="30" fill="#7FA9B3" rx="3"/><rect x="130" y="254" width="5" height="30" fill="#6B7280" rx="3"/><rect x="135" y="254" width="109" height="30" fill="#E8702A" rx="3"/><text x="189" y="274" class="b w m">Obra</text><text x="244" y="300" class="b e">pronto 10/5</text><text x="16" y="332" class="b">Proj. 8 sem + cond. 4 · 75 d.u.</text><rect x="25" y="338" width="70" height="30" fill="#0F4C5C" rx="3"/><text x="60" y="358" class="b w m">Projeto</text><rect x="95" y="338" width="35" height="30" fill="#7FA9B3" rx="3"/><rect x="130" y="338" width="5" height="30" fill="#6B7280" rx="3"/><rect x="135" y="338" width="136" height="30" fill="#E8702A" rx="3"/><text x="203" y="358" class="b w m">Obra</text><text x="271" y="384" class="b e">pronto 1/6</text><line x1="44" y1="74" x2="44" y2="428" stroke="#E5E7EB"/><text x="44" y="442" class="g m">dez/26</text><line x1="121" y1="74" x2="121" y2="428" stroke="#E5E7EB"/><text x="121" y="442" class="g m">fev/27</text><line x1="195" y1="74" x2="195" y2="428" stroke="#E5E7EB"/><text x="195" y="442" class="g m">abr/27</text><line x1="271" y1="74" x2="271" y2="428" stroke="#E5E7EB"/><text x="271" y="442" class="g m">jun/27</text><text x="16" y="470">Obra começa até 5 d.u. após as 3 liberações.</text><text x="16" y="490" class="g">Fonte: processo Bewild (nov/26); calendário SP.</text></svg>