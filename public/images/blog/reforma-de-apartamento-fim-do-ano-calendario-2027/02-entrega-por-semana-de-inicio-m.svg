<svg xmlns="http://www.w3.org/2000/svg" width="420" height="540" viewBox="0 0 420 540" role="img" aria-labelledby="t"><title id="t">Data de término de uma obra de 60 dias úteis conforme a semana de início, calendário de São Paulo: início 16/11/26 termina 11/2/27 (88 dias corridos); 30/11 termina 24/2; 7/12 termina 3/3; 21/12 termina 17/3; 28/12 termina 23/3; 4/1/27 termina 30/3; 18/1 termina 13/4; 1/2 termina 27/4; 15/2 termina 11/5; 1/3 termina 25/5. Pelo contrato, 60 dias úteis dão sempre 86 a 88 dias corridos. Na hipótese de calendário prático, começar entre 7/12 e 28/12 custa 10 a 16 dias a mais; a partir de 15/2 a diferença some.</title><style>text{font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:12px;fill:#1F2937}.b{font-weight:bold}.g{fill:#6B7280}.w{fill:#FFFFFF}.m{text-anchor:middle}.e{text-anchor:end}</style><rect width="420" height="540" fill="#FFFFFF"/><text x="16" y="26" style="font-size:13px" class="b">Dezembro: prazo igual no contrato, maior na prática</text><text x="16" y="46" class="g">Dias corridos para 60 dias úteis, por início</text><text x="16" y="84">16/11</text><rect x="86" y="66" width="171" height="26" fill="#0F4C5C" rx="3"/><rect x="257" y="66" width="29" height="26" fill="#E8702A" rx="3"/><text x="292" y="84" class="b">88+15 · 11/2</text><text x="16" y="120">30/11</text><rect x="86" y="102" width="169" height="26" fill="#0F4C5C" rx="3"/><rect x="255" y="102" width="29" height="26" fill="#E8702A" rx="3"/><text x="290" y="120" class="b">87+15 · 24/2</text><text x="16" y="156">7/12</text><rect x="86" y="138" width="169" height="26" fill="#0F4C5C" rx="3"/><rect x="255" y="138" width="29" height="26" fill="#E8702A" rx="3"/><text x="290" y="156" class="b">87+15 · 3/3</text><text x="16" y="192">21/12</text><rect x="86" y="174" width="169" height="26" fill="#0F4C5C" rx="3"/><rect x="255" y="174" width="31" height="26" fill="#E8702A" rx="3"/><text x="292" y="192" class="b">87+16 · 17/3</text><text x="16" y="228">28/12</text><rect x="86" y="210" width="167" height="26" fill="#0F4C5C" rx="3"/><rect x="253" y="210" width="19" height="26" fill="#E8702A" rx="3"/><text x="279" y="228" class="b">86+10 · 23/3</text><text x="16" y="264">4/1</text><rect x="86" y="246" width="167" height="26" fill="#0F4C5C" rx="3"/><rect x="253" y="246" width="6" height="26" fill="#E8702A" rx="3"/><text x="265" y="264" class="b">86+3 · 30/3</text><text x="16" y="300">18/1</text><rect x="86" y="282" width="167" height="26" fill="#0F4C5C" rx="3"/><rect x="253" y="282" width="6" height="26" fill="#E8702A" rx="3"/><text x="265" y="300" class="b">86+3 · 13/4</text><text x="16" y="336">1/2</text><rect x="86" y="318" width="167" height="26" fill="#0F4C5C" rx="3"/><rect x="253" y="318" width="6" height="26" fill="#E8702A" rx="3"/><text x="265" y="336" class="b">86+3 · 27/4</text><text x="16" y="372">15/2</text><rect x="86" y="354" width="167" height="26" fill="#0F4C5C" rx="3"/><text x="259" y="372" class="b">86 · 11/5</text><text x="16" y="408">1/3</text><rect x="86" y="390" width="167" height="26" fill="#0F4C5C" rx="3"/><text x="259" y="408" class="b">86 · 25/5</text><rect x="16" y="440" width="12" height="12" fill="#0F4C5C"/><text x="32" y="451" class="g">60 d.u. contratuais</text><rect x="166" y="440" width="12" height="12" fill="#E8702A"/><text x="182" y="451" class="g">Extra (hipótese prática)</text><text x="16" y="510">Data contratual; obra começa após as 3 liberações.</text><text x="16" y="530" class="g">Fonte: contrato Bewild; calendário SP; hipótese Bewild.</text></svg>