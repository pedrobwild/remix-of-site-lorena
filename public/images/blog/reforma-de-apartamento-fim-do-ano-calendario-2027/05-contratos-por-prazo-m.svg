<svg xmlns="http://www.w3.org/2000/svg" width="420" height="330" viewBox="0 0 420 330" role="img" aria-labelledby="t"><title id="t">Qual prazo de obra se aplica nos 198 contratos Bewild (planilha lida em 10/11/2026): 160 contratos (81%) têm até 30 m² e prazo de 60 dias úteis, com valor mediano de R$ 71.432 (metade central R$ 65.000 a R$ 77.110); 38 contratos (19%) têm mais de 30 m² e prazo de até 75 dias úteis, com mediana de R$ 105.000 (R$ 86.059 a R$ 119.500).</title><style>text{font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:12px;fill:#1F2937}.b{font-weight:bold}.g{fill:#6B7280}.w{fill:#FFFFFF}.m{text-anchor:middle}.e{text-anchor:end}</style><rect width="420" height="330" fill="#FFFFFF"/><text x="16" y="26" style="font-size:13px" class="b">8 em 10 contratos: prazo de 60 dias úteis</text><text x="16" y="46" class="g">198 contratos por prazo contratual</text><rect x="16" y="76" width="301" height="48" fill="#0F4C5C" rx="3"/><text x="166" y="105" style="font-size:13px" class="b w m">160 contratos · 81%</text><rect x="319" y="76" width="71" height="48" fill="#E8702A" rx="3"/><text x="354" y="105" style="font-size:13px" class="b w m">38 · 19%</text><rect x="16" y="148" width="12" height="12" fill="#0F4C5C"/><text x="34" y="159" style="font-size:13px" class="b">60 dias úteis (até 30 m²)</text><text x="34" y="178">Mediana R$ 71.432 · Q1–Q3 R$ 65.000–R$ 77.110</text><rect x="16" y="200" width="12" height="12" fill="#E8702A"/><text x="34" y="211" style="font-size:13px" class="b">75 dias úteis (acima de 30 m²)</text><text x="34" y="230">Mediana R$ 105.000 · Q1–Q3 R$ 86.059–R$ 119.500</text><text x="16" y="300">Mediana = metade abaixo; metade central = Q1–Q3.</text><text x="16" y="320" class="g">Fonte: contratos Bewild (10/11/2026, 198 reg.).</text></svg>