<svg xmlns="http://www.w3.org/2000/svg" width="420" height="360" viewBox="0 0 420 360" role="img" aria-labelledby="t"><title id="t">Pedidos de orçamento à Bewild entre 1 de outubro e 10 de novembro de 2026 por metragem (121 pedidos com m² informado): até 30 m² 45 pedidos (37%), 14 para morar; 31 a 50 m² 48 (40%), 34 para morar; 51 a 80 m² 17 (14%), 15 para morar; acima de 80 m² 11 (9%), 9 para morar. Em 63% dos pedidos o apartamento tem mais de 30 m² e o prazo contratual passa a 75 dias úteis.</title><style>text{font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:12px;fill:#1F2937}.b{font-weight:bold}.g{fill:#6B7280}.w{fill:#FFFFFF}.m{text-anchor:middle}.e{text-anchor:end}</style><rect width="420" height="360" fill="#FFFFFF"/><text x="16" y="26" style="font-size:13px" class="b">Pedidos out–nov: 63% acima de 30 m²</text><text x="16" y="46" class="g">121 pedidos (1/10–10/11/2026) por metragem</text><line x1="40" y1="260" x2="400" y2="260" stroke="#E5E7EB"/><text x="34" y="264" class="g e">0</text><line x1="40" y1="225" x2="400" y2="225" stroke="#E5E7EB"/><text x="34" y="229" class="g e">10</text><line x1="40" y1="191" x2="400" y2="191" stroke="#E5E7EB"/><text x="34" y="195" class="g e">20</text><line x1="40" y1="156" x2="400" y2="156" stroke="#E5E7EB"/><text x="34" y="160" class="g e">30</text><line x1="40" y1="122" x2="400" y2="122" stroke="#E5E7EB"/><text x="34" y="126" class="g e">40</text><line x1="40" y1="87" x2="400" y2="87" stroke="#E5E7EB"/><text x="34" y="91" class="g e">50</text><rect x="62" y="105" width="45" height="155" fill="#0F4C5C" rx="3"/><rect x="62" y="212" width="45" height="48" fill="#E8702A" rx="3"/><text x="85" y="99" class="b m">45 (37%)</text><text x="85" y="276" class="m">até 30 m²</text><text x="85" y="292" class="g m">14 para morar</text><rect x="152" y="94" width="45" height="166" fill="#0F4C5C" rx="3"/><rect x="152" y="143" width="45" height="117" fill="#E8702A" rx="3"/><text x="175" y="88" class="b m">48 (40%)</text><text x="175" y="276" class="m">31–50 m²</text><text x="175" y="292" class="g m">34 para morar</text><rect x="242" y="201" width="45" height="59" fill="#0F4C5C" rx="3"/><rect x="242" y="208" width="45" height="52" fill="#E8702A" rx="3"/><text x="265" y="195" class="b m">17 (14%)</text><text x="265" y="276" class="m">51–80 m²</text><text x="265" y="292" class="g m">15 para morar</text><rect x="332" y="222" width="45" height="38" fill="#0F4C5C" rx="3"/><rect x="332" y="229" width="45" height="31" fill="#E8702A" rx="3"/><text x="355" y="216" class="b m">11 (9%)</text><text x="355" y="276" class="m">acima de 80 m²</text><text x="355" y="292" class="g m">9 para morar</text><text x="16" y="330">Até 30 m²: 60 d.u.; acima: até 75 d.u.</text><text x="16" y="350" class="g">Fonte: formulário bewild.com.br, 1/10–10/11/2026.</text></svg>