<svg xmlns="http://www.w3.org/2000/svg" width="720" height="500" viewBox="0 0 720 500" role="img" aria-labelledby="t"><title id="t">Data de término de uma obra de 60 dias úteis conforme a semana de início, calendário de São Paulo: início 16/11/26 termina 11/2/27 (88 dias corridos); 30/11 termina 24/2; 7/12 termina 3/3; 21/12 termina 17/3; 28/12 termina 23/3; 4/1/27 termina 30/3; 18/1 termina 13/4; 1/2 termina 27/4; 15/2 termina 11/5; 1/3 termina 25/5. Pelo contrato, 60 dias úteis dão sempre 86 a 88 dias corridos. Na hipótese de calendário prático, começar entre 7/12 e 28/12 custa 10 a 16 dias a mais; a partir de 15/2 a diferença some.</title><style>text{font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:12px;fill:#1F2937}.b{font-weight:bold}.g{fill:#6B7280}.w{fill:#FFFFFF}.m{text-anchor:middle}.e{text-anchor:end}</style><rect width="720" height="500" fill="#FFFFFF"/><text x="16" y="26" style="font-size:16px" class="b">Começar em dezembro não muda o prazo do contrato; muda o calendário prático</text><text x="16" y="46" class="g">Dias corridos para cumprir 60 dias úteis, por semana de início da obra</text><text x="16" y="84">início 16/11</text><rect x="166" y="66" width="339" height="26" fill="#0F4C5C" rx="3"/><rect x="505" y="66" width="58" height="26" fill="#E8702A" rx="3"/><text x="569" y="84" class="b">88 d (+15) · pronto 11/2</text><text x="16" y="118">início 30/11</text><rect x="166" y="100" width="335" height="26" fill="#0F4C5C" rx="3"/><rect x="501" y="100" width="58" height="26" fill="#E8702A" rx="3"/><text x="565" y="118" class="b">87 d (+15) · pronto 24/2</text><text x="16" y="152">início 7/12</text><rect x="166" y="134" width="335" height="26" fill="#0F4C5C" rx="3"/><rect x="501" y="134" width="58" height="26" fill="#E8702A" rx="3"/><text x="565" y="152" class="b">87 d (+15) · pronto 3/3</text><text x="16" y="186">início 21/12</text><rect x="166" y="168" width="335" height="26" fill="#0F4C5C" rx="3"/><rect x="501" y="168" width="62" height="26" fill="#E8702A" rx="3"/><text x="569" y="186" class="b">87 d (+16) · pronto 17/3</text><text x="16" y="220">início 28/12</text><rect x="166" y="202" width="331" height="26" fill="#0F4C5C" rx="3"/><rect x="497" y="202" width="39" height="26" fill="#E8702A" rx="3"/><text x="542" y="220" class="b">86 d (+10) · pronto 23/3</text><text x="16" y="254">início 4/1</text><rect x="166" y="236" width="331" height="26" fill="#0F4C5C" rx="3"/><rect x="497" y="236" width="12" height="26" fill="#E8702A" rx="3"/><text x="515" y="254" class="b">86 d (+3) · pronto 30/3</text><text x="16" y="288">início 18/1</text><rect x="166" y="270" width="331" height="26" fill="#0F4C5C" rx="3"/><rect x="497" y="270" width="12" height="26" fill="#E8702A" rx="3"/><text x="515" y="288" class="b">86 d (+3) · pronto 13/4</text><text x="16" y="322">início 1/2</text><rect x="166" y="304" width="331" height="26" fill="#0F4C5C" rx="3"/><rect x="497" y="304" width="12" height="26" fill="#E8702A" rx="3"/><text x="515" y="322" class="b">86 d (+3) · pronto 27/4</text><text x="16" y="356">início 15/2</text><rect x="166" y="338" width="331" height="26" fill="#0F4C5C" rx="3"/><text x="503" y="356" class="b">86 d · pronto 11/5</text><text x="16" y="390">início 1/3</text><rect x="166" y="372" width="331" height="26" fill="#0F4C5C" rx="3"/><text x="503" y="390" class="b">86 d · pronto 25/5</text><rect x="16" y="420" width="12" height="12" fill="#0F4C5C"/><text x="32" y="431" class="g">Contrato: 60 dias úteis (86 a 88 corridos)</text><rect x="316" y="420" width="12" height="12" fill="#E8702A"/><text x="332" y="431" class="g">Dias a mais na hipótese de calendário prático</text><text x="16" y="470">"Pronto" é a data contratual. A obra começa após condomínio, chaves e energia liberados.</text><text x="16" y="490" class="g">Fonte: contrato Bewild (60 dias úteis até 30 m²); calendário oficial de SP; hipótese prática Bewild.</text></svg>