<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="t"><title id="t">Linha do tempo de uma reforma de apartamento contratada em 16 de novembro de 2026, em quatro cenários (premissas da Bewild): projeto 3D e executivo em 4 semanas e condomínio em 1 semana levam a obra de 60 dias úteis a começar em 28/12 e terminar em 23/3/27 (até 30 m²) ou 14/4/27 (75 dias úteis, acima de 30 m²); projeto em 8 semanas e condomínio em 4 semanas levam a obra a começar em 12/2/27 e terminar em 10/5/27 (60 dias úteis) ou 1/6/27 (75 dias úteis).</title><style>text{font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:12px;fill:#1F2937}.b{font-weight:bold}.g{fill:#6B7280}.w{fill:#FFFFFF}.m{text-anchor:middle}.e{text-anchor:end}</style><rect width="720" height="420" fill="#FFFFFF"/><text x="16" y="26" style="font-size:16px" class="b">Contrato em novembro: apartamento pronto entre março e junho de 2027</text><text x="16" y="46" class="g">Quatro cenários a partir de um contrato assinado em 16/11/2026 (premissas da Bewild, não promessa)</text><text x="16" y="96" class="b">Proj. 4 sem + cond. 1 · 60 d.u.</text><rect x="228" y="76" width="47" height="30" fill="#0F4C5C" rx="3"/><text x="251" y="96" class="b w m">Projeto</text><rect x="274" y="76" width="12" height="30" fill="#7FA9B3" rx="3"/><rect x="286" y="76" width="12" height="30" fill="#6B7280" rx="3"/><rect x="297" y="76" width="141" height="30" fill="#E8702A" rx="3"/><text x="368" y="96" class="b w m">Obra</text><text x="443" y="96" class="b">pronto 23/3</text><text x="16" y="160" class="b">Proj. 4 sem + cond. 1 · 75 d.u.</text><rect x="228" y="140" width="47" height="30" fill="#0F4C5C" rx="3"/><text x="251" y="160" class="b w m">Projeto</text><rect x="274" y="140" width="12" height="30" fill="#7FA9B3" rx="3"/><rect x="286" y="140" width="12" height="30" fill="#6B7280" rx="3"/><rect x="297" y="140" width="178" height="30" fill="#E8702A" rx="3"/><text x="386" y="160" class="b w m">Obra</text><text x="479" y="160" class="b">pronto 14/4</text><text x="16" y="224" class="b">Proj. 8 sem + cond. 4 · 60 d.u.</text><rect x="228" y="204" width="93" height="30" fill="#0F4C5C" rx="3"/><text x="274" y="224" class="b w m">Projeto</text><rect x="321" y="204" width="47" height="30" fill="#7FA9B3" rx="3"/><text x="344" y="224" class="b w m">Cond.</text><rect x="367" y="204" width="7" height="30" fill="#6B7280" rx="3"/><rect x="374" y="204" width="145" height="30" fill="#E8702A" rx="3"/><text x="446" y="224" class="b w m">Obra</text><text x="523" y="224" class="b">pronto 10/5</text><text x="16" y="288" class="b">Proj. 8 sem + cond. 4 · 75 d.u.</text><rect x="228" y="268" width="93" height="30" fill="#0F4C5C" rx="3"/><text x="274" y="288" class="b w m">Projeto</text><rect x="321" y="268" width="47" height="30" fill="#7FA9B3" rx="3"/><text x="344" y="288" class="b w m">Cond.</text><rect x="367" y="268" width="7" height="30" fill="#6B7280" rx="3"/><rect x="374" y="268" width="181" height="30" fill="#E8702A" rx="3"/><text x="465" y="288" class="b w m">Obra</text><text x="559" y="288" class="b">pronto 1/6</text><line x1="253" y1="64" x2="253" y2="326" stroke="#E5E7EB"/><text x="253" y="340" class="g m">dez/26</text><line x1="304" y1="64" x2="304" y2="326" stroke="#E5E7EB"/><text x="304" y="340" class="g m">jan/27</text><line x1="356" y1="64" x2="356" y2="326" stroke="#E5E7EB"/><text x="356" y="340" class="g m">fev/27</text><line x1="402" y1="64" x2="402" y2="326" stroke="#E5E7EB"/><text x="402" y="340" class="g m">mar/27</text><line x1="454" y1="64" x2="454" y2="326" stroke="#E5E7EB"/><text x="454" y="340" class="g m">abr/27</text><line x1="504" y1="64" x2="504" y2="326" stroke="#E5E7EB"/><text x="504" y="340" class="g m">mai/27</text><line x1="555" y1="64" x2="555" y2="326" stroke="#E5E7EB"/><text x="555" y="340" class="g m">jun/27</text><text x="16" y="390">Obra começa até 5 dias úteis após condomínio, chaves e energia liberados; cenário rápido atravessa o fim do ano.</text><text x="16" y="410" class="g">Fonte: processo e contrato da Bewild (nov/2026); calendário oficial de SP. Prazos de projeto e condomínio variam.</text></svg>