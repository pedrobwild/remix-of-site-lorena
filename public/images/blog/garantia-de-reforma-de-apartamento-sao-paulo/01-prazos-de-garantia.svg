<svg xmlns="http://www.w3.org/2000/svg" width="720" height="344" viewBox="0 0 720 344" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="13" fill="#222">
<rect width="720" height="344" fill="#fff"/>
<text x="16" y="26" font-size="17" font-weight="700" fill="#1f4e5f">Quem garante o quê e por quanto tempo</text>
<text x="16" y="46" font-size="12" fill="#8a8f94">Prazos de garantia e de reclamação que incidem numa reforma de apartamento</text>
<text x="246" y="82" text-anchor="end" font-size="12">CDC art. 26: produto não durável</text>
<rect x="254" y="64" width="3" height="26" fill="#8a8f94" rx="2"/>
<text x="263" y="82" font-size="12" font-weight="600">30 dias</text>
<text x="246" y="120" text-anchor="end" font-size="12">CDC art. 26: serviço e produto durável</text>
<rect x="254" y="102" width="10" height="26" fill="#8a8f94" rx="2"/>
<text x="270" y="120" font-size="12" font-weight="600">90 dias</text>
<text x="246" y="158" text-anchor="end" font-size="12">Fabricante de eletrodomésticos</text>
<rect x="254" y="140" width="41" height="26" fill="#4f7d8c" rx="2"/>
<text x="301" y="158" font-size="12" font-weight="600">12 meses</text>
<text x="246" y="196" text-anchor="end" font-size="12">Bewild: mão de obra e marcenaria</text>
<rect x="254" y="178" width="203" height="26" fill="#e8712b" rx="2"/>
<text x="463" y="196" font-size="12" font-weight="600">5 anos</text>
<text x="246" y="234" text-anchor="end" font-size="12">CC art. 618: solidez e segurança</text>
<rect x="254" y="216" width="203" height="26" fill="#1f4e5f" rx="2"/>
<text x="463" y="234" font-size="12" font-weight="600">5 anos</text>
<text x="246" y="272" text-anchor="end" font-size="12">CC art. 205: ação de indenização</text>
<rect x="254" y="254" width="406" height="26" fill="#1f4e5f" rx="2"/>
<text x="666" y="272" font-size="12" font-weight="600">10 anos</text>
<line x1="254" y1="58" x2="254" y2="292" stroke="#d9dcdf"/>
<text x="254" y="308" text-anchor="middle" font-size="11" fill="#8a8f94">0 anos</text>
<line x1="335" y1="58" x2="335" y2="292" stroke="#d9dcdf"/>
<text x="335" y="308" text-anchor="middle" font-size="11" fill="#8a8f94">2 anos</text>
<line x1="416" y1="58" x2="416" y2="292" stroke="#d9dcdf"/>
<text x="416" y="308" text-anchor="middle" font-size="11" fill="#8a8f94">4 anos</text>
<line x1="498" y1="58" x2="498" y2="292" stroke="#d9dcdf"/>
<text x="498" y="308" text-anchor="middle" font-size="11" fill="#8a8f94">6 anos</text>
<line x1="579" y1="58" x2="579" y2="292" stroke="#d9dcdf"/>
<text x="579" y="308" text-anchor="middle" font-size="11" fill="#8a8f94">8 anos</text>
<line x1="660" y1="58" x2="660" y2="292" stroke="#d9dcdf"/>
<text x="660" y="308" text-anchor="middle" font-size="11" fill="#8a8f94">10 anos</text>
<text x="16" y="332" font-size="11" fill="#8a8f94">Prazos legais contam de marcos diferentes (entrega, aparecimento do vício, ciência do dano); ver texto.</text>
</svg>
