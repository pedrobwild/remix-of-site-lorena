<svg xmlns="http://www.w3.org/2000/svg" width="420" height="344" viewBox="0 0 420 344" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="13" fill="#222">
<rect width="420" height="344" fill="#fff"/>
<text x="16" y="26" font-size="17" font-weight="700" fill="#1f4e5f">Quem garante o quê e por quanto tempo</text>
<text x="16" y="46" font-size="12" fill="#8a8f94">Prazos que incidem numa reforma de apartamento</text>
<text x="156" y="82" text-anchor="end" font-size="12">CDC 26: não durável</text>
<rect x="164" y="64" width="3" height="26" fill="#8a8f94" rx="2"/>
<text x="173" y="82" font-size="12" font-weight="600">30 dias</text>
<text x="156" y="120" text-anchor="end" font-size="12">CDC 26: durável</text>
<rect x="164" y="102" width="5" height="26" fill="#8a8f94" rx="2"/>
<text x="175" y="120" font-size="12" font-weight="600">90 dias</text>
<text x="156" y="158" text-anchor="end" font-size="12">Fabricante de eletros</text>
<rect x="164" y="140" width="20" height="26" fill="#4f7d8c" rx="2"/>
<text x="190" y="158" font-size="12" font-weight="600">12 meses</text>
<text x="156" y="196" text-anchor="end" font-size="12">Bewild: obra e marcenaria</text>
<rect x="164" y="178" width="98" height="26" fill="#e8712b" rx="2"/>
<text x="268" y="196" font-size="12" font-weight="600">5 anos</text>
<text x="156" y="234" text-anchor="end" font-size="12">CC 618: solidez</text>
<rect x="164" y="216" width="98" height="26" fill="#1f4e5f" rx="2"/>
<text x="268" y="234" font-size="12" font-weight="600">5 anos</text>
<text x="156" y="272" text-anchor="end" font-size="12">CC 205: indenização</text>
<rect x="164" y="254" width="196" height="26" fill="#1f4e5f" rx="2"/>
<text x="366" y="272" font-size="12" font-weight="600">10 anos</text>
<line x1="164" y1="58" x2="164" y2="292" stroke="#d9dcdf"/>
<text x="164" y="308" text-anchor="middle" font-size="11" fill="#8a8f94">0 anos</text>
<line x1="203" y1="58" x2="203" y2="292" stroke="#d9dcdf"/>
<text x="203" y="308" text-anchor="middle" font-size="11" fill="#8a8f94">2 anos</text>
<line x1="242" y1="58" x2="242" y2="292" stroke="#d9dcdf"/>
<text x="242" y="308" text-anchor="middle" font-size="11" fill="#8a8f94">4 anos</text>
<line x1="282" y1="58" x2="282" y2="292" stroke="#d9dcdf"/>
<text x="282" y="308" text-anchor="middle" font-size="11" fill="#8a8f94">6 anos</text>
<line x1="321" y1="58" x2="321" y2="292" stroke="#d9dcdf"/>
<text x="321" y="308" text-anchor="middle" font-size="11" fill="#8a8f94">8 anos</text>
<line x1="360" y1="58" x2="360" y2="292" stroke="#d9dcdf"/>
<text x="360" y="308" text-anchor="middle" font-size="11" fill="#8a8f94">10 anos</text>
<text x="16" y="332" font-size="11" fill="#8a8f94">Cada prazo conta de um marco diferente (entrega, vício, dano); ver texto.</text>
</svg>
