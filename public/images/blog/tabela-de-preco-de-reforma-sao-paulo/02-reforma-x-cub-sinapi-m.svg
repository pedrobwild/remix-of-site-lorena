<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 616.5" width="420" height="616" role="img" aria-labelledby="t d"><title id="t">Custo por m²: Sinapi, CUB e reforma completa de studio</title><desc id="d">Sinapi, estado de São Paulo, outubro de 2026, sem desoneração: R$ 2.216,38 por m². CUB-SP R8-N, outubro de 2026, sem desoneração: R$ 2.245,68 por m². Reforma completa de studio e apartamento compacto, mediana do Índice Bewild de novembro de 2026: R$ 2.831 por m², com metade dos 585 orçamentos entre R$ 2.499 e R$ 3.283 por m².</desc><style>.s{font-family:Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif}.m{font-family:'JetBrains Mono', Menlo, Consolas, monospace}</style><rect width="420" height="616.5" fill="#FFFFFF"/><text x="24" y="40" class="m" font-size="13" fill="#11355B" font-weight="700" letter-spacing="1.5">REFORMA X ÍNDICES DE CONSTRUÇÃO</text><text x="24" y="72" class="s" font-size="22" fill="#1A2332" font-weight="700" letter-spacing="-0.5">O m² da reforma completa</text><text x="24" y="100" class="s" font-size="22" fill="#1A2332" font-weight="700" letter-spacing="-0.5">fica acima do CUB e do</text><text x="24" y="128" class="s" font-size="22" fill="#1A2332" font-weight="700" letter-spacing="-0.5">Sinapi, que não medem</text><text x="24" y="156" class="s" font-size="22" fill="#1A2332" font-weight="700" letter-spacing="-0.5">marcenaria nem móveis</text><text x="24" y="188" class="s" font-size="14.5" fill="#5A6472">CUB e Sinapi: construir 1 m² de</text><text x="24" y="208.5" class="s" font-size="14.5" fill="#5A6472">edificação. Índice: reformar um studio</text><text x="24" y="229.0" class="s" font-size="14.5" fill="#5A6472">com marcenaria, móveis e eletros.</text><text x="24" y="283.5" class="s" font-size="14.5" fill="#1A2332" font-weight="700">Sinapi, estado de SP</text><text x="24" y="301.5" class="s" font-size="12" fill="#5A6472">IBGE, out/2026, custo de construção</text><rect x="24" y="311.5" width="231.8" height="16" rx="4" fill="#2F6FA8"/><text x="263.8" y="324.5" class="s" font-size="14" fill="#1A2332" font-weight="700">R$ 2.216,38</text><text x="24" y="357.5" class="s" font-size="14.5" fill="#1A2332" font-weight="700">CUB-SP R8-N</text><text x="24" y="375.5" class="s" font-size="12" fill="#5A6472">SindusCon-SP, out/2026, prédio padrão normal</text><rect x="24" y="385.5" width="234.8" height="16" rx="4" fill="#2F6FA8"/><text x="266.8" y="398.5" class="s" font-size="14" fill="#1A2332" font-weight="700">R$ 2.245,68</text><text x="24" y="431.5" class="s" font-size="14.5" fill="#1A2332" font-weight="700">Reforma completa de studio</text><text x="24" y="449.5" class="s" font-size="12" fill="#5A6472">Índice Bewild, nov/2026, mediana</text><rect x="24" y="459.5" width="296.0" height="16" rx="4" fill="#D07A3E"/><line x1="285.3" y1="467.5" x2="367.3" y2="467.5" stroke="#11355B" stroke-width="2"/><line x1="285.3" y1="460.5" x2="285.3" y2="474.5" stroke="#11355B" stroke-width="2"/><line x1="367.3" y1="460.5" x2="367.3" y2="474.5" stroke="#11355B" stroke-width="2"/><text x="32" y="472.0" class="s" font-size="13" fill="#FFFFFF" font-weight="700">R$ 2.831</text><text x="24" y="505.5" class="s" font-size="12" fill="#5A6472">Traço: metade central dos 585</text><text x="24" y="522.5" class="s" font-size="12" fill="#5A6472">orçamentos, R$ 2.499 a R$ 3.283 por m².</text><text x="24" y="539.5" class="s" font-size="12" fill="#5A6472">CUB e Sinapi sem desoneração.</text><line x1="24" y1="560.5" x2="396" y2="560.5" stroke="#E7E2D9" stroke-width="1"/><text x="24" y="582.5" class="m" font-size="12.5" fill="#5A6472">Fontes: SindusCon-SP, IBGE,</text><text x="24" y="600.5" class="m" font-size="12.5" fill="#5A6472">Índice Bewild</text><text x="396" y="600.5" class="m" font-size="12.5" fill="#11355B" font-weight="700" text-anchor="end">bewild.com.br</text></svg>