<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 668" width="720" height="802" role="img" aria-labelledby="t d"><title id="t">Orçamento de reforma completa por faixa de metragem</title><desc id="d">até 20 m²: mediana R$ 66.969, metade central de R$ 60 mil a R$ 75 mil (42 orçamentos); 20 a 24 m²: mediana R$ 69.160, metade central de R$ 63 mil a R$ 76 mil (64 orçamentos); 24 a 28 m²: mediana R$ 70.537, metade central de R$ 64 mil a R$ 78 mil (241 orçamentos); 28 a 32 m²: mediana R$ 75.656, metade central de R$ 67 mil a R$ 91 mil (107 orçamentos); 32 a 40 m²: mediana R$ 95.459, metade central de R$ 80 mil a R$ 111 mil (109 orçamentos); 40 a 45 m²: mediana R$ 109.938, metade central de R$ 95 mil a R$ 130 mil (22 orçamentos). Fonte: Índice Bewild, novembro de 2026, 585 orçamentos.</desc><style>.s{font-family:Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif}.m{font-family:'JetBrains Mono', Menlo, Consolas, monospace}</style><rect width="600" height="668" fill="#FFFFFF"/><text x="32" y="40" class="m" font-size="13" fill="#11355B" font-weight="700" letter-spacing="1.5">PREÇO POR METRAGEM</text><text x="32" y="72" class="s" font-size="24" fill="#1A2332" font-weight="700" letter-spacing="-0.5">Até 28 m², metade dos orçamentos de cada</text><text x="32" y="102" class="s" font-size="24" fill="#1A2332" font-weight="700" letter-spacing="-0.5">faixa fica entre R$ 60 mil e R$ 78 mil</text><text x="32" y="136" class="s" font-size="15" fill="#5A6472">Barra: metade central dos orçamentos. Ponto: mediana. Reforma</text><text x="32" y="157" class="s" font-size="15" fill="#5A6472">completa, com projeto, obra, marcenaria, móveis e eletros.</text><line x1="83.8" y1="192" x2="83.8" y2="570" stroke="#E7E2D9" stroke-width="1"/><line x1="187.3" y1="192" x2="187.3" y2="570" stroke="#E7E2D9" stroke-width="1"/><line x1="290.8" y1="192" x2="290.8" y2="570" stroke="#E7E2D9" stroke-width="1"/><line x1="394.4" y1="192" x2="394.4" y2="570" stroke="#E7E2D9" stroke-width="1"/><text x="32"