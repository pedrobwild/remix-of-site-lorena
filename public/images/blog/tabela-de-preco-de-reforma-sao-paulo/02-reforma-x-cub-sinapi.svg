<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 493.0" width="720" height="592" role="img" aria-labelledby="t d"><title id="t">Custo por m²: Sinapi, CUB e reforma completa de studio</title><desc id="d">Sinapi, estado de São Paulo, outubro de 2026, sem desoneração: R$ 2.216,38 por m². CUB-SP R8-N, outubro de 2026, sem desoneração: R$ 2.245,68 por m². Reforma completa de studio e apartamento compacto, mediana do Índice Bewild de novembro de 2026: R$ 2.831 por m², com metade dos 585 orçamentos entre R$ 2.499 e R$ 3.283 por m².</desc><style>.s{font-family:Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif}.m{font-family:'JetBrains Mono', Menlo, Consolas, monospace}</style><rect width="600" height="493.0" fill="#FFFFFF"/><text x="32" y="40" class="m" font-size="13" fill="#11355B" font-weight="700" letter-spacing="1.5">REFORMA X ÍNDICES DE CONSTRUÇÃO</text><text x="32" y="72" class="s" font-size="21" fill="#1A2332" font-weight="700" letter-spacing="-0.5">O m² da reforma completa fica acima do CUB e</text><text x="32" y="99" class="s" font-size="21" fill="#1A2332" font-weight="700" letter-spacing="-0.5">do Sinapi, que não medem marcenaria nem móveis</text><text x="32" y="130" class="s" font-size="14.5" fill="#5A6472">CUB e Sinapi medem quanto custa construir 1 m² de edificação. O</text><text x="32" y="150.5" class="s" font-size="14.5" fill="#5A6472">Índice mede a reforma de um studio com marcenaria, móveis e eletros.</text><text x="32" y="205.0" class="s" font-size="14.5" fill="#1A2332" font-weight="700">Sinapi, estado de SP</text><text x="32" y="223.0" class="s" font-size="12.5" fill="#5A6472">IBGE, out/2026, custo de construção</text><rect x="32" y="233.0" width="333.1" height="16" rx="4" fill="#2F6FA8"/><text x="373.1" y="246.0" class="s" font-size="14" fill="#1A2332" font-weight="700">R$ 2.216,38</text><text x="32" y="275.0" class="s" font-size="14.5" fill="#1A2332" font-weight="700">CUB-SP R8-N</text><text x="32" y="293.0" class="s" font-size="12.5" fill="#5A6472">SindusCon-SP, out/2026, prédio padrão normal</text><rect x="32" y="303.0" width="337.5" height="16" rx="4" fill="#2F6FA8"/><text x="377.5" y="316.0" class="s" font-size="14" fill="#1A2332" font-weight="700">R$ 2.245,68</text><text x="32" y="345.0" class="s" font-size="14.5" fill="#1A2332" font-weight="700">Reforma completa de studio</text><text x="32" y="363.0" class="s" font-size="12.5" fill="#5A6472">Índice Bewild, nov/2026, mediana</text><rect x="32" y="373.0" width="425.5" height="16" rx="4" fill="#D07A3E"/><line x1="407.6" y1="381.0" x2="525.4" y2="381.0" stroke="#11355B" stroke-width="2"/><line x1="407.6" y1="374.0" x2="407.6" y2="388.0" stroke="#11355B" stroke-width="2"/><line x1="525.4" y1="374.0" x2="525.4" y2="388.0" stroke="#11355B" stroke-width="2"/><text x="40" y="385.5" class="s" font-size="13" fill="#FFFFFF" font-weight="700">R$ 2.831</text><text x="32" y="415.0" class="s" font-size="12" fill="#5A6472">Traço: metade central dos 585 orçamentos, de R$ 2.499 a R$ 3.283 por m².</text><text x="32" y="432.0" class="s" font-size="12" fill="#5A6472">CUB e Sinapi sem desoneração da folha. Escala a partir de zero.</text><line x1="32" y1="453.0" x2="568" y2="453.0" stroke="#E7E2D9" stroke-width="1"/><text x="32" y="475.0" class="m" font-size="13" fill="#5A6472">Fontes: SindusCon-SP, IBGE (Sinapi), Índice Bewild</text><text x="568" y="475.0" class="m" font-size="13" fill="#11355B" font-weight="700" text-anchor="end">bewild.com.br</text></svg>