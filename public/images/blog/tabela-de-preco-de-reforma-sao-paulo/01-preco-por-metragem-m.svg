<svg xmlns="http://www.w3.org/2000/svg" viewBox="12 0 396 832.0" width="396" height="832" role="img" aria-labelledby="t d"><title id="t">Orçamento de reforma completa por faixa de metragem</title><desc id="d">até 20 m²: mediana R$ 66.969, metade central de R$ 60 mil a R$ 75 mil (42 orçamentos); 20 a 24 m²: mediana R$ 69.160, metade central de R$ 63 mil a R$ 76 mil (64 orçamentos); 24 a 28 m²: mediana R$ 70.537, metade central de R$ 64 mil a R$ 78 mil (241 orçamentos); 28 a 32 m²: mediana R$ 75.656, metade central de R$ 67 mil a R$ 91 mil (107 orçamentos); 32 a 40 m²: mediana R$ 95.459, metade central de R$ 80 mil a R$ 111 mil (109 orçamentos); 40 a 45 m²: mediana R$ 109.938, metade central de R$ 95 mil a R$ 130 mil (22 orçamentos). Fonte: Índice Bewild, novembro de 2026, 585 orçamentos.</desc><style>.s{font-family:Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif}.m{font-family:'JetBrains Mono', Menlo, Consolas, monospace}</style><rect width="420" height="832.0" fill="#FFFFFF"/><text x="24" y="40" class="m" font-size="13" fill="#11355B" font-weight="700" letter-spacing="1.5">PREÇO POR METRAGEM</text><text x="24" y="72" class="s" font-size="22" fill="#1A2332" font-weight="700" letter-spacing="-0.5">Até 28 m², metade dos</text><text x="24" y="100" class="s" font-size="22" fill="#1A2332" font-weight="700" letter-spacing="-0.5">orçamentos de cada faixa</text><text x="24" y="128" class="s" font-size="22" fill="#1A2332" font-weight="700" letter-spacing="-0.5">fica entre R$ 60 mil e</text><text x="24" y="156" class="s" font-size="22" fill="#1A2332" font-weight="700" letter-spacing="-0.5">R$ 78 mil</text><text x="24" y="188" class="s" font-size="14.5" fill="#5A6472">Barra: metade central dos orçamentos.</text><text x="24" y="208.5" class="s" font-size="14.5" fill="#5A6472">Ponto: mediana. Reforma completa, com</text><text x="24" y="229.0" class="s" font-size="14.5" fill="#5A6472">projeto, obra, marcenaria, móveis e</text><text x="24" y="249.5" class="s" font-size="14.5" fill="#5A6472">eletros.</text><line x1="58.6" y1="284.0" x2="58.6" y2="706.0" stroke="#E7E2D9" stroke-width="1"/><line x1="127.8" y1="284.0" x2="127.8" y2="706.0" stroke="#E7E2D9" stroke-width="1"/><line x1="196.9" y1="284.0" x2="196.9" y2="706.0" stroke="#E7E2D9" stroke-width="1"/><line x1="266.1" y1="284.0" x2="266.1" y2="706.0" stroke="#E7E2D9" stroke-width="1"/><text x="24" y="302.0" class="s" font-size="14.5" fill="#1A2332" font-weight="600">até 20 m²</text><text x="396" y="302.0" class="m" font-size="13" fill="#5A6472" text-anchor="end">42 orçamentos</text><rect x="24" y="312.0" width="294" height="12" rx="6" fill="#EEF1F5"/><rect x="58.6" y="312.0" width="51.9" height="12" rx="6" fill="#D07A3E"/><circle cx="82.7" cy="318.0" r="7" fill="#11355B" stroke="#FFFFFF" stroke-width="2.5"/><text x="328" y="323.0" class="s" font-size="13.5" fill="#1A2332" font-weight="700">R$ 66.969</text><text x="24" y="343.0" class="m" font-size="13" fill="#5A6472">metade central: R$ 60 a 75 mil</text><text x="24" y="374.0" class="s" font-size="14.5" fill="#1A2332" font-weight="600">20 a 24 m²</text><text x="396" y="374.0" class="m" font-size="13" fill="#5A6472" text-anchor="end">64 orçamentos</text><rect x="24" y="384.0" width="294" height="12" rx="6" fill="#EEF1F5"/><rect x="69.0" y="384.0" width="45.0" height="12" rx="6" fill="#D07A3E"/><circle cx="90.3" cy="390.0" r="7" fill="#11355B" stroke="#FFFFFF" stroke-width="2.5"/><text x="328" y="395.0" class="s" font-size="13.5" fill="#1A2332" font-weight="700">R$ 69.160</text><text x="24" y="415.0" class="m" font-size="13" fill="#5A6472">metade central: R$ 63 a 76 mil</text><text x="24" y="446.0" class="s" font-size="14.5" fill="#1A2332" font-weight="600">24 a 28 m²</text><text x="396" y="446.0" class="m" font-size="13" fill="#5A6472" text-anchor="end">241 orçamentos</text><rect x="24" y="456.0" width="294" height="12" rx="6" fill="#EEF1F5"/><rect x="72.4" y="456.0" width="48.4" height="12" rx="6" fill="#D07A3E"/><circle cx="95.0" cy