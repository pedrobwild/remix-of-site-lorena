<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 689" width="720" height="689" role="img" aria-labelledby="t d"><title id="t">Pela referência do Itaim Bibi, um studio no Brooklin fatura de R$ 3.240 a R$ 7.272 por mês</title><desc id="d">Receita bruta mensal de referência (diária × 30 × ocupação), janeiro a setembro de 2026. Aproximação do Brooklin pelo Itaim Bibi, com 60% de ocupação: P75, diária de R$ 404 e R$ 7.272; média, R$ 359 e R$ 6.462; mediana, R$ 279 e R$ 5.022, o cenário de partida; P25, R$ 180 e R$ 3.240. Bairros com dado próprio: Moema, R$ 263 e 61%, R$ 4.813; São Paulo, R$ 265 e 60%, R$ 4.770; Santo Amaro, R$ 256 e 56%, R$ 4.301; Campo Belo, R$ 233 e 60%, R$ 4.194. Fonte: Radar Bewild, com dados da GuestFavorites.</desc><style>.s{font-family:Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif}.m{font-family:'JetBrains Mono', Menlo, Consolas, monospace}</style><rect width="720" height="689" fill="#FFFFFF"/><text x="32" y="34" class="m" font-size="12" font-weight="700" fill="#11355B" letter-spacing="1.5">BROOKLIN · AIRBNB</text><text x="32" y="66" class="s" font-size="22" font-weight="700" fill="#1A2332" letter-spacing="-0.3">Pela referência do Itaim Bibi, um studio no</text><text x="32" y="95" class="s" font-size="22" font-weight="700" fill="#1A2332" letter-spacing="-0.3">Brooklin fatura de R$ 3.240 a R$ 7.272 por mês</text><text x="32" y="128" class="s" font-size="14" fill="#5A6472">Receita bruta mensal = diária × 30 × ocupação, jan–set/2026.</text><rect x="32" y="141" width="12" height="12" rx="2" fill="#D07A3E"/><text x="50" y="151" class="s" font-size="13" fill="#5A6472">Itaim Bibi, aproximação do Brooklin</text><rect x="277.84375" y="141" width="12" height="12" rx="2" fill="#2F6FA8"/><text x="295.844" y="151" class="s" font-size="13" fill="#5A6472">Dado próprio do bairro ou da cidade</text><text x="32" y="189" class="s" font-size="15" font-weight="700" fill="#1A2332">Itaim Bibi · P75</text><text x="688" y="189" class="m" font-size="12" fill="#5A6472" text-anchor="end">R$ 404 × 30 × 60%</text><path d="M32 198H498Q502 198 502 202V214Q502 218 498 218H32Z" fill="#D07A3E"/><text x="510" y="213" class="s" font-size="15" font-weight="700" fill="#1A2332">R$ 7.272</text><text x="32" y="241" class="s" font-size="15" font-weight="700" fill="#1A2332">Itaim Bibi · média</text><text x="688" y="241" class="m" font-size="12" fill="#5A6472" text-anchor="end">R$ 359 × 30 × 60%</text><path d="M32 250H445.649Q449.649 250 449.649 254V266Q449.649 270 445.649 270H32Z" fill="#D07A3E"/><text x="457.649" y="265" class="s" font-size="15" font-weight="700" fill="#1A2332">R$ 6.462</text><text x="32" y="293" class="s" font-size="15" font-weight="700" fill="#1A2332">Itaim Bibi · mediana</text><text x="688" y="293" class="m" font-size="12" fill="#5A6472" text-anchor="end">R$ 279 × 30 × 60%</text><path d="M32 302H352.579Q356.579 302 356.579 306V318Q356.579 322 352.579 322H32Z" fill="#D07A3E"/><text x="364.579" y="317" class="s" font-size="15" font-weight="700" fill="#1A2332">R$ 5.022</text><text x="438.001" y="317" class="s" font-size="13" fill="#5A6472">cenário de partida</text><text x="32" y="345" class="s" font-size="15" font-weight="700" fill="#1A2332">Moema</text><text x="688" y="345" class="m" font-size="12" fill="#5A6472" text-anchor="end">R$ 263 × 30 × 61%</text><path d="M32 354H339.071Q343.071 354 343.071 358V370Q343.071 374 339.071 374H32Z" fill="#2F6FA8"/><text x="351.071" y="369" class="s" font-size="15" font-weight="700" fill="#1A2332">R$ 4.813</text><text x="32" y="397" class="s" font-size="15" font-weight="700" fill="#1A2332">São Paulo</text><text x="688" y="397" class="m" font-size="12" fill="#5A6472" text-anchor="end">R$ 265 × 30 × 60%</text><path d="M32 406H336.292Q340.292 406 340.292 410V422Q340.292 426 336.292 426H32Z" fill="#2F6FA8"/><text x="348.292" y="421" class="s" font-size="15" font-weight="700" fill="#1A2332">R$ 4.770</text><text x="32" y="449" class="s" font-size="15" font-weight="700" fill="#1A2332">Santo Amaro</text><text x="688" y="449" class="m" font-size="12" fill="#5A6472" text-anchor="end">R$ 256 × 30 × 56%</text><path d="M32 458H305.98Q309.98 458 309.98 462V474Q309.98 478 305.98 478H32Z" fill="#2F6FA8"/><text x="317.98" y="473" class="s" font-size="15" font-weight="700" fill="#1A2332">R$ 4.301</text><text x="32" y="501" class="s" font-size="15" font-weight="700" fill="#1A2332">Campo Belo</text><text x="688" y="501" class="m" font-size="12" fill="#5A6472" text-anchor="end">R$ 233 × 30 × 60%</text><path d="M32 510H299.064Q303.064 510 303.064 514V526Q303.064 530 299.064 530H32Z" fill="#2F6FA8"/><text x="311.064" y="525" class="s" font-size="15" font-weight="700" fill="#1A2332">R$ 4.194</text><text x="32" y="553" class="s" font-size="15" font-weight="700" fill="#1A2332">Itaim Bibi · P25</text><text x="688" y="553" class="m" font-size="12" fill="#5A6472" text-anchor="end">R$ 180 × 30 × 60%</text><path d="M32 562H237.406Q241.406 562 241.406 566V578Q241.406 582 237.406 582H32Z" fill="#D07A3E"/><text x="249.406" y="577" class="s" font-size="15" font-weight="700" fill="#1A2332">R$ 3.240</text><text x="32" y="607" class="s" font-size="13" fill="#5A6472">O Itaim Bibi inclui a Vila Olímpia e parte do Brooklin; não há dado público só do bairro. Nas faixas do</text><text x="32" y="625" class="s" font-size="13" fill="#5A6472">Itaim Bibi, a ocupação de 60% é a mesma em todas: a fonte não a publica por faixa de preço.</text><line x1="32" y1="649" x2="688" y2="649" stroke="#E7E2D9" stroke-width="1"/><text x="32" y="671" class="m" font-size="12" fill="#5A6472">Fonte: Radar Bewild (GuestFavorites, jan–set/26)</text><text x="688" y="671" class="m" font-size="12" font-weight="700" fill="#11355B" text-anchor="end">bewild.com.br</text></svg>