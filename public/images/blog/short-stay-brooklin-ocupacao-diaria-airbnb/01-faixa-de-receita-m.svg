<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 778" width="420" height="778" role="img" aria-labelledby="t d"><title id="t">Pela referência do Itaim Bibi, um studio no Brooklin fatura de R$ 3.240 a R$ 7.272 por mês</title><desc id="d">Receita bruta mensal de referência (diária × 30 × ocupação), janeiro a setembro de 2026. Aproximação do Brooklin pelo Itaim Bibi, com 60% de ocupação: P75, diária de R$ 404 e R$ 7.272; média, R$ 359 e R$ 6.462; mediana, R$ 279 e R$ 5.022, o cenário de partida; P25, R$ 180 e R$ 3.240. Bairros com dado próprio: Moema, R$ 263 e 61%, R$ 4.813; São Paulo, R$ 265 e 60%, R$ 4.770; Santo Amaro, R$ 256 e 56%, R$ 4.301; Campo Belo, R$ 233 e 60%, R$ 4.194. Fonte: Radar Bewild, com dados da GuestFavorites.</desc><style>.s{font-family:Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif}.m{font-family:'JetBrains Mono', Menlo, Consolas, monospace}</style><rect width="420" height="778" fill="#FFFFFF"/><text x="24" y="32" class="m" font-size="12" font-weight="700" fill="#11355B" letter-spacing="1.5">BROOKLIN · AIRBNB</text><text x="24" y="64" class="s" font-size="20" font-weight="700" fill="#1A2332" letter-spacing="-0.3">Pela referência do Itaim Bibi, um</text><text x="24" y="90" class="s" font-size="20" font-weight="700" fill="#1A2332" letter-spacing="-0.3">studio no Brooklin fatura de</text><text x="24" y="116" class="s" font-size="20" font-weight="700" fill="#1A2332" letter-spacing="-0.3">R$ 3.240 a R$ 7.272 por mês</text><text x="24" y="146" class="s" font-size="13" fill="#5A6472">Receita bruta mensal = diária × 30 × ocupação,</text><text x="24" y="166" class="s" font-size="13" fill="#5A6472">jan–set/2026.</text><rect x="24" y="178" width="12" height="12" rx="2" fill="#D07A3E"/><text x="42" y="188" class="s" font-size="13" fill="#5A6472">Itaim Bibi, aproximação do Brooklin</text><rect x="24" y="200" width="12" height="12" rx="2" fill="#2F6FA8"/><text x="42" y="210" class="s" font-size="13" fill="#5A6472">Dado próprio do bairro ou da cidade</text><text x="24" y="248" class="s" font-size="14" font-weight="700" fill="#1A2332">Itaim Bibi · P75</text><text x="396" y="248" class="m" font-size="12" fill="#5A6472" text-anchor="end">R$ 404 × 30 × 60%</text><path d="M24 256H256Q260 256 260 260V270Q260 274 256 274H24Z" fill="#D07A3E"/><text x="268" y="270" class="s" font-size="14" font-weight="700" fill="#1A2332">R$ 7.272</text><text x="24" y="298" class="s" font-size="14" font-weight="700" fill="#1A2332">Itaim Bibi · média</text><text x="396" y="298" class="m" font-size="12" fill="#5A6472" text-anchor="end">R$ 359 × 30 × 60%</text><path d="M24 306H229.713Q233.713 306 233.713 310V320Q233.713 324 229.713 324H24Z" fill="#D07A3E"/><text x="241.713" y="320" class="s" font-size="14" font-weight="700" fill="#1A2332">R$ 6.462</text><text x="24" y="348" class="s" font-size="14" font-weight="700" fill="#1A2332">Itaim Bibi · mediana</text><text x="396" y="348" class="m" font-size="12" fill="#5A6472" text-anchor="end">R$ 279 × 30 × 60%</text><path d="M24 356H182.98Q186.98 356 186.98 360V370Q186.98 374 182.98 374H24Z" fill="#D07A3E"/><text x="194.98" y="370" class="s" font-size="14" font-weight="700" fill="#1A2332">R$ 5.022 · partida</text><text x="24" y="398" class="s" font-size="14" font-weight="700" fill="#1A2332">Moema</text><text x="396" y="398" class="m" font-size="12" fill="#5A6472" text-anchor="end">R$ 263 × 30 × 61%</text><path d="M24 406H176.197Q180.197 406 180.197 410V420Q180.197 424 176.197 424H24Z" fill="#2F6FA8"/><text x="188.197" y="420" class="s" font-size="14" font-weight="700" fill="#1A2332">R$ 4.813</text><text x="24" y="448" class="s" font-size="14" font-weight="700" fill="#1A2332">São Paulo</text><text x="396" y="448" class="m" font-size="12" fill="#5A6472" text-anchor="end">R$ 265 × 30 × 60%</text><path d="M24 456H174.802Q178.802 456 178.802 460V470Q178.802 474 174.802 474H24Z" fill="#2F6FA8"/><text x="186.802" y="470" class="s" font-size="14" font-weight="700" fill="#1A2332">R$ 4.770</text><text x="24" y="498" class="s" font-size="14" font-weight="700" fill="#1A2332">Santo Amaro</text><text x="396" y="498" class="m" font-size="12" fill="#5A6472" text-anchor="end">R$ 256 × 30 × 56%</text><path d="M24 506H159.581Q163.581 506 163.581 510V520Q163.581 524 159.581 524H24Z" fill="#2F6FA8"/><text x="171.581" y="520" class="s" font-size="14" font-weight="700" fill="#1A2332">R$ 4.301</text><text x="24" y="548" class="s" font-size="14" font-weight="700" fill="#1A2332">Campo Belo</text><text x="396" y="548" class="m" font-size="12" fill="#5A6472" text-anchor="end">R$ 233 × 30 × 60%</text><path d="M24 556H156.109Q160.109 556 160.109 560V570Q160.109 574 156.109 574H24Z" fill="#2F6FA8"/><text x="168.109" y="570" class="s" font-size="14" font-weight="700" fill="#1A2332">R$ 4.194</text><text x="24" y="598" class="s" font-size="14" font-weight="700" fill="#1A2332">Itaim Bibi · P25</text><text x="396" y="598" class="m" font-size="12" fill="#5A6472" text-anchor="end">R$ 180 × 30 × 60%</text><path d="M24 606H125.149Q129.149 606 129.149 610V620Q129.149 624 125.149 624H24Z" fill="#D07A3E"/><text x="137.149" y="620" class="s" font-size="14" font-weight="700" fill="#1A2332">R$ 3.240</text><text x="24" y="650" class="s" font-size="12" fill="#5A6472">O Itaim Bibi inclui a Vila Olímpia e parte do Brooklin; não há</text><text x="24" y="667" class="s" font-size="12" fill="#5A6472">dado público só do bairro. Nas faixas do Itaim Bibi, a</text><text x="24" y="684" class="s" font-size="12" fill="#5A6472">ocupação é a mesma (60%): a fonte não a publica por faixa</text><text x="24" y="701" class="s" font-size="12" fill="#5A6472">de preço.</text><line x1="24" y1="724" x2="396" y2="724" stroke="#E7E2D9" stroke-width="1"/><text x="24" y="745" class="m" font-size="12" fill="#5A6472">Fonte: Radar Bewild</text><text x="24" y="762" class="m" font-size="12" fill="#5A6472">(GuestFavorites, jan–set/26)</text><text x="396" y="762" class="m" font-size="12" font-weight="700" fill="#11355B" text-anchor="end">bewild.com.br</text></svg>