name: Production build

# Roda o pipeline completo de build em push para a main e em pull requests.
# Falha o job (exit != 0) se qualquer etapa falhar:
#   1. routes:check  → paridade de rotas SPA ↔ edge function
#   2. lint          → ESLint (inclui scripts/)
#   3. test          → suíte Vitest (jsdom), inclusive o guard de src/test/setup.ts
#                      (setupNoTsExpectError) e os testes dos scripts de build
#   4. prebuild      → sitemap + paridade de rotas (via npm prebuild hook)
#   5. tsc -b        → checagem de tipos
#   6. vite build    → bundle de produção
#
# Gatilhos: push só na main + pull_request. Antes era push em qualquer branch
# E pull_request, então todo commit de PR rodava duas vezes.

on:
  push:
    branches: [main]
  pull_request:

# Só leitura do repositório: o job não publica nada.
permissions:
  contents: read

# Um push novo no mesmo ref cancela o run anterior ainda em andamento.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (parity + lint + tests + tsc + vite)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Node 20 saiu de suporte (EOL em 2026-04-30); 22 é a LTS atual.
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Routes parity check
        run: npm run routes:check

      - name: Lint (eslint)
        # Falha o job se houver erros de ESLint. Warnings são aceitos por
        # enquanto (cleanups incrementais ficam para PRs do plano do audit).
        run: npm run lint

      - name: Tests (vitest run)
        # Roda a suíte completa antes do build. Regressões de SEO/roteador
        # devem bloquear o merge antes do bundle de produção ser gerado.
        run: npm test

      - name: Production build (tsc + vite)
        # `npm run build` aciona o prebuild (sitemap + parity check) novamente,
        # roda `tsc -b` e em seguida `vite build`. Falha em qualquer
        # uma das etapas faz o step retornar exit != 0.
        run: npm run build
