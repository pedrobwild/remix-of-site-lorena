name: Production build

# Roda o pipeline completo de build em push para a main e em pull requests.
# Falha o job (exit != 0) se qualquer etapa falhar:
#   1. routes:check  → paridade de rotas ↔ edge function
#   2. lint          → ESLint (inclui scripts/)
#   3. test          → suíte Vitest (jsdom), inclusive o guard de src/test/setup.ts
#                      (setupNoTsExpectError) e os testes dos scripts de build
#   4. prebuild      → sitemap + paridade de rotas (via hook prebuild)
#   5. vite build    → bundle de produção (TanStack Start)
#
# Gerenciador de pacotes: bun (`bun.lock`, desde a migração para TanStack Start
# em 29/09/2026). O workflow antigo rodava `npm ci` com um package-lock.json que
# não existe mais e falhava em todo push.
#
# Gatilhos: push só na main + pull_request. Antes era push em qualquer branch
# E pull_request, então todo commit de PR rodava duas vezes.

on:
  push:
    branches: [main]
  pull_request:

# Só leitura do repositório: o job não publica nada.
permissions:
  contents: read

# Um push novo no mesmo ref cancela o run anterior ainda em andamento.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (parity + lint + tests + vite)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        # `--frozen-lockfile` falha se o bun.lock não bater com o package.json,
        # em vez de regravar o lockfile em silêncio no CI.
        run: bun install --frozen-lockfile

      - name: Routes parity check
        run: bun run routes:check

      - name: Lint (eslint)
        # Falha o job se houver erros de ESLint. Warnings são aceitos por
        # enquanto (cleanups incrementais ficam para PRs do plano do audit).
        run: bun run lint

      - name: Tests (vitest run)
        # Roda a suíte completa antes do build. Regressões de SEO/roteador
        # devem bloquear o merge antes do bundle de produção ser gerado.
        run: bun run test

      - name: Production build (vite)
        # `bun run build` aciona o prebuild (sitemap + parity check) e em
        # seguida `vite build`. Falha em qualquer etapa faz o step retornar
        # exit != 0. As chaves públicas do Supabase têm fallback em
        # vite.config.ts, então o build não precisa de segredos.
        run: bun run build
